 idea_GTR_golfball_s_lab: "Лаборатория Гольфболл"
 idea_GTR_golfball_s_lab_desc: "До сегодняшних событий, Гойкийский Университет был технологическим центром всего Гойки. Ныне же, как и всё вокруг, Альма-матер находится в упадке. Гольфболл возглавила самоуправление, когда волны анархии захлестнули Гойки. Хоть и это образование всё ещё до конца не осознало себя как государство, оно обладает гигантским потенциалом и техническими возможностями, и даже возможно что под флагом Гольфболл, Гойки вновь вступит в эпоху процветания..."
