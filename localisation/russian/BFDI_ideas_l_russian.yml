 idea_YFC_neglectful_command: "Небрежное командование"
 idea_YFC_neglectful_command_desc: "Подразделения Корпорации находятся под индивидуальным руководством. Большинство вышестоящих и нижестоящих командных чинов возглавляют штатные сотрудники компании. Поскольку они также задействованы в операциях, не связанных с боевыми действиями, возможности для улучшения ограничены, и ситуация остается прежней."
 idea_YFC_anarchic_lands: "Анархия"
 idea_YFC_anarchic_lands_desc: "Из-за того, что мы по-настоящему не контролируем земли, которыми \"владеем\", мы §tне можем строить, исследовать, и производить собственное вооружение. Также, мы сильно ограничены в изменении внутреннего законодательства.§!"
 idea_YFC_our_benefactors: "Наши §8Сектора§!" #Yeah past me was a dumbass never let him cook again.
 idea_YFC_trade_food: "Импорт Еды"
 YFC_Pipe: "Пайп"
 YFC_Pipe_desc: "Этот обджект с юных лет проявлял большой интерес к поездам. Родившись в городе Центрогойки, который сейчас является столицей Южного управления железных дорог, он сохранил этот интерес на протяжении большей части своего детства и во взрослой жизни. Во время революционных событий, связанных с распадом Старого Гойки, он стремился обрести прочную опору, чтобы оставаться в безопасности. Поэтому он начал самостоятельно обслуживать железные дороги за определенную плату. Этот независимый бизнес привлек наше внимание и вскоре объединился с Корпорацией. Теперь он представляет ж/д сектор."
 idea_YFC_TopHat_desc: "Генерал в армии Старого Гойки. Родом из Кэсленда, он жил там уже после того, как стал взрослым, а затем отправился в путешествие по континенту с Свободными армиями Южного Гойки, возглавляемыми Кредит Кард, и руководил крупными сражениями, которые нарушили мирный анархический режим Старого Гойки. Однако вскоре он перешёл на сторону идей Корпорации, проникшись любовью к абсолютной свободной рыночной торговле. Он убеждённый капиталист, чья семья накопила богатое состояние много лет назад благодаря недвижимости. Кроме того, он является единственным бенефициаром некоторых... офшорных сделок, которые он отказывается раскрывать. Он высокодисциплинированный член корпорации, и эта дисциплина, наряду с его состоянием и мастерством, привела к его продвижению на пост главы Военного сектора. Он довольно часто борется за власть, поэтому мы будем держать его под контролем."
 idea_YFC_Beaker_desc: "Начинающая учёная. Родившись в Норт-Гойкиленде, ей пришлось проделать долгий путь, чтобы избежать коммунистического правления. Она происходит из семьи фермеров, владевших таким количеством ферм в родном городе и его окрестностях, что, вероятно, работники их семьи имели отношение к продуктам питания, которые можно было попробовать там до того, как Файри захватил фермы. Несмотря на это, она не питает особой неприязни к правлению Файри; она утверждает, что переехала в основном ради возможностей, а не чтобы избежать политических конфликтов. Тем не менее, он является ценным активом и ценным сотрудником нашей корпорации, поскольку, похоже, только она одна испытывает жажду знаний. Она изучала математику, естественные науки, политическую экономию, физику, экологию и многое другое. Хотя у неё не было времени получить высшее образование, он всё равно очень образован."
 idea_YFC_Hammer_desc: "Редактор континентальной новостной сети и автор нескольких очень популярных и невероятно хорошо принятых книг. Родом из Кэсланда, он всегда имел склонность размышлять о том, что видел вокруг себя, и город влиял на его работу. О его личной жизни известно немного, однако, из-за высокой зарплаты в строительном секторе, считается, что он отказывается получать прибыль от своей работы в качестве отраслевого эксперта, живя исключительно за счет продажи книг. Он стал отраслевым экспертом в строительной отрасли благодаря частым отчетам о деятельности в строительном секторе и благодаря своим хорошим управленческим навыкам; у него мало реального опыта в строительстве, мы просто ценим его коммуникабельность."
 idea_YFC_Taser_desc: "Раньше он работал охранником в каком-то случайном здании в Санкт-Обджектбурге, на своей родине, и его интерес к электронике и чистая удача помогли ему занять руководящую должность в Корпорации. Во время хаоса, вызванного свержением старого порядка, он случайно встретил Йелоу Фейса и впечатлил его своими знаниями, вероятно, поверхностного уровня в области технологий. Тем не менее, ему быстро предоставили временное жилье и назначили главой сектора электроники, что позволило ему начать сдавать ветхие квартиры обджектам и быстро сколоть большое состояние. По правде говоря, он достиг нынешнего положения только благодаря удаче."
