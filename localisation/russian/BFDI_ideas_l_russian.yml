 idea_LSS_lack_of_everything: "Недостаток... Всего"
 idea_LSS_lack_of_everything_desc: "Поскольку привезено очень мало, а запасы скудны, нам не хватает всего необходимого для устойчивого существования. Нам нужно действовать быстро, иначе нас ждут последствия.\n\n§YПока этот дух активен, мы не сможем понести экономический крах§!"
 idea_LSS_modern_ground_army: "Современная Наземная армия"
 idea_LSS_modern_ground_army_desc: "С 1823 года наши доблестные сухопутные войска сражались в различных войнах и конфликтах. Мы одержали победу тогда, и мы снова победим на этих чужих землях."
 idea_LSS_political_chaos: "Политический Хаос"
 idea_LSS_political_chaos_desc: "Мы находимся в чужой стране, без связи с федеральным правительством и без четкого понимания нашей ситуации. Мы предоставлены сами себе и должны сами выбраться из этого хаоса."
 idea_LSS_texas_blood: "Техасская Кровь"
 idea_LSS_texas_blood_desc: "Мы сильны и не дрогнем перед лицом этих новых вызовов. Мы готовы и хотим умереть за то, чтобы наши дети вернулись домой!"
 idea_LSS_human_race: "Человечество"
 idea_LSS_human_race_desc: "Похоже, мы чужаки в этих незнакомых краях. Местные жители, кажется, нам очень не доверяют и не заинтересованы в сотрудничестве. Где же мы находимся?"
