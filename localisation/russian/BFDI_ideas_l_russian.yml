 idea_CRN_city_on_a_shining_hill_desc: "Нумизматия была одним из первых \"государств\", возникших из этого хаоса. Возглавляемое одним из немногих военных из Старого Гойки, это государство превыше всего ценит свою демократию. Нумизматия — это оплот капитализма и свободы на континенте, охваченном тиранией как в государственном управлении, так и на рынке. Сюда бежали люди со всего континента, и задача нумизматической демократии — гарантировать этим людям их право на жизнь, свободу и стремление к счастью."
