 idea_BUN_Ticking_Bomb: "Тикающая Бомба"
 idea_BUN_Ticking_Bomb_desc: "Мы не можем выиграть затяжную войну. Если война затянется, мы начнём терять припасы, люди начнут переходить на сторону противника, наши иностранные союзники будут разгромлены, и произойдёт всё остальное, что может случиться. Решающая война не просто нам нужна, она нам необходима."
