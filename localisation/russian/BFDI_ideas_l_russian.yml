 idea_BUN_collapsed_economy: "Рухнувшая экономика"
 idea_BUN_collapsed_economy_desc: "Наша экономика была разорена Корпорацией. В настоящее время почти все наши здания и промышленные предприятия разрушены, и большая часть богатства Старой Банды потеряна навсегда. Все, что нам остается, — это надеяться на чудо."
 idea_BUN_armed_militia: "Военное Ополчение"
 idea_BUN_armed_militia_desc: "Хотя наше восстание произошло совсем недавно, наше население нас любит. Так много обджектов добровольно бросаются на передовую! Гражданское население восстало, чтобы освободить бывшие земли Банды от тирании Корпорации."
 idea_BUN_unstable_future: "Неясное Будущее"
 idea_BUN_unstable_future_desc: "Без наших лидеров, целей и большей части того, что делало Старую Банду такой хорошей, большинство обджектов в нашем правительстве совершенно растеряны. Мы не знаем, куда это нас приведет и что делать после того, как все это закончится. Остается только надеяться на лучшее."
