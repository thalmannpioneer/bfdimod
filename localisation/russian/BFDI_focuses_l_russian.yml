l_russian:
 #GOIKY
 GOI_focus_continue_contest: "Состязание продолжается!"
 GOI_focus_continue_contest_desc: "Битва За Остров Мечты уже на финишной прямой! Зрители ожидают результата.\nОсталось провести всего пару тортов на кону чтобы определить победителя!"
 GOI_focus_final_four: "Финальная Четвёрка"
 GOI_focus_final_four_desc: "Цветок, Огонёк, Листик и Пузырёк сформировались в фильнальную четвёрку БЗОМа! Спустя 2 года состязания, шоу подходит к концу."
 GOI_focus_viewers_will_decide: "Зрителям решать"
 GOI_focus_viewers_will_decide_desc: "Теперь, когда осталось всего два возможных победителя, мы дадим зрителям выбрать победителя."
 GOI_focus_burning_results: "Обжигающие итоги"
 GOI_focus_burning_results_desc: " "
 GOI_focus_oh_my_tree: "О моё дерево!"
 GOI_focus_oh_my_tree_desc: " "
 GOI_focus_congratulate_the_winner: "Поздравить победителя"
 GOI_focus_congratulate_the_winner_desc: "Необходимо провести некоторые торжества по случаю окончания шоу."
 GOI_focus_roll_up_the_show: "Свернуть шоу"
 GOI_focus_roll_up_the_show_desc: "Теперь, когда шоу завершено, мы можем со спокойной душой сворачивать всю его инфраструктуру."
 GOI_focus_back_to_normal_life: "Возвращение к обычной жизни"
 GOI_focus_back_to_normal_life_desc: "Битва За Остров Мечты достаточно сильно повлияла на ход жизни в Гойки. Теперь, когда шоу подошло к концу, можно вернуть зелёные равнины к нормальной жизни."
 
 #NGRF
 WGF_focus_our_situation: "Наша ситуация"
 WGF_focus_our_situation_desc: "Прежде спокойный Гойки ныне погрузился в хаос, и наше положение в этом сумасброде незавидно. Знамя социализма сейчас несёт лишь небольшой осколок на северо-западе Гойки, всюду окружённый предателями и контрреволюцией. Очевидным фактом является неизбежное распространение диктатуры пролетариата на весь континент, но пока что революция должна уйти в оборону и хорошо изучить свою ситуацию и окружение."
 
 WGF_focus_means_of_production: "Средства производства"
 WGF_focus_means_of_production_desc: "Промышленность в доанархичном Гойки не была сильно развита и в основном концентрировалась в центре, из-за чего теперь страдает наш молодой социализм. После совещания с президиумом Файри отправляет директиву о немедленном развертывании новых производств в Норт-Гойкилэнде и окрестностях."
 
 WGF_focus_protect_the_revolution: "Оборона революции"
 WGF_focus_protect_the_revolution_desc: "Республика скована со всех сторон. На востоке предатели и контрреволюционеры оформились в военный округ и планируют военный поход на Норт-Гойкилэнд, на юге прогнивший режим душит наши коммуникации и внешние связи. Революции необходимо оружие, которое она может держать в руках. В старом Гойки никто и не задумывался о вооружении, поэтому нам придется проделать титаническую работу по налаживанию уже давно забытых технологий."
 
 WGF_focus_ideals_of_revolution: "Идеалы революции"
 WGF_focus_ideals_of_revolution_desc: "Наш благородный гойкийский социализм должен иметь соответствующие общественные идеалы. Агитация - один из главных наших инструментов. Нужно чтобы каждый обджект северного Гойки знал о той величайшей революции общества, которую сумел застать."
 
 WGF_focus_forget_about_island: "Забудьте об острове!"
 WGF_focus_forget_about_island_desc: "Остров мечты пропал навсегда. Это неотвратимо. Мы должны осознать это и двигаться дальше."
 
 WGF_focus_socialist_realism: "Социалистический реализм"
 WGF_focus_socialist_realism_desc: "Новый строй диктует новые культурные нормы. Долой мещанское искусство!"
 
 WGF_focus_peoples_object_show: "Народное Обджект-шоу"
 WGF_focus_peoples_object_show_desc: "Чтобы отвлечь людей мы запустим собственное обджект-шоу. Далеко не такое масштабное как БЗОМ, но продвигающее идеалы нашего славного социалистического строя."
 
 WGF_focus_development_of_theory: "Углубление теории"
 WGF_focus_development_of_theory_desc: "Без хорошей теории не может быть никакой практики. Необходимо изучить противоречия доанархичного общества Гойки, ведь очевидно, что пропажа острова мечты стала лишь спусковым крючком всей той массы проблем, которые накопились в обществе Гойки."
 
 WGF_focus_investigation: "Расследование"
 WGF_focus_investigation_desc: "Необходимо провести изучение цепочки событий после пропажи острова. Судьба Лифи до сих пор не до конца ясна."
 
 WGF_focus_trial_over_leafy: "Суд над Лифи"
 WGF_focus_trial_over_leafy_desc: "Лифи исчезла без следа, но это никак не может помешать нам справедливо оценить её деяния на процессе при помощи показаний свидетелей и вынести приговор, даже если он никогда не будет приведём в исполнение."
 
 WGF_focus_different_but_united: "Разные, но единые"
 WGF_focus_different_but_united_desc: "Обджекты имеют огромное разнообразие форм и размеров, цветов и конечностей, но всех их единяет непримиримая борьба за своё освобождение. Именно поэтому мы берём на свои знамёна 'Обджекты Гойки, соединяйтесь!'."
 
 WGF_focus_our_struggling_friends: "Наши борющиеся друзья"
 WGF_focus_our_struggling_friends_desc: "Множество обджектов всего Гойки откликнулись на призыв свободы и создали революционные ячейки по всему континенту. Мы должны поддерживать этих товарищей всем, чем можем и обязательно должны создать крепкие контакты."
 
 WGF_focus_the_offer: "Предложение"
 WGF_focus_the_offer_desc: "Интересные вести поступают из Кэсленда: Крупную популярность там набирают дружественная нам фракция обджект-социалистов. Мы можем протолкнуть в временное правительство предложение о сотрудничестве, при некотором давлении со стороны местных коммунистов."
 
 WGF_focus_declare_our_goal: "Заявить о нашей цели"
 WGF_focus_declare_our_goal_desc: "Теперь, когда мы основательно подготовились, наша революция может открыто объявить о своём неизбежном распространении на весь Гойки. Пришло время начать освободительный поход против реакционеров!"
 
 WGF_focus_ready_for_work_and_defense: "Готов к труду и обороне!"
 WGF_focus_ready_for_work_and_defense_desc: "Не может быть государства без индустрии и без армии, а тем более государства социалистического! План преобразований, составленный нашим правительством, приведёт обджектов Северного Гойки к процветанию и убедит всех наших противников в неопровержимом превосходстве социализма!"
 
 WGF_focus_machines_for_objects: "Станки"
 WGF_focus_machines_for_objects_desc: "Промышленность Норт-Гойкилэнда находится в плачевном положении. Необходимо семимильными шагами быстро провести индустриализацию, даже если для этого придётся открывать цеха под открытым небом."
 
 WGF_focus_socialist_army: "Красная армия"
 WGF_focus_socialist_army_desc: "Государство без армии - как обджект без рук, оно абсолютно неспособно за себя постоять. А тем более государству социалистическому армия нужна как никогда. Обджектам старого Гойки армия была не нужна по природе их общества, но сегодня армия - залог выживания любого режима."
 
 WGF_focus_rifles_for_objects: "Винтовки"
 WGF_focus_rifles_for_objects_desc: "Армии нужно оружие, а оружие невозможно без промышленности. Таким образом - армия и индустрия неразрывно связаны между собой. Развёртывание военной промышленности тоже является необходимым условием выживания нашего народного государства."
 
 WGF_focus_all_objects_serving: "Все обджекты проходят службу"
 WGF_focus_all_objects_serving_desc: "Все обджекты, имеющие верхние конечности должны проходить обязательную службу в нашей социалистической армии. Нам необходимо добиться как минимум трёхкратной инициативы над противником для победы."
 
 WGF_focus_challenge_coiny: "Бросить вызов Койни"
 WGF_focus_challenge_coiny_desc: "Смелая идея зародилась в рядах генералитета: 'Немного' перейти границу и спровоцировать конфликт с их пограничниками. Если у нас всё получится, мы получим не только опыт, но и значительное количество припасов."
 
 WGF_focus_industrialization_of_steppes: "Индустриализация степей"
 WGF_focus_industrialization_of_steppes_desc: "60% нашей территории - Западная пустыня Гойки. Освоение этой территории нашей промышленностью никак нам не помешает, к тому же, там есть значительные запасы топлива."
 
 WGF_focus_quarterly_planning: "Квартальное планирование"
 WGF_focus_quarterly_planning_desc: "Будет выделено отдельное министерство планирования для создания директивных планов по экономическому развитию."
 
 WGF_focus_science_expansion: "Развитие наук"
 WGF_focus_science_expansion_desc: "Наука - базис развития производительных сил. Необходимо и жизненно важно развивать эту отрасль."
 
 WGF_focus_revolutionary_tactics: "Революционные тактики"
 WGF_focus_revolutionary_tactics_desc: "В доанархичном Гойки никто и не мыслил о военной тактике и стратегии, но сегодня их разработка необходима нам как воздух."
 
 WGF_focus_socialist_economic_miracle: "Социалистическое экономическое чудо"
 WGF_focus_socialist_economic_miracle_desc: "Год назад Норт-Гойкилэнд был фактической пустыней, а сегодня это экономический центр всего северного Гойки! Такие высоты были достигнуты исключительно благодаря нашей социалистической экономике и мужественности наших обджектов."
 
 WGF_focus_operation_coinflip: "§YКОИНФЛИП§!"
 WGF_focus_operation_coinflip_desc: "У нас нет времени ожидать, когда реакционеры сами прольют воду на наш социалистический огонь. Превентивный удар по контрреволюции - лучшее решение. Хунта Койни на востоке будет первой целью нашей Красной Армии."
 
 WGF_focus_deploy_the_army: "Развернуть армию"
 WGF_focus_deploy_the_army_desc: "Пришло время задействовать резервы для решающего боя."
 
 WGF_focus_barriers_and_pitfalls: "Барьеры и Ловушки"
 WGF_focus_barriers_and_pitfalls_desc: "Линия обороны в случае чего не будет лишней."
 
 WGF_focus_mass_propaganda: "Развернуть пропаганду"
 WGF_focus_mass_propaganda_desc: "Эта битва ведётся за освобождение обджектов Северного Гойки, и обджекты должны знать этот неопровержимый факт."
 
 WGF_focus_send_saboteurs: "Заслать диверсантов"
 WGF_focus_send_saboteurs_desc: "Саботаж Военного Округа изнутри также очень важен для нашей победы."
 
 WGF_focus_flip_the_coin: "§YПоследний шлепок§!"
 WGF_focus_flip_the_coin_desc: "Пришло время нанести реакционерам-милитаристам из 'Военного Округа' превентивный смертельный удар. Очень скоро наши обджекты пересекут границу Округа и безусловно наголову разгромят армию безумного деспота!\n\n§RСоциалистическая революция начинает свой экспорт.§!"
 
 #REICH
 GGR_focus_power_of_the_strong: "Власть Сильных"
 GGR_focus_power_of_the_strong_desc: "Прежний Гойки рухнул из-за своей нищенской анархичной структуры. Снежное плато требует сильной власти, пусть и её жители пока что этого не понимают."
 
 GGR_focus_radicalization: "Радикализация"
 GGR_focus_radicalization_desc: "В первую очередь необходимо поставить на правильный путь население. Любые средства пропаганды будут полезны в этой великой борьбе за культурную общность наших обджектов."
 
 GGR_focus_militarization: "Милитаризация"
 GGR_focus_militarization_desc: "Оглянитесь! Со всех сторон культурное и общественное единство нашего Снежного Плато, которое строилось многие годы, беспощадно разрывается национал-предателями и анархистами! Нам необходима сильная армия, которая сможет защитить наши национальные узы."
 
 GGR_focus_snowy_identity: "Снежная идентичность"
 GGR_focus_snowy_identity_desc: "Неоспоримо, то что обджекты Снежного Плато отличаются особым единством и культурными связями, чем не может похвастаться ни один другой регион Гойки. Мы должны сохранить единство нашей нации любой ценой и распространить её."
 
 GGR_focus_einheitstadt: "§RАйнхатсштадт§!"
 GGR_focus_einheitstadt_desc: "Снежное плато пребывает в печальном состоянии: Малая плотность населения и отсталая промышленность очень сильно бьют по единству снежных обджектов, к этому накладываются южные национал-предатели и лесные анархисты, которые появились из-за недоверия нашему правительству. Для объединения народа Снежных равнин будет предпринят ряд 'политик'."
 
 GGR_focus_fight_against_anarchy: "Борьба против Анархии"
 GGR_focus_fight_against_anarchy_desc: "Хоть на бумажных картах Снежный лес находится в нашем составе, на деле там уже давно действуют 'незаконные органы власти'. Самоуправления анархистов и безрукой пятой колонны бьют по единству нации. Они должны быть уничтожены."
 
 GGR_focus_propaganda: "Пропаганда"
 GGR_focus_propaganda_desc: "Доверие нашему национальному правительству находится на достаточно низком уровне. Обджекты Снежного Плато хоть и отличаются своей культурной общностью, но достаточно пассивны в плане политических движений. Одна из наших важнейших целей - объединить обджектов в великом порыве национального единства. Для достижения этого результата нам необходима низовая политическая активность масс, именно поэтому пропаганда - один из наших первых ходов."
 
 GGR_focus_our_way: "Наш Путь"
 GGR_focus_our_way_desc: "Экономика доанархичного Гойки была случайным, невнятным хаосом под сапогом пятой колонны из Кэсленда. Нам необходима своя экономическая модель, которая будет отражать великое единство обджектов Снежного Плато."
 
 GGR_focus_industrialization: "Индустриализация"
 GGR_focus_industrialization_desc: "Как бы тяжело не было это признавать, но Плато - Один из беднейших регионов современного Гойки. Он отличается невероятно низкой плотностью населения и практическим отсутствием промышленности. Сволочи из Кэсленда обделили нас какими-либо технологиями, понимая свою никчёмность, но мы ещё покажем им, на что способны обджекты Снежных Равнин."
 
 GGR_focus_are_you_smarter_than_a_snowball: "Ты умнее чем Сноуболл?"
 GGR_focus_are_you_smarter_than_a_snowball_desc: "Не может быть никакой экономики без технического прогресса. Снежное Плато с каждым годом полнится гениями, так направим же этот национальный порыв в нужное русло."
 
 GGR_focus_snowy_vexels: "Снежные Векселя"
 GGR_focus_snowy_vexels_desc: "Давать долги самому себе - Очень эффективное средство роста экономики, хоть и опасное. Но мы же будем аккуратны, верно?"
 
 GGR_focus_wrong_objects: "'Неправильные' обджекты"
 GGR_focus_wrong_objects_desc: "С давних пор известна сущность верхушки общества Гойки. Обджекты без верхних конечностей, маленькие и слабые мало того что живут за счёт трудящихся, так ещё и формируют тайные пятые колонны, при помощи которых управляют подконтрольными обджектами, притворяясь 'слабыми и невинными'. Весь старый Гойки был пропитан этим отвратительным духом, и он сильно ударил по Снежному Плато. Но из-за кризиса власть пятой колонны была уничтожена, и мы можем со спокойной душой начать уничтожать этих паразитов общества."
 
 GGR_focus_four_year_plan: "Четырёхлетний план"
 GGR_focus_four_year_plan_desc: "Важной чертой нашей новой экономики станет централизованность. Нельзя допустить анархичности старого Гойки."
 
 GGR_focus_free_labor: "Бесплатный труд"
 GGR_focus_free_labor_desc: "Паразиты должны отрабатывать свою паразитарную природу. Именно поэтому мы будем использовать бесплатный труд безруких обджектов в лагерях."
 
 GGR_focus_destruction_by_labor: "Уничтожение трудом"
 GGR_focus_destruction_by_labor_desc: "Отработка паразитов - нормальная практика. Но даже после смерти они могут пригодиться в качестве материала для нашей промышленности."
 
 GGR_focus_corporative_economy: "Снежная экономика"
 GGR_focus_corporative_economy_desc: "Мы достигли невероятных результатов благодаря нашей гениальной экономической политике. Снежное плато продолжает своё движение вперёд!"
 
 GGR_focus_verschneitwehr: "Вершнайтвёр"
 GGR_focus_verschneitwehr_desc: "В старом Гойки никто не заботился об армии, до того момента пока не припекло. Снежное Плато ныне нуждается в защите как ни один другой регион Гойки. Для того чтобы уберечь своё национальное единство, обджекты Снежных Равнин должны создать вооружённые силы."
 
 GGR_focus_advanced_tactics: "Передовые тактики"
 GGR_focus_advanced_tactics_desc: "Война - невероятно сложное искусство, и мы должны освоить его раньше своих противников. Гениальные умы Снежных Равнин отлично справятся с этой задачей."
 
 GGR_focus_mass_mobilization: "Массовая мобилизация"
 GGR_focus_mass_mobilization_desc: "Все обджекты Снежного Плато должны держать в руках оружие против своих врагов. Десятикратное численное превосходство откроет нам двери к любой победе."
 
 GGR_focus_penal_battalions: "Штрафные батальоны"
 GGR_focus_penal_battalions_desc: "Национал-предателей и низкосортных обджектов можно сгонять в армию и отправлять их на амбразуры противника в целях искупления их вины перед обществом."
 
 GGR_focus_expand_militia: "Расширить ополчение"
 GGR_focus_expand_militia_desc: "'Нерегулярные части' могут выполнять не только задачи фронта, но и расширить свои полномочия на 'усмирение' малых населённых пунктов и анархичных самоуправлений в нашем тылу. Важной задачей будет его расширение."
 
 GGR_focus_forest_tanks: "Лесные танки"
 GGR_focus_forest_tanks_desc: "Техника - залог успеха в бою. Однако, территория на которой мы будем вести боевые действия требует некоторой её модификации."
 
 GGR_focus_anti_partisan_tactics: "Тактики против партизан"
 GGR_focus_anti_partisan_tactics_desc: "Партизанская война является одним из самых сложных типов боевых действий, и мы никак не сможем перегнать анархистов в этом искусстве, поэтому нам необходимы некоторые специфические 'тактики'."
 
 GGR_focus_expansionist_army: "Наступательная армия"
 GGR_focus_expansionist_army_desc: "Да, цель номер 1 нашей армии - защита культуры Снежного Плато от порабощения. Но одной из её задач также является расширение высокой культуры и традиций Снежных Равнин на другие территории."
 
 GGR_focus_law_enforcement_agencies: "Силовые органы"
 GGR_focus_law_enforcement_agencies_desc: "Полиция - наша вторая армия. Мы должны иметь сильный тыл без подпольных ячеек и прочих последствий анархической пропаганды."
 
 GGR_focus_erweiterungsbedarf: "Необходимость экспансии"
 GGR_focus_erweiterungsbedarf_desc: "Так как наше превосходство над остальными регионами неоспорима, то наша первичная цель - расширение национальной идентичности Снежного Плато на весь Гойки."
 
 GGR_focus_whiteshirts: "Белорубашечники"
 GGR_focus_whiteshirts_desc: "Малые отряды ополчения из идейно заряженных обджектов будут показывать отличную эффективность в операциях по 'умиротворению' населённых пунктов под контролем анархистов."
 
 GGR_focus_schneeschutz: "Шнеешутс"
 GGR_focus_schneeschutz_desc: "Секретная внутренняя полиция, которая будет работать с подпольем - вот что нам нужно."
 
 GGR_focus_terror: "Террор"
 GGR_focus_terror_desc: "К анархистам и национал-предателям должны быть применены самые жестокие методы по усмирению и уничтожению."
 
 GGR_focus_burn_the_underground: "Выжечь подполье"
 GGR_focus_burn_the_underground_desc: "Прежде чем вернуть под контроль леса, необходимо уничтожить противника у себя дома. Подполье - первоочерёдная цель."
 
 GGR_focus_operation_wintersfest: "'Зимний праздник'"
 GGR_focus_operation_wintersfest_desc: "Операция 'Зимний праздник' - План высшего военного командования по уничтожению партизанских формирований на нашей территории с применением самых жестоких методов."
 
 GGR_focus_popular_support: "Всенародная поддержка"
 GGR_focus_popular_support_desc: "Для успеха нашего государственного строительства нам необходимо идейное единство обджектов Снежного Плато, и мы успешно идём к своей цели."
 
 GGR_focus_partizan_war: "Партизанская Война"
 GGR_focus_partizan_war_desc: "Все предыдущие операции были лишь подготовкой к нашей основной цели - Уничтожению гнезда анархистов в Снежном Лесу. Огромное количество обджектов поддалось ереси этих неполноценных. Что-ж, пришло время положить этому конец."
 
 GGR_focus_emphasize_our_superiority: "Подчеркнуть наше превосходство"
 GGR_focus_emphasize_our_superiority_desc: "Снежное Плато - Самая возвышенная и благородная территория Гойки в культурном и национальном аспекте, и это неоспоримый факт. Никогда никакой регион в истории Гойки не был так крепко сплочён как Снежные Равнины и их жители."
 
 GGR_focus_demonstrative_democracy: "Показательная демократия"
 GGR_focus_demonstrative_democracy_desc: "В целях создания некоторой вывески демократии будет созван парламент в котором будут заседать две партии."
 
 GGR_focus_nothing_happens_here: "Здесь ничего не происходит!"
 GGR_focus_nothing_happens_here_desc: "Наша политика по отношению к  неполноценным обджектам может вызывать некоторые... вопросы. Нам просто необходимо спрятать это от глаз общественности, пока она не будет к этому готова."
 
 #PROVISIONAL GOVERNMENT
 GPG_focus_first_congress: "§YПервый Съезд§!"
 GPG_focus_first_congress_desc: "Ситуация на континенте патовая, и особенно сильно она обострилась в бывшем экономическом центре - Кэсленде. Различные фракции объединились для сопротивления анархии и сформировали Совет Рекомендованных Персонажей. Скоро пройдёт первый съезд нового правительства."
 
 GPG_focus_rubys_speech: "Речь Руби"
 GPG_focus_rubys_speech_desc: "Левая фракция Рабочего Фронта объявила о своих целях и задачах на съезде от имени Руби. Это вызвало шумные обсуждения и взбудоражило массы."
 
 GPG_focus_right_wing_unification: "Объединение Правых"
 GPG_focus_right_wing_unification_desc: "Множество разнообразных боевых и политических организаций авторитарного толка было сформировано на волне анархии и беззакония. На съезде их большинство сумело объединиться во фракции Железной Руки."
 
 GPG_focus_congress_closing: "Закрытие Съезда"
 GPG_focus_congress_closing_desc: "Первый съезд прошёл в целом успешно. Окончательно устаканились фракции и были решены многие вопросы управления и развития. Но все пристально ожидают второго съезда, как судьбоносного для политического строя Центрального Гойки."
 
 GPG_focus_second_congress: "§YВторой Съезд§!"
 GPG_focus_second_congress_desc: "С закрытия первого съезда изменилось... Много вещей. Политический кризис невероятно обострился, и представители радикальных фракций уже начинают говорить о государственном перевороте. Если мы хотим спасти хрупкую Гойкийскую демократию, мы должны провести жизненно-важные реформы."
 
 GPG_focus_clocks_dead: "[GPG_CLOCKSDEAD_FOCUS]"
 GPG_focus_clocks_dead_1: "Все средства хороши"
 GPG_focus_clocks_dead_2: "Объективность"
 GPG_focus_clocks_dead_3: "Просчёт"
 GPG_focus_clocks_dead_desc: ""
 
 GPG_focus_cabinet_head: "[GPG_CABHEAD_FOCUS]"
 GPG_focus_cabinet_head_1: "Триумф Фрайс"
 GPG_focus_cabinet_head_2: "Пай остаётся"
 GPG_focus_cabinet_head_desc: ""
 
 GPG_focus_compensation: "[GPG_COMPENS_FOCUS]"
 GPG_focus_compensation_1: "Компенсация"
 GPG_focus_compensation_2: "Урезки бюджета"
 GPG_focus_compensation_desc: ""
 
 GPG_focus_defense_plan: "[GPG_DEFPLANS_FOCUS]"
 GPG_focus_defense_plan_1: "§3Синий план§!"
 GPG_focus_defense_plan_2: "§RКрасный план§!"
 GPG_focus_defense_plan_3: "§gЧёрный план§!"
 GPG_focus_defense_plan_desc: ""
 
 GPG_focus_casland_remilitarization: "[GPG_CASLREM_FOCUS]"
 GPG_focus_casland_remilitarization_1: "Ремилитаризация"
 GPG_focus_casland_remilitarization_2: "Не трожьте Кэсленд!"
 GPG_focus_casland_remilitarization_desc: ""
 
 GPG_focus_mines: "[GPG_MINENAT_FOCUS]"
 GPG_focus_mines_1: "Национализация"
 GPG_focus_mines_2: "Разорение шахт"
 GPG_focus_mines_desc: ""
 
 GPG_focus_constitution: "[GPG_CONSTIT_FOCUS]"
 GPG_focus_constitution_1: "§7Первая конституция Гойки§!"
 GPG_focus_constitution_2: "Бумага может подождать..."
 GPG_focus_constitution_desc: ""
 
 GPG_focus_second_congress_end: "[GPG_CONGEND_FOCUS]"
 GPG_focus_second_congress_end_1: "§RКрах правительства§!"
 GPG_focus_second_congress_end_2: "§YКонец Второго Съезда§!"
 GPG_focus_second_congress_end_desc: ""
 
 GPG_focus_cabinet_resisted: "Кабинет выстоял"
 GPG_focus_cabinet_resisted_desc: ""
 
 GPG_focus_bake_taco: "§3Зажарить Тако§!"
 GPG_focus_bake_taco_desc: "Демократическая фракция хоть и не является настолько радикальной как остальные, но всё равно представляет для правительства большую угрозу. Мы должны с ней разобраться."
 
 GPG_focus_break_up_the_brilliant: "§tРазбить рубин§!"
 GPG_focus_break_up_the_brilliant_desc: "Опаснейшей целью для нас ныне является Рабочий Фронт. Коммунисты должны быть уничтожены, пока они не ожидают удара."
 
 GPG_focus_yoylemetal_hand: "§LРука из йойлометалла§!"
 GPG_focus_yoylemetal_hand_desc: "Самая милитаризованная и реакционная фракция в совете представляет великую угрозу для государства. Она должна быть удавлена."
 
 GPG_focus_strenght_republic_border: "Контроль границы"
 GPG_focus_strenght_republic_border_desc: "Ни для кого не секрет, что Демократы получают огромную помощь из-за границы, а конкретно из Зелёных Равнин, от Альянса. Мы постараемся как можно сильнее перекрыть им эту трубу, и, это, очевидно, замедлит их приготовления."
 
 GPG_focus_leafy_was_democrat: "§7Лифи была демократкой!§!"
 GPG_focus_leafy_was_democrat_desc: "Лифи - один из самых ненавистных обджектов современного Гойки, так почему бы не использовать её образ для расчеловечивания своих противников? Тем более, что, всё таки, некоторые контакты с членами демократической фракции она имела."
 
 GPG_focus_ban_foreign_aid: "Закон о запрете внешних поставок"
 GPG_focus_ban_foreign_aid_desc: "Нашей важнейшей целью также является законодательно перекрыть каналы поставок для Демократов. Это переведёт их в нелегальную сферу, и, как следствие, усложнит их использование."
 
 GPG_focus_barf_bag_is_stupid: "Усомниться в уме Барф бэг"
 GPG_focus_barf_bag_is_stupid_desc: "Как пакет с переваренной пищей может быть лицом номер 2 одной из главных фракций совета? Нам следует провести Барф бэг некоторые тестирования на интеллект и временно отстранить её от должности..."
 
 GPG_focus_expel_taco: "Высылка Тако"
 GPG_focus_expel_taco_desc: "Чтож, если Тако так любит своих друзей из Альянса, она может отправляться к ним, и мы этому всячески посодействуем."
 
 GPG_focus_ban_democratic_faction: "§3Запрет Демократов§!"
 GPG_focus_ban_democratic_faction_desc: "Несомненно, что Демократическая фракция вела опасную подрывную деятельность в республике, что противоречит её конституции, и будет в связи с этим исключена из совета, а её члены будут приданы суду."
 
 GPG_focus_raise_miners_salary: "Поднять зарплаты шахтёрам"
 GPG_focus_raise_miners_salary_desc: "Основаня социальная база коммунистов Руби находится на востоке, где действуют крупные руднодобывающие предприятия. Мы должны успокоить местных рабочих, немного порезав бюджет, но, это, несомненно, поможет нам."
 
 GPG_focus_and_communist: "§R...И коммунисткой§!"
 GPG_focus_and_communist_desc: "Связь Лифи с коммунистами неопровержима. Мы также этим воспользуемся."
 
 GPG_focus_firey_marionette: "§OМарионетки Файри!§!"
 GPG_focus_firey_marionette_desc: "Рабочий Фронт без сомнений имеет серьёзные контакты с Революционным Фронтом на севере. Этих связей конечно не очень достаточно для обвинения, но это никак не помешает нашей пропаганде."
 
 GPG_focus_organize_arson: "Организовать поджог"
 GPG_focus_organize_arson_desc: "Наши люди найдут некоторых личностей, связанных с Рабочим Фронтом, подкупят их и организуют их руками поджог здания СРП, чтобы потом использовать против коммунистов."
 
 GPG_focus_ban_communist_faction: "§tЗапрет Рабочего Фронта§!"
 GPG_focus_ban_communist_faction_desc: "Коммунисты - Опасные радикалы, и урон республике, нанесённый Рабочим Фронтом, неопровержим. В связи с этим, Рабочий Фронт исключается из совета."
 
 GPG_focus_slow_disarm: "Медленное разоружение"
 GPG_focus_slow_disarm_desc: "Основная сила правой фракции - её вооружённые формирования. Мы будем аккуратно разоружать их под разными предлогами или даже выкупать их вооружение."
 
 GPG_focus_entice_nickel: "Переманить Никеля"
 GPG_focus_entice_nickel_desc: "Никель хоть и условно является членом Железной Руки, не очень разделяет радикальные позиции фракции. Мы сможем достаточно легко переманить его."
 
 GPG_focus_recharnd_demilitarization: "Демилитаризация Речернда"
 GPG_focus_recharnd_demilitarization_desc: "Речернд - Основная точка скопления штурмовиков Железной Руки. Мы придадим городу и его окрестностям такое же правительственное значение, как и Кэсленду, и, таким образом, добьёмся разоружения либо вывода этих боевых формирований."
 
 GPG_focus_fanny_emotional_stability_question: "Вопрос о стабильности Фанни"
 GPG_focus_fanny_emotional_stability_question_desc: "Фанни, пожалуй, самый эмоционально нестабильный заседатель совета. Стоит 'внести рекомендацию' в кабинет о её исключении из СРП."
 
 GPG_focus_trans: "§gТРАНС§!"
 GPG_focus_trans_desc: "Нахождение Сав в совете от фашистской фракции вызывает, в первую очередь, вопросы у самих сторонников Железной Руки. Как и почему обджект неопределённого пола выступает от имени реакционной фракции? От этого стоит избавиться."
 
 GPG_focus_ban_fascist_faction: "§LЗапрет Железной Руки§!"
 GPG_focus_ban_fascist_faction_desc: "Несомненно, что Железная Рука подготавливала военный переворот в Кэсленде, но доблестный кабинет правительства присёк это. Теперь эта фракция будет исключена из совета, а её члены репрессированы."
 
 GPG_focus_no_more_factions: "Больше никаких фракций"
 GPG_focus_no_more_factions_desc: "Фракционизм, отныне, запрещен в совете. Теперь каждый заседающий будет выступать независимо от своего имени."
 #GPG CW TREE
 GPG_focus_fight_for_stability: "§YБитва за стабильность!§!"
 GPG_focus_fight_for_stability_desc: "Эти чёртовы радикалы, мы пытались договориться с ними в совете, мы пытались договориться с ними на съезде, но это не привело ни к чему. Пришло время покончить с этими деструктивными кликами и пронести на штыке победоносное знамя Гойки!"
 
 GPG_focus_council_of_the_one_faction: "Совет одной фракции"
 GPG_focus_council_of_the_one_faction_desc: "Никакой больше фракционщины! Все конфликты в совете отныне будут решаться в рамках одной общей парадигмы сохранения стабильности."
 
 GPG_focus_mobilization: "Клич по Зелёным Равнинам"
 GPG_focus_mobilization_desc: "Сейчас, как никогда, для вооружения государственного ополчения нам нужны обджекты. Вперёд, друзья, на защиту Гойки!"
 
 GPG_focus_industry_transformation: "Превращение промышленности"
 GPG_focus_industry_transformation_desc: "Индустрия окраин Кэсленда представляет собой полностью гражданские формы производства. Нам необходимы винтовки для наших обджектов, и, поэтому, мы милитаризуем эти отрасли для победы правительства!"
 
 GPG_focus_goiky_army: "Армия Гойки"
 GPG_focus_goiky_army_desc: "Ополчение в виде государственных патрулей явно не представляет собой серьёзную силу. Нам нужна полноценная, кадровая армия из обджектов, знающих своё дело."
 
 GPG_focus_12_hours_working_day: "12-часовой рабочий день"
 GPG_focus_12_hours_working_day_desc: "Обджекты на новых заводах должны трудиться не покладая рук ради нашей победы!"
 
 GPG_focus_second_congress_continues: "§YВозобновление Съезда§!"
 GPG_focus_second_congress_continues_desc: "Прерванный незаконным выступлением радикалов, съезд наконец-то может продолжить свою работу. Теперь, в куда более спокойных условиях."
 
 #GPG FRIES PATH
 GPG_focus_never_again: "§RНикогда снова§!"
 GPG_focus_never_again_desc: "В Кэсленд вновь возвращена стабильность. Но какой ценой? Тысячи обджектов полегли в бессмысленной гражданской войне, и сердце Гойки больше не бьётся также, как прежде. Новое мудрое правительство Фрайса не допустит подобного, больше никогда."
 
 GPG_focus_fries_no_more_factions: "Больше никаких фракций"
 GPG_focus_fries_no_more_factions_desc: "Первым шагом для предотвращения подобной катастрофы станет запрет фракций. Именно разлад в совете привёл к тому, чего мы хотим избежать."
 
 GPG_focus_fries_constitution: "Запоздалая конституция"
 GPG_focus_fries_constitution_desc: "С некоторыми правками, конституция всё же будет принята. Официальное закрепление нового правительства должно состояться."
 
 GPG_focus_unlimited_interruptions: "Неограниченные перерывы"
 GPG_focus_unlimited_interruptions_desc: "Нынешним законодательством перерыв в созыве съезда ограничивается двумя годами. Это ограничение противоречит нашему курсу на сохранение стабильности и будет отменено, как вредительское."
 
 GPG_focus_fries_second_congress_end: "§YЗавершение съезда§!"
 GPG_focus_fries_second_congress_end_desc: "Второй съезд, прерванный выступлениями радикалов, наконец-то можно считать законченным. Кэсленд жив и идёт вперёд!"
 
 GPG_focus_eternal_transition: "Вечный переход"
 GPG_focus_eternal_transition_desc: "Временное Правительство будет сохранять статус-кво столько, сколько нам покажется нужным. И, пока что, предпосылок для переустройства государства не виднеется."
 
 GPG_focus_anti_crisis_measures: "Антикризисные меры"
 GPG_focus_anti_crisis_measures_desc: "Кэсленд и окрестности лежат в руинах после опустошительных боёв с радикалами. Нам необходимо восстановить национальную экономику, иначе Кэсленд никогда не сможет вновь стать столицей Гойки."
 
 GPG_focus_restore_fabrics: "Возрождение фабрик"
 GPG_focus_restore_fabrics_desc: "Огромное количество производств было утрачено во время боёв. Необходимо перезапустить фабрики из руин."
 
 GPG_focus_object_industry: "Промышленность для обджектов"
 GPG_focus_object_industry_desc: "Производство мирного времени - Наш приоритет. Военное производство может подождать."
 
 GPG_focus_cancel_military_law: "Отмена военного налога"
 GPG_focus_cancel_military_law_desc: "Кэсленду пришло время возвращаться на рельсы мирного строительства. Нам больше не нужно душить наших обджектов ради лишней винтовки."
 
 GPG_focus_careful_trading: "Осторожная торговля"
 GPG_focus_careful_trading_desc: "Нам очень поверхностно известно наше окружение. На просторах Гойки образовалось огромное количество правительств, чьи настроения нам неизвестны. Но мы всё-таки должны немного торговать с ними, для нашего же блага."
 
 GPG_focus_heart_of_goiky: "Сердце Гойки"
 GPG_focus_heart_of_goiky_desc: "Кэсленд восстаёт из руин и вновь становится величайшим городом континента. Благодаря стараниям временного правительства и его гениальным реформам, сердце Гойки вновь бьётся также живо, как прежде."
 
 GPG_focus_power_for_fries: "Полномочия для Фрайса"
 GPG_focus_power_for_fries_desc: "Для сохранения стабильности в Кэсленде необходимо укрепление исполнительной власти. Фрайсу нужны специальные полномочия для сохранения стабильности в регионе."
 
 GPG_focus_announcers_example: "Пример Анонсера"
 GPG_focus_announcers_example_desc: "Анонсер показал себя отличным управленцем и привёл шоу к популярности. Правительство должно брать с него пример. Культ личности Анонсера ещё сильнее укрепит наше правительство."
 
 GPG_focus_our_great_past: "Наше славное прошлое"
 GPG_focus_our_great_past_desc: "Когда-то Гойки был единым. Это было великое время, и Кэсленд - место, где это время до сих пор живёт. Мы должны равняться на то время, и стремиться к тому, чтобы вернуть Гойки его целостность."
 
 GPG_focus_autocratic_cabinet: "Автократический кабинет"
 GPG_focus_autocratic_cabinet_desc: "Для защиты стабильности правительство должно сохранять централизацию. Мы сможем обойтись и без совета."
 
 GPG_focus_puppet_congress: "Марионеточный совет"
 GPG_focus_puppet_congress_desc: "Именно СРП стал причиной крушения правительства. Мы должны держать его под нашим крепким контролем, чтобы обджекты Кэсленда вновь на начали убивать друг друга."
 
 GPG_focus_eternal_chairman: "Постоянный председатель"
 GPG_focus_eternal_chairman_desc: "Для сохранения государственной безопасности, Фрайс будет оставаться на своём посте столько, сколько потребует национальная безопасность."
 
 GPG_focus_army_reformation: "Реформы армии"
 GPG_focus_army_reformation_desc: "Нынешнее положение наших вооружённых сил плачевно. В основном это неорганизованное ополчение с непостоянным составом и сомнительным командованием. Мы должны это исправить и создать полноценные войска."
 
 GPG_focus_personnel_army: "Кадровая армия"
 GPG_focus_personnel_army_desc: "Первое, что мы должна сделать - Избавиться от ополчения. Это сильно ослабит наши вооружённые силы в моменте, но в долгосрочной перспективе позволит нам создать сильнейшие войска в регионе."
 
 GPG_focus_rearmament: "Перевооружение"
 GPG_focus_rearmament_desc: "За время гражданской войны были значительно улучшены технологии вооружения. Мы должны идти в ногу, и, по-хорошему, встать в авангард военных технологий."
 
 GPG_focus_recharnd_military_academy: "Речерндская военная академия"
 GPG_focus_recharnd_military_academy_desc: "Для новой армии нам нужны подготовленные офицерские кадры. В Речернде будет открыта академия для обджектов, поступающих на военную службу."
 
 GPG_focus_doctrine_development: "Разработка доктрины"
 GPG_focus_doctrine_development_desc: "Всякая современная армия должна обладать своей стратегией. Мы должны разработать сухопутную доктрину наших войск."
 
 GPG_focus_end_military_turmoil: "Закончить хаос в армии"
 GPG_focus_end_military_turmoil_desc: "С самого своего создания государственное ополчение представляло из себя неразбериху. Но, благодаря гениальным реформам Временного Правительства, сухопутная армия обджектов Кэсленда теперь является одной из самых прогрессивных в регионе. Смятению положен конец."
 
 GPG_focus_lawnland_question: "§7Лэвнлэнд§!"
 GPG_focus_lawnland_question_desc: "Воспользовавшись нашей слабостью и раздробленностью, правительство в Гринпорте ввела войска в наши северные регионы для 'защиты своих границ'. Мы уже один раз разгромили их марионеток в честном бою, теперь, мы разгромим их самих."
 
 #GPG REPUBLIC PATH
 GPG_focus_third_congress: "§YТретий Съезд§!"
 GPG_focus_third_congress_desc: "Теперь, когда радикалы и оппозиция разгромлена, Совет может спокойно завершить реформы и окончательно стабилизировать правительство на новом, третьем съезде."
 
 GPG_focus_collective_leadership: "Коллективное Руководство"
 GPG_focus_collective_leadership_desc: "Главный принцип нашего правительства - Плюрализм. Каждое мнение должно иметь свой вес."
 
 GPG_focus_only_self_nominated: "Совет самовыдвиженцев"
 GPG_focus_only_self_nominated_desc: "Больше никаких фракций. Совет будет формироваться исключительно из самовыдвигаемых, независимых обджектов."
 
 GPG_focus_lessons_from_democrats: "...Уроки от демократов?"
 GPG_focus_lessons_from_democrats_desc: "Пусть Тако и компания были очевидными марионетками Гринпорта, у них всё же было здравое зерно. Нам следует перенять некоторые их принципы и механизмы управления."
 
 GPG_focus_goiky_republic: "§7Республика§!"
 GPG_focus_goiky_republic_desc: "Самое страшное позади. Кэсленд вновь стабилен и идёт вперёд. Обджекты Гойки скоро будут вновь едины."
 
 GPG_focus_third_congress_end: "§YКонец Съезда§!"
 GPG_focus_third_congress_end_desc: "Съезд завершается. Реформы успешно были проведены, и наше правительство больше никогда не впадёт в бездну анархии и гражданской войны."
 
 GPG_focus_power_for_congress: "Власть для съезда"
 GPG_focus_power_for_congress_desc: "Отныне съезд и СРП - Неоспоримо главные органы управления Республикой. Ничего выше быть не может. Мы не можем допустить диктатуры."
 
 GPG_focus_dream_island_ideals: "Идеалы Острова"
 GPG_focus_dream_island_ideals_desc: "Весь Гойки однажды объединился, чтобы создать райский уголок на краю континента. Пусть это и привело к тяжёлым последствиям, но мы должны стремиться к подобному единству."
 
 GPG_focus_republic_our_great_past: "Наше славное прошлое"
 GPG_focus_republic_our_great_past_desc: "Когда-то Гойки был единым. Это было великое время, и Кэсленд - место, где это время до сих пор живёт. Мы должны равняться на то время, и стремиться к тому, чтобы вернуть Гойки его целостность."
 
 GPG_focus_republic_weaken_the_cabinet: "Ослабить кабинет"
 GPG_focus_republic_weaken_the_cabinet_desc: "Кабинет и председатель не должны отныне иметь прежнего веса в Совете. Основную власть должна получить коллективная сила обджектов-депутатов."
 
 GPG_focus_collective_decisions: "Совместное принятие решений"
 GPG_focus_collective_decisions_desc: "Все главные вопросы государства должны решаться на съезде и свободно обсуждаться всеми обджектами-заседателями. Никакой кулуарности быть не должно, а иначе Кэсленд вновь впадёт в пучину анархии."
 
 GPG_focus_abolition_of_the_chairman: "Отмена Должности Председателя"
 GPG_focus_abolition_of_the_chairman_desc: "Совету не нужен лидер или диктатор. Вся власть должна быть передана коллективному руководству. В связи с этим, должность председателя кабинета устраняется."
 
 GPG_focus_republic_anti_crisis_measures: "Антикризисные меры"
 GPG_focus_republic_anti_crisis_measures_desc: "Кэсленд и окрестности лежат в руинах после опустошительных боёв с радикалами. Нам необходимо восстановить национальную экономику, иначе Кэсленд никогда не сможет вновь стать столицей Гойки."
 
 GPG_focus_republic_restore_fabrics: "Возрождение фабрик"
 GPG_focus_republic_restore_fabrics_desc: "Огромное количество производств было утрачено во время боёв. Необходимо перезапустить фабрики из руин."
 
 GPG_focus_republic_object_industry: "Промышленность для обджектов"
 GPG_focus_republic_object_industry_desc: "Производство мирного времени - Наш приоритет. Военное производство может подождать."
 
 GPG_focus_republic_cancel_military_law: "Отмена военного налога"
 GPG_focus_republic_cancel_military_law_desc: "Кэсленду пришло время возвращаться на рельсы мирного строительства. Нам больше не нужно душить наших обджектов ради лишней винтовки."
 
 GPG_focus_republic_careful_trading: "Осторожная торговля"
 GPG_focus_republic_careful_trading_desc: "Нам очень поверхностно известно наше окружение. На просторах Гойки образовалось огромное количество правительств, чьи настроения нам неизвестны. Но мы всё-таки должны немного торговать с ними, для нашего же блага."
 
 GPG_focus_republic_heart_of_goiky: "Сердце Гойки"
 GPG_focus_republic_heart_of_goiky_desc: "Кэсленд восстаёт из руин и вновь становится величайшим городом континента. Благодаря стараниям временного правительства и его гениальным реформам, сердце Гойки вновь бьётся также живо, как прежде."
 
 GPG_focus_republic_army_reformation: "Реформы армии"
 GPG_focus_republic_army_reformation_desc: "Нынешнее положение наших вооружённых сил плачевно. В основном это неорганизованное ополчение с непостоянным составом и сомнительным командованием. Мы должны это исправить и создать полноценные войска."
 
 GPG_focus_republic_personnel_army: "Кадровая армия"
 GPG_focus_republic_personnel_army_desc: "Первое, что мы должна сделать - Избавиться от ополчения. Это сильно ослабит наши вооружённые силы в моменте, но в долгосрочной перспективе позволит нам создать сильнейшие войска в регионе."
 
 GPG_focus_republic_rearmament: "Перевооружение"
 GPG_focus_republic_rearmament_desc: "За время гражданской войны были значительно улучшены технологии вооружения. Мы должны идти в ногу, и, по-хорошему, встать в авангард военных технологий."
 
 GPG_focus_republic_recharnd_military_academy: "Речерндская военная академия"
 GPG_focus_republic_recharnd_military_academy_desc: "Для новой армии нам нужны подготовленные офицерские кадры. В Речернде будет открыта академия для обджектов, поступающих на военную службу."
 
 GPG_focus_republic_doctrine_development: "Разработка доктрины"
 GPG_focus_republic_doctrine_development_desc: "Всякая современная армия должна обладать своей стратегией. Мы должны разработать сухопутную доктрину наших войск."
 
 GPG_focus_republic_end_military_turmoil: "Закончить хаос в армии"
 GPG_focus_republic_end_military_turmoil_desc: "С самого своего создания государственное ополчение представляло из себя неразбериху. Но, благодаря гениальным реформам Временного Правительства, сухопутная армия обджектов Кэсленда теперь является одной из самых прогрессивных в регионе. Смятению положен конец."
 
 GPG_focus_republic_lawnland_question: "§7Лэвнлэнд§!"
 GPG_focus_republic_lawnland_question_desc: "Воспользовавшись нашей слабостью и раздробленностью, правительство в Гринпорте ввела войска в наши северные регионы для 'защиты своих границ'. Мы уже один раз разгромили их марионеток в честном бою, теперь, мы разгромим их самих."
 
 #GDR FOCUSES
 #GDR CW tree
 GDR_focus_fight_for_the_republic: "§7Битва за республику!§!"
 GDR_focus_fight_for_the_republic_desc: "После того как переходное правительство попрало демократию и попыталось установить авторитарный режим, мы не можем рассчитывать на мирное установление республики. Обджекты Зелёных Равнин должны взять винтовки и пойти в бой на свою свободу!"
 
 GDR_focus_gpr_support_expansion: "Расширение поставок"
 GDR_focus_gpr_support_expansion_desc: "Наши друзья из Гринпорта помогут нам в борьбе с противниками республики."
 
 GDR_focus_military_advisors: "Военные советники"
 GDR_focus_military_advisors_desc: "Из западной республики к нам прибыли офицеры и советники для помощи в организации обороны и наступлений. Мы должны использовать это как можно больше."
 
 GDR_focus_volunteers_from_greeny_plains: "Добровольцы Зелёных Равнин"
 GDR_focus_volunteers_from_greeny_plains_desc: "Из Гринпорта нам также пребывает огромное количество добровольцев, которые готовы сражаться за республику."
 
 GDR_focus_rule_of_majority: "Власть большинства"
 GDR_focus_rule_of_majority_desc: "Основной принцип нашей будущей республики - Демократия. Мы уже сейчас должны всесторонне его продвигать."
 
 GDR_focus_help_with_industry: "Импорт промышленности"
 GDR_focus_help_with_industry_desc: "Для победы нам необходимо производство. Северная часть бывшего переходного режима, где сейчас распологается наше правительство, не отличалась промышленным развитием. Наши друзья из Гринпорта окажут нам широкую поддержку."
 
 GDR_focus_arsenal_of_democracy: "Арсенал демократии"
 GDR_focus_arsenal_of_democracy_desc: "Пока налаживаются наши новые производственные линии, из Гринпорта нам будут вестись поставки вооружения."
 
 GDR_focus_constitution: "§7Вторая Конституция§!"
 GDR_focus_constitution_desc: "Первая конституция потерпела крах. Но за вторую конституцию мы будем биться до последнего обджекта."
 
 #GDR post-CW tree
 focus_GDR_triumph_of_the_democracy: "§7Триумф Демократии§!"
 focus_GDR_triumph_of_the_democracy_desc: ""
 
 focus_GDR_third_congress: "Третий Съезд"
 focus_GDR_third_congress_desc: "Теперь, когда демократии в Кэсленде ничего не угрожает, СРП может вновь собраться для решения государственных вопросов!"
 
 focus_GDR_president_selection: "Президентские Выборы"
 focus_GDR_president_selection_desc: "Кончается эпоха коллективного правительства. Пора нашим обджектам избрать слугу народа."
 
 focus_GDR_dealing_with_crisis: "Кризис"
 focus_GDR_dealing_with_crisis_desc: "Тяжело на всех Зелёных Равнинах отозвалась эта война. К тому же, на нас висит тяжёлое ярмо кредитов от Гринпорта. Пришло время съезду с этим разобраться."
 
 focus_GDR_congress_plan: "§3План Совета§!"
 focus_GDR_congress_plan_desc: ""
 
 focus_GDR_deindustrialization: "Вывоз Промышленности"
 focus_GDR_deindustrialization_desc: "Чтобы расплатиться по долгам, нам придётся попрощаться с некоторыми промышленными предприятиями. К сожалению, у нас нет выбора."
 
 focus_GDR_shock_therapy: "Шоковая Терапия"
 focus_GDR_shock_therapy_desc: "Для запуска экономики нам необходимо перераспределение собственности. Государство должно начать этот процесс."
 
 focus_GDR_debt_payments: "Закрытие Долгов"
 focus_GDR_debt_payments_desc: "Пусть и большой ценой, но мы сумели расплатиться по счетам. Теперь мы можем двигаться вперёд!"
 
 focus_GDR_ban_military_organizations: "Запрет Экстремизма"
 focus_GDR_ban_military_organizations_desc: "Сколько горя и бед принесли обджектам кровожадные столкновения политических полушарий. Пора положить этому конец."
 
 focus_GDR_representation_for_right: "Представители для Правых"
 focus_GDR_representation_for_right_desc: "Консерваторы и умеренные правые имеют право существовать в нашем политическом поле. Да здравствует демократия!"
 
 focus_GDR_representation_for_left: "Представители для Левых"
 focus_GDR_representation_for_left_desc: "Социал-демократы и нереволюционные организации должны быть представлены в нашей демократии."
 
 focus_GDR_lower_house_plan: "План Нижней Палаты"
 focus_GDR_lower_house_plan_desc: ""
 
 focus_GDR_demilitarization: "Разоружение"
 focus_GDR_demilitarization_desc: "Армия съедает огромную долю национальных доходов, которые мы могли бы пустить на погашение долга."
 
 focus_GDR_slow_privatization: "Постепенная Приватизация"
 focus_GDR_slow_privatization_desc: "Резкие и крупные передачи собственности могут плохо сказаться на единстве нашей демократии. В этом нет нужды."
 
 focus_GDR_debt_negotiations: "Переговоры по Долгам"
 focus_GDR_debt_negotiations_desc: "Большая часть долга уже выплачена, и, возможно, Гринпорт пойдёт на попятную, касаясь оставшейся доли."
 
 focus_GDR_land_of_liberty: "§6Маяк Свободы§!"
 focus_GDR_land_of_liberty_desc: "Наша Республика окончательно закрепилась в сердце Гойки как демократическое государство, в котором все обджекты имеют право на свободу слова и собрания. Мы должны освещать путь всему Гойки."
 
 focus_GDR_democratic_congress: "§7Демократический Съезд§!"
 focus_GDR_democratic_congress_desc: ""
 
 focus_GDR_lawnland: "Лэвнлэнд"
 focus_GDR_lawnland_desc: "В результате нестабильности Республики Гринпорт отсёк от нас пограничный Лэвнленд и прилегающие территории. Пора Лэвнленду вернуться назад."
 
 focus_GDR_casland_role: "Роль Кэсленда"
 focus_GDR_casland_role_desc: "Кэсленд - историческая столица всего Гойки. Объединение должно пройти именно под знамёнами исторической столицы."
 
 #GSR FOCUSES
 #GSR CW tree
 GSR_focus_workers_revolution: "§RРабочая революция§!"
 GSR_focus_workers_revolution_desc: "Ура! Рабочие шахт наконец-то сбросили с себя ярмо диктатуры капиталистов и чиновничества Временного Правительства! Но это только начало. Рабочим Гойки нужно разбить в последнем бою противников революции, стремящихся восстановить грабительский строй."
 
 GSR_focus_toilers_dictatorship: "Диктатура Пролетариата"
 GSR_focus_toilers_dictatorship_desc: "В эти тяжёлые дни за судьбы социализма, рабочие Гойки должны установить жёсткий контроль над любыми проявлениями оппозиции методами террора."
 
 GSR_focus_red_army: "Красная Армия"
 GSR_focus_red_army_desc: "После того как временное правительство рухнуло и борьба перешла из подполья в настоящую линию фронта, пришло время переорганизовать рабочие батальоны в настоящую боеспособную армию."
 
 GSR_focus_political_commissars: "Политические коммисары"
 GSR_focus_political_commissars_desc: "Для поддержки боевого духа армии нам необходимы ячейки политического просвещения и надзора в каждой боевой единице. Такими ячейками выступят передовые обджекты-оппозиционеры добровольцы, которые хорошо показали себя во время подпольной борьбы."
 
 GSR_focus_full_expropriation: "Полная Экспроприация"
 GSR_focus_full_expropriation_desc: "Пришло время покончить с эксплуатацией обджектов. Все производственные и добыващие предприятия отныне перейдут в собственность рабочего правительства."
 
 GSR_focus_well_screw_the_bayonets_ourselves: "...Мы сами прикрутим штыки!"
 GSR_focus_well_screw_the_bayonets_ourselves_desc: "Никто не защитит рабочих, кроме их самих. Обджекты на заводах должны трудиться не покладая рук для защиты революции, а если нужно, взять своей же рукой собранную винтовку и пойти сражаться."
 
 GSR_focus_triumphant_victory: "§RТоржественная Победа§!"
 GSR_focus_triumphant_victory_desc: "Победное шествие революции распространилось на всю прежнюю территорию Временного Правительства и реакционеры оказались разгромлены. Эта победа войдёт в историю Гойки как величайший толчок к свободе всех обджектов."
 
 #GSR post-CW tree
 GSR_focus_successful_revolution: "§RУспешная Революция§!"
 GSR_focus_successful_revolution_desc: "С тяжёлыми боями, рабочие Кэсленда сумели взять власть в свои руки. Но Республика находится в очень неустойчивом положении. Необходимо разгромить оставшиеся контрреволюционные силы, которые дремлют в недрах нашего общества."
 
 GSR_focus_struggle_with_anarchists: "Борьба с анархизмом"
 GSR_focus_struggle_with_anarchists_desc: "Многие обджекты, сражавшиеся за революционные идеалы бок о бок с нами, после победы социализма стали уходить в радикализм и левый уклон. Это очень губительно для нашего государства."
 
 GSR_focus_army_arrests: "Чистки в армии"
 GSR_focus_army_arrests_desc: "Армейские части разлагаются с каждым днём под влиянием гнилой пропаганды. Партии необходимо это присечь и арестовать обджектов-подстрекателей."
 
 GSR_focus_congress_condemnation: "Чистки в партии"
 GSR_focus_congress_condemnation_desc: "И в рядах Рабочего Фронта сегодня есть множество обджектов, симпатизирующих анархистам и раскольникам. Необходимо вырвать с корнем эту заразу."
 
 GSR_focus_casland_process: "§YКэслендский Процесс§!"
 GSR_focus_casland_process_desc: "Было вскрыто множество ячеек анархистов по всей стране. Пришло время провести суд над лидерами заговора."
 
 GSR_focus_slow_retirement: "Медленный переход"
 GSR_focus_slow_retirement_desc: "Победа одержана. Обджекты устали от военного времени. Пришло время постепенно уходить от практики военного коммунизма и сделать упор в повышение качества жизни наших обджектов."
 
 GSR_focus_sweets_monopoly: "Монополия на сладости"
 GSR_focus_sweets_monopoly_desc: "По предложению Руби в президиуме, государство введёт полный контроль над производством и сбытом сладкой и подслащённой продукции."
 
 GSR_focus_new_economic_policy: "§7Новая Экономическая Политика§!"
 GSR_focus_new_economic_policy_desc: "Пришло время снять с горба огромные военные расходы и уйти от военного коммунизма."
 
 
 GSR_focus_first_congress_ruby: "§YПервый съезд§!"
 GSR_focus_first_congress_ruby_desc: ""
 
 GSR_focus_peoples_constitution: "Народная конституция"
 GSR_focus_peoples_constitution_desc: "'Первая Конституция Республики Гойки' была переполнена популизмом и ложью. Весь этот документ стал констатацией факта установления рабства и тирании над трудящимися обджектами Зелёных Равнин. Теперь же, после установления народовластия в Кэсленде, этот документ должен быть переписан полностью."
 
 GSR_focus_article_17: "Статья 17"
 GSR_focus_article_17_desc: "'Каждый обджект Социалистической Республики Зелёных Равнин имеет гарантированное право на трудоустройство, кров и пищу. Это право обеспечивается:\n\n1. Плановым хозяйством СРЗР.\n\n.2 Социалистическим строем государства и политикой всеобщего равенства.'"
 
 GSR_focus_fabrics_conversion: "Перевод фабрик"
 GSR_focus_fabrics_conversion_desc: "Мы больше не нуждаемся в таких масштабах военного производства. Республике пришло время перейти на рельсы мирного строительства и обеспечить жителей в необходимых товарах."
 
 GSR_focus_peoples_goods: "Народные товары"
 GSR_focus_peoples_goods_desc: "Самый лучший способ убедить обджектов в превосходстве социализма - дать им так необходимые блага цивилизации, которые они утеряли после развала Гойки и Временного Правительства. Мы должны наполную развернуть мирное производство."
 
 GSR_focus_regional_development: "Развитие регионов"
 GSR_focus_regional_development_desc: "В результате гражданской войны округа Кэсленда превратилась в раскопанную сапёрными лопатами пустошь. Пришло время привести эти регионы в порядок и сконцентрироваться именно на их развитии."
 
 GSR_focus_slow_down_casland: "Замедлить Кэсленд"
 GSR_focus_slow_down_casland_desc: "Ещё на картах времён единого Гойки явно проявляется неравенство регионов нашей нынешней Республики: Кэсленд, как экономический центр, намного лучше развит, нежели окраины. Сейчас нам нужно замедлить развитие Кэсленда в пользу окрущающих провинций."
 
 GSR_focus_planning_commitee: "Комитет по Планированию"
 GSR_focus_planning_commitee_desc: "Логичным результатом наших экономических реформ стал бы сбор всех плановых органов под одну крышу и создание единого государственного экономического управления."
 
 GSR_focus_socialism_with_sugar_characters: "Социализм с сахарной спецификой"
 GSR_focus_socialism_with_sugar_characters_desc: "Пора определить путь нашего государства на курс социализма. В определении этой дороги нам поможет наш Великий Председатель."
 
 GSR_focus_cultural_revolution: "Культурная Революция"
 GSR_focus_cultural_revolution_desc: "В первую очередь нужно отбить у обджектов отмёршее, устаревшее представление о мире. Массовые пропагандистские кампании должны затронуть каждый уголок нашей Великой Коммуны."
 
 GSR_focus_new_casland_object: "Новый Кэслендский Обджект"
 GSR_focus_new_casland_object_desc: "Гражданин нашего славного Социалистического Государства должен иметь новую, лучшую, социалистическую мораль. В нём будут искоренены все те пороки, которые существуют в обджекте нынешнем: индивидуализм, мещанство, корысть и прочие болезни морали нынешней."
 
 GSR_focus_the_only_right_way: "Единственный Верный Путь"
 GSR_focus_the_only_right_way_desc: "Нет иного пути к социализму кроме того, что диктует Руби и партия. Всё остальное - ложь и ревизионизм."
 
 GSR_focus_condemn_firey: "Осудить Файри"
 GSR_focus_condemn_firey_desc: "Революционный Фронт является ревизионистским, соглашательским образованием и предствляет для нас не меньшую угрозу, нежели окружающие реакционные государства. Никаких сделок с ревизионистами."
 
 GSR_focus_great_chairman_ruby: "§RВеликий Председатель Руби§!"
 GSR_focus_great_chairman_ruby_desc: "Руби есть отражение и авангард революционных обджектов Кэсленда и всего Гойки! Она поведёт нас вперёд под социалистическим знаменем и разгромит реакционеров!\n\nДа здравствует Руби!\nДа здравствует Руби!\nДа здравствует Руби!"
 
 GSR_focus_socialism_in_one_country: "Социализм в одной стране"
 GSR_focus_socialism_in_one_country_desc: "Объединение Гойки может подождать. Мы должны сконцентрироваться на внутренних делах нашей Республики, окружающие реакционные режимы сами рухнут, видя наш великий прогресс."
 
 GSR_focus_take_what_ours: "§YЛэвнлендский Вопрос§!"
 GSR_focus_take_what_ours_desc: "Реакционеры на севере, фашистская диктатура под прикрытием 'демократии' отрезала от нас Лэвнленд - неотъемлемую часть нашей Социалистической Республики. Необходимо восстановить Лэвнленд в нашем составе, даже если придётся пронести знамя революции до самого побережья."
 
 #GSR Anarchists
 GSR_focus_objects_liberation: "§tОсвобождение обджектов§!"
 GSR_focus_objects_liberation_desc: "Рабочие Кэсленда успешно взяли власть в свои руки, но революция должна идти дальше. Обджекты должны быть освобождены от оков государства!"
 
 GSR_focus_anarchists_consolidation: "Консолидация"
 GSR_focus_anarchists_consolidation_desc: "Пришло время либертарианскому крылу открыто заявить о себе перед госаппаратом и выступить на съезде партии."
 
 GSR_focus_anarchist_propaganda: "Глас освобождения"
 GSR_focus_anarchist_propaganda_desc: "Все сознательные обджекты Зелёных Равнин должны услышать и проникнуться свободным духом нашей революции. С этой целью отряды активистов будут распространять идеалы анархизма по всему Кэсленду."
 
 GSR_focus_embrace_syndicalism: "Объятия синдикализма"
 GSR_focus_embrace_syndicalism_desc: "Частичная передача власти профсоюзам и самоуправление на рабочем месте - залог победы социализма!"
 
 GSR_focus_objects_communities: "Создание общин"
 GSR_focus_objects_communities_desc: "Нет ничего сильнее коллектива! Сегодня обджекты Кэсленда должны сплачиваться для борьбы с контрреволюцией."
 
 
 GSR_focus_first_coucils_congress: "§RПервый Съезд Советов§!"
 GSR_focus_first_coucils_congress_desc: ""
 
 GSR_focus_deconstruction: "Деконструкция"
 GSR_focus_deconstruction_desc: "Государственный аппарат, который стоит на плечах наших обджектов, который душит свободный порыв Зелёных Равнин, безусловно должен быть уничтожен. Чем раньше, тем лучше."
 
 GSR_focus_crush_mineco: "§YМинистерство Экономики§!"
 GSR_focus_crush_mineco_desc: "Налоги, непосильные пошлины, удушающая политика государства действует на обджектов как смертельный яд. Он должен перестать отравлять наше свободное общество."
 
 GSR_focus_crush_foraff: "§YИностранные Дела§!"
 GSR_focus_crush_foraff_desc: "Нам не нужны дипломатические связи с контрреволюцией и желателями отобрать нашу свободу. Следовательно, Министерство Иностранных Дел безусловно должно отмереть, как бесполезный конструкт."
 
 GSR_focus_crush_police: "§YСиловые Органы§!"
 GSR_focus_crush_police_desc: "Средства подавления свободного нрава обджектов Зелёных Равнин должны быть безжалостно уничтожены. Никто не защитит нас лучше, чем мы сами, и нам не нужна помощь государства."
 
 GSR_focus_crush_parliament: "§YПарламент§!"
 GSR_focus_crush_parliament_desc: "Конгресс, Съезд, Совет и так далее. Как бы это явление не называлось, оно не даёт простым обджектам ничего, кроме кулуарной диктатуры нескольких десятков человек. Нам не нужны представительства, единственная настоящая демократия - анархическая демократия."
 
 GSR_focus_crush_army: "§YАрмия§!"
 GSR_focus_crush_army_desc: "Государственные вооружённые силы это точно такой же инструмент подавления, как и полиция. Необходимо без промедления с ним расправиться и передать бремя обороны народным массам."
 
 GSR_focus_we_dont_need_constitution: "Нам не нужна Конституция"
 GSR_focus_we_dont_need_constitution_desc: "Бумага с чернилами никак не может гарантировать свобод обджектов. Нам не нужна эта профанация, чтобы утвердить свободу Зелёных Равнин."
 
 GSR_focus_free_from_government: "Свобода от Государства"
 GSR_focus_free_from_government_desc: "Государственная система была практически ликвидирована здесь, на территории свободных обджектов. Нам не нужны господа!"
 
 GSR_focus_lawnland_liberation: "§tОсвобождение Лэвнленда§!"
 GSR_focus_lawnland_liberation_desc: ""
 
 #GFG FOCUSES
 #GFG CW tree
 GFG_focus_indivisible_goiky: "§gНеделимый Гойки§!"
 GFG_focus_indivisible_goiky_desc: "Временное Правительство показало свою полную неспособность защитить сердце Гойки от предателей и оппортунистов. В таком случае, с национал-предателями расправятся наши штурмовые отряды."
 
 GFG_focus_unity_or_death: "Единство или смерть!"
 GFG_focus_unity_or_death_desc: "Наша главная цель - Единый и Неделимый Гойки, и мы готовы отдать тысячи жизней наших обджектов ради этого."
 
 GFG_focus_full_militarization: "Полная милитаризация"
 GFG_focus_full_militarization_desc: "Все доступные нам обджекты должны встать под ружьё ради объединения Гойки!"
 
 GFG_focus_expand_militia: "Расширение ополчения"
 GFG_focus_expand_militia_desc: "Наша армия в основном состоит из разношёрстных отрядов ополчения от разных военизированных организаций. Нам необходимо сплотить и расширить их!"
 
 GFG_focus_physical_destruction_of_opposition: "Физическое уничтожение оппозиции"
 GFG_focus_physical_destruction_of_opposition_desc: "Любой оппозиционер нашего режима - Противник нации. Оппозицию нужно безжалостно давить, как ядовитых жуков."
 
 GFG_focus_2_hours: "2 Часа на Государство"
 GFG_focus_2_hours_desc: "Обджекты на заводах будут работать 2 дополнительных часа, зарплата с которых пойдёт в казну."
 
 GFG_focus_national_resurrection: "§gНациональное Возрождение§!"
 GFG_focus_national_resurrection_desc: "Предатели и Пятая Колонна разгромлены. Наше государство объединяет все территории, прежде контролировавшееся переходным режимом. Это первый шаг к нашей цели."
 
 #GFG post-CW tree
 GFG_focus_green_grass_black_flag: "§7Чёрный флаг, Зелёная трава§!"
 GFG_focus_green_grass_black_flag_desc: ""
 
 GFG_focus_trial_over_traitors: "Суд над предателями"
 GFG_focus_trial_over_traitors_desc: "Демократы, коммунисты, нейтралы, как бы себя ни называли предатели народа и нации, они постигнут участь, которую заслуживают."
 
 #Fanny
 GFG_focus_neverending_victory: "§YВечная Победа§!"
 GFG_focus_neverending_victory_desc: ""
 
 GFG_focus_goikian_identity: "Гойкийская Идентичность"
 GFG_focus_goikian_identity_desc: "За то время, что Гойки находится в глубокой анархии, многие обджекты уже успели забыть, что они являются представителями великой расы, и присягнули местным незаконным государственным формированиям. Пора вернуть им мозги на место."
 
 GFG_focus_if_you_feel: "По зову сердца"
 GFG_focus_if_you_feel_desc: "Любой обджект Гойки может считать себя представителем великой Гойкийской Нации, как бы сильно он ни отличался от населения Зелёных Равнин. Все мы едины!"
 
 GFG_focus_clean_from_traitors: "Чисты от предателей"
 GFG_focus_clean_from_traitors_desc: "Обджекты Кэсленда больше никогда не должны начать братоубийственной войны. Предательство и подстрекательство должны быть жестоко присечены."
 
 GFG_focus_free_from_empathy: "Свободны от сострадания"
 GFG_focus_free_from_empathy_desc: "Не может быть никакой жалости к предателям нации и расы, под какими бы ложными знамёнами они ни стояли и какими бы лозунгами ни прикрывались. Все эти дегенераты должны быть уничтожены."
 
 GFG_focus_goiky_ressurection_government: "§YПравительство Возрождения§!"
 GFG_focus_goiky_ressurection_government_desc: "Теперь, когда сердце Великого Континента чисто от ублюдков, забывших свои корни, Кэсленд может открыто заявить о своей цели по очищению всего континента.\n\n§RДа Здравствует Гойки!§!"
 
 GFG_focus_i_hate_you: "§RЯ ненавижу тебя!§!"
 GFG_focus_i_hate_you_desc: ""
 
 GFG_focus_deal_with_resistance: "Удар по сопротивлению"
 GFG_focus_deal_with_resistance_desc: "Ячейки террористов по всей стране всё ещё являются большой проблемой для нас. Пришло время окончательно раздавить предателей, которые посягают на Национальное Возрождение Гойки."
 
 GFG_focus_integrate_neutrals: "Интеграция Нейтралов"
 GFG_focus_integrate_neutrals_desc: "Многие члены Нейтральной Фракцци абсолютно спокойны к нашей власти, а иногда и симпатизируют жёстким решениям нашей администрации. Необходимо воспользоваться этой возможностью для легитимизации режима."
 
 GFG_focus_restore_cabinet: "Восстановление Кабинета"
 GFG_focus_restore_cabinet_desc: "Старый режим хоть и являлся бесхребетной нежизнеспособной системой, но многие практики его управления могли бы быть очень даже эффективны под сильной рукой. Восстановление Кабинета СРП улучшит работу администрации, а также успокоит обджектов."
 
 GFG_focus_greeny_plains_terror: "Поля в Огне"
 GFG_focus_greeny_plains_terror_desc: "Предатели и бандиты должны быть жестоко раздавлены нашей могучей рукой. И ни в коем случае нельзя показать слабость сейчас."
 
 GFG_focus_operation_east: "Восточная Операция"
 GFG_focus_operation_east_desc: "Коммунисты среди рабочих Гринмайна, ячейки демократов в полях Зелёных Равнин, пришло время покончить с этими национал-предателями. Добровольцы Национального Возрождения катком пройдутся по восточным регионам, и ничего, если полетит пара случайных голов."
 
 GFG_focus_autarky: "Автаркия"
 GFG_focus_autarky_desc: "Нашей национальной миссии не нужен никто, кроме нас и наших обджектов. Для этого нужно обеспечить полную экономическую самостоятельность."
 
 GFG_focus_traitors_work: "Руки Предателя"
 GFG_focus_traitors_work_desc: "Исправительные работы отлично помогут быстрее справиться с развалинами Гражданской Войны. Да и к тому же, предателей не жалко."
 
 GFG_focus_enemys_treasures: "Сокровища Врага"
 GFG_focus_enemys_treasures_desc: "Государственная казна должна пополниться за счёт активов национал-предателей."
 
 GFG_focus_take_methods: "Методы"
 GFG_focus_take_methods_desc: "Снежный Рейх является великолепным примером экономического скачка в полной изоляции. Нам следует у них поучиться."
 
 GFG_focus_but_not_the_ideas: "Но не идеи"
 GFG_focus_but_not_the_ideas_desc: "Идеология Снежного Рейха абсолютно противна духу Национального Возрождения. Это лишь очередные предатели, посягнувшие на единство Гойки, пусть и находящиеся в схожем положении. С ними не может быть никаких контактов."
 
 GFG_focus_reconstruction: "Реконструкция"
 GFG_focus_reconstruction_desc: "Мы должны сконцентрироваться на проектах восстановления стратегических промышленных преприятий."
 
 GFG_focus_national_acceleration: "Национальное Ускорение"
 GFG_focus_national_acceleration_desc: "Славный дух нового Национального Государства вдохновнит наших великих обджектов на свершения и десятикратный труд во имя Гойки!"
 
 GFG_focus_looking_up: "Поднятье Взоров"
 GFG_focus_looking_up_desc: "Теперь, когда Кэсленд встретил свою новую жизнь, настало время распросранить Национальное Возрождение на окружающие территории. Вперёд, Гойки!"
 
 #Pillow :D
 GFG_focus_neverending_terror: "§1Вечный Террор§!"
 GFG_focus_neverending_terror_desc: ""
 
 GFG_focus_burn_their_towns: "Сжигайте их дома"
 GFG_focus_burn_their_towns_desc: "Поселения, которые поддержали дегенератов, должны быть наказаны. Национальная кара постигнет каждого предателя на этой земле."
 
 GFG_focus_kill_their_people: "Режьте их обджектов"
 GFG_focus_kill_their_people_desc: "При малейшем подозрении на предательство должны быть приняты самые жесточайшие меры.\n§RНИКТО НЕ УЙДЁТ ОТ НАКАЗАНИЯ.§!"
 
 GFG_focus_fake_gods: "Ложные Боги"
 GFG_focus_fake_gods_desc: "За время деградации и разъедающего анархизма обджекты Гойки признали над собой ложные правительства и ложные идеи, чем совершили жесточайшее предательство против своей расы.\n§RКАЖДЫЙ ПРЕДАТЕЛЬ БУДЕТ НАКАЗАН.§!"
 
 GFG_focus_call_of_the_north: "Зов Севера"
 GFG_focus_call_of_the_north_desc: "Современные обджекты Гойки безусловно являются предками великой Йойлолендской нации. Эта древняя цивилизация опережала своё время, возводила великие городские агломерации и стойко переживала тяжёлые условия жизни. Мы должны равняться на наших предков!"
 
 GFG_focus_terra_yoylelandia: "§1Йойлоленд§!"
 GFG_focus_terra_yoylelandia_desc: "Недообджекты, дегенераты и предатели раздробили великую Йойлолендскую расу и оскотинили её представителей. Анархия явилась лишь логичным исходом. Необходимо положить этому конец.\n\n§КВеликая Раса сначала уничтожит предателей внутри, а потом вернётся на свою Родину.§!"
 
 GFG_focus_loyalty_to_ancestors: "§1Верность Предкам§!"
 GFG_focus_loyalty_to_ancestors_desc: ""
 
 GFG_focus_neutrals_execution: "Никаких Исключений"
 GFG_focus_neutrals_execution_desc: "Всех, кто когда-либо выступали противниками Национальной Революции, должна постичь её жестокая кара. И мы не будем договариваться."
 
 GFG_focus_militarization: "Перевооружение"
 GFG_focus_militarization_desc: "Нашим войскам нужны хорошие ружья для разгрома отступников и предателей. Нашим войскам нужен кров, чтобы продолжать походы. Следует сконцентрироваться на этом."
 
 GFG_focus_expedition: "§1Экспедиция§!"
 GFG_focus_expedition_desc: "Пришло время отправить отряд наших самых доблестных обджектов, чтобы они посетили землю предков."
 
 GFG_focus_opening_backpacks: "§YОткрываем рюкзаки!§!"
 GFG_focus_opening_backpacks_desc: ""
 
 GFG_focus_culture: "§2Культура§!"
 GFG_focus_culture_desc: "Огромный пласт ментального наследия был утерян в просторах Йойлоленда. Мы, безусловные наследники могучей северной цивилизации, обязаны восстановить эти утраченные сокровища у себя."
 
 GFG_focus_language: "Язык"
 GFG_focus_language_desc: "Погибшая, утраченная в бездне времени йойлолендская рукопись была добыта нами, и должна ожить вновь."
 
 GFG_focus_nation: "Нация"
 GFG_focus_nation_desc: "После распада Южного Гойки над всеми обджектами остро встал вопрос национальной ориентации. Пришло время и нам гордо поднять знамя Йойлоленда над сердцем Гойки!"
 
 GFG_focus_were_yoylesse: "Мы - Йойлолендцы!"
 GFG_focus_were_yoylesse_desc: "Гойкийская нация погибла в огне саморазрушения.\nМы - не Гойкийцы, Мы - Йойлолендцы! Мы - Наследники великой цивилизации."
 
 GFG_focus_economics: "§YЭкономика§!"
 GFG_focus_economics_desc: "Кэсленд переживает тяжёлые дни. В результате развала, а затем предательства съезда и гражданской войны, мы находимся в тяжелейшем кризисе. Необходимо уничтожить эту напасть, прежде чем нас сожрут окружающие режимы."
 
 GFG_focus_technologies: "Технологии"
 GFG_focus_technologies_desc: "Благодаря образцам, собранным в экспедиции, мы способны совершить серьёзный технологический рывок в экономике."
 
 GFG_focus_pillow_reconstruction: "Восстановление"
 GFG_focus_pillow_reconstruction_desc: "Кэсленд и окраины лежат в руинах, а мы ничего с этим не делаем. Пришло время для реконструкции!"
 
 GFG_focus_keep_up_militarization: "Углубление Милитаризации"
 GFG_focus_keep_up_militarization_desc: "Ради выполнения миссии и уничтожения предателей нам необходимо продолжать военное строительство."
 
 GFG_focus_labor_service: "Трудовая Повинность"
 GFG_focus_labor_service_desc: "Каждый обджект Кэсленда должен трудиться ради защиты своего государства."
 
 GFG_focus_establish_autarky: "Автаркия"
 GFG_focus_establish_autarky_desc: "Для поддержания нашей борьбы нам необходима экономическая самостоятельность. Следует стремиться к этому идеалу."
 
 GFG_focus_politics: "§6Политика§!"
 GFG_focus_politics_desc: "Для сохранения единства и разгрома противников нам нужна крепкая рука и общественное единство, выраженное в общей политической линии."
 
 GFG_focus_final_hit: "Разгром Сопротивления"
 GFG_focus_final_hit_desc: "Наша политика по уничтожению повстанцев отлично показала себя, но по всей стране всё ещё действуют некоторые ячейки предателей. Пора нанести по ним последний удар."
 
 GFG_focus_unity: "Единство"
 GFG_focus_unity_desc: "Обджекты всего Кэсленда должны встать под знамёна Предков и объединиться, иначе, мы будем разгромлены."
 
 GFG_focus_yoyleland_government: "Лиловое Государство"
 GFG_focus_yoyleland_government_desc: "Никогда не было ничего подобного в истории Гойки. Мы - Единственные и неповторимые наследники великого Йойлоленда, и нашей нации нет равных среди предателей и отступников."
 
 GFG_focus_ours_by_right: "§1Наше по Праву§!"
 GFG_focus_ours_by_right_desc: "Дегенераты, которые воспользовались нашей слабостью, которые украли у нас нашу драгоценную землю, поплатятся. И это неизбежно."
 
 #GFG Expansion Tree
 GFG_focus_greeny_plains_claims: "§7Претензии на Зелёные Равнины§!"
 GFG_focus_greeny_plains_claims_desc: ""
 
 GFG_focus_southern_agreement: "Южное Соглашение"
 GFG_focus_southern_agreement_desc: "Перед тем как атаковать предателей на севере, нужно обезопасить свои тылы. Для этого следует договориться с правительством в Малых Равнинах."
 
 GFG_focus_agreement_result: "[GFG_FOCUS_AGREEMENT_RESULT]"
 GFG_focus_agreement_result_desc: ""
 GFG_focus_agreement_result_succeed: "Пакт о Ненападении"
 GFG_focus_agreement_result_failed: "Неудачные Переговоры"
 
 GFG_focus_break_the_line: "§tПересечение Линии§!"
 GFG_focus_break_the_line_desc: "Пришло время разгромить ублюдков в Гринпорте раз и навсегда!"
 
 #GOIKY TECHNOCRATIC REPUBLIC
 GTR_focus_project_1: "Проект №1"
 GTR_focus_project_1_desc: ""
 
 GTR_focus_stage_1: "Первый Этап"
 GTR_focus_stage_1_desc: "Необходимо всё тщательно спланировать, ибо от этого зависит судьба всего Гойки. Наш университет способен на это, и мы обязаны перед всеми обджектами приступить к выполнению этого задания."
 
 GTR_focus_best_minds: "Лучшие Умы"
 GTR_focus_best_minds_desc: "Кампус полон светлейших умов со всего континента. Необходимо привлечь их для работы над восстановлением Острова Мечты."
 
 GTR_focus_make_a_recipe: "Составить Рецепт"
 GTR_focus_make_a_recipe_desc: "Печь, 320 градусов по Фаренгейту... Необходимо написать чёткий рецепт приготовления соуса, чтобы всё прошло хорошо."
 
 GTR_focus_stage_2: "Вторая Стадия"
 GTR_focus_stage_2_desc: "Проект требует огромного количества ресурсов, нам нужно добыть их любой ценой."
 
 GTR_focus_austerity_politics: "Жёсткая экономия"
 GTR_focus_austerity_politics_desc: "Соберём со всех по крошкам, во имя всеобщего блага. Пусть это и создаст некоторые лишения, но это необходимо."
 
 GTR_focus_integrate_greenheart: "Включить Гринхарт"
 GTR_focus_integrate_greenheart_desc: "Поля Гринхарта полны множества различных ресурсов и не заняты ни одной из военных группировок, нам необходимо использовать этот шанс."
 
 GTR_focus_get_digging: "Копай!"
 GTR_focus_get_digging_desc: "Мы должны зубами вгрызться в землю и вытащить из неё всё, что там может понадобиться."
 
 GTR_focus_stage_3: "Третья Стадия"
 GTR_focus_stage_3_desc: "Ресурсы и план подготовлены. Мы в шаге от успеха. Пора перейти к практике."
 
 GTR_focus_mix_it_up: "Замешать"
 GTR_focus_mix_it_up_desc: "Объединим ингредиенты!"
 
 GTR_focus_get_the_oven_ready: "Нагреть Печь"
 GTR_focus_get_the_oven_ready_desc: "Пришло время запекать."
 
 GTR_focus_testings: "§YТестирование§!"
 GTR_focus_testings_desc: "Всё готово. Сейчас или никогда, судьба всех обджектов мира зависит от нас."
 
 GTR_focus_tennis_ball_rise: "§7Восход Теннис Болла§!"
 GTR_focus_tennis_ball_rise_desc: "Положение критическое, и только Теннис Болл знает, как спасти нас."
 
 GTR_focus_excavate_the_ruins: "Раскопать Руины"
 GTR_focus_excavate_the_ruins_desc: "Ещё не всё потеряно! Возможно, в Университете ещё что-нибудь уцелело. Нужно провести немедленные раскопки и начать реформы нашей экономики."
 
 GTR_focus_accept_casland_refugees: "Беженцы из Кэсленда"
 GTR_focus_accept_casland_refugees_desc: "Новости с запада не радуют: ситуация в сердце Гойки накаляется, и, видимо, близится война. К нам перебирается большое количество беженцев оттуда, и мы обязаны принять этих обджектов."
 
 GTR_focus_announcergrad_aid: "Помогите Анонсерграду!"
 GTR_focus_announcergrad_aid_desc: "Необходимо немедленно направить гуманитарную помощь умирающему Анонсерграду. Нужно наскрести всё что можно и бросить по Гойки клич о помощи."
 
 GTR_focus_launch_industry: "Запуск промышленности"
 GTR_focus_launch_industry_desc: "Из-за чреды кризисов индустрия Анонсерграда стоит без дела, пока обджекты так нуждаются в продуктах. Необходимо запустить эти заводы, это вопрос выживания."
 
 GTR_focus_city_assembly: "Городская Ассамблея"
 GTR_focus_city_assembly_desc: "Администрация Анонсерграда сегодня напоминает гниющий труп. Необходимо привлечь умелых обджектов к управлению и начать политические реформы."
 
 GTR_focus_address_centralization: "Проблема Централизации"
 GTR_focus_address_centralization_desc: "Университетский Совет оказался слишком узким кругом для управления муниципалитетом. Необходимо передать некоторые бразды правления местным."
 
 GTR_focus_bureaucracy_reform: "Реформа Бюрократии"
 GTR_focus_bureaucracy_reform_desc: "Тот бюрократический аппарат, что существует сегодня, если его вообще можно назвать существующим, при смерти. Нужно сформировать новые органы государственной власти."
 
 GTR_focus_rethinking_of_technocracy: "Цифровые Лучи Технократии"
 GTR_focus_rethinking_of_technocracy_desc: "Ясно одно: только технический прогресс сумеет спасти Анонсерград от анархии и разграбления. Этот идеал пронесёт нас через сложные времена современности."
 
 GTR_focus_republic: "§2Р Е С П У Б Л И К А§!"
 GTR_focus_republic_desc: "Лучшие побуждения обджектов Анонсерграда нашли свой выход в Технократической Республике! Лишь вместе, при помощи технологий, мы сможем выйти из этого трудного положения."
 
 GTR_focus_new_government: "§gПоднимая Флаги§!"
 GTR_focus_new_government_desc: "Нашими усилиями, молодая республика наук вздымается на развалинах Гойки! Ура!"
 
 GTR_focus_looking_outside: "Взгляд наружу"
 GTR_focus_looking_outside_desc: "Изоляция тяжело сказывается на обджектах Анонсерграда: информационный голод, дефицит множества товаров создаёт проблемы развития всей Республики. Администрации необходмо принять меры для выхода из этого положения."
 
 GTR_focus_contacts_with_casland: "Мозг и Сердце"
 GTR_focus_contacts_with_casland_desc: "Кэслендское правительство вышло из тяжёлого этапа смуты и выглядит достаточно дружелюбным, чтобы начать с ним взаимодействовать. Администрация Университета пришла к решению о дипломатических сношениях с ними."
 
 GTR_focus_collective_research: "Совместные Исследования"
 GTR_focus_collective_research_desc: "Кэсленд обладает громадными исследовательскими мощностями и множеством талантливых обджектов. Объединив усилия, наши правительства смогут достичь высот технического прогресса."
 
 GTR_focus_casland_industry: "Промышленность Кэсленда"
 GTR_focus_casland_industry_desc: "Позаимствовав многие практики ведения производства из Кэсленда, мы сумеем сильно поднять эффективность производства у себя."
 
 GTR_focus_open_borders: "Открытые Границы"
 GTR_focus_open_borders_desc: "В знак дружественности наших государств, пора ослабить пограничный контроль на западе. Пусть беженцы возвращаются домой."
 
 GTR_focus_mutual_protection: "Взаимозащита"
 GTR_focus_mutual_protection_desc: "Теперь, когда мы обладаем серьёзными вооруженными силами, мы способны предложить Кэслендскому правительству акт о взаимной обороне. Это серьёзно укрепит наше сотрудничество."
 
 GTR_focus_all_roads_to_centrogoiky: "Все дороги в Центрогойки"
 GTR_focus_all_roads_to_centrogoiky_desc: "Администрация Железных Дорог находится в неясном положении - серьёзные прибыли со взымания пошлин за проход поездов с одной стороны, а с другой нарастающее политическое безвременье и проблемы с продоовольствием простых обджектов. Наше сотрудничество сильно не помешает."
 
 GTR_focus_develop_railroad_tech: "Обновление Матчасти"
 GTR_focus_develop_railroad_tech_desc: "Одноколейные железные дороги и разваливающиеся поезда кричат о необходимости переоснащения инфраструктуры железных дорог. Нашими технологиями и их производством, мы сможем этого добиться."
 
 GTR_focus_start_the_trains: "Пустить Поезда"
 GTR_focus_start_the_trains_desc: "Начав свободную коммуникацию между Анонсеградом и Центрогойки, мы сможем исправить множество экономических проблем и способствовать развитию всего региона."
 
 GTR_focus_aid_for_centrogoiky: "Помощь Центрогойки"
 GTR_focus_aid_for_centrogoiky_desc: "Обджекты городов Железных Дорог страдают от недостатка продовольствия и перебоев снабжения. Мы должны помочь им!"
 
 GTR_focus_integrate_lofty: "Интегрировать Лофти"
 GTR_focus_integrate_lofty_desc: "Чересчур растянутые границы Железных Дорог создают множество проблем для самой администрации. Если мы интегрируем Лофти, то сильно разгрузим их администрацию."
 
 GTR_focus_behind_steel_walls: "За железными стенами"
 GTR_focus_behind_steel_walls_desc: "Мы должны сохранять холодность к опасному окружению, ведь от нас зависит дальнейшая судьба Университета и всей науки Гойки. Никто не смеет помешать нам."
 
 GTR_focus_heaven_for_research: "Рай для Науки"
 GTR_focus_heaven_for_research_desc: "Мы должны создать удобные условия для развития науки и привлечения обджектов-исследователей со всего континента. Пора вернуть былую славу Анонсерграду и Университету!"
 
 GTR_focus_recruitment_campaign: "Операция \"Скрепка\""
 GTR_focus_recruitment_campaign_desc: "Необходимо привлекать учёных со всего Гойки к переезду в Анонсерград для дальнейшей исследовательской работы. Даже шпионскими методами."
 
 GTR_focus_strict_border_control: "Граница под контролем"
 GTR_focus_strict_border_control_desc: "Расширением пограничной службы и усилением контроля на заставах мы ограничим появление нежелательных элементов на нашей территории."
 
 GTR_focus_privacy_of_innovation: "Тайна Инновации"
 GTR_focus_privacy_of_innovation_desc: "Только сохранив наши научные наработки в секрете от враждебного окружения, мы сумеем сохранить своё преимущество и свою независимость. Пора ввести строгие наказания за раскрытие исследовательской тайны."
 
 GTR_focus_brain_of_goiky: "Мозг Гойки"
 GTR_focus_brain_of_goiky_desc: "Анонсерград вновь является сердцем науки Гойки! Сохранаяя этот статус и держа наши знания под замком, мы можем сохранять безопасность и независимость."
 
 GTR_focus_republican_affairs: "Дела Республики"
 GTR_focus_republican_affairs_desc: "Пора обратить внимание на внутренние проблемы нашей молодой Технократии и выбрать дальнейший курс внутренней политики."
 
 GTR_focus_democracy: "§7Демократия§!"
 GTR_focus_democracy_desc: "Мы не должны забывать, что всё, что мы делаем, делается во имя обджектов Анонсерграда. Все должны получать свою долю технического прогресса."
 
 GTR_focus_reform_rulership: "Реформа Управления"
 GTR_focus_reform_rulership_desc: "Администрация Универститета не может более эффективно управлять Республикой в одиночку. Пришло время для крупной реформы верховной власти."
 
 GTR_focus_science_for_objects: "Наука для Обджектов"
 GTR_focus_science_for_objects_desc: "Развитие науки - первейшая цель Республики. Но наука должна служить обджектам, а не быть самодовлеющей целью."
 
 GTR_focus_wide_ruling_horizontal: "Горизонталь Управления"
 GTR_focus_wide_ruling_horizontal_desc: "Надо привлекать больше талантливых обджектов к управлению. Только так мы сможем поддерживать Республику."
 
 GTR_focus_noocracy: "§2Ноократия§!"
 GTR_focus_noocracy_desc: "Наука идёт впереди социальных конструктов! Они лишь подпирают её вечный ход. Именно поэтому в управлении должны находиться только те обджекты, которые посвятили жизнь её росту."
 
 GTR_focus_rule_of_smart: "Власть Умных"
 GTR_focus_rule_of_smart_desc: "Мы должны укрепить институт Университетской Администрации и сохранить его во главе республиканской модели."
 
 GTR_focus_science_over_all: "Наука превыше всего!"
 GTR_focus_science_over_all_desc: "Развитие науки - первейшая цель Технократической Республики. Мы обязаны беззаветно ей следовать!"
 
 GTR_focus_voting_cense: "IQ-Ценз"
 GTR_focus_voting_cense_desc: "Не все способны голосовать правильно. Поэтому пришло время ввести интеллектуальный ценз для глупых обджектов."
 
 GTR_focus_economics: "Хлеб и Книги"
 GTR_focus_economics_desc: "Технократическая Республика теперь обладает серьёзным материальным базисом для полноценного экономического строительства. С научным подходом наших обджектов, мы сможем провести это наиболее эффективно."
 
 GTR_focus_announcergrad_modernization: "Обновление Анонсерграда"
 GTR_focus_announcergrad_modernization_desc: "Анонсерград - самый главный город Республики в нынешние времена, пока Кампус Университета лежит в руинах. В данный момент город стоит на уровне развития средней руки регионального центра, но научный прогресс обязательно повернёт эту ситуацию лучшей стороной."
 
 GTR_focus_public_education: "Общественные Школы"
 GTR_focus_public_education_desc: "Наша Республика основывается на науке и знаниях. Мы обязаны предоставить хорошее образование всем обджектам, ведь от этого зависит будущее всего государства."
 
 GTR_focus_talents_of_our_time: "Таланты Нашей Эпохи"
 GTR_focus_talents_of_our_time_desc: "Огромное количество гениев и больших умов прозябает в бессмысленном существовании из-за неспособности пробиться наверх. Мы должны дать дорогу таким обджектам, и тогда нам не будет равных."
 
 GTR_focus_industry_for_objects: "§7Промышленность для Обджектов§!"
 GTR_focus_industry_for_objects_desc: "Не стоит забывать, что всё, что мы делаем в нашей Республике, должно идти на пользу, в первую очередь, простым обджектам. Мы должны создать современную индустрию в гармонии с окружающей средой в интересах простых обджектов."
 
 GTR_focus_consumer_factories: "Малая Промышленность"
 GTR_focus_consumer_factories_desc: "Обджекты Анонсерграда уже долго прозябают в кризисе и дефиците. Пришло время развернуть технологичное производство товаров народного потребления и выбросить их на рынок!"
 
 GTR_focus_care_for_ecology: "Забота о Природе"
 GTR_focus_care_for_ecology_desc: "У нас только одна планета! Нельзя превращать Гойки в полигон промышленных отходов. Необходимо развернуть наш технологический потенциал для снижения негативного влияния промышленности на окружающую среду."
 
 GTR_focus_wasteless_production: "Безотходное Производство"
 GTR_focus_wasteless_production_desc: "Благодаря технологиям переработки и производству полного цикла мы сможем пустить в производство все доступные нам ресурсы, при этом без вреда для жизни простых обджектов и без вреда для окружающей среды."
 
 GTR_focus_industry_for_science: "§2Промышленность для Науки§!"
 GTR_focus_industry_for_science_desc: "Необходимо в ближайшее время развернуть масштабные производства для поддержки нашего промышленного потенциала! Пусть это повредит окружающей среде и жизни обджектов, от этого зависит независимость Республики."
 
 GTR_focus_massive_factories: "Крупная Промышленность"
 GTR_focus_massive_factories_desc: "Наш технологический отрыв позволяет разворачивать невиданные по масштабу производственные площадки. Мы обязаны этим воспользоваться."
 
 GTR_focus_experiments_with_planning: "Компьютеры!"
 GTR_focus_experiments_with_planning_desc: "Применение вычислительных машин в целях развития экономики - интересное новшество, которое может показать хорошие результаты. Это сильно снизит нагрузку с нашей бюрократии!"
 
 GTR_focus_get_all_we_can: "Вскрыть Мантию"
 GTR_focus_get_all_we_can_desc: "Наши холмы и поля хранят под собой огромное количество ресурсов, которые так необходимы Республике. Придется нарушить равновесие природы во имя науки и техники!"
 
 GTR_focus_elephant_in_a_room: "Слон в Комнате"
 GTR_focus_elephant_in_a_room_desc: "Университет и Кампус продолжает лежать в руинах, а мы просто сидим, сложа руки? Теперь, когда у нас есть время и ресурсы, пришло время приступить к восстановлению могучей альма-матер континента!"
 
 GTR_focus_making_blueprints: "Чертежи"
 GTR_focus_making_blueprints_desc: "Реконструкция Университета - масштабный проект, требующий тщательного планирования. Соберём же команду талантливых инженеров и продумаем всё до мельчайших деталей!"
 
 GTR_focus_new_professors: "Молодые Профессора"
 GTR_focus_new_professors_desc: "К сожалению, огромный научный состав был утрачен во время катастрофы в Университете. Его замещение молодыми и энергичными обджектами, пусть не такими опытными, немного восполнит этот ужасный пробел."
 
 GTR_focus_start_building: "Начнем Строить!"
 GTR_focus_start_building_desc: "Основы заложены. Пора приступить к практической реализации проектов нового Университета!"
 
 GTR_focus_even_better_now: "§7Город-Сад§!"
 GTR_focus_even_better_now_desc: "После наших усилий по реставрации, Университет Гойки возвышается над землёй ещё величественней, чем раньше!\n\nДа Здравствует Технократическая Республика!"
 
 GTR_focus_military: "Оборона Республики"
 GTR_focus_military_desc: "После пропажи Острова Мечты Гойки распался на множество осколков, не всегда дружественных. В этом опасном окружении нам необходимо создать современные вооружённые силы, основанные на наших технологиях."
 
 GTR_focus_defense_tech: "Разработка Оружия"
 GTR_focus_defense_tech_desc: "Наше основное преимущество - технологический прогресс. Уйдя вперёд по технологическому строению нашего вооружения мы сможем отбить любых захватчиков и агрессоров."
 
 GTR_focus_investigate_the_explosion: "Расследование Взрыва"
 GTR_focus_investigate_the_explosion_desc: "Взрыв в Университете, очевидно, произошёл не магическим образом. Что-то, какой-то элемент, реакция или химический состав поспособствовали этому. Хоть это и страшная трагедия, но мы должны использовать этот опыт в целях усиления наших оборонных возможностей."
 
 GTR_focus_power_of_yoylelite: "Сила Йойлолита"
 GTR_focus_power_of_yoylelite_desc: "Недавно рухнувший на Сатойминь метеорит позволит нам изучить свойства этого материала, и, возможно, продвинуть наши исследования по созданию вооружений."
 
 GTR_focus_reform_defense_forces: "Реформа Охраны"
 GTR_focus_reform_defense_forces_desc: "Небольшие ополчения пограничников и вооружённых охранников больше не способны покрывать наши нужды в обороне. Пришло время начинать реформу армии."
 
 GTR_focus_modern_aircraft: "Современные Самолёты"
 GTR_focus_modern_aircraft_desc: "Самолёт - идеальный продукт инженерного ума и смекалки. Мы должны активно работать в области самолётостроения. Развивитие этой отрасли открывает широкие сферы применения её детищ."
 
 GTR_focus_rockets_air_ground: "Ракета Воздух-Земля"
 GTR_focus_rockets_air_ground_desc: "Пора применить наши новейшие авиационные разработки в военном деле! Снабдив истребители ракетами, которые могут носить опасные заряды, мы будем наводить ужас на агрессоров и захватчиков!"
 
 GTR_focus_secret_weapon: "§YСекретное Оружие§!"
 GTR_focus_secret_weapon_desc: "Благодаря нашим стараниям в военной области, нам удалось получить вооружение невероятной мощности. Пришло время испытать его!"
 
 GTR_focus_final_frontier: "§3Вкус Космоса§!"
 GTR_focus_final_frontier_desc: "Наши интересные научные разработки по реактивным двигателям создали возможность отправки в космос! Было решено отправить команду храбрецов."
 
 GTR_focus_modern_army: "Современная Армия"
 GTR_focus_modern_army_desc: "Современная и небольшая армия будет соответствовать нуждам нашей обороны и покажет силу наших технологий всему враждебному окружению Технократической Республики."
 
 GTR_focus_outcome: "[GTR_FOCUS_OUTCOME]"
 GTR_focus_outcome_desc: " "
 GTR_focus_outcome_golfball: "§1Первый Профессор§!"
 GTR_focus_outcome_tennis_ball: "§7Президент§!"
 GTR_focus_outcome_duumvirate: "§LРавновесие§!"
 
 #generic
 generic_focus_industry: "Развитие промышленности"
 generic_focus_army: "Армия"
 generic_focus_researches: "Технологии"
 
 LSS_focus_understanding_our_position: "Понять Нашу Позицию"
 LSS_focus_understanding_our_position_desc: "'Это неправильно! Я был в Капитолии штата Техас! Что происходит? Что это за земля? Где...'"
 LSS_focus_see_our_stockpiles: "Проверить Склады"
 LSS_focus_see_our_stockpiles_desc: "Совершенно очевидно, что выбраться из этих земель не удастся быстро. Мы должны собрать всё необходимое для продвижения вперёд. Начнём с поиска и обезопасения тайников, которые мы привезли с собой. Заодно давайте позаимствуем у разрозненного и дезориентированного населения немного снаряжения для \"защиты\"."
 LSS_focus_structure_the_government: "Образовать Правительство"
 LSS_focus_structure_the_government_desc: "В нашем недавно реорганизованном правительстве по-прежнему сохраняется политический тупик. Обе стороны, как в Палате представителей, так и в Сенате, не продвигаются в решении стоящих перед нами проблем. Возможно, пришло время предпринять... более радикальные действия.\n\n§RОт этого выбора зависит будущее Техаса.§!"
 LSS_focus_jumpstart_an_economy: "Запустить Экономику"
 LSS_focus_jumpstart_an_economy_desc: "Этот остров, похоже, был построен для роскоши. К сожалению, это не то, что нам нужно для полноценной экономики. Мы должны заложить основу не только для выживания, но и для процветания на этих новых землях. Давайте оценим то, что уже есть на острове, и определим, как нам следует строить техасскую нацию."
 LSS_focus_the_agriculture: "Сельское Хозяйство"
 LSS_focus_the_agriculture_desc: "Наши запасы продовольствия, и без того ограниченные и распределяемые по квотам, подходят к концу. Эксперты считают, что у нас осталось всего несколько месяцев, прежде чем продовольствие закончится. Ситуацию усугубляет то, что смертность от голода растет тревожными темпами. Мы должны начать развивать сельское хозяйство и направить больше усилий на обеспечение населения продовольствием."
 LSS_focus_the_commerce: "Частный Сектор"
 LSS_focus_the_commerce_desc: "Мы - капиталистическая страна, однако объемы продаж упали до рекордно низкого уровня, поскольку люди скупают все, что попадается им под руку. Сейчас самое время начать и возобновить политику, направленную на стимулирование как продаж, так и покупок."
 LSS_focus_the_relief: "Отдушина"
 LSS_focus_the_relief_desc: "С телепортацией доллар в одночасье утратил свою ценность. Бартер так же быстро вытеснил традиционные формы торговли, люди стали обменивать всё что угодно на всё. Если мы не примем быстрых мер, на рынок могут появиться новые \"товары\". Мы будем укреплять доллар посредством помощи."
 LSS_focus_setup_the_livestock: "Создать Поголовье"
 LSS_focus_setup_the_livestock_desc: "Странно, что телепортация, похоже, перенесла из нашего мира всё подряд. Овцы, коровы, свиньи и ещё несколько животных были перенесены. При правильном содержании они могли бы стать хорошим источником пищи. Давайте займёмся фермами и амбарами."
 LSS_focus_encourage_local_growing: "Продвигать Подсобное Хозяйство"
 LSS_focus_encourage_local_growing_desc: ""
 LSS_focus_expand_rationing: "Увеличение Рационов"
 LSS_focus_expand_rationing_desc: "Нам нужно как можно скорее создать больше ферм, иначе еще больше населения умрет от голода. Есть значительная часть земли, застроенной жилыми домами, которую сложно использовать для сельского хозяйства. Давайте сосредоточимся на том, чтобы населению приходилось выращивать собственную еду."
 LSS_focus_first_harvest: "Первый Урожай"
 LSS_focus_first_harvest_desc: ""
 LSS_focus_manufacture_tools: "Сборка Инструментов"
 LSS_focus_manufacture_tools_desc: "Значительная часть современной промышленности и экономики зависит от инструментов, используемых рабочими. Поскольку наши производственные мощности и количество рабочих мест пока ограничены, послужит нашему развитию!"
 LSS_focus_grant_land_rights: "Собственность на Землю"
 LSS_focus_grant_land_rights_desc: "Для процветания малого бизнеса необходимо пространство. Использование части земли вызывает споры. Мы разрешим эти споры, и земля будет передана новым, более мелким предприятиям."
 LSS_focus_repurpose_vehicles: "Переоборудовать Транспорт"
 LSS_focus_repurpose_vehicles_desc: ""
 LSS_focus_create_new_businesses: "Новые Бизнесы"
 LSS_focus_create_new_businesses_desc: "Уровень безработицы катастрофически высок. По нашим приблизительным оценкам, он составляет около 50% и выше. Ещё несколько дней безработицы могут нанести непоправимый ущерб и без того благополучной стране. Мы должны как можно быстрее создать новые рабочие места и возможности для трудоустройства."
 LSS_focus_offer_land_to_companies: "Продать Землю Компаниям"
 LSS_focus_offer_land_to_companies_desc: "Малый бизнес может подождать, нам нужны средства и легитимность. Многие компании, которые у нас есть, хотят приобрести землю для собственного развития и готовы за неё заплатить большие деньги. Начнём торги за право владения землёй."
 LSS_focus_make_grand_deals: "Большие Сделки"
 LSS_focus_make_grand_deals_desc: ""
 LSS_focus_build_housing: "Жилая Застройка"
 LSS_focus_build_housing_desc: ""
 LSS_focus_create_stimulus_checks: "Стимуляция"
 LSS_focus_create_stimulus_checks_desc: "Для нормального функционирования экономики необходимы базовые принципы спроса и предложения. Предложение, хотя и небольшое, существует. Однако спрос по-прежнему низок, поскольку многие не хотят тратить свои деньги. Чтобы решить эту проблему, мы начинаем раздавать деньги людям, чтобы они тратили их по всему острову."
 LSS_focus_military_assistance: "Помощь Военных"
 LSS_focus_military_assistance_desc: "Военные, всё ещё находящиеся в процессе реорганизации и выполняющие функции полиции, всё ещё располагают некоторыми ресурсами. Нам нужно больше рук для стабилизации страны и спасения населения. Марк Милли не будет сильно расстроен тем, что часть его подчиненных работает над гражданскими проектами."
 LSS_focus_reestablish_the_dollar: "Восстановление Доллара"
 LSS_focus_reestablish_the_dollar_desc: ""
 YFC_focus_consolidate_power: "§YСконцентрировать Власть§!"
 YFC_focus_consolidate_power_desc: "Нам необходимо обеспечить легитимность как в компании, так и в государстве."
 YFC_focus_open_the_market: "Открыть Рынки!"
 YFC_focus_open_the_market_desc: "Разрешив иностранным компаниям работать на территории нашего государства, мы сможем увеличить ВВП и стимулировать нашу и зарубежную экономику. Мы также должны участвовать в рынках других стран, продавая собственные товары или товары других стран с целью получения прибыли."
 YFC_focus_establish_sectorialism: "Секториализм"
 YFC_focus_establish_sectorialism_desc: "Разрешив дружественную конкуренцию между различными подразделениями нашей корпорации, мы можем гарантировать рост нашего производства, а следовательно, и прибыли. Конечно, мы не можем позволить одной ветви власти иметь слишком много влияния на правительство, это было бы просто глупо."
 YFC_focus_the_grapes_and_the_cherries: "Виноград и Вишня"
 YFC_focus_the_grapes_and_the_cherries_desc: "Несколько наёмников решили обосноваться в Футпатхбурге. Покупка наёмников кажется довольно хорошей идеей, так почему бы не попробовать? Конечно, мы также должны помочь им в организации операций в знак доброй воли."
 YFC_focus_invest_in_speed: "Вклад в Скорость"
 YFC_focus_invest_in_speed_desc: "Некоторые сотрудники военной сферы, работающие под началом Топхэта, говорят, что компания Черри слишком медлительна... Возможно, если мы хорошо поищем, то сможем найти других наёмников, лучше подходящих для наших нужд."
 YFC_focus_invest_in_power: "Вклад в Силу"
 YFC_focus_invest_in_power_desc: "Некоторые сотрудники военной структуры, работающие под началом Топ Хэта, говорят, что компания Черри слишком слаба... Возможно, если мы хорошо поищем, то сможем найти другую группу, лучше подходящую для наших нужд."
 YFC_focus_purchase_support_package: "Пакет Снабжения"
 YFC_focus_purchase_support_package_desc: "Несмотря на отсутствие средств для укомплектования собственных армий, мы, безусловно, можем укомплектовать иностранные армии, когда придёт время. Мы неплохо сотрудничали с Юнайтед Грейпс, так почему бы не купить им пару дополнительных единиц вооружения, когда придёт время?"
 YFC_focus_purchase_ordnance_package: "Пакет Оружия"
 YFC_focus_purchase_ordnance_package_desc: "Огромная мощь Аннеймд Бразерхуд дает отличные результаты, однако с дополнительной огневой мощью они могли бы быть еще лучше. Вполне в пределах нашего бюджета можно приобрести дополнительную артиллерию для дальнейшего вооружения Братства, если мы решим это сделать в будущем."
 YFC_focus_mobilize_excess_reserves: "Мобилизация Резервов"
 YFC_focus_mobilize_excess_reserves_desc: "Приобретение нами компании Черри на постоянной основе позволило нам более формально инвестировать в неё, не рискуя случайно усилить потенциального будущего врага. Таким образом, мы будем стремиться укрепить наши силы, чтобы стать более грозными в будущих конфликтах."
 YFC_focus_focus_on_supply: "Фокус на Снабжении"
 YFC_focus_focus_on_supply_desc: "Приобретение нами Юнайтед Грейпс позволило нам более формально инвестировать в нее, не рискуя случайно усилить потенциального будущего врага. Таким образом, мы будем использовать их для обучения наших командиров, что облегчит нам сотрудничество с ними и, в свою очередь, сделает нас сильнее в будущих сражениях."
 YFC_focus_focus_on_combat: "Фокус на Сражении"
 YFC_focus_focus_on_combat_desc: "Приобретение нами Аннеймд Бразерхуд позволило нам более формально инвестировать в них, не рискуя случайно усилить потенциального будущего врага. Таким образом, мы будем использовать их для обучения наших командиров, что облегчит нам сотрудничество с ними и, в свою очередь, сделает нас сильнее в будущих сражениях."
 YFC_focus_the_southern_bandits: "§gЮжная Банда§!"
 YFC_focus_the_southern_bandits_desc: "Эти бандиты к югу от нас вызывают серьезную обеспокоенность среди наших сотрудников. Некоторые из них боятся возможного нападения, а другие считают, что мы должны воспользоваться их положением. Только время покажет, что произойдет с бандитами, но мы должны всегда быть на шаг впереди них."
 YFC_focus_CRN_cooperation: "Дружба с Нумизматией"
 YFC_focus_CRN_cooperation_desc: "После нашего заявления против Банды, взаимные инвестиции между нами и Нумизматией взлетели. Вполне естественно, что наши страны должны сотрудничать, поскольку у нас общие цели и интересы."
 YFC_focus_sell_them_guns: "Продавать Оружие Бандитам"
 YFC_focus_sell_them_guns_desc: "Несмотря на политические пристрастия, в нашей стране нет сомнений в том, что продажа оружия бандитам может принести только пользу. Они слабы и неорганизованы, и у них много денег, которые они готовы тратить бездумно. Только дурак упустит такую ​​возможность легко заработать."
 YFC_focus_YFC_funded_pillaging: "Узаконенный Грабёж"
 YFC_focus_YFC_funded_pillaging_desc: "Все что угодно можно купить и продать, даже смерть, предательство, союз и войну. Свободный рынок не знает границ, и политика к ним не относится. Банда получает выгоду от нас, и мы получаем выгоду от них. Совершенно естественно, что мы работаем вместе, так же естественно, как и свободный рынок!"
 YFC_focus_open_foreign_policy: "Окно В Гойки"
 YFC_focus_open_foreign_policy_desc: "Корпорации определенно не следует оставаться в стороне от политической игры. На дружбе и войне можно хорошо заработать."
 YFC_focus_demand_end_pillage: "Прекратить Грабёж"
 YFC_focus_demand_end_pillage_desc: "Эти проклятые бандиты воруют не зная границ. Коммунистам-грабителям нет места на свободном рынке, само их существование - это акт против свободы, и мы должны положить конец этим грабежам, прежде чем они выйдут из-под контроля. Грабеж вреден для бизнеса."
 YFC_focus_hire_militias: "Нанять Ополченцев"
 YFC_focus_hire_militias_desc: "Несмотря на наличие наемников, этого недостаточно для возможной войны с захватчиками. Мы можем нанять временные ополчения, чтобы временно пополнить наши ряды, хотя, очевидно, мы не можем позволить неуравновешенным боевикам оставаться в нашей стране после войны."
 YFC_focus_coiny_cooperation: "Дружба с Койни"
 YFC_focus_coiny_cooperation_desc: "Ни для кого не секрет, чего хочет добиться \"Революционный\" фронт Северного Гойки. Они ясно дали понять, что хотят править всем северным побережьем Гойки, а у Файри личная вендетта против Койни. Мы должны помочь нашему новообретенному союзнику отразить эти атаки, иначе они падут под натиском социализма. К тому же, социализм вреден для бизнеса!"
 YFC_focus_outsource_gun_production: "Аутсорс Производства"
 YFC_focus_outsource_gun_production_desc: "Используя Военный Округ, мы можем продолжать продавать оружие Банде, при этом спокойно его производя. Хотя это может немного расстроить Военный Округ, на свободном рынке все средства хороши."
 YFC_focus_buy_defense_trainings: "Оборонительные Курсы"
 YFC_focus_buy_defense_trainings_desc: "Заплатив инвесторам из Военного Округа за обучение наших наемников и ополченцев, мы будем лучше подготовлены к нападению и обороне против Бандитов в конфликте, который кажется неизбежным."
 YFC_focus_money_arms_capital: "§RВ Бой За Капитал!§!"
 YFC_focus_money_arms_capital_desc: "В левой руке Сникерс, в правой руке Марс..."
 YFC_focus_a_look_inward: "§YВнутренние Дела§!"
 YFC_focus_a_look_inward_desc: "Бандиты, конечно, распались, но их идеология продолжает жить. Теперь, когда мы частично оккупировали их земли, некоторые из их \"граждан\" решили перейти на нашу сторону. Несмотря на своё происхождение, они в основном вели мирный образ жизни, однако этот новый приток обджектов заставил нас осознать одну из наших главных слабостей. У нас нет настоящих городов. Это привело к тому, что многие Сектора отвлеклись от текущих проектов, предпочтя вместо этого заняться строительством наших городов."
 YFC_focus_new_interests: "Новые Интересы"
 YFC_focus_new_interests_desc: "Внезапный крах фашистского Снежного правительства на юге открыл перед нами новые возможности. Помимо потенциальной прибыли от продажи оружия сторонам в возможной гражданской войне, отколовшееся государство на нашей границе принесло интриги. Там, где стоит Великий Хребет, сформировалось правительство из бывших рабов, антифашистов и обычных мирных жителей, пытающихся спастись от хаоса. Их правительство слабо как в военном, так и в экономическом плане, но благодаря их богатым ресурсами землям мы могли бы разбогатеть! Вторжение на их земли, конечно, возможно, но мирное поглощение предпочтительнее. Мы начнем с простого предложения защиты и финансирования их ресурсов. Предложение настолько выгодное, что они были бы глупцами, если бы от него отказались!"
 YFC_focus_integrate_great_ridge: "Интегрировать Хребет"
 YFC_focus_integrate_great_ridge_desc: "Грейт-Ридж практически полностью подчинен нашим приказам, воле и желаниям. Для их правительства не осталось ни промышленности, ни труда, все теперь контролируется Компанией. Они, по сути, независимы только на бумаге; давайте сожжем эту бумагу. Давайте лишим их де-юре независимости. Интегрируем Великий Хребет."
 YFC_focus_the_bunchivist_problem: "§9Бандитская Неурядица§!"
 YFC_focus_the_bunchivist_problem_desc: "После поражения Эрейзера и его приспешников мы оказались в затруднительном положении. Бандиты оказались гораздо более... сплоченными, чем мы ожидали. Многие из наших новых обитателей, независимо от того, где именно на бывшей территории бандитов они живут, заявили, что заслуживают сохранения национальной целостности. Мы более чем готовы полностью искоренить бандитизм. Это чудовищная идеология, однако то, как мы будем её применять, безусловно, может определить наше будущее положение. Только представьте, какую прибыль мы могли бы выкачать из марионеток в Подгорныве! Представьте, сколько признания мы бы получили за уничтожение всех бандитских народов! Навсегда."
 YFC_focus_the_economic_issue: "§6Вопросы Экономики§!"
 YFC_focus_the_economic_issue_desc: "С момента окончания нашей войны против бандитов мы столкнулись с некоторыми экономическими... сложностями. Настало время внимательно рассмотреть экономическую ситуацию в нашей стране. Нам стоит попытаться улучшить наше положение."
 YFC_focus_industrialize_or_die: "Бесхозный Задний Двор"
 YFC_focus_industrialize_or_die_desc: "Совершенно очевидно: содержание восточных территорий обходится дороже, чем они стоят. Поэтому давайте сделаем их прибыльными! Индустриализация восточных поселений обеспечит нам максимальную прибыль."
 YFC_focus_erasers_stockpiles: "Тайники Эрейзера"
 YFC_focus_erasers_stockpiles_desc: "Большой тайник с деньгами, который мы нашли после захвата столицы бандитов, всё ещё там. Конечно, не на территории бандитов, мы забрали его в свою столицу, но кроме этого, деньги остались нетронутыми. Хотя формально они всё ещё принадлежат Эрейзеру, он же в тюрьме, не так ли? Он бы точно не возражал, если бы мы... одолжили... немного этих денег. Он бы даже не заметил!"
 YFC_focus_develop_peoniele: "Развивать Пионил"
 YFC_focus_develop_peoniele_desc: "Пеониэле обладает уникальной природной красотой, не имеющей аналогов на континенте. Несмотря на свою красоту, здесь проживает достаточно много обджектов. Начальное население – это отлично для города, однако необходимо сохранить его природную красоту, чтобы нынешнее население не было недовольно. На данный момент достаточно превратить грунтовые дороги в проселочные и построить пару многоквартирных домов для размещения рабочих, а затем можно будет приступать к более масштабным проектам."
 YFC_focus_develop_yoyleton: "Развивать Йойлтон"
 YFC_focus_develop_yoyleton_desc: "Йойлтон - самое отдалённое место в Южном Гойки на данный момент. Несмотря на небольшую численность населения и большое количество трудолюбивых обджектов, этот провинциальный городок обладает огромным потенциалом. Как ни странно, похоже, там имеется некоторая диаспора тирдропперов. Учитывая удалённость города от моря, их присутствие несколько необычно, однако они, как и все остальные, занимаются своими делами. Возможно, стоит заняться созданием каких-нибудь водных объектов."
 YFC_focus_military_industrial_complex: "Расширить ВПК"
 YFC_focus_military_industrial_complex_desc: "Покупка и продажа оружия с целью получения прибыли - это то, чем мы довольно известны. Вполне логично, что мы прилагаем все усилия для развития этой отрасли, что позволит нам экспортировать продукцию по всему Гойки."
 YFC_focus_expand_northern_trade: "Северная Торговля"
 YFC_focus_expand_northern_trade_desc: "Используя Йойлтон в качестве базы, мы можем расширить наши торговые пути дальше на север, что приведет к более эффективной торговле с северными правительствами."
 YFC_focus_scope_out_sea_trade: "Изучить Море"
 YFC_focus_scope_out_sea_trade_desc: "Морская торговля - это то, чем мы занимаемся в небольших масштабах уже довольно давно. Однако, если бы у нас был более прочный плацдарм на восточном побережье, мы могли бы быстро сократить время и ресурсы, необходимые для торговли с Давидианским Королевством."
 YFC_focus_spread_out_sectors: "Разбрести Сектора"
 YFC_focus_spread_out_sectors_desc: "Большинство споров между Секторами возникают из-за близости; наши Сектора расположены слишком близко друг к другу, чтобы вести цивилизованные беседы. Возможно, пара видеозвонков в Zoom их бы успокоила. Конечно, никто из них не стал бы это слушать, если бы мы не предложили им стимул к переезду. То есть, мы должны построить им объекты подальше друг от друга. Ради вас и меня. Серьезно, их ссоры настолько чертовски раздражают, что я, пожалуй, сойду с ума."
 YFC_focus_peoniele_the_second_city: "Пионил, город номер 2"
 YFC_focus_peoniele_the_second_city_desc: "Ах, Пионил. С его цветочными полями, холмистым рельефом и огромными зданиями. Огромные здания - это, пожалуй, самое лучшее."
 YFC_focus_big_yoyleton: "Большой Йойлтон"
 YFC_focus_big_yoyleton_desc: "Если мы правильно разыграем свои карты, Йойлтон может стать оплотом свободной торговли. Будем надеяться, что всё сложится так, как должно."
 YFC_focus_population_boom: "§GБум Населения§!"
 YFC_focus_population_boom_desc: "Похоже, наши инвестиции привлекают в наши города огромное количество обджектов! Эти мигранты могут принести только одно: прибыль."
 YFC_focus_clamp_down_on_bunchivism: "Раздавить Банду"
 YFC_focus_clamp_down_on_bunchivism_desc: "Очевидный выбор. Бандитизм был чумой для наших торговых партнеров с самого развала Гойки, и больше ни один рейдер не сможет красть нашу прибыль и грабить наших братьев по капиталу. Мы никогда, ни при каких обстоятельствах, не позволим свободному бандитизму существовать, и любой, кто считает иначе, - предатель свободного рынка. Пусть бунтовщики сгорят от силы нашей мощи!"
 YFC_focus_trial_over_eraser: "Суд над Эрейзером"
 YFC_focus_trial_over_eraser_desc: "Эрейзер был обнаружен на передовой, защищая пригороды Подгорныва, когда война ещё продолжалась. Мы быстро расправились с его армией, вскоре взяв его в плен. Мы собирались оставить его гнить, но, по-видимому, кому-то удалось проникнуть в его камеру, или, по крайней мере, достаточно близко, чтобы передать его сообщения оставшимся сторонникам Банды. Даже сейчас ходят слухи о том, что инструкции поступают непосредственно от Эрейзера, сообщая подпольщикам, что им следует делать. Очевидно, нам нужно предпринять более радикальные меры, однако его знания о нашей стране, если эти слухи верны, весьма… полезны. Наличие такого обджекта в кабинете министров, конечно, с каким-то исправительным наказанием, может пойти нам на пользу. Что бы мы ни делали, важно, чтобы он держался подальше от любых попыток сопротивления."
 YFC_focus_execute_pen: "Пен."
 YFC_focus_execute_pen_desc: "500 миллионов вигинтиллионов. Невероятно большая сумма, которую он каким-то образом должен нам. Пока соревнование ещё продолжалось, Пен обещал своим сторонникам крупную сумму денег. Эта сумма стала долгом, который он пытался погасить с помощью бумажной квитанции. Бумажные квитанции, сделанные, конечно же, в Корпорации, не являются настоящей валютой, поэтому сумма долга каким-то образом перешла от его сторонников к нам. У нас нет реального интереса заставлять его выплатить эту сумму, но мы заинтересованы в том, чтобы показательно наказать задолженность перед должниками. Он - сторонник Банды, был очень близок, слишком близок, к Эрейзеру, при этом открыто поддерживая попытки сопротивления нашему правлению. Идеальный пример."
 YFC_focus_reeducation: "Лагеря Перевоспитания"
 YFC_focus_reeducation_desc: "Среднестатистический сторонник Банды представляет из себя полного идиота. Он ничего не смыслит в торговле, в капитале, в заработной плате. Давайте исправим ошибки предыдущего режима и научим их чему-нибудь, причём силой."
 YFC_focus_strengthen_the_law: "Усилить Закон"
 YFC_focus_strengthen_the_law_desc: "Хотя в наших центральных территориях правоохранительные органы не одобряются, размещение вооруженных обджектов в поселениях бандитов может принести определенную выгоду. Нетрудно понять почему: эти бандиты не знают разума, только насилие. Вполне естественно, что мы начинаем говорить на их языке."
 YFC_focus_ban_theft: "Запрет Воровства"
 YFC_focus_ban_theft_desc: "Хотя это может показаться глупым поступком, он гениален. Воровство - это основа общества бандитов. Это их \"естественный\" \"закон природы\". Объявить его вне закона - значит уничтожить раковую опухоль Банды в самом корне. Конечно, за это преступление будут суровые наказания."
 YFC_focus_remove_oligarchical_sentiment: "Вырвать Симпатии к Богатству"
 YFC_focus_remove_oligarchical_sentiment_desc: "Впечатляет, как олигархам из Старой Банды удалось так быстро и под таким давлением создать культ личности. Давайте уничтожим его. Он поразил земли к югу от нас, поразил умы обджектов, живущих на этих землях, и, как любая болезнь, угрожает усугубить ситуацию. Этого нельзя допустить. Учитывая безнравственность Эрейзера, прежнюю глупость Блоки и... ну, Пен - это просто Пен; уже само по себе преступление."
 YFC_focus_fund_secret_police: "Недреманное Око"
 YFC_focus_fund_secret_police_desc: "Некоторые считают, что мы недостаточно осторожны в своей тактике. Говорят, что мы слишком открыты, слишком хвастливы, слишком гордимся этим завоеванием. Мы слишком явно демонстрируем, что мы - верховные правители, а они - побежденные, которых нельзя ассимилировать. Это справедливая оценка, и вполне вероятно, что сторонники Банды переняли практику скрывания от нас, теперь, когда они поняли, какая установилась ситуация. Давайте найдем эти тайные подполья, проникнем в них и разрушим их изнутри."
 YFC_focus_fully_cored: "§GИнтеграция§!"
 YFC_focus_fully_cored_desc: "Мы это сделали! Все бандиты либо послушны, либо мертвы, либо слишком напуганы, чтобы дать отпор. Мы приручили льва (точнее, мелкого котенка) и теперь уверенно движемся к полному и абсолютному контролю над старыми землями Банды."
 YFC_focus_stalled_plans: "§RСорванные Планы§!"
 YFC_focus_stalled_plans_desc: "Похоже, мы неправильно всё спланировали. Ничего страшного, мы снова будем процветать, ведь власть капитала - это естественное явление. А теперь, разобьем вновь мерзких бандитов!"
 YFC_focus_unite_the_capitalists: "§YКонцентрация Капитала§!"
 YFC_focus_unite_the_capitalists_desc: "Мы стоим на пороге формирования полномасштабного альянса. Давайте раз и навсегда объединим силы капитала."
 YFC_focus_foster_new_society: "Создать Новое Общество"
 YFC_focus_foster_new_society_desc: "Бандиты - это всё ещё обджекты. А с обджектами приходит и прибыль. Очевидно, мы потеряли немало денег из-за необходимости иметь дело с рейдерами, но если мы возьмём под свой контроль всё их население, то сможем быстро всё вернуть! Создание новой, реформированной Банды должно быть вполне оправданным и незатратным предприятием. Ах да, мирным жителям тоже нужно разрешить жить свободно и всё такое. Это для нас очень важно."
 YFC_focus_support_blocky: "Поддержать Блоки"
 YFC_focus_support_blocky_desc: "Некоторые менее сильные кандидаты в президенты от Банды обращались к нам с просьбой о финансовой поддержке, однако одна просьба особенно выделялась. А именно, просьба Блоки. Втайне, даже под носом у представителей этого сектора, мы проделали небольшую работу с Блоки. Удивительно, но он очень хорошо умеет хранить секреты. Эта черта, конечно, делает его отличным кандидатом в президенты. По крайней мере, для нас."
 YFC_focus_stimulate_bunch_business: "Шоковая Терапия"
 YFC_focus_stimulate_bunch_business_desc: "Подгорныв сейчас пребывает в опустении. Кажется, когда мы взяли его под контроль, там, по крайней мере, была жизнь, но предприятий почти не было. Честно говоря, это и неудивительно. Общество (надеюсь, бывших) рейдеров грабило всё, что попадалось им на пути. Эти дикари уничтожили все шансы на успех бизнеса в Подгорныве! Другими словами, мы вполне могли бы вдохнуть жизнь в этот умирающий город. Может быть, налоговые льготы для владельцев бизнеса?"
 YFC_focus_establish_law_presence: "Силовой Аппарат"
 YFC_focus_establish_law_presence_desc: "Послушай, если полиция находится в частной собственности, это уже не полиция. Кроме того, на бывших территориях Банды определённо нужен кто-то для поддержания порядка. Мы, конечно, будем оплачивать зарплаты полиции, но, вероятно, вернём эти деньги, когда они перестанут быть нужны. Верно?"
 YFC_focus_blockys_offer: "Предложение Блоки"
 YFC_focus_blockys_offer_desc: "Блоки спрашивает нас, может ли он встретиться с Желтолицым, чтобы обсудить свою предвыборную кампанию. Или, по крайней мере, нам так кажется? Он не очень четко сформулировал свою просьбу, кроме как о встрече для обсуждения некоторых вопросов. В любом случае, мы сможем назначить встречу в ближайшее время."
 YFC_focus_allow_people_enter: "Открыть Границы"
 YFC_focus_allow_people_enter_desc: "Численность членов бандитстского движения невелика, и многие преступники, осужденные и заключенные в тюрьму на наших землях, вероятно, могли бы безнаказанно жить в хаосе, царящем в этом обществе. Открыв границу с нашей оккупационной зоной, мы сможем стимулировать её экономику, одновременно избавившись от некоторых проблем, мешающих нам."
 YFC_focus_banks_too_big_to_fail: "Большие Банки Банды"
 YFC_focus_banks_too_big_to_fail_desc: "Предложение Блоки о создании банковского сектора имело большой успех во всей стране. По сути, он хочет создать крупную и разветвленную банковскую систему для хранения того, что он называет \"незаменимыми\" деньгами. Культура бандитов, очевидно, построена на воровстве, да, однако некоторые люди не хотят потерять всё. Его банки будут безопасным местом для хранения вещей, взлом которых будет незаконным."
 YFC_focus_advertise_YFC_products: "Реклама Наших Продуктов"
 YFC_focus_advertise_YFC_products_desc: "Бандиты начинают участвовать в капитализме. В настоящем, подлинном капитализме. Они покупают и продают землю, сдают вещи в аренду, инвестируют в различные компании. Это действительно впечатляющее зрелище. Конечно, теперь нам нужно закрепиться в этой земле на раннем этапе, получив финансовую поддержку. Так почему бы не оплатить немного рекламы?"
 YFC_focus_insentivize_employment: "Поддержать Занятость"
 YFC_focus_insentivize_employment_desc: "Попытки заставить этих ленивых придурков устроиться на работу бесполезны, если мы не дадим им того, что их бестолковые мозги сочтут \"стимулом\". Этим бандитам что-то нужно, чтобы устроиться на работу; что же им следует дать?"
 YFC_focus_free_pows: "Свобода Пленным"
 YFC_focus_free_pows_desc: "Во время и вскоре после нашей войны с Бандой, которую аналитики теперь называют \"Ранней войной\", было захвачено большое количество пленных, в основном с нашей стороны. Ладно, полностью с нашей стороны. Мы были единственными, кто брал пленных. Тем не менее, освобождение части пленных обратно в общество Банды, вероятно, уменьшило бы их желание убивать нас. Вопрос, однако, в том, сколько именно следует освободить?"
 YFC_focus_bunchivist_new_deal: "Новый Курс"
 YFC_focus_bunchivist_new_deal_desc: "Признаюсь, попытка превратить общество, погрязшее в глупости, - задача непростая. Мы компания, а не правительство. Хотя, наверное, мы всё-таки правительство. Чёрт. В общем, мы только начали этот проект и уже потратили на него больше денег, чем планировали. Нам нужно срочно найти лучший способ выкачивания денег из населения!"
 YFC_focus_bunch_fostered: "Новая Банда"
 YFC_focus_bunch_fostered_desc: "Президентские выборы подошли к концу, и Банда прочно находится под контролем как нас, так и Нумизматии. Банда практикует свою собственную, странную форму капитализма, которую мы ей позволили. Пока что. Кажется, дела у нас налаживаются."
 YFC_focus_united_by_profits: "§YНа Волне Прибылей§!"
 YFC_focus_united_by_profits_desc: "Нумизматийцы предлагают нам \"официально оформить\" наши отношения как с ними, так и с реформированной Бандой. Что они имеют в виду? Нумизматийцы, на самом деле, называют много пунктов. Постоянно присылают нам письма по поводу какой-то глупой \"внешней дипломатии\". Им повезло, что мы их терпим."
 YFC_focus_see_to_the_eastern_front: "§CВзгляд на Восток§!"
 YFC_focus_see_to_the_eastern_front_desc: "Восточное побережье - это территория, которая может принести нам огромные деньги, если нам удастся её захватить. Здесь открываются прекрасные возможности для более быстрых и безопасных торговых путей. Однако, судя по количеству обитающих здесь тирдроперров, кажется, что Тирдроп уже давно присматривается к этому району. Возможно, нам придётся провести серьёзную игру, чтобы установить над ним контроль."
 YFC_focus_play_fast: "Удар Волны"
 YFC_focus_play_fast_desc: "Быстро обострив конфликт, мы сможем подавить силы, противостоящие катастрофе, и подчинить себе уже существующие объекты вдоль побережья."
 YFC_focus_anger_teardrop: "Разозлить Тирдроп"
 YFC_focus_anger_teardrop_desc: "Никто не принимает правильных решений, когда злится. Мы легко можем сорвать стратегию этих тирдропперов (или, как говорят дети, \"надрать им задницу\"), разозлив их лидера и заставив её действовать иррационально."
 YFC_focus_procure_funds: "Достать Денег"
 YFC_focus_procure_funds_desc: "Возможно, у нас не будет средств на эту операцию в нужный момент, но мы, безусловно, можем извлечь выгоду из... некоторых... \"неиспользованных\" отраслей."
 YFC_focus_claim_excessive_land: "Расширить Притязания"
 YFC_focus_claim_excessive_land_desc: "Мы точно не знаем, но, возможно, Тирдроп получает иностранную помощь. Если мы создадим впечатление, что у нас гораздо больше земли, чем на самом деле, то сможем выставить Тирдроп проигравшей. Никто не вкладывает деньги в проигранное дело!"
 YFC_focus_move_in_army: "Послать Войска"
 YFC_focus_move_in_army_desc: "Конечно, нам следовало сделать это гораздо раньше, но сейчас самое время. Непокорные тирдропперы уже начали нападать на наших мирных поселенцев, к чему может привести введение войск?"
 YFC_focus_invest_into_infrastructure: "Строить Дороги"
 YFC_focus_invest_into_infrastructure_desc: "Благодаря дорогам мы можем передвигаться более эффективно, следовательно, мы можем более эффективно осваивать новые территории. Большее количество поселенцев означает больший охват владений, а это значит больше промышленности, лучшие торговые пути, больше туристических мест, по сути, это означает больше прибыли."
 YFC_focus_buy_ships: "Купить Корабли"
 YFC_focus_buy_ships_desc: "Очевидно, что флот Тирдроп намного превосходит флот любой другой нации по эту сторону Гойки, за исключением, возможно, Девидленда. Однако, если мы купим дешевые корабли, мы легко сможем отвлечь часть их сил, что затруднит им переброску войск для борьбы с нашими."
 YFC_focus_undermine_legitimacy: "Подоврать Легитимность"
 YFC_focus_undermine_legitimacy_desc: "Было ли расистским предположение, что каждый тирдроппер является последователем Тирдроп? Очевидно, не все слезообразные являются её сторонниками. Некоторые из них более колеблются в вопросе её поддержки; в конце концов, она диктатор. Очерняя её имидж, выставляя её некомпетентной, мы легко можем привлечь больше сторонников на свою сторону."
 YFC_focus_build_ports: "Улучшить Торговлю"
 YFC_focus_build_ports_desc: "Благодаря нашим лодкам и улучшенному доступу к морю мы теперь можем начать ощущать преимущества этой замечательной игры. Наша торговля с северянами может улучшиться; возможно, мы даже сможем снова начать торговать с давидианцами."
 YFC_focus_interfere_with_sea_routes: "Подрезать Их Маршруты"
 YFC_focus_interfere_with_sea_routes_desc: "Теперь совершенно очевидно, что Тирдроп получает финансирование от кого-то, верно? Даже если они (каким-то образом) просто умело играют в эту игру, используя смекалку (если она у них вообще есть), нападение на их конвои фактически приведет к голоду среди их солдат и сделает население зависимым от товаров корпорации."
 YFC_focus_play_smart: "Нейронный Бриз"
 YFC_focus_play_smart_desc: "Используя тщательно разработанную стратегию, мы можем одержать верх в этом конфликте, доминируя на восточном побережье. Если мы перехитрим противников, они не смогут добиться успеха; это будет несложно."
 YFC_focus_negotiate_with_teardrop: "Переговоры с Тирдроп"
 YFC_focus_negotiate_with_teardrop_desc: "Очевидно, что мы не ожидаем большую выгоду из переговоров, однако, демонстрируя дружелюбие, мы легко можем опорочить репутацию Тирдроп в будущем, выставив её агрессором в этом конфликте. На международной арене она может даже потерять поддержку!"
 YFC_focus_push_for_settlement: "Заселение Земель"
 YFC_focus_push_for_settlement_desc: "Внутри компании мы легко можем убедить наших сотрудников переехать на Восточное побережье. Благодаря прекрасным пляжам, постоянно солнечной погоде и спокойным волнам, мы без труда сможем уговорить обджектов потратиться на переезд. И, конечно же, недвижимость находится в нашей собственности!"
 YFC_focus_prospect_the_lands: "Разработка Земель"
 YFC_focus_prospect_the_lands_desc: "На восточном побережье, несомненно, находится множество пещер, в которых, безусловно, могут содержаться драгоценные металлы, на которых мы могли бы заработать. Владение этой землей уже само по себе принесет нам прибыль, однако, зная ее потенциальную стоимость, мы легко сможем инвестировать в нее дополнительные средства."
 YFC_focus_deploy_peacekeepers: "Послать \"Миротворцев\""
 YFC_focus_deploy_peacekeepers_desc: "Поймите, на этих землях царит настоящий хаос! С наплывом этих тирдропперов явно необходимы силы для их сдерживания. К счастью, у Топхэта, главы нашего военного Сектора, есть обджекты (откуда он их берет?), готовые временно защищать нашу территорию. Конечно, Топхэт оплачивает их услуги из собственных средств, так что для нас это не повлечет никаких дополнительных затрат!"
 YFC_focus_bribe_village_leaders: "Подкупить Главарей"
 YFC_focus_bribe_village_leaders_desc: "Хотя большинство деревень состоят из самих жителей, прибывших на пляж, они утверждают, что не имеют никакого отношения к Тирдроп. Возможно, с помощью небольших денежных вложений мы сможем убедить их не пускать новых жителей на пляж, разрешая жить и работать на востоке только нашим сотрудникам и партнерам."
 YFC_focus_shuffle_around_funds: "Переместить Средства"
 YFC_focus_shuffle_around_funds_desc: "По всей видимости, какой-то идиот в головном офисе берет кредиты и выплачивает их, чтобы \"создать видимость занятости\". Если мы уволим этого парня и снизим зарплаты некоторым нашим низкооплачиваемым сотрудникам, мы сможем сэкономить на расходах и перенаправить их на Большую Восточную Игру."
 YFC_focus_invest_into_infrastructure_other: "Строить Дороги"
 YFC_focus_invest_into_infrastructure_other_desc: "Некоторые утверждают, что из-за ограниченной инфраструктуры и ресурсов они не могут совершать проезды через Восточное побережье. Строительство дорог позволит облегчить жизнь нашим гражданам на побережье и тем самым укрепить наши позиции в этом регионе."
 YFC_focus_build_ports_other: "Улучшить Перевозки"
 YFC_focus_build_ports_other_desc: "Мы уже наладили торговые пути через Море Святого Камешка, однако, благодаря укреплению наших позиций на восточном побережье, мы можем расширить торговлю по морю, сделав её проще и выгоднее. В свою очередь, мы получим больше прибыли от торговли с давидианцами, а, вероятно, и с Военным Округом."
 YFC_focus_accidental_mistakes: "\"Недопонимание\""
 YFC_focus_accidental_mistakes_desc: "Мы можем очень легко \"случайно\" сорвать пути снабжения Тирдроп, вынудив её замедлить продвижение, и при этом не допустить вмешательства международных сил в конфликт."
 YFC_focus_who_dares_wins: "§YСмелость Берега Берёт§!"
 YFC_focus_who_dares_wins_desc: "Что ж, с этого момента делать особо нечего. Мы выделили большую часть наших свободных ресурсов, привлекли людей, разместили рекламу, и теперь, наконец, остается только одно: играть в игру."
 YFC_focus_sectorial_meddling: "Нанять Сотрудников"
 YFC_focus_sectorial_meddling_desc: "Учитывая крайне маловероятную возможность того, что наше сотрудничество с бандитами вызовет возмущение, нам следует найти верных работников, которые будут выполнять наши поручения. Давайте приступим к работе и разместим объявления о наборе персонала!" #pun this is so good i thought i wrote it lowkey
 YFC_focus_establish_formal_connection: "Официальные Отношения"
 YFC_focus_establish_formal_connection_desc: "Было бы нелепо с нашей стороны пытаться вести дела с Бандой, не признав предварительно их независимость и не направив в их страну квалифицированных дипломатов."
 YFC_focus_diverting_funds: "Направить Финансы"
 YFC_focus_diverting_funds_desc: "На начальном этапе развития нашей компании мы быстро тратили деньги на рекламу, где бы она ни появлялась. Мы рекламировались повсюду, часто для обджектов, которые уже знали о нашей продукции, тем самым растрачивая ценные ресурсы. Сократив расходы на рекламу, мы можем освободить финансы, что обеспечит нам гибкость в будущих отношениях с этим новым торговым партнером."
 YFC_focus_permanent_mercenary_purchase: "Постоянные Наёмники"
 YFC_focus_permanent_mercenary_purchase_desc: "Банда, явно милитаристское государство, сообщили нам, что нам крайне важно иметь внушительную постоянную армию. Мы уже некоторое время ищем наёмные отряды, готовые временно работать на нас. Возможно, за подходящую цену они присягнут нам на верность и станут нашей постоянной армией!"
 YFC_focus_great_business_partnership: "§YУважаемые Партнёры§!"
 YFC_focus_great_business_partnership_desc: "Благодаря нашим сильным переговорным навыкам, мы заключили ряд выгодных для нас сделок. Между нами и Бандой существует своего рода симбиоз; у нас сложилось идеальное партнерство, и у нас нет причин сохранять прежнюю вражду."
 YFC_focus_hoard_gold: "Сгрести Золото"
 YFC_focus_hoard_gold_desc: "Несмотря на то, что часть средств была высвобождена ранее, крайне важно убедиться в наличии достаточных средств для обеспечения безопасности наших инвестиций и покупок. Сокращая производство товаров и продавая их по более высоким ценам, мы можем быть готовы к любым грядущим трудностям."
 YFC_focus_publicize_partnership: "Установить Границу"
 YFC_focus_publicize_partnership_desc: "Наша фактическая граница с Бандой часто становится темой обсуждения в штаб-квартире компании. Неопределенная граница нередко приводит к серьезным недоразумениям, которые, порой, заканчиваются убытками. Поэтому мы попытаемся должным образом определить границу, чтобы способствовать миру и безопасности (по крайней мере, между нами и Бандой)."
 YFC_focus_from_the_deal: "§GСделка§!"
 YFC_focus_from_the_deal_desc: "Благодаря нашим финансовым связям с Бандой мы сделали компанию гораздо более прибыльной, чем когда-либо. Сотрудники, даже некоторые из самых низкооплачиваемых, получают прибавки к зарплате, в штаб-квартире стало намного чище, и мы смогли расширить свое присутствие на севере и западе континента. Работая с этими рейдерами, мы действительно можем стать великими; давайте формализуем наше партнерство и, как положено, заключим сделку."
 YFC_focus_the_first_embargo: "Эмбарго..."
 YFC_focus_the_first_embargo_desc: "Эти мерзкие, коварные горные твари прекратили с нами всякое сотрудничество! Всего одно правительство... верно?"
 YFC_focus_numismatian_split: "Разрыв с Нумизматией"
 YFC_focus_numismatian_split_desc: "Это событие, безусловно, беспрецедентно, но Нумизатия, в конечном счете, - это несущественная секта. Это всего лишь еще один аттавизм... \n\nверно?"
 YFC_focus_allow_raiding_into_traitors: "Разрешить Рейды"
 YFC_focus_allow_raiding_into_traitors_desc: "В деловых отношениях необходимо принимать ответные меры. Если какая-либо компания или страна причинили вам зло, вы должны ответить им тем же; это справедливо. Так что, если Нумизматия и Рейх так ненавидят наше партнерство с Бандой, почему бы не показать им, на что Банда действительно способна? Давайте позволим нашим друзьям грабить этих мятежных \"капиталистов\", если они будут платить нам долю добычи."
 YFC_focus_the_great_recession: "§RВеликий Упадок§!"
 YFC_focus_the_great_recession_desc: "Всё пошло по одному месту! Что же нам делать, имея почти никаких средств?!"
 YFC_focus_mass_firings: "Массовые Увольнения"
 YFC_focus_mass_firings_desc: "Уволив часть сотрудников, мы сможем освободить место для работы. Хотя мы по-прежнему будем иметь отрицательный баланс, небольшие потери легче компенсировать, чем крупные."
 YFC_focus_entice_the_sectors: "Привлечь Сектора"
 YFC_focus_entice_the_sectors_desc: "Представители отрасли в настоящее время недовольны сокращениями в компании и винят в рецессии руководство Корпорации. Само по себе это не проблема, однако их идеи влияют на рядовых сотрудников, что может оказаться опасным. Используя наши скудные средства, мы все еще можем преподнести представителям отрасли достаточно подарков, чтобы заставить их замолчать."
 YFC_focus_debt_restructuring: "Реструктуризация Долга"
 YFC_focus_debt_restructuring_desc: "К сожалению, к нам пришли коллекторы и потребовали крупные суммы денег. Конечно, это не вина руководства компании; за управление инвестициями отвечают рядовые сотрудники. Однако эти сотрудники были уволены, так действительно ли этот долг принадлежит нам? Почему бы нам не переложить его на уволенных?"
 YFC_focus_fire_their_underlings: "Уволить Подчинённых"
 YFC_focus_fire_their_underlings_desc: "Главы Секторов, обладающие огромным влиянием на умы и массы рядовых сотрудников, лишь усугубили и без того тяжелую ситуацию в условиях рецессии. Конечно, это может привести к еще большим проблемам, скорее всего, в виде насилия, если кто-то вроде Топхэта добьется своего. Очевидно, что напрямую расстраивать их было бы неразумно, однако, уволив их самых преданных сторонников, мы можем разрушить их контроль снизу, создав видимость очередного увольнения в большой серии сокращений."
 YFC_focus_ensure_loyalty: "Обеспечить Лояльность"
 YFC_focus_ensure_loyalty_desc: "Несмотря на то, что наёмники согласились быть купленными навсегда, они не являются самой контролируемой силой. Мы по-прежнему обязаны платить им зарплату, и в любой момент они могут потребовать непомерно высокого повышения заработной платы, сбежать в более стабильную страну или снова стать отступниками. Конечно, используя выдающийся военный ум Топхэта, мы можем привить им дисциплину и преданность."
 YFC_focus_observe_top_hat: "Следить за Топхэтом"
 YFC_focus_observe_top_hat_desc: "Несмотря на тесное сотрудничество с нами, Топхэт все больше становится нестабильным и ненадежным сотрудником. Он стал реже посещать совещания, медленнее отвечать на письма и был замечен в тайных разговорах с другими сотрудниками, словно пытаясь сохранить какой-то секрет. Хотя он и не совершил ничего противоправного, мы все равно должны внимательно следить за ним, чтобы обеспечить безопасность нашей компании."
 YFC_focus_strike_the_headache: "§RМигрень§!"
 YFC_focus_strike_the_headache_desc: "Мы сделали открытие. По всей видимости, Топхэт пытался совершить крупный переворот, захватив наше руководство, но потерпел неудачу. Безусловно, пришло время поставить его на место и подготовиться к более масштабному конфликту."
 YFC_focus_diligence: "§GУсердие§!"
 YFC_focus_diligence_desc: "Хотя другие главы Секторов, похоже, встали на сторону Топхэта, мы всё же можем гарантировать, что будем готовы к предстоящему масштабному конфликту."
 YFC_focus_goodwill: "§GДобрая Воля§!"
 YFC_focus_goodwill_desc: "Как ни странно, у глав Секторов нет единого мнения относительно переворота. По всей видимости, они совершенно не понимают, что такое сплочённость; давайте воспользуемся этим слабым местом."
 YFC_focus_shame: "§GСтыд§!"
 YFC_focus_shame_desc: "Несмотря на то, что другие главы Секторов больше не сотрудничают с ним, Топхэт по-прежнему считает, что он и его обджекты (откуда он их берет?) могут захватить Корпорацию, и для него запланировано крупное сражение в Футпатхбурге. К счастью для нас, мы знаем, что он задумал, и его глупая игра рассчитана на двоих."
 YFC_focus_battle_for_footpathburg: "§RБитва за Футпатхбург§!"
 YFC_focus_battle_for_footpathburg_desc: "Наша разведка подтвердила факты: мятежники Топхэта движутся на Футпатхбург, планируя захватить город, а вместе с ним и компанию. Мы мало что знаем о его планах, однако мы точно знаем одно: мы должны устоять. Время покажет: мы или он?"
 YFC_focus_fate_of_top_hat: "§LСудьба Топхэта§!"
 YFC_focus_fate_of_top_hat_desc: "Очень жаль, что эта глупая ситуация выросла до таких масштабов, однако компания должна подать сигнал. Не только своим сотрудникам, но и всему миру. Эта корпорация - не игрушка, это грозная сила, которая убивает тех, кто осмеливается ей противостоять, чего бы это ни стоило." #if top hat doesnt die change kill to something else that is equally cool
 YFC_focus_company_restructuring: "Перестройка"
 YFC_focus_company_restructuring_desc: "В свете тяжелого экономического спада, с которым столкнулась наша компания, важно, чтобы мы восстановили свои позиции с помощью тщательного экономического планирования, однако еще важнее найти виновных. Сектора - полезная группа, однако они являются самыми высокооплачиваемыми сотрудниками; если мы используем их в качестве козлов отпущения, мы можем снизить их зарплату, высвободив тем самым больше средств для себя."
 YFC_focus_lower_wage_gaps: "Выровнять Зарплаты"
 YFC_focus_lower_wage_gaps_desc: "Снизив заработную плату главам Секторов, мы можем подавить разногласия между высокооплачиваемыми и низкооплачиваемыми сотрудниками, гарантируя стабильность компании и экономя на затратах."
 YFC_focus_crack_down_on_influence: "Присечь Пропаганду"
 YFC_focus_crack_down_on_influence_desc: "Удивительно, но значительная часть наших сотрудников оказалась более лояльна к отдельным Секторам, чем к компании в целом. Подавив это несогласие (и проведя небольшую серию сокращений), мы легко сможем напомнить компании, кто на самом деле главный. Хотя мы не уверены, как отреагируют отраслевые подразделения."
 YFC_focus_offset_debt: "Отложить Выплаты"
 YFC_focus_offset_debt_desc: "В лучшие времена мы часто брали кредиты для инвестиций в проекты. По мере краха Старого Гойки, появлялось все больше проектов для инвестирования, и они становились все более прибыльными. В какой-то момент мы начали брать больше кредитов, чем нам было нужно. Конечно, мы всегда вовремя погашали кредиты; мы совсем не бедные. Однако незадолго до рецессии мы взяли большую серию кредитов, и теперь с трудом их погашаем. Конечно, у некоторых членов нашей компании есть крупные личные сбережения. Не помешало бы нам стабилизировать ситуацию, не так ли?"
 YFC_focus_lessons_from_mercs: "Уроки от Наёмников"
 YFC_focus_lessons_from_mercs_desc: "Топхэт изредка говорил о своем интересе к тактике недавно приобретенной нами группы наемников. Он говорит, что хочет изучить их сильные стороны, чтобы привить лучшую дисциплину своим войскам (откуда он берет этих солдат?). Мы не знаем, зачем нам эта информация; нам все равно. Делай, что хочешь, Топхэт."
 YFC_focus_tophats_outlook: "Взгляд Топхэта?"
 YFC_focus_tophats_outlook_desc: "В корпоративном почтовом ящике (на самом деле, это большой мусорный ящик, где хранятся письма, датированные еще 2011 годом; мы свою почту не проверяем!) появилось письмо от Топхэта, предположительно адресованное Йелоу Фейсу. Давайте откроем его и посмотрим, что он написал."
 YFC_focus_the_sectorial_powderkeg: "§RПороховая Бочка§!"
 YFC_focus_the_sectorial_powderkeg_desc: "Представители Секторов недовольны нами, в каком бы смысле этого слова это ни звучало. На самом деле, можно сказать, что они... \"расстроены\" нами. Их беспокойство по поводу изменений в структуре компании нарастает, и теперь они открыто отказываются работать с Йелоу Фейсом, если не будут удовлетворены их требования. К счастью, они по-прежнему выполняют достаточно работы для процветания компании, поэтому мы будем продолжать оказывать на них давление, пока наше финансовое положение не улучшится. Возможно, если они хотят снова получать свои льготы, им следует помочь нам выбраться из этой ямы?"
 YFC_focus_sloth: "§GЛень§!"
 YFC_focus_sloth_desc: "Как ни странно, после демонстрации Секторов они решили задержаться в Футпатхбурге на некоторое время. Мы точно не знаем, чем они занимаются, поскольку больше не можем отслеживать их закупки, однако, похоже, они что-то замышляют. Само собой разумеется, нам следует к этому подготовиться, но к чему именно?"
 YFC_focus_envy: "§GЗависть§!"
 YFC_focus_envy_desc: "Один из немногих оставшихся сотрудников железнодорожного Сектора любезно сообщил нам о том, что видел некое событие. Он утверждает, что видел, как Хаммер и Бикер покупали билет на поезд, который должен был отправиться через несколько недель. Конечно, сделка все равно состоялась - почему бы нам не взять их деньги? - однако возникает вопрос: что же планируют сотрудники сектора?"
 YFC_focus_pride: "§GГордость§!"
 YFC_focus_pride_desc: "Мы наконец-то коллективно, образно говоря, твердо заявили: хватит! Подрывные и сомнительные действия представителей отрасли, а также их громкие и открытые призывы к забастовке против компании, уже вызвали достаточно внутренних разногласий. Мы - и под \"мы\" подразумевается Корпорация - решили депортировать мятежных бывших глав Секторов на малонаселенное Восточное побережье, чтобы они не могли влиять на население."
 YFC_focus_march_on_footpathburg: "§RМарш на Футпатхбург§!"
 YFC_focus_march_on_footpathburg_desc: "Мы получили поразительное количество сообщений - от жителей наших восточных территорий до даже жителей округа Риджхарт, не входящего в Футпатхбург, - о неожиданном продвижении наших изгнанных сотрудников. Бывшие секториальные наёмники, приобретенная нами группа наёмников и некоторые личные обджекты Топхэта (откуда он берет этих обджектов?) - все они двинулись из случайной части восточного побережья, куда мы их поместили, к окраинам нашей столицы. Мы пытались нанять больше наёмников и сформировать отряд из рядовых сотрудников компании, чтобы подавить восстание, однако мы не можем знать результат, пока он не станет известен."
 YFC_focus_tophat_clan: "§0Клан Топхэта§!"
 YFC_focus_tophat_clan_desc: "Здравствуйте. Это сообщение от недавно сформированного Клана Топхэта. Вы принадлежите нам."
 YFC_focus_the_nation: "Нация"
 YFC_focus_the_nation_desc: "К сожалению, Корпорация захватила эти земли, не имея намерения дать живущим на них обджектам общую идентичность. Таким образом, по мере того как компания начала разваливаться, рушилось и жалкое подобие общества, построенного вокруг нее. Исправив эту проблему, сформировав национальную идентичность в нашем государстве, мы сможем более эффективно управлять им, сможем стать стабильным государством."
 YFC_focus_repossess_our_land: "Перераспределение Земли"
 YFC_focus_repossess_our_land_desc: "Каждый гектар наших земель покрыт грязью кумовского капитализма Йелоу Фейса. От лесов до городов - всё, по сути, принадлежит какой-то частной компании. Однако после краха Корпорации не появилось ни малейшего подобия власти, способной обеспечить соблюдение частных прав на землю на нашей территории. Возвращая себе всю принадлежащую нам территорию, мы можем получать прибыль от её перепродажи и должным образом развивать то, что мы считаем нужным сохранить."
 YFC_focus_instate_stabilization: "Стабилизация"
 YFC_focus_instate_stabilization_desc: "Формируя государственный аппарат, мы считаем необходимым обеспечить стабильность сверху донизу. Наше руководство в основном стабильно, поэтому настало время принести эту стабильность и населению в целом. Поэтому мы считаем необходимым создать финансируемые государством программы для облегчения повседневных проблем населения и, что немаловажно, для стимулирования развития бизнеса."
 YFC_focus_renters_relief: "Облегчение Ренты"
 YFC_focus_renters_relief_desc: "Более 99% наших граждан арендуют жилье. К сожалению, почти ни одно из этих арендных зданий не принадлежало компании или ее дочерним предприятиям, а это значит, что мы не сможем принудительно завладеть ими. Поскольку они по-прежнему будут находиться в частной собственности, мы считаем целесообразным, чтобы для улучшения условий жизни приостановить выплату арендной платы этим компаниям-владельцам недвижимости на несколько месяцев."
 YFC_focus_civillian_infrastructure: "Гражданская Инфраструктура"
 YFC_focus_civillian_infrastructure_desc: "При диктатуре Йелоу Фейса не было построено абсолютно никакой инфраструктуры для поддержания жизни рядового гражданина. Дороги, поезда, железные дороги, мосты - всё это строилось только в том случае, если это стимулировало бизнес. В результате многие районы, расположенные вплотную друг к другу, лишены дорог. Наше население, из-за отсутствия инфраструктуры, необходимой для сплочения, разделено. Строя инфраструктуру для наших граждан, мы сможем укрепить доверие внутри сообществ, сделав нас более сплочёнными и стабильными."
 YFC_focus_hire_city_planners: "Нанять Градостроителей"
 YFC_focus_hire_city_planners_desc: "Начиная и продолжая строительство инфраструктуры для населения, мы пришли к выводу: ни один сектор не знает, как правильно планировать город. Конечно, с учетом талантов, оставшихся от предыдущего режима, найти группу обджектов, понимающих архитектуру живого сообщества, не составит труда. Мы можем создать должным образом интегрированные сообщества с более развитой самоидентификацией посредством правильного планирования общества."
 YFC_focus_yoyleton_speech: "Йойлтонская Речь"
 YFC_focus_yoyleton_speech_desc: "Вскоре Топхэт должен выступить с речью, посвященной нуждам и проблемам жителей Йойлтона и всего северо-востока нашего государства. Точно предсказать, о чем он будет говорить, невозможно, но несомненно, эта речь принесет огромную радость народу нашей страны."
 YFC_focus_agriculturization: "Сельское Хозяйство"
 YFC_focus_agriculturization_desc: "Есть известная поговорка: \"Хлеб всему голова\", и, по мере того как мы пытаемся сдержать радикализм народа, по мере того как мы работаем над превращением страхов народа в доверие, мы, несомненно, работаем над тем, чтобы контролировать его. Таким образом, если мы хотим контролировать народ, мы должны контролировать хлеб, однако сначала мы должны производить его больше. Хотя голод, чудесным образом, не поразил наши земли, его уродливая голова поднимается все ближе. Мы должны принять превентивные меры; мы должны создать фермы, которые будут простираться по всей нашей стране."
 YFC_focus_peoniele_conservation: "Консервация Пионила"
 YFC_focus_peoniele_conservation_desc: "Хаммер рассказал нам, что недавно ему звонили жители Пеонила с просьбой навестить их. Он говорит, что они верят в то, что природная красота Пионила должна быть сохранена от любых предполагаемых проблем, с которыми она может столкнуться, и что он был бы лучшим представителем этой идеи в остальных районах. Он уедет всего на несколько дней, если не захочет остаться надолго."
 YFC_focus_northern_economics: "Северная Экономика"
 YFC_focus_northern_economics_desc: "Само собой разумеется, что Йелоу Фейс не был светлым обджектом (а был ли он вообще обджектом?), однако совершенно шокирует, что он упустил такую ​​возможность, как Йойлтон. С того места, где он находится в Гойки, он легко может стать маяком торговли на севере. Наше экономическое положение должно определяться не только Футпатхбургом, который имеет прекрасные связи с югом, но и Йойлтоном, который мог бы иметь столь же прекрасные связи с севером."
 YFC_focus_green_energy: "Зелёная Энергия"
 YFC_focus_green_energy_desc: "Члены городского совета Пионила в одностороннем порядке приняли резолюцию о полном переходе на использование возобновляемых источников энергии в течение следующих пяти лет. По всей видимости, еще несколько региональных и городских советов планируют принять аналогичные резолюции, как только смогут провести их через свои органы управления. Возможно, если мы примем что-то вроде \"Зеленой резолюции\" Пеонила, мы сможем повысить популярность правящих отраслевых лидеров."
 YFC_focus_the_state: "Государство"
 YFC_focus_the_state_desc: "К сожалению, Корпорация захватила эти земли, не имея намерения создавать мощный государственный аппарат; они просто считали, что компания сможет управлять землями самостоятельно. Конечно, мы все знаем, чем это закончилось. Создав мощное государство, мы получим гораздо больше возможностей для дипломатического и экономического воздействия на другие страны. Мы сможем надлежащим образом обеспечивать соблюдение законов, вести геополитические переговоры, нас смогут признать международным сообществом равными. Мы сможем политически стать могущественными."
 YFC_focus_kickstart_economy: "Запустить Экономику"
 YFC_focus_kickstart_economy_desc: "Строя собственные заводы, мы можем стать самодостаточными, создав тем самым благоприятную среду для полноценного экономического развития. Зависимость от других стран в производстве обернулась катастрофой и, вероятно, будет продолжаться, если мы не изменим свой подход. Эту ужасную политику Йелоу Фейса необходимо исправить."
 YFC_focus_decorporatization: "Декорпоратизация"
 YFC_focus_decorporatization_desc: "Хотя это очевидно любому, кто имеет глаза, мы должны дать понять, что мы больше не корпорация. Мы просто кооператив между объектами; мы не Корпорация Йелоу Фейса. Дистанцируясь от наших несчастных предшественников, мы сможем начать восстанавливать международное уважение, а преобразовав наш государственный аппарат в нечто, не напоминающее структуру корпорации, мы сможем значительно повысить эффективность своих обязанностей. Управление государством по аналогии с корпорацией было кошмаром, давайте избавимся от этих глупых методов."
 YFC_focus_reformalize_borders: "Перекроить Границу"
 YFC_focus_reformalize_borders_desc: "С началом партнерства между Компанией и Бандой границы между этими двумя странами размывались с каждой неделей. Это стало еще более очевидным, когда силы Эрейзера начали прорываться через, казалось бы, суверенную территорию, практически не встречая сопротивления. Изменив наши границы, мы можем ясно дать понять международному сообществу, что больше не хотим считаться партнерами Эрейзера. Хотя это может расстроить Банду, для нас это не имеет значения, поскольку мы больше не заинтересованы в сотрудничестве с ними. Наше партнерство закончилось вместе с Компанией."
 YFC_focus_meet_with_numismatia: "Встретиться с Нумизматией"
 YFC_focus_meet_with_numismatia_desc: "Нумизматийцы, оплот истинного капитализма, желают встретиться с нами. Они говорят, что хотят установить партнерские отношения и понять наши планы на будущее развитие. Мы, разумеется, воспользуемся этой возможностью с большим энтузиазмом. Нумизматийцы, хотя и довольно неприятные на вид, могут предложить нам огромные экономические возможности, и, учитывая их внушительную казну, мы были бы глупцами, если бы не прислушались к их советам."
 YFC_focus_the_democratic_question: "Вопрос Демократии"
 YFC_focus_the_democratic_question_desc: "Когда нумизматийцы познакомили нас с демократической концепцией, нам было довольно сложно примирить её и применить к себе. Как именно мы можем гарантировать, что подобная система не станет объектом злоупотреблений? Мы так долго позволяли капитализму править нашим народом, что эта идея, вероятно, развратит его и легко проникнет в новое общество, которое хочет построить наш Клан. Что можно сделать, чтобы сохранить свободу населения на уровне рыночной экономики, не жертвуя при этом его правами?"
 YFC_focus_disavow_raiders: "Отречься от Банды"
 YFC_focus_disavow_raiders_desc: "Чтобы полностью разорвать связь с идентичностью, которую нам навязал Йелоу Фейс, - идентичностью варварского общества рейдеров, - мы должны полностью, публично, неоспоримо и в одностороннем порядке отрицать любые связи или отношения с мерзостью, которая находится к югу от нас. Это должно быть известно широкой общественности: мы не воры! Мы не рейдеры! Мы не бандиты!"
 YFC_focus_reopen_markets: "Открыть Рынки"
 YFC_focus_reopen_markets_desc: "Короче говоря, этого ждали очень долго. Закрытие международного рынка (совершенное, конечно же, самим Йелоу Фейсом) в то время было, в какой-то степени, необходимо, хотя это все равно был довольно печальный день. Пусть же открытие станет для нас самым счастливым событием."
 YFC_focus_great_goikean_trade: "Великогойкийская Торговля"
 YFC_focus_great_goikean_trade_desc: "Возобновление работы рынка принесло сплошной успех! Торговля снова свободно функционирует, прибыль растет, люди обеспечены продовольствием, армии финансируются, в целом, это принесло континенту только положительные результаты. Конечно, эта свободная торговля, эта прибыль, исходят из нашей сферы, и, следовательно, все возвращается к нам разом. Давайте пожнем плоды наших усилий."
 YFC_focus_new_monetary_avenues: "Новые Денежные Каналы"
 YFC_focus_new_monetary_avenues_desc: "Сам Топхэт считал, что простая продажа товаров, произведенных на производственных линиях других стран, не обеспечит долгосрочное финансирование нашего государства. Самый главный источник прибыли - война. Да, мы продаем военную технику, однако этот рынок нестабилен. Со временем запасы морально устаревают; единственное неизменное в войне - это сами обджекты, солдаты. Так почему бы не продавать силу готовых к действию солдат? Мы говорим о наёмниках, ополченцах и, возможно, даже о тех, кто готов стать шпионами за определенную плату. Управляя этими группами, налаживая для них связи, мы легко можем получить свою долю прибыли, которую их сила приносит войне."
 YFC_focus_crackdown_on_substances: "Запрет Наркотиков"
 YFC_focus_crackdown_on_substances_desc: "К сожалению, мы действительно заметили, что наше население поражено болезнью наркомании. Хотя в этом участвует лишь очень небольшая часть населения, любая степень наркомании в обществе ужасна и требует надлежащего лечения. Эти вещества, по всей видимости, также происходят из режима. Конечно, мы тоже должны избавить нашу страну от его бессмертной глупости."
 YFC_focus_international_standards: "Международные Стандарты"
 YFC_focus_international_standards_desc: "Международное сообщество возмущается тем, насколько хаотично оно участвует в нашей рыночной системе. Наше высшее руководство не понимает, как кто-либо может это терпеть. Введя стандарты, которым компании должны следовать при покупке и продаже товаров, мы сможем создать более безопасные континентальные маршруты для всех наших грузоотправителей, тем самым обеспечив доставку посылок."
 YFC_focus_teardrop_diplomacy: "Дипломатия с Тирдроп"
 YFC_focus_teardrop_diplomacy_desc: "Восточное побережье - это очень экономически перспективная территория, завоевание которой или захват её части могут принести нам невероятные плоды. Конечно, Тирдроп, чьё присутствие распространилось по всему Восточному Гойки, уже пытается захватить эту территорию. Поскольку в настоящее время мы не в состоянии вести войну, мы должны попытаться получить эти земли дипломатическим путём, к большому неудовольствию Топхэта. Переговоры по поводу этих земель также могут принести нам значительную международную легитимность."
 YFC_focus_take_up_arms: "Поднять Ружья"
 YFC_focus_take_up_arms_desc: "Поскольку дебаты с Тирдроп накаляются, крайне важно оставаться готовыми к любому потенциальному конфликту. Поэтому мы должны начать производить больше собственного оружия и боеприпасов для самообороны. Кроме того, если этот конфликт не перерастет в более крупное сражение, мы легко сможем продать все запасы, создав таким образом сценарий, который в любом случае принесет нам только положительные результаты."
 YFC_focus_beakers_idea: "Идея Бикер:"
 YFC_focus_beakers_idea_desc: "По всей видимости, Бикер заинтересовалась растущей индустриализацией нашего государства, как в отношении граждан, так и в отношении нашей армии. Следуя её исследованиям, он, похоже, хочет предложить нам несколько очень конкретных, хорошо продуманных планов относительно... полётов? Как интересно."
 YFC_focus_city_council_compromise: "Компромисс Совета"
 YFC_focus_city_council_compromise_desc: "Хотя слишком опасно позволять центру нашей страны быть \"демократическим\" фронтом для восстановления жалкой идеологии Йелоу Фейса, Хаммер сформулировал предложение, которое интегрирует демократию в широком масштабе на местном уровне. Возможно, если мы прислушаемся к его опасениям, мы сможем достичь консенсуса с Нумизматией и, по праву, стать их партнерами в развитии Гойки. Это, конечно, решило бы многие из наших проблем, поскольку наше центральное правительство не всеведущо и не может понять происходящее в каждом отдельном поселении."
 YFC_focus_respect_autonomy: "Уважать Автономию"
 YFC_focus_respect_autonomy_desc: "Уважая автономию и права отдельных сообществ, существующих в пределах наших границ, мы можем укрепить доверие внутри нашего государства, что позволит обеспечить более масштабное, комплексное и совместное развитие."
 YFC_focus_the_numis_ideology: "Путь Нумизматии"
 YFC_focus_the_numis_ideology_desc: "Выход в Нумизматии труда \"Путь Нумизматии\" вызвал большой резонанс среди его крайне политически разнообразного населения. В тексте излагаются идеи социальной сплоченности посредством управления, обсуждаются преимущества прямой и представительной демократии и предпринимается попытка деконструировать роль, которую правительство должно играть в жизни обджекта. В конечном счете, это антиавторитарный текст, который не пытается склониться ни вправо, ни влево, учитывая спорность этого вопроса в контексте Нумизматии. Если этот текст получит широкое распространение, он может оказать значительное влияние на многие группы населения Гойки."
 YFC_focus_rural_representation: "Обновить Деревню"
 YFC_focus_rural_representation_desc: "Жители сельской местности сообщили нам, что система городских советов, несомненно, не учитывает их образ жизни. Они говорят, что их часто меньше, чем тех, кто хочет расширить города в сторону их населенных пунктов, и они не могут обеспечить себя самостоятельно. Это не слишком многочисленная и не вызывающая недовольства группа, поэтому мы не считаем их мнение авторитетным источником информации о желаниях населения в целом, однако это поднимает вопрос: должны ли мы учитывать интересы сельского населения?"
 YFC_focus_grand_metropolises: "Мегаполисы"
 YFC_focus_grand_metropolises_desc: "Жители крупных городов сообщили нам, что, по их мнению, в муниципальную систему должны входить только те, кто проживает в том городе, где этот совет базируется и которым управляет. Они говорят, что сельские жители неоднократно блокировали принятие важных городских законов, и считают власть, которой обладают сельские жители в советах, диктатурой немногих над многими. Реформы, которые хотят продвигать городские жители, несомненно, принесут большие экономические выгоды, однако: хотим ли мы ограничивать наше сельское население ради блага большинства, ради прибыли государства?"
 YFC_focus_beakers_return: "Возвращение Бикер"
 YFC_focus_beakers_return_desc: "Спустя несколько лет мы наконец готовы организовать возвращение Бикер. Прошло немало времени с тех пор, как кто-либо в нашем государстве, включая отраслевых деятелей, видел или слышал о ней. Она, несомненно, совершенно новый обджект по сравнению с той, что было раньше. Возвращение Бикер оживит наше государство, наполнив его грандиозными идеями о том, как интеллектуально стимулировать население. Давайте вернем её домой!"
 YFC_focus_a_stable_society: "Стабильность!"
 YFC_focus_a_stable_society_desc: "Кажется, мы осуществили свои самые смелые мечты! Мы превратили анархическое варварское квазигосударство Йелоу Фейса в полноценное национальное государство с населением, разделяющим свою идентичность, с сообществами, отстаивающими свои права, и с гражданами, несущими ответственность друг за друга. Мы создали справедливое сообщество обджектов; давайте же будем наслаждаться этим."
 YFC_focus_to_the_future: "В Будущее" #make this sky blue pls
 YFC_focus_to_the_future_desc: "Поскольку мы создали общество, которого этот мир всегда заслуживал, остается смотреть только в одном направлении: вперед!"
 YFC_focus_reassess_geopolitics: "Пересмотреть Геополитику"
 YFC_focus_reassess_geopolitics_desc: "Совершенно очевидно, что мы уже не занимаем прежние позиции на международной арене. Поэтому настало время переосмыслить наши корпоративные стратегии, чтобы не просто снова стать прибыльными, но и превратиться в центр капиталистической торговли на континенте."
 YFC_focus_close_the_markets: "Закрыть Рынки"
 YFC_focus_close_the_markets_desc: "Поскольку закупок стало очень мало, отправка разведчиков по нашим маршрутам и их оценка обходится дороже, чем мы получаем прибыли. Поэтому руководство корпорации приняло решение начать закрытие большинства наших маршрутов, фактически закрыв рынки сбыта."
 YFC_focus_the_second_embargo: "Последнее Эмбарго"
 YFC_focus_the_second_embargo_desc: "Наш единственный союзник вне Банды, Военный Округ, принял решение прекратить с нами всякое сотрудничество, фактически положив конец торговле между нашими великими державами (или, когда-то великими, в случае с Округом)."
 YFC_focus_trade_alternatives: "Торговые Альтернативы?"
 YFC_focus_trade_alternatives_desc: "Совершенно очевидно, что мы больше не можем получать прибыль, покупая и перепродавая военную технику. Конечно, нам всё ещё нужно зарабатывать деньги, поэтому мы должны найти другой товар для продажи. От наших солдат по этому вопросу поступило немного предложений (по крайней мере, стоящих), и мы должны действовать быстро. Судьба компании сейчас крайне неопределённа."
 YFC_focus_last_of_the_layoffs: "Последние Сокращения"
 YFC_focus_last_of_the_layoffs_desc: "К сожалению, элементы бунта Секторов по-прежнему сохраняются в низших звеньях нашей компании. Вероятно, эти увольнения сильно нас подкосят, но это необходимо для дальнейшего существования корпорации. Мы больше не можем мириться с мелкими разногласиями."
 YFC_focus_establish_the_correct_leadership: "Верный Управленческий Аппарат"
 YFC_focus_establish_the_correct_leadership_desc: "Ужасный отраслевой фиаско показал, что нам нужно лучшее руководство. Возможно, наняв сотрудников, которые во всех отношениях неизменно поддерживали бы Йелоу Фейса, мы сможем гарантировать, что наша компания больше не станет жертвой мятежных сил."
 YFC_focus_create_checkpoints: "Создать Пункты Досмотра"
 YFC_focus_create_checkpoints_desc: "Подобные заговоры никогда больше не должны повториться. Слежка за нашими сотрудниками и гражданами позволит нам лучше предотвратить любое инакомыслие. Наблюдение можно упростить, установив контрольно-пропускные пункты вокруг крупнейших населенных пунктов и разместив людей в укромных местах для наблюдения за подозрительной активностью."
 YFC_focus_sectors_their_place: "Поставить Сектора на Место"
 YFC_focus_sectors_their_place_desc: "Давайте раз и навсегда покончим с этой проблемой, должным образом разобравшись с мятежниками..."
 YFC_focus_radical_meeting: "§9Радикальная Встреча§!"
 YFC_focus_radical_meeting_desc: "К сожалению, это ужасное событие - восстание и отпор - истощило нас ещё больше; у нас меньше средств, чем было в начале рецессии, и мы гораздо ближе к полному банкротству, чем раньше. К счастью, наш (единственный) союзник, Банда, процветает. Возможно, более тесное сотрудничество с Эрейзером поможет нам встать на ноги; давайте встретимся с ним."
 YFC_focus_way_of_raiders: "§RСкользкая Дорожка§!" #is this name too long?
 YFC_focus_way_of_raiders_desc: "Следуя по стопам наших друзей с юга, мы сможем эффективно перестроить компанию с нуля, создав своего рода \"новую\" корпорацию Йелоу Фейс. Мы сами станем рейдерами, как бандиты. Мы снова станем силой, с которой придется считаться на всем континенте."
 YFC_focus_seek_cooperation_with_bunch: "§9Кооперация с Бандой§!"
 YFC_focus_seek_cooperation_with_bunch_desc: "Конечно, для преобразования корпорации нам потребуется существенная помощь от Банды, которая с радостью окажет нам поддержку в наших начинаниях."
 YFC_focus_promote_blocky: "Повысить Блоки"
 YFC_focus_promote_blocky_desc: "Блоки снова и снова демонстрировал свою эффективность в руководстве и управлении рейдами. Он умеет действовать в условиях высокого давления, является блестящим стратегом, когда ставит перед собой цель; качества, идеально подходящие для члена новой Корпорации."
 YFC_focus_finally_form_the_deal: "Наконец Заключить Сделку"
 YFC_focus_finally_form_the_deal_desc: "После этого тяжелого периода финансовых трудностей мы почти забыли о торговом соглашении, которое начали разрабатывать с Бандой. Давайте, после долгих задержек, наконец-то заключим это соглашение должным образом, гарантируя наше партнерство на долгие годы вперед."
 YFC_focus_invite_bunch_settlers: "Пригласить Поселенцев"
 YFC_focus_invite_bunch_settlers_desc: "Несмотря на наше тесное сотрудничество, обмен населением между нами и Бандой был незначительным. Давайте пригласим жителей Банды, желающих начать новую жизнь, переехать в наши поселения: Футпатхбург, Йойлтон, Пионил или даже в сельскую местность Фарвудс. Мы обязательно отправим поезда, чтобы помочь сопроводить будущих граждан... за определенную плату."
 YFC_focus_bunch_technology: "Технологии Банды"
 YFC_focus_bunch_technology_desc: "Вместо нас, бандиты, которые, судя по всему, сохранили Теннис Болла в своих рядах, потратили удивительно много времени на исследование технологий. Возможно, нам следовало бы начать делиться научными открытиями, чтобы еще больше сплотить наши великие нации."
 YFC_focus_free_flowing_trade: "Свободная Торговля"
 YFC_focus_free_flowing_trade_desc: "Наконец, благодаря заключенному соглашению, торговля между нашими великими державами расцвела, капитал и средства свободно перемещаются от границы к границе. Давайте порадуемся тому огромному прогрессу, которого мы достигли за столь короткий срок!"
 YFC_focus_improve_the_rail_links: "Улучшить ж/д сеть"
 YFC_focus_improve_the_rail_links_desc: "Похоже, наши финансовые трудности привели к тому, что мы оставили наши железные дороги без должного ухода. Некоторые из них сожжены солнцем, другие покрыты грязью и илом, что делает их практически непригодными для использования. Давайте возродим эти линии, чтобы способствовать нашему развитию."
 YFC_focus_hand_over_intel: "Передать Данные"
 YFC_focus_hand_over_intel_desc: "Мы получили удивительно много разведывательной информации о наших соседях на мировой арене, которая может оказаться весьма ценной. Конечно, мы не можем просто так передать эту информацию кому угодно, однако, добрым людям в Подгорныве, безусловно, пригодились бы эти сведения. За определенную плату мы могли бы им их предоставить."
 YFC_focus_strength_in_skill: "Сила в Навыке"
 YFC_focus_strength_in_skill_desc: "Пройдя надлежащую подготовку и овладев искусством набегов, мы можем погрузить этот континент в диктатуру бандитизма, в истинный капитализм. Самые дисциплинированные и образованные из нас непременно станут хозяевами новой эпохи Гойки."
 YFC_focus_strength_in_power: "Сила в Мощи"
 YFC_focus_strength_in_power_desc: "Благодаря надлежащей подготовке и опыту в самом деле грабежа, мы можем погрузить этот континент в диктатуру бандитизма, в истинный капитализм. Самые сильные и физически подготовленные из нас непременно станут хозяевами новой эпохи Гойки."
 YFC_focus_bandit_pack: "§YБандитский Договор§!"
 YFC_focus_bandit_pack_desc: "Вся наша упорная работа окупилась. Мы тесно сотрудничали с Бандой, и наши страны практически переплелись; мы создали неразрывное партнерство, которое может продлиться поколениями. Давайте официально оформим это соглашение и создадим между нами вечный мир и братство."
 YFC_focus_prepare_for_strikes: "§gПодготовиться к Забастовкам§!"
 YFC_focus_prepare_for_strikes_desc: "Часть наших сотрудников по-прежнему недовольна нашими недавними действиями. К сожалению, у нас нет возможности точно определить источник этого недовольства, однако мы знаем, что эти обджекты планируют вскоре объявить забастовку. Чего, по их мнению, добьётся забастовка, мы не знаем (серьёзно, к чему это приведёт?), но мы всё равно должны быть к этому готовы, на случай, если ситуация снова выйдет из-под контроля.."
 YFC_focus_acquire_the_people: "Кадровый Ресурс"
 YFC_focus_acquire_the_people_desc: "Для предотвращения любых нежелательных конфликтов нам необходимо иметь достаточное количество обджектов, охраняющих штаб-квартиру компании, а также наши контрольно-пропускные пункты. Мы не можем позволить еще одному мелкому восстанию помешать нашим финансовым амбициям."
 YFC_focus_acquire_the_firepower: "Огневая Мощь"
 YFC_focus_acquire_the_firepower_desc: "Чтобы предотвратить любые нежелательные конфликты, нам необходимо иметь достаточную огневую мощь. Орудия, артиллерия, возможно, даже танки, должны быть размещены вокруг города Футпатхбург, а также в некоторых наших более мелких поселениях, чтобы обеспечить себе надлежащее положение. Мы не можем позволить еще одному мелкому восстанию помешать нашим финансовым устремлениям."
 YFC_focus_train_with_bunch: "Опыт Банды"
 YFC_focus_train_with_bunch_desc: "Тренировки с бандитами, которые прекрасно разбираются в военном деле, позволят нам легко подготовиться к любым угрозам, которые могут быть направлены против нас, будь то внешние или, не дай бог, внутренние. Кроме того, бандиты известны тем, что быстро наживают огромные состояния, используя методы, которые некоторые считают нечестными. Мы могли бы пойти по их стопам, если бы достаточно хорошо подготовились."
 YFC_focus_pillage_our_neighbors: "§RГрабить Соседей§!"
 YFC_focus_pillage_our_neighbors_desc: "Свободный рынок - это именно то, чем он себя называет: рынок и, что наиболее важно, свобода. Благодаря власти, которой наделен капитал, мы свободны зарабатывать деньги так, как считаем нужным. Если у человека нет средств для защиты своей собственности, то насколько она ему на самом деле принадлежит? Грабить соседей - это идеологически оправданно, а финансово тем более!"
 YFC_focus_setup_staging_grounds: "Подготовка Дорог"
 YFC_focus_setup_staging_grounds_desc: "Конечно, было бы... гораздо лучше совершать набеги с использованием настоящих дорог, с реальным транспортом, а не пытаться пробираться сквозь кусты и леса, чтобы атаковать противников. Строительство инфраструктуры может легко занять довольно много миль (или километров?), так что давайте так и сделаем."
 YFC_focus_demand_great_ridge_tribute: "Ультиматум Хребту"
 YFC_focus_demand_great_ridge_tribute_desc: "Этатистский режим Сноуболла на юге потерпел ожидаемый крах, а на его гниющем трупе возникли всяческие опарыши, доживающие свой век в междуусобной грызне правительства. Один из таких несчастных режимов расположился в богатой природными ресурсами зоне Великого Хребта, где прокажённые и рабы подумали, что могут требовать право на самостоятельность. Пора придавить их сапогом и показать, что значит настоящая свобода."
 YFC_focus_follow_easers_strategy: "Стратегия Эрейзера"
 YFC_focus_follow_easers_strategy_desc: "Умелый и компетентный Эрейзер уже давно выработал эффективную стратегию набегов. Она проста: отвлечь внимание, проникнуть внутрь и двигаться от центра поселения наружу, вытесняя людей из поселения и получая при этом значительное богатство. Эта стратегия хорошо работала в прошлом, и хотя некоторые поселения лучше научились отражать подобные атаки, это не значит, что она сломана."
 YFC_focus_rapid_assaults: "Молниеносный Удар"
 YFC_focus_rapid_assaults_desc: "Благодаря стратегии Эрейзера мы сможем легко начать совершать частые и эффективные набеги. Наши обджекты смогут атаковать несколько разных поселений за одну ночь, и, если мы правильно разработаем стратегию, мы сможем сделать это практически без потерь. Нам нужно больше изучить этот вопрос."
 YFC_focus_old_traditions: "Традиция"
 YFC_focus_old_traditions_desc: "Великая традиция набегов Эрейзера уходит корнями в военную стратегию Старого Гойки, существовавшую во время войны между Гойки и Девидлендом, которая произошла много столетий назад. Эти традиции не новы, они повторяются, и мы должны относиться к ним не как к знанию Банды, а как к знанию самого Гойки. Поистине, набеги - это дело Гойки."
 YFC_focus_mercenaries_practice: "Идеи Наёмников"
 YFC_focus_mercenaries_practice_desc: "Приобретенная нами некоторое время назад компания наемников изучила стратегию Эрейзера и заметила некоторые слабые места, которые, по их мнению, следует пересмотреть. Они утверждают, что другие страны учатся на этом примере и со временем будут обладать оборудованием, способным в одиночку противостоять любой стратегии. Они говорят, что нам тоже необходимо получить высокотехнологичное оружие и распределить его между всеми отрядами, участвующими в набегах, если мы хотим оставаться впереди. Однако эта стратегия может легко оказаться дорогостоящей и никогда ранее не применялась."
 YFC_focus_modern_weaponry: "Современное Вооружение"
 YFC_focus_modern_weaponry_desc: "Наше модернизированное вооружение позволяет нам с лёгкостью и эффективностью совершать набеги на поселения, пугая даже самых стойких солдат и вынуждая мирных жителей быстро отступать из своих домов, не забрав при этом свои ценности! Наши аналитики утверждают, что современное оружие, благодаря воздействию на психику обджекта, вызывая реакцию бегства, может снизить число жертв."
 YFC_focus_new_motorization: "Новая Моторизация"
 YFC_focus_new_motorization_desc: "Благодаря моторизации - грузовикам, поездам, автомобилям - мы можем передвигаться так быстро и эффективно, что можем проникать глубоко на территорию противника, атакуя населенные пункты далеко за пределами наших границ, не опасаясь никакого ответного удара. Вражеские армии просто слишком медлительны; обджекты медленнее, чем двигатели!"
 YFC_focus_acknowledge_our_shortcomings: "Наши Недостатки"
 YFC_focus_acknowledge_our_shortcomings_desc: "К сожалению, несмотря на недавние усилия, наши силы плохо справляются с рейдами. По крайней мере, мы не соответствуем уровню, заданному Бандой. Мы должны еще внимательнее изучить нашу тактику и неудачи, чтобы правильно понять, как стать лучше в будущем. Мы должны перестроить нашу командную структуру, чтобы иметь возможность быстрее отдавать приказы и обеспечить большую сплоченность с Бандой."
 YFC_focus_issues_in_east: "§CВопрос Востока§!"
 YFC_focus_issues_in_east_desc: "Согласно различным источникам, лояльным компании, Тирдроп отправляет своих людей в различные, ранее необитаемые районы Гойки, чтобы захватить больше земель. Очевидно, этот акт империалистического вторжения... гениален! Почему мы не додумались до этого раньше? Нам следовало бы попытаться превзойти их в этой военной игре!"
 YFC_focus_to_portland: "В Портленд!"
 YFC_focus_to_portland_desc: "Некоторое время мы владели и частично вели свою деятельность в небольшом, изолированном рыбацком городке на восточном побережье, известном как Портленд. По мере роста корпоративных операций рос и этот порт, и теперь это ценное поселение подвергается нападению со стороны безумных тирдропперов. Мы должны установить контроль над другими частями восточного побережья, чтобы спасти это жизненно важное поселение от этих варваров!"
 YFC_focus_plunder_the_wealth: "Грабить Восток"
 YFC_focus_plunder_the_wealth_desc: "Восточное побережье - хотя его легко пропустить на карте из-за низкой плотности населения и (до сих пор!) ничейных земель - похоже, хранит ценности на своих берегах и в своих мелких поселениях. Если мы будем действовать быстро, мы сможем совершить набег на эти поселения еще до того, как они поймут, что такое «набег», разграбив их, используя эффект неожиданности."
 YFC_focus_distract_teardrop: "Отвлечь Тирдроп"
 YFC_focus_distract_teardrop_desc: "Тирдроп, кровавая диктаторша, — весьма неплохой стратег. Только под её руководством её слабо сформированные армии могут превзойти наши. Поэтому, если мы выведем её из равновесия раздражающе отвлекающим письмом, мы легко сможем разгромить её восточную операцию и захватить эти земли."
 YFC_focus_dispatch_the_forces: "Послать Войска"
 YFC_focus_dispatch_the_forces_desc: "Подразделения тирдропперов неэффективны. Ни в коем случае нельзя сказать, что они хороши. Они не быстры, не сильны, но их много. И, что более важно, ими умело маневрируют. Мы должны немедленно отправить наших лучших бойцов на восточное побережье, чтобы противостоять (безусловно) блестящей стратегии войск Тирдроп."
 YFC_focus_more_ways_of_wealth: "Иные Богатства"
 YFC_focus_more_ways_of_wealth_desc: "Этот короткий конфликт истощил наши значительные средства. Нам необходимо немедленно найти новый, уникальный и, самое главное, быстрый способ увеличить долю в капитале компании. Некоторые из наших сотрудников в головном офисе были пойманы на употреблении... каких-то веществ... чтобы работать быстрее, и, похоже, они покупают их килограммами ежедневно. Возможно, если мы сможем выйти на этот рынок и распространить его за границу, у нас появятся миллионы постоянных клиентов; идеальная возможность для получения прибыли."
 YFC_focus_expand_our_claims: "Расширение Притязаний"
 YFC_focus_expand_our_claims_desc: "Похоже, среди наших сотрудников ходят слухи, что сторонники Тирдроп получают иностранную помощь. Конечно, мы уволили сплетников, поскольку сплетни в рабочее время запрещены, однако мы должны предотвратить вмешание других стран в этот конфликт. Если мы создадим впечатление, что у нас гораздо больше территории, чем на самом деле, то сможем представить Тирдроп проигравшей. Какой идиот добровольно пожертвует ресурсами на проигранную войну?"
 YFC_focus_scout_teardrop_positions: "Рейды на их Позиции"
 YFC_focus_scout_teardrop_positions_desc: "Один из важнейших аспектов этого конфликта — неизведанные территории Восточного побережья. Боевики-тирдропперы часто занимали невыгодные позиции, подчиняясь приказам вышестоящих офицеров, которые не понимают местности (мы тоже не понимаем, но, тссс!). Если мы должным образом разведаем их позиции, мы легко сможем обнаружить слабые места до начала боевых действий, а не после."
 YFC_focus_smuggle_prisoners: "Подкупить Пленных"
 YFC_focus_smuggle_prisoners_desc: "Мы действительно держим в плену значительное количество тирдропперов по ​​тем или иным причинам, большинство из которых являются жителями Прибрежной территории. Возможно, если мы освободим этих пленных и отправим их в специально отведенный для них район, мы сможем серьезно ослабить их силы и линии снабжения, заставив их сосредоточиться на диких преступниках, что позволит нам продвинуться еще дальше."
 YFC_focus_way_to_seas: "§GМорская Дорожка§!"
 YFC_focus_way_to_seas_desc: "После непродолжительной борьбы мы установили связь с городом Портленд и успешно обеспечили безопасность нашей жизненно важной морской базы. Радуйтесь!"
 YFC_focus_locked_on_land: "§RЗакрыты на Суше§!"
 YFC_focus_locked_on_land_desc: "К сожалению, после ожесточенных боёв и серии набегов нам не удалось соединить Портленд с Йойлтоном или Пионилом, фактически потеряв город в пользу Тирдроп. На данный момент корпорация Йелоу Фейс де-юре и де-факто не имеет выхода к морю."
 YFC_focus_suppress_yoyleton: "Подавить Йойлтон"
 YFC_focus_suppress_yoyleton_desc: "Тирдропперы умудрились обосноваться на нашей территории в Йойлтоне. И здесь они проявляют больше мятежа, чем где бы то ни было, открыто призывая к восстаниям против правительства и... утверждая, что находятся здесь дольше, чем мы?! Мы не будем этого слушать, мы позаботимся о том, чтобы эти макрощёлки больше не могли бунтовать."
 YFC_focus_before_setting_sail: "Перед отплытием"
 YFC_focus_before_setting_sail_desc: "Завладев Портлендом, а, значит, и прямым выходом в самое богатое море Гойки, мы можем перенести нашу рейдерскую традицию на морскую гладь, сформировав собственный небольшой флот! Потенциальная прибыль от грабежа девидлендских конвоев огромна, и мы не можем упускать такой приятной возможности."
 YFC_focus_construct_the_naval_base: "Построить Порт"
 YFC_focus_construct_the_naval_base_desc: "Следует перенаправить часть награбленных средств для строительства достойной (по нашим меркам) верфи в Портленде, а также направить туда рабочую силу для начала работ по строительству нашего великолепного морского флота! За всё заплатят, естественно, низшие чины, они ведь дармоеды."
 YFC_focus_pirate_life: "§YПиратская Доля§!"
 YFC_focus_pirate_life_desc: "Весь Гойки познает страх наших налётов, на суше и на море! Наши доблестные рейдеры будут обчищать караваны, а наш пиратский флот - топить богатых и бедных сопляков, осмелившихся без должной защиты сунуться в наши моря!\n\n§RНабьём же доверху наши сундуки! Пусть льётся ром через край! Йяр-р-рр!!§!"
 Musketeers_three_musketeers: "Три Мушкетёра"
 Musketeers_three_musketeers_desc: "Теперь, когда все объединены идеалами капитализма, мы наконец-то можем начать зарабатывать по-настоящему большие деньги! Потребуется некоторое время, прежде чем эти улучшения принесут нам ощутимые результаты, но время на нашей стороне. Пусть партнёрство продолжает расти!"
 Musketeers_form_own: "Создать ОВН"
 Musketeers_form_own_desc: "Для обеспечения единства в наших целях получения прибыли нам необходима единая организация для управления и расширения нашей торговли и получения прибыли. Таким образом, Организация Великих Наций, или просто ОВН, станет такой организацией. Мы направим представителей от каждой страны для подписания необходимых документов для вступления. Со временем это станет самым сильным экономическим соглашением во всем Гойки!"
 Musketeers_grant_drilling_subsidies: "Разрешить Бурить"
 Musketeers_grant_drilling_subsidies_desc: "Одним из главных пунктов экономического роста является наличие ресурсов. Этот сектор находится на подъеме с момента краха старого Гойки. В наших краях есть ценные ресурсы, которые могут принести прибыль. Давайте инвестируем в бурение и добычу полезных ископаемых."
 Musketeers_unite_trading_deals: "Единые Торговые Сделки"
 Musketeers_unite_trading_deals_desc: "Различные страны закупают ресурсы у других стран, не являющихся нашими. Мы приложим больше усилий для того, чтобы закупать товары и ресурсы, которые нам необходимы."
 Musketeers_build_new_mines: "Новые Шахты"
 Musketeers_build_new_mines_desc: "Наши усилия в горнодобывающей промышленности не должны ограничиваться несколькими новыми шахтами, мы должны постоянно расширяться!"
 Musketeers_gather_contracts: "Контракты"
 Musketeers_gather_contracts_desc: "Мы предпримем еще больше шагов, чтобы больше стран могли закупать нашу продукцию!"
 Musketeers_form_udc: "Создать ОДО"
 Musketeers_form_udc_desc: "Нам необходимо взглянуть правде в глаза: нас со всех сторон окружают агрессивные нации. Те самые агрессивные нации, которые рассматривают нас лишь как сокровищницу, которую можно разграбить, а не как реальную угрозу. Хотя мы не можем создать огромную армию или провести действенные реформы, мы можем объединить командную структуру наших стран. Таким образом, Объединенное командование обороны (ОДО) будет служить именно этой цели."
 Musketeers_conduct_military_drills: "Военные Учения"
 Musketeers_conduct_military_drills_desc: "Нам необходимо обеспечить одинаковый уровень боеготовности и подготовки всех армий. В связи с этим мы будем организовывать ежемесячные военные учения для реализации этих планов."
 Musketeers_tighten_command: "Усиление Командования"
 Musketeers_tighten_command_desc: "Нам необходимо еще больше сплотить нашу командную структуру. У каждого подразделения армии по-прежнему есть элементы, которые не подпадают под действие этих мощных усилий. Давайте исправим эту ситуацию с оставшимися офицерами и генералами."
 Musketeers_rules_of_war: "Уроки Войны"
 Musketeers_rules_of_war_desc: "Война превращается из чего-то действительно простого и примитивного в нечто более сложное. Хотя мы не можем быть лучшими, мы должны идти в ногу с другими. Мы будем изучать результаты прошлых и нынешних войн, чтобы быть готовыми к будущим."
 generic_focus_industry_desc: "Наши производственные мощности довольно низкие, не так ли?"
 generic_focus_army_desc: "Наша армия довольно маленькая, не так ли?"
 generic_focus_researches_desc: "Скорость создания технологических инноваций у нас довольно низкая, не так ли?"
 
