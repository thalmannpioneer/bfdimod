 CRN_credit_card: "Кредиткард"
 CRN_credit_card_desc: "Бывший лидер знаменитых Свободных Армий Южного Гойки, нынешний основатель Капиталистической Республики, Кредиткард многого добился в своей жизни. Когда-то он был генералом старой армии Гойки, причем высокопоставленным. После трагедии, связанной с исчезновением Острова Мечты, он возглавил Свободную Армию в походе на сам Кэсленд, положив начало новой эре Гойки."
