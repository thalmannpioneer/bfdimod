 YFC_yellow_face: "Елоу фейс"
 
 SOS_anchor: "Энчер"
 SOS_anchor_desc: "Старый командир торгового судна, после пропажи Острова Мечты Энчер приобрёл репутацию честного, решительного обджекта. Благодаря своему честному имени и талантам управления он был выбран главой самоуправления флотилии."
 SOS_pin: "§8Королева Народа Святого Обджектбурга и Хозяйка Земель Его, Пин§!"
 
 UGA_mammal_bone: "Кость Мамонта"
 
 DAV_king_david: "Давид IV"
 DAV_king_david_desc: "Король Давид, которого не следует путать с Давидом, участником БЗОМ, правит Королевством почти тридцать лет. Его правление до сих пор почитается народом. Однако некоторые считают его предателем Давидовского народа из-за того, что он позволил своему сыну, наследнику престола, участвовать в БЗОМ среди других участников. Несмотря на это мнение, он остается непоколебимым. Да благословит Бог Давидову землю!"
 
