 sp_application_choice_reward_desc: "...              СЕКРЕТНО. ПЕРЕДАТЬ ЛИЧНО ГОЛЬФБОЛЛ.\n\nИнженеры спорят о боевом применении проекта. Команда разделилась на две группы: одна желает, чтобы во время взрыва было использовано как можно больше йойлита; другая же, напротив, стоит за то, чтобы в результате взрыва йойлолит распределился по большой площади и вызвал заражение окружающей территории.\nКакое решение будет принято?"
