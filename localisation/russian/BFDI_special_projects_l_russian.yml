 sp_yoylite_reactor_tested_reward_desc: "...          ОПЫТ №4\n\nКонтрольной группе учёных успешно удалось запустить реактор холодного синтеза на основе контролируемого распада атомов йойлита. Реактор в данный момент работает стабильно. Очевидно, это большой шаг для всей физической науки Гойки."
