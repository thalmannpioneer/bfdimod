l_russian:
 LOADING_TIP_0: "Эй, я просто в настроении, чтоб кому-нибудь надубасить!\n- Блоки"
 LOADING_TIP_1: "Мне нравится Теннисболл только платонически.\n- Гольфболл"
 LOADING_TIP_2: "Всего 70.000 платежей, по $70.000 каждый.\n- Реклама Йелоу Фейса"
 LOADING_TIP_3: "Бабл хочет убить себя, а ещё она настолько тупая, что не умеет считать до трёх.\n- Пенсил"
 LOADING_TIP_4: "Я хочу мести!\n- Айс Кьюб"
 LOADING_TIP_5: "НЕЕЕЕЕЕЕЕЕЕЕЕЕЕЕЕЕЕЕЕЕЕЕТ!!!!\n- Сноубол"
 LOADING_TIP_6: "Нам следует соблюсти тишину.\n- Койни"
 LOADING_TIP_7: "Эй, чудаки, вот вам ещё один пранк!\n- Блоки"
 LOADING_TIP_8: "Отлично, безрукий сопляк!\n- Сноубол"
 LOADING_TIP_9: "Мне нравилось, когда были исключения, это добавляло интриги.\n- Пен"
 LOADING_TIP_10: "Знаете, когда падаешь в бездонную пропасть, умираешь от голода.\n- Лифи"
 LOADING_TIP_11: "До 0.000 процентов.\n- Гольфбол"
 LOADING_TIP_12: "Койни, ты копейка! Ты ничего не стоишь!\n- Файри"
 LOADING_TIP_13: "Файри, я предлагаю тебе прекратить поджигать окружающих!\n- Теннисбол"
 LOADING_TIP_14: "Видишь, ничего сложного! Самая лёгкая штука, которую я провёртывал!\n- Пен"
 LOADING_TIP_15: "Серьезно, почему вы все тонете? Это же не зыбучий песок.\n- Анонсер"
 LOADING_TIP_16: "Айси, сравнивая с Метч... ты хлам.\n- Пенсил"
 LOADING_TIP_17: "Оу, серьёзно?\n- Девид"
 LOADING_TIP_18: "Давай займёмся чем-нибудь весёлым, например, спрыгнем с обрыва!\n- Лифи"
 LOADING_TIP_19: "Оо, завидуешь, малыш?\n- Файри"
 LOADING_TIP_20: "Хьехехехее-ХЕХЫЕХЕЕ!\n- Yellow Face"
 LOADING_TIP_21: "Ты думаешь, что много видел? Я сижу тут уже 16 МЕСЯЦЕВ и ХОЧУ НАРУЖУ ПРЯМО СЕЙЧАС!\n- Флауер"
 LOADING_TIP_22: "О нет! Значит, Анонсер слышал каждый раз, когда я называл его-\n- Койни"
 LOADING_TIP_23: "Что? Я не знал, что ты коррупционерка, Лифи!\n- Теннисбол"
 LOADING_TIP_24: "Значит, я выиграю! Значит, я выиграю!\n- Пенсил"
 LOADING_TIP_25: "Йойлкейк!\n- Бабл"
 LOADING_TIP_26: "Тебе ещё надо подняться на 73 уровня, чтобы достичь моего уровня доброты.\n- Лифи"
 LOADING_TIP_27: "О, да, у йойлоягод есть некоторые побочные эффекты. Извини.\n- Лифи"
 LOADING_TIP_28: "Иии, нет! Т-ты получишь противоположность Острова Мечты!\n- Флауер"
 LOADING_TIP_29: "О, привет, Койни! Приятно видеть, что ты попал туда, куда тебе следует.\n- Файри"
 LOADING_TIP_30: "Да, финальная четвёрка, Файри!\n- Лифи"
 LOADING_TIP_31: "Мы притворялись мёртвыми, естественно.\n- Лифи"
 LOADING_TIP_32: "Я думаю, что мир достаточно спокоен.\n- Анонсер"
 LOADING_TIP_33: "Файри, ты выиграл.\n- Анонсер"
 LOADING_TIP_34: "Анонсер, отдай мне остров!\n- Лифи"
 LOADING_TIP_35: "Пен, признай, ты не получишь остров назад.\n- Теннисбол"
 LOADING_TIP_36: "Бабл, мне жаль. А, нет, не жаль!\n- Флауер"
 LOADING_TIP_37: "Ты КУПИЛА Остров Мечты, не так ли? Вот откуда ТЫ всё знала!\n- Гольфбол"
 LOADING_TIP_38: "Поторопитесь! Нам нужно возвращаться к казни!\n- Гольфбол"
 LOADING_TIP_39: "[Вздох!]\n- Все"
 LOADING_TIP_40: "Торт На Кону!\n- Озвучка"
 LOADING_TIP_41: "Оу, серьёзно!\n- Нидл"
 LOADING_TIP_42: "Блех!\n- Роки"
 LOADING_TIP_43: "НЕТ!\n- Девид"
 LOADING_TIP_44: "Странно, я чувствую арахисовое масло? ... Ладно, наверно нет.\n- Файри"
 
