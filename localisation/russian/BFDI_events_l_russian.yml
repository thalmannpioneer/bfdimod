 YFC_sector.16.t: "...Top Hat seizes some control!"
 YFC_sector.16.desc: "Due entirely to the high influence that Top Hat has managed to gain over the company, Top Hat has seized a high amount of power within the Yellow Face Corporation. Unfortunately, this means that he will no longer be subservient to our wants, and we will be unable to keep him in line for quite some time, as, he can simply force the employees to oust anyone he so chooses, due to this power. We will §Rno longer benefit from what he brings to the company§!, though, luckily, he will not be able to contain this level of power forever. We are actively working on dismantling his influence, and, expect to see a return to form from him, soon."
 YFC_sector.16.a: "Curse him!"
 YFC_sector.17.t: "...Pipe seizes some control!"
 YFC_sector.17.desc: "Due entirely to the high influence that Pipe has managed to gain over the company, Pipe has seized a high amount of power within the Yellow Face Corporation. Unfortunately, this means that they will no longer be subservient to our wants, and we will be unable to keep them in line for quite some time, as, they can simply force the employees to oust anyone they so choose, due to this power. We will §Rno longer benefit from what they bring to the company§!, though, luckily, they will not be able to contain this level of power forever. We are actively working on dismantling their influence, and, expect to see a return to form from them, soon."
 YFC_sector.17.a: "Curse them!"
