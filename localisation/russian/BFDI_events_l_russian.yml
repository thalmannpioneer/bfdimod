l_russian:
 #COMMON
 common_event.1.t: "Банкротство"
 common_event.1.desc: "Похоже, наше государство не способно платить по счетам. Мы вынуждены объявить себя неплатёжеспособными, пока не погасим свои обязательства. Это сильно ударит по нашему экономическому потенциалу."
 common_event.1.a: "Не самое мудрое руководство."
 
 common_event.2.t: "Конец Кризиса"
 common_event.2.desc: "Нам успешно удалось погасить наши раздутые долги, и наша экономика может вернуться в нормальный режим. Отличная работа!"
 common_event.2.a: "Вперёд!"
 
 common_event.3.t: "Денежная Система"
 common_event.3.desc: "Экономика в Troubles in Goiky работает очень просто! Деньги копятся от некоторых фиксированных параметров - количества фабрик и населения. Тратятся деньги на некоторые социальные политики - общественное образование и медицину, а также на дополнительные игровые механики (напр. решения). Если вы уйдёте слишком глубоко в минус, то может произойти банкротство. Старайтесь этого избежать.\nУдачи!"
 common_event.3.a: "Понятно."
 
 #GOIKY
 GOI_event.1.t: "Битва За Остров Мечты"
 GOI_event.1.desc: "БЗОМ, или Битва За Остров Мечты, это интернет-шоу, в котором различные обджекты сражаются за главный приз - Остров с отелем, двумя ресторанами и прочими удобствами. В последнее время оно набирает всё большую и большую популярность. Но это шоу - далеко не единственное что происходит в землях Гойки. Этот континент густо населён другими различными обджектами и в целом является сильным экономическим и социальным целым."
 GOI_event.1.a: "В неизвестность."
 
 GOI_event.2.t: "Файнал-Фоур"
 GOI_event.2.desc: "С исключением Спонджи осталось всего четыре возможных победителя: Файри, Лифи, Флавер и Бабл. Страсти вокруг шоу продолжают накаляться и это даже вызывает на континенте серьёзные политические волнения, что является очень редким в этих местах."
 GOI_event.2.a: "Победитель многим не понравится."
 
 GOI_event.3.t: "Окончательные результаты"
 GOI_event.3.desc: "Голоса подсчитаны, возможные вбросы предотвращены, и в итоге... Файри вышел победителем! За ним на втором месте оказалась Лифи с незначительным отставанием в количестве голосов. Результаты уже опубликованы, и реакция общественности пока что не ясна."
 GOI_event.3.a: "Что-ж, похоже что это конец."
 
 GOI_event.4.t: "Торжества"
 GOI_event.4.desc: "По случаю победы Файри, на Острове Мечты были проведены торжественные мероприятия. В это время, континентальный Гойки раздирают конфликты на политической почве. Простые недовольства победителем начали перерастать в настоящие политические манифестации и митинги. Но беспорядки же пройдут сами собой, верно?"
 GOI_event.4.a: "Гигант пробуждается."
 
 GOI_event.5.t: "Остров... Пропал?"
 GOI_event.5.desc: "Нет, этого не может быть. Пару часов назад Остров Мечты просто... Исчез? От него след простыл. Место, которое раньше было меккой Гойки, сейчас напоминает о себе лишь ограждающими стенами, по которым бьёт вода."
 GOI_event.5.a: "..."
 
 GOI_event.6.t: "Протесты перерастают в восстания!"
 GOI_event.6.desc: "Итак условно единый Гойки очень быстро погружается в пучину анархии. На окраинах континента уже провозглашаются местные органы управления. Похоже, что это конец..."
 GOI_event.6.a: "Будущее туманно."
 
 GOI_event.7.t: "Отчёт"
 GOI_event.7.desc: "'...Последними город покидали самые безнадёжные обджекты; Без ног и рук, с трещинами, погнутые, и прочие изувеченные этим тёмным временем. Все центры восстановления были уничтожены, либо находились под контролем бандитов, и никакой внятной помощи этим несчастным оказать было невозможно. Эвакуация проводилась в спешке и очень неорганизованно, особенно на финальных волнах, к примеру: в восточных окраинах, на выезде за одно только 20-е число было потеряно 17 грузовиков, 10 из них - украдены местными бандитами, а 7 - сожжены. Немного лучше ситуация на севере...'"
 GOI_event.7.a: "Интересный отрывок."
 
 GOI_event.8.t: "Битва за Гойки"
 GOI_event.8.desc: "Здесь и начинается наша история. Для начала, нужно выбрать один из множества осколков Гойки, который вы приведёте к величию.\n\n§RСТРОГО РЕКОМЕНДУЕМ ПОСТАВИТЬ ИГРУ НА ПАУЗУ!§!"
 GOI_event.8.a: "Поехали!"
 
 GOI_event.9.t: "Данная Страна Неиграбельна!"
 GOI_event.9.desc: "Эта страна пока что не имеет контента и не подразумевает наличие игрока. Мы рекомендуем выйти в главное меню и выбрать другую страну. Вы можете пропустить это предупреждение."
 GOI_event.9.a: "Пропустить"
 
 #NGRF
 WGF_event.1.t: "Революционный фронт"
 WGF_event.1.desc: "Удивительно, ведь буквально ещё пару месяцев назад он победил в голосовании, он должен был получить остров, но сегодня он тут. Файри часто задумывался о том, куда занесла его судьба. Вообще, он круто изменился в дни работы фронта. Где лифи? Куда пропал остров? Эти вопросы уже давно его не волнуют. Освобождение обджектов Гойки стало главной задачей его существования. Недолго налаженные отношения с Койни быстро прервались когда этот предатель бросил дело освобождения рабочих и сбежал на восток. Но ничего, все враги революции получат по заслугам."
 WGF_event.1.a: "Огонь не погаснет."
 
 WGF_event.2.t: "Дело #8"
 WGF_event.2.desc: "ЗАКЛЮЧЕНИЕ ПО ДЕЛУ #8 О ПРОПАЖЕ О.М.:\nПосле проведённых исследовательских работ, описанных на стр.9 этого документа и слушаний свидетелей становится неотрицаемой вина Лифи в утере народной собственности, приведшей к особо крупным экономическим потерям. Заседание суда по делу пройдёт в ближайшие несколько месяцев."
 WGF_event.2.a: "Да будет так."
 
 WGF_event.3.t: "Суд"
 WGF_event.3.desc: "'...Таким образом, несмотря на отсутствие обвиняемого на процессе, доказательная база стороны обвинения достаточна и неоспорима, чтобы вынести приговор обвиняемому по статьям 14.1, 16 и 51 законодательства социалистической республики, революционный суд выносит приговор..."
 WGF_event.3.a: "Смерть через сплющивание'"
 WGF_event.3.b: "Пожизненное заключение'"
 WGF_event.3.c: "Суд не будет выносить приговор."
 
 WGF_event.4.t: "Привет со снежного плато"
 WGF_event.4.desc: "Когда мы начали программу по установлению контактов с коммунистическими организациями по всему Гойки, мы совсем не ожидали того, что обнаружили в снежном плато. На юге, в заснеженных лесах с фашистским режимом Сноуболла ведут непримиримую борьбу анархо-коммунисты, возглавляемые Роки! Нашим делегатам устроили тёплый приём и мы смогли договориться о сотрудничестве с их партизанским движением. Была также выбрана дорога для поставок им снаряжения, невероятно сложная и длинная, но перед солидарностью с товарищами на далёком востоке не может быть никаких преград."
 WGF_event.4.a: "Они герои, хоть и заблуждаются."
 
 WGF_event.5.t: "Предложение"
 WGF_event.5.desc: "Интересная телеграмма поступила от коммунистов с севера: Они предлагают военное и техническое сотрудничество, которое 'очень необходимо для обоих наших государств в эти тёмные годы'. Хотя очевидна враждебность северян к нашему режиму, мы передадим решение по вопросу в СРП."
 WGF_event.5.a: "Под давлением левой фракции, предложение проходит."
 
 WGF_event.6.t: "Взгляд на восток"
 WGF_event.6.desc: "Теперь, когда наступление на Военный Округ стало лишь вопросом времени, прояснились многие вещи: Койни за время своего участия в строительстве Фронта изначально продвигал саботажные и вредные предложения. Не исключено также что он замысливал военный переворот. В любом случае, сейчас это уже не так важно."
 WGF_event.6.a: "Фиктивная дружба."
 
 WGF_event.7.t: "Победа!"
 WGF_event.7.desc: "Хунта Койни разгромлена! Наши пограничники успешно смогли продвинуться вглубь территории противника и захватить военные склады!"
 WGF_event.7.a: "Берите всё что сможете!"
 
 WGF_event.8.t: "Поражение"
 WGF_event.8.desc: "Наше наступление захлебнулось, и в итоге войска Военного Округа перешли в контрнаступление и захватили некоторые наши склады. Это тяжёлое поражение для наших молодых вооружённых сил и обджектов северного Гойки."
 WGF_event.8.a: "Мы ещё отомстим"
 
 WGF_event.9.t: "Переговоры"
 WGF_event.9.desc: "Хоть мы и добились некоторых успехов, операция в конце концов захлебнулась и фронт встал. В связи с этим начались переговоры и конфликт закончился ничьёй."
 WGF_event.9.a: "Хорошо."
 
 WGF_event.10.t: "Сигнал"
 WGF_event.10.desc: "Наши радиостанции уловили сигнал о запросе помощи, который шёл из Северного Гойки. Мы полагаем что это экспедиция, которая отправилась туда пол года назад. Должны ли мы выслать спасательный корабль?"
 WGF_event.10.a: "Отправьте транспортные суда на сигнал."
 WGF_event.10.b: "Не наши проблемы."
 
 WGF_event.11.t: "Экспедиция спасена"
 WGF_event.11.desc: "Наши корабли смогли успешно пересечь Канал Гойки и приплыть по координатам. Там мы обнаружили примерно 60 обджектов, которые были успешно доставлены обратно на континент."
 WGF_event.11.a: "Будет интересно послушать их истории."
 
 WGF_event.12.t: "Мы опоздали"
 WGF_event.12.desc: "Увы, но когда наши корабли подплыли к побережью, мы смогли обнаружить лишь несколько упаковок от пайков и следы. Судьба группы неизвестна."
 WGF_event.12.a: "Трата времени."
 
 WGF_event.14.t: "Блеск монеты"
 WGF_event.14.desc: "Постепенно пограничные конфликты переросли в полноценные сражения по всей линии фронта от пустыни до побережья канала. Наши войска переходят в наступление. Конфликт официально начался."
 WGF_event.14.a: "Так точно."
 
 WGF_event.15.t: "Суд над Койни"
 WGF_event.15.desc: "- Итак, обвиняемый, признаёте ли вы свою вину в военных преступлениях против обджектов Северного Гойки и против революции?\n- Пошёл к чёрту, Файри!\nПодсудимый внезапно выскачил из своего места в суде присяжных, подбежал к Файри и шлёпнул его по лицу, на что последовал ответный шлепок. Вскоре их разняли."
 WGF_event.15.a: "Как в старые добрые."
 
 WGF_event.16.t: "Цепи поставок разорваны!"
 WGF_event.16.desc: "После начала вторжения фашистов в Снежный Лес продолжать поставки Анархистам стало практически невозможно. К сожалению, нам придётся прекратить отправку винтовок этим товарищам."
 WGF_event.16.a: "Удачи им."
 
 WGF_event.17.t: "Разрыв отношений с Временным Правительством"
 WGF_event.17.desc: "Нам поступила телеграмма из Кэсленда. В результате, очевидно сфабрикованного, расследования, в рядах местной компартии были обнаружены наши ячейки. Это послужило причиной для прекращения дипломатических отношений с нами."
 WGF_event.17.a: "Когда мы войдём в Кэсленд, они даже не смогут отправить запрос о капитуляции?"
 
 WGF_event.18.t: "Подарок из Кэсленда"
 WGF_event.18.desc: "После печальных новостей о смещении социалистического режима в Кэсленде, наше правительство мало на что рассчитывало. Но, внезапно, было получено донесение о перебежчиках через границу со стороны Защитной Зоны. Обмотанный тряпками нарушитель границы и его сообщники предложили нам свои услуги."
 WGF_event.18.a: "Добро пожаловать."
 
 WGF_event.19.t: "Операция затягивается"
 WGF_event.19.desc: "Изначальный план разгрома Койни за шесть месяцев потерпел неудачу. Это вызывает серьёзные сотрясания в нашем обществе и рост недоверия к правительству. Наши ресурсы во многом истощились."
 WGF_event.19.a: "Надо спешить."
 
 WGF_event.20.t: "Разрыв отношений с Зелёными Равнинами"
 WGF_event.20.desc: "Правительство СРЗР объявило нас в 'ревизионизме' и разорвало с нами все связи. Это решение выглядит странно и глупо, но мы ничего не можем с этим поделать."
 WGF_event.20.a: "Идиоты."
 
 WGF_event.21.t: "Наша Ситуация"
 WGF_event.21.desc: "Файри уже как несколько недель сплотил вокруг себя государство и правительство, но так и не изложил своих взглядов на взятый курс. Но уже в течение ближайших часов это положение изменится. Он сидел в купе, ожидая прибытия, готовясь к своей речи. Файри был взловнован. Он прокручивал в голове все возможные сценарии его выступления и попивал свой кофе.\nЭти мысли забивали его рассудок, создавая впечатление неизбежности провала.\n\nВыходя из состава, Файри обнаружил вокруг себя толпу. Обджекты вокруг ждали, чего-то, чего он не мог понять. Осматривая платформу, он недоумевал. Вскоре он осознал, что эта масса жадно ждала его. Он был в центре, и обджекты желали его услышать."
 WGF_event.21.a: "Похоже, речь будет удачной."
 
 #Reich
 GGR_event.1.t: "За хребтом"
 GGR_event.1.desc: "Снежное Плато это чудесный регион с прекрасными обджектами, хоть и достаточно бедный. Он имеет некоторые особенности, например: Его население из-за изолированности достаточно сильно сплочено и имеет единообразную, особенную культуру, в отличие от других регионов Южного Гойки. Он отличается особой автономией и не так сильно зависит от внешней торговли..."
 GGR_event.1.a: "Этому региону нужна сильная рука."
 
 GGR_event.2.t: "Снежный статус-кво"
 GGR_event.2.desc: "'Смерть анархистам!' - Именно на этом Сноуболл закончил своё выступление перед бойцами впервые созданного ополчения. Сомнения накапливались в нём и, словно он сам, скатывались в большой снежный ком. Анархисты занимают деревню за деревней, а его поддержка в народе мала. Но одно он знал точно:"
 GGR_event.2.a: "Наш дух не сломать."
 
 GGR_event.3.t: "Резня в Вальде"
 GGR_event.3.desc: "Вальд, один из немногих лесных населённых пунктов который остался под контролем Рейха, подвергся 'акту возмездия' со стороны ультранационалистических батальонов. По первоначальным данным, по подозрениям в сотрудничестве с подпольем было убито 506 обджектов всех полов и возрастов. Убитые скидывались в кучи и сжигались. Те, кого сжечь было нельзя, просто скидывались в канавы и ямы. Этот инцидент войдёт в историю Снежного Плато как один из самых жестоких."
 GGR_event.3.a: "Бывают и перегибы."
 
 GGR_event.4.t: "Последний рывок"
 GGR_event.4.desc: "Эти проклятые анархисты, национал-предатели, которые пытались подорвать единство Снежного Плато. Скоро они ответят за свои деяния по справедливости, осталось лишь нанести финальный удар. Грасси погружался в размышления, которые будоражили его разум. Он вступил в местный отряд Белорубашечников достаточно давно и показал примерную дисциплину. Он пока ещё не знает о своём повышении."
 GGR_event.4.a: "Рука, которая положит конец анархии."
 
 GGR_event.5.t: "Сопротивление подавлено"
 GGR_event.5.desc_1: "Мы успешно подавили сопротивление в регионе Шнеехорн и теперь он находится под нашим полным контролем."
 GGR_event.5.desc_2: "Мы успешно подавили сопротивление в регионе Снежные Равнины и теперь он находится под нашим полным контролем."
 GGR_event.5.desc_3: "Мы успешно подавили сопротивление в регионе Снежные Холмы и теперь он находится под нашим полным контролем."
 GGR_event.5.desc_4: "Мы успешно подавили сопротивление в регионе Нижнее Плато и теперь он находится под нашим полным контролем."
 GGR_event.5.a: "Отличная работа."
 
 GGR_event.6.t: "Революционный Фронт заявляет о поддержке Анархистов!"
 GGR_event.6.desc: "Режим Файри на севере, несмотря на разногласия в государственном строительстве, сумел договориться о линии поставок снаряжения для Анархистов Снежного Плато. Хоть и РФСГ достаточно далёк от Снежного Плато географически, это сильно подняло моральный дух Анархистов у нас в тылах."
 GGR_event.6.a: "Проклятье!"
 
 GGR_event.7.t: "Проблема с Анархистами"
 GGR_event.7.desc: "Далеко не все согласились с нашими... Достаточно радикальными методами правления, и это создаёт нам множество трудностей. Национал-предатели сформировались с коммуны и укрылись в лесах на юге, практически полностью их контролируя. Мало того, они пропагандируют свои разлагающие идеи и среди обджектов нашего великого Снежного Государства в северных регионах. Если мы не решим это проблему в ближайшие годы, то судьба Снежного Плато останется под вопросом."
 GGR_event.7.a: "Хайль Сноуболл!"
 
 GGR_event.8.t: "Записки Сноуболла"
 GGR_event.8.desc: "Интересно, то что в последние месяцы Снежного Рейха, Сноуболл даже научился писать, и вёл некоторое подобие 'дневника'. Записи в нём, под стать времени, с каждым днём становились всё безысходней и безысходней. Когда из-под контроля Рейха ушли сначала Снежные Холмы, а потом и Северные Регионы, Сноуболл написал короткое послание для своих последователей. Оно послужило своеобразным 'манифестом' для оставшихся сил в Шнеехорне. После написания, Сноуболл, вероятно, отправился в бой с одним из своих элитных отрядов и погиб."
 GGR_event.8.a: "Отбоя не было. Борьба продолжается."
 
 GGR_event.9.t: "Опасность восстания устранена!"
 GGR_event.9.desc: "Последний очаг сопротивления в нашем тылу был успешно уничтожен, и теперь мы можем полностью переместить наш взор в сторону внешней политики."
 GGR_event.9.a: "Отличные новости."
 
 GGR_event.10.t: "Выгодное уничтожение...?"
 GGR_event.10.desc: "Через несколько недель после создания первого концентрационного лагеря в районе Снежных Холмов, один из директоров местного производственного предприятия приехал в Шнеехорн, чтобы предложить... Небольшие отчисления государству в обмен на бесплатный труд заключённых концлагеря. Хоть и сегрегированные обджекты в основном не имеют рук, это не помешает принудить их к работе."
 GGR_event.10.a: "Бизнес идёт хорошо."
 
 GGR_event.11.t: "Некоторые неопределённости"
 GGR_event.11.desc: "- Какого чёрта эта дорога перекрыта!?\n\n- Определённых причин не дано, но проезжать здесь строго запрещено.\n\n- Да мне плевать, у меня срочная встреча в Шнеехорне, открой этот шлагбаум немедленно, иначе у тебя будут большие проблемы в рейхсорднунге!\n\n- ...Простите, сэр, но я загоню себя под трибунал, если это сделаю. Это приказ с самых верхов.\n\nРаздражённый собеседник, окончательно взбесившись, вдавил педаль в пол и пробил шлагбаум, устремившись вдаль."
 GGR_event.11.a: "Открывайте огонь!"
 
 GGR_event.12.t: "Пересечение линии"
 GGR_event.12.desc: "В 4 часа утра наши войска перешли условную границу в виде реки Сноуривер и заняли працдармы в Снежном Лесу. Анархисты явно не ожидали настолько быстрого вторжения и готовят оборону. Битва за Снежное Плато начинается."
 GGR_event.12.a: "Вперёд!"
 
 GGR_event.13.t: "Массовое дезертирство!"
 GGR_event.13.desc: "Мы столкнулись с большой проблемой: Тыловые и резервные части предательски и вероломно перешли на сторону противника, подвергнувшись его пропаганде. Это значительно бьёт по нашим тылам и может привести к разрушению фронта."
 GGR_event.13.a: "Предатели!"
 
 #PROVISIONAL GOVERNMENT
 GPG_event.1.t: "Беспорядок"
 GPG_event.1.desc: "Очередной день в совете. Очередная перепалка между Руби и Тако по какому-то мелкому вопросу. Расширение военного налога, кажется?... В любом случае, это имеет мало значения. Неделя за неделей правительство тянет время и не принимает никаких решений, которые могли бы вытащить Центральный Гойки из этого бедственного положения. Фракционщина поразила все слои общества и Кэсленд пребывает в тяжёлом положении..."
 GPG_event.1.a: "Съезд близится к открытию."
 GPG_event.1.b: "Я хочу знать больше о фракциях."
 
 GPG_event.2.t: "Переходное Правительство"
 GPG_event.2.desc: "Представляет собой нынешний кабинет правительства. Достаточно нейтральная и неактивная фракция. Фактически, формирование единого правительства Зелёных Равнин и сохранение некоторой стабильности - заслуга этой фракции. Самым ярким и пассионарным её членом в данный момент является Клок, который и возглавляет кабинет."
 GPG_event.2.a: "Сохранение стабильности - приоритет."
 
 GPG_event.3.t: "Демократическая Фракция"
 GPG_event.3.desc: "Открыто либеральная организация. Её участники нацелены на частичное восстановление анархичной экономической модели Гойки, а также на формирование федеративного устройства южного континента. Явного лидера у этой фракции нет, однако наиболее сильно выделяются Тако, Бук и Бэрф бэг."
 GPG_event.3.a: "(А ещё их спонсирует альянс)"
 
 GPG_event.4.t: "Рабочий Фронт"
 GPG_event.4.desc: "Открыто революционная фракция, ни раз призывавшая к вооружённым восстаниям. В ней имеется несколько крыльев, но всё же общая цель - переустройство государства на общественных началах. Генеральный секретарь фракции - Руби."
 GPG_event.4.a: "Рабочие Гойки, объединяйтесь!"
 
 GPG_event.5.t: "Железная Рука"
 GPG_event.5.desc: "Пожалуй, самая военизированная фракция во всём правительстве. Сформированная из множества организаций разного толка на волне наступления анархии, фракция отстаивает консервативные и реакционные позиции в правительстве. Управление происходит кулуарно в так называемой 'Железной Тройке', которая состоит из Фанни, Пиллоу и Никеля."
 GPG_event.5.a: "Гойки, Единый и Неделимый!"
 
 GPG_event.6.t: "Клок убит!"
 GPG_event.6.desc: "Сегодня в Кэсленде произошёл случай, который отразится на всей стране. Лидер кабинета правительства, глава нейтральной фракции, Клок, погиб в результате покушения представителя радикального крыла демократической фракции. Убийство было произведено молоточком, которым был пробит стеклянный корпус. В данный момент кабинет обезглавлен и пребывает в прострации. Исполняющим обязанности главы кабинета была временно выбрана Пай."
 GPG_event.6.a: "Кризис обостряется."
 
 GPG_event.7.t: "Фракции требуют открытия съезда!"
 GPG_event.7.desc: "Правительственный кризис продолжает обостряться. В связи с этим, три из четырёх фракций потребовали провести чрезвычайное открытие второго съезда заранее намеченного срока для разрешения вопросов управления."
 GPG_event.7.a: "У нас нет выбора."
 
 GPG_event.8.t: "Начало съезда"
 GPG_event.8.desc: "Улицы Кэсленда под охраной, здание совета подготовлено, всё готово для начала заседания фракций. Самые острые вопросы будут поочерёдно решаться на съезде, под конец которого должна быть достигнута стабильность."
 GPG_event.8.a: "Пора собираться!"
 
 GPG_event.9.t: "Вопрос о Клоке"
 GPG_event.9.desc: "Итак, первым вопросом, который должен разрешить съезд, станет покушение на главу кабинета. Ещё до конца не понятно, стоял ли кто-то крупнее за спиной активиста-левого демократа. Съезд должен принять решение о расследовании, однако, мы можем немного поиграть фактами и обвинить в этом коммунистов и демократов, что скажется на их позициях в совете."
 GPG_event.9.a: "Очевидно, виноваты коммунисты."
 GPG_event.9.b: "...Этот анархист действовал сам по себе, мы не будем пустословить."
 
 GPG_event.10.t: "Коммунисты и демократы опровергают свою причастность!"
 GPG_event.10.desc: "В результате независимого расследования выяснилось, что налётчик, убивший главу кабинета, даже не имел партийного билета и назвался демократом лишь для красивого словца. Так же очевидно, что он имеет психические расстройства. Но это уже неважно, ведь коммунисты пошли в контратаку и обвинили действующее правительство в намеренных провокациях."
 GPG_event.10.a: "Фрайс попытался оспорить обвинение, но ему нечего было ответить."
 
 GPG_event.11.t: "Вопрос о председателе"
 GPG_event.11.desc: "Второй темой заседания станет и/о главы кабинета. Ни для кого не секрет, что Пай не очень уж и подходит под эту роль. Фрайс выдвинул свою кандидатуру на этот пост. Что скажет совет?"
 GPG_event.11.a: "Фрайс проходит!"
 GPG_event.11.b: "Пай сумела защитить свой пост."
 
 GPG_event.12.t: "Вопрос об острове"
 GPG_event.12.desc: "Как ни что другое в Кэсленде сейчас стоит вопрос о средствах, которые были потрачены на постройку Острова Мечты. Огромные деньги исчезли в пустоту, и, это нанесло сильнейший удар по экономическому сердцу континента. На повестку съезда был поставлен вопрос о частичной выплате компенсаций инвесторам. Многие считают это необходимой мерой, но также есть мнение, что экономика Гойки сможет зализать раны сама собой, а выплата компенсаций порежет итак невероятно малый бюджет. Что изберёт конгресс?"
 GPG_event.12.a: "Компенсациям - быть!"
 GPG_event.12.b: "Съезд отклоняет предложение."
 
 GPG_event.13.t: "Вопрос о обороне"
 GPG_event.13.desc: "Пока республика находится в состоянии кризиса, необходимо обеспечить её безопасность от внешней угрозы. Именно этот вопрос был поставлен на съезде. Было решено выделить часть бюджета на постройку оборонительных рубежей на внешних границах. Но этих средств явно не хватает, чтобы обеспечить сильную оборону на всех участках. Съезд должен выбрать приоритетное направление."
 GPG_event.13.a: "Следует защитить железную дорогу на севере."
 GPG_event.13.b: "Следует защитить добывающие предприятия на востоке."
 GPG_event.13.c: "Радикалы на юге представляют наибольшую угрозу."
 
 GPG_event.14.t: "Вопрос о Кэсленде"
 GPG_event.14.desc: "После создания правительства коллективно было принято решение о запрете действий военных организаций и допуска в город армейских формирований. Но сегодня многие ставят вопрос о вводе войск в город ради поддержания порядка. Мы можем принять это решение, но оно вызовет яростный протест у многих заседателей."
 GPG_event.14.a: "Нет!"
 GPG_event.14.b: "Первый государственный патруль с фанфарами входит в Кэсленд"
 
 GPG_event.15.t: "Вопрос о шахтах"
 GPG_event.15.desc: "Представители Рабочего Фронта потребовали от правительства национализации разорённых после кризиса шахт в восточной части страны для их спасения. Принятие этого предложения может вызвать серьёзные протесты у других фракций. Как поступит съезд?"
 GPG_event.15.a: "Принять."
 GPG_event.15.b: "Пусть разбираются сами."
 
 GPG_event.16.t: "Вопрос о конституции"
 GPG_event.16.desc: "С самого создания республики она тонула в анархии и законодательном хаосе. Время пришло. Об этом говорят все фракции, об этом говорит кабинет, и вот, наконец, вопрос был поставлен. Был выдвинут проект конституции, разработанный представителями от всех четырёх фракций."
 GPG_event.16.a: "Да здравствует республика!"
 GPG_event.16.b: "§RСъезд принимает решение повременнить с конституцией...§!"
 
 GPG_event.17.t: "Фракции голосуют за конституцию!"
 GPG_event.17.desc: "Несмотря на вынесенное решение правительства, фракции всё равно продолжают голосовать за конституцию, бойкотируя решение кабинета. Уже начинают выдвигаться ультиматумы правительству о немедленном её принятии."
 GPG_event.17.a: "Просто игнорируйте их."
 
 GPG_event.18.t: "Коммунисты и демократы выходят из совета!"
 GPG_event.18.desc: "Отказ принятия конституции привёл к массовым протестам заседающих этих двух фракций, в результате чего было принято решение о покидании и бойкоте съезда. В таких условиях совет больше не может продолжать свою работу."
 GPG_event.18.a: "Мы обойдёмся без них."
 
 GPG_event.19.t: "Вооружённые восстания!"
 GPG_event.19.desc: "В результате краха съезда и разобщения фракций, по всему государству начались восстания: Правые мобилизовали вооружённые отряды, ячейки коммунистов берут под контроль шахты и так далее. В связи с этим объявлено военное положение и совет прекращает свою работу."
 GPG_event.19.a: "Конец республики."
 
 GPG_event.20.t: "Крах"
 GPG_event.20.desc: "В результате кризиса местной демократии, окраины откололись от центрального правительства и объявили своей целью взятие Кэсленда. Битва за будущее Гойки разворачивается здесь."
 GPG_event.20.a: "Временное правительство восстановит стабильность!"
 GPG_event.20.b: "Рабочие Гойки, объединяйтесь!"
 GPG_event.20.c: "Демократы восстановят республику!"
 GPG_event.20.d: "Железная Рука установит порядок!"
 
 GPG_event.21.t: "Государственный переворот!"
 GPG_event.21.desc: "Железная Рука, пользуясь своим особенным положением в вооружённых силах, при помощи милицейских гарнизонов в Кэсленде сумела практически без сопротивления взять под контроль город! Правительство бежало на запад, и, это, вероятно, означает коллапс совета и государственного кабинета."
 GPG_event.21.a: "О моя булочная!"
 
 GPG_event.22.t: "Радикалы пользуются слабостью правительства!"
 GPG_event.22.desc: "В результате... Не лучших решений съезда, популярность кабинета сильно упала, и радикальные группы воспользовались этим, начав бойкотировать решения кабинета и оспаривать его положение. В таких условиях совет не может продолжать свою работу."
 GPG_event.22.a: "Это приведёт к тяжёлым последствиям."
 
 GPG_event.23.t: "Успешное завершение съезда"
 GPG_event.23.desc: "Чудесная работа! Кабинету удалось сохранить стабильность в государстве и консенсус по основным вопросам был успешно найден! Республика движется вперёд, и её обджекты счастливы."
 GPG_event.23.a: "Вперёд, Гойки!"
 
 GPG_event.24.t: "Контратака"
 GPG_event.24.desc: "Итак, стабильность восстановлена, но это только начало. Мы выиграли время, и теперь, нам нужно разобраться с радикальной оппозицией и сделать это так, чтобы не вызвать волнений, до того, как эти радикалы не дестабилизируют государство вновь."
 GPG_event.24.a: "Нужно действовать быстро."
 
 GPG_event.25.t: "Поджог совета!"
 GPG_event.25.desc: "Этой ночью, группа злоумышленников проникла в окрестности Кэсленда и под покровом тьмы зашла в центр города, где совершила поджог здания Совета Рекомендованных Персонажей с целью госпереворота. Один из них был задержан с партбилетом Рабочего Фронта. Наша доблестная полиция немедленно взяла всё управление Рабочего Фронта под стражу и их ожидает разбирательство."
 GPG_event.25.a: "Пришло время суда."
 
 GPG_event.26.t: "Речерндский процесс"
 GPG_event.26.desc: "По результатам судебного заседания в Речернде, была безусловно доказана вина коммунистов в поджоге государственного сооружения. Все они получили сроки, и, теперь, Рабочий Фронт фактически обезглавлен."
 GPG_event.26.a: "Отличная работа."
 
 GPG_event.27.t: "Демократы восстают в зелёных равнинах!"
 GPG_event.27.desc: "Демократы, при поддержке Республики Зелёных Равнин, сумели занять север страны и установить там свой режим. Мы должны уничтожить их."
 GPG_event.27.a: "Мы с этим разберёмся."
 
 GPG_event.28.t: "Коммунисты берут под контроль шахты!"
 GPG_event.28.desc: "В результате не самой ловкой политики нашего правительства в отношении радикалов, фракция Рабочего Фронта сумела получить полную поддержку в рядах рабочих восточных шахт и установить там социалистический режим. Теперь в дело вступают войска."
 GPG_event.28.a: "В бой!"
 
 GPG_event.29.t: "Штурмовики занимают Речернд!"
 GPG_event.29.desc: "Железная Рука, почувствовав полную безнаказанность со стороны правительства, решилась на вооружённое восстание и заняла второй по размеру город страны. Мы должны немедленно задушить это восстание!"
 GPG_event.29.a: "Верните Речернд!"
 
 GPG_event.30.t: "Фрайс принимает военное командование"
 GPG_event.30.desc: "Пришло время дать вооружённый отпор мятежникам. Фрайс вступает в должность военачальника для защиты Гойки от радикалов."
 GPG_event.30.a: "Вперёд!"
 
 GPG_event.31.t: "Республика оккупирует Лэвнленд!"
 GPG_event.31.desc: "Воспользовавшись нестабильностью в правительстве после недавнего принятия конституции, правительство Гринпорта приняло решение ввести война в приграничные территории для 'защиты своих границ'. Это беспрецедентный акт агрессии, но, пока что, мы не можем ничего сделать."
 GPG_event.31.a: "Сволочи."
 
 GPG_event.32.t: "Запрет фракций"
 GPG_event.32.desc: "Второй Съезд продолжил работу, будто ничего не произошло. Не волновала съезд как прошедшая кровавая гражданская война, так и отсутствие двух третей бывших заседавших. Первым документом, который принял новый кабинет, стал запрет фракционизма. После пятиминутного обсуждения, он абсолютно буднично был подписан, словно обычный месячный доходный отчёт, и съезд продолжил спокойный разбор следующего вопроса."
 GPG_event.32.a: "Как в тумане."
 
 GPG_event.33.t: "Конституция Гойки"
 GPG_event.33.desc: "Мы, обджекты разных форм и размеров, скреплённые славными историческими узами, великим экономическим и политическим единством обджектов всего Гойки, веря в равноправие, справедливость и свободу, собрались в Кэсленде, чтобы составить КОНСТИТУЦИЮ ГОЙКИ.\n\nГлава 1. Основы конституционного строя.\nСтатья 1..."
 GPG_event.33.a: "...Эта редакция отличается"
 
 GPG_event.34.t: "Начало переговоров"
 GPG_event.34.desc: "Сегодня в Кэсленд из Гринпорта прибыла уполномоченная группа дипломатов для урегулирования вопроса Лэвнленда. Первое заседание было назначено на завтра. Результаты переговоров определят наш будущий курс."
 GPG_event.34.a: "Пакуйте чемоданы!"
 
 GPG_event.35.t: "Полная победа!"
 GPG_event.35.desc: "Наши дипломаты смогли перехватить инициативу на переговорах и уличили Гринпорт в неоправданной агрессии. Их миссия полностью капитулировала перед нашими требованиями и согласилась на передачу Лэвнленда."
 GPG_event.35.a: "Великолепная работа!"
 
 GPG_event.36.t: "Полный провал."
 GPG_event.36.desc: "Прибывшие в Кэсленд дипломаты мало того что отказались идти на какие-либо уступки, так ещё и обвинили нашу сторону в подготовке агрессии, и требуют демилитаризации приграничных районов. Наши представители потерпели полное поражение, и перед нами стоит выбор."
 GPG_event.36.a: "Капитулировать перед их требованиями."
 GPG_event.36.b: "Мы не вынесем такого позора. Начать операцию 'Горящая Трава'."
 
 GPG_event.37.t: "Тупик."
 GPG_event.37.desc: "В результате накаления переговоров и чрезмерного меренья силами вооружённых сил, вопрос о Лэвнленде попал в тупик. Отношения между нами и Республикой невероятно накалены, и нам не следует ждать, пока они ударят нам в спину."
 GPG_event.37.a: "Начать операцию 'Горящая Трава'."
 
 GPG_event.38.t: "Статус-кво"
 GPG_event.38.desc: "В результате затяжных переговоров, нашим дипломатам не удалось в каком-либо виде получить одобрение на возвращения Лэвнленда. Однако, сторона Гринпорта согласилась выплатить крупную компенсацию в нашу пользу."
 GPG_event.38.a: "Не лучший итог."
 
 GPG_event.39.t: "Возвращение Лэвнленда!"
 GPG_event.39.desc: "Наши дипломаты смогли успешно договориться об окончании оккупации Лэвнленда. С некоторыми условиями, граница вернулась к прежнему виду."
 GPG_event.39.a: "Отлично!"
 
 GPG_event.40.t: "Конец переговоров"
 GPG_event.40.desc: "Сегодня дипломаты Республики покинули Кэсленд, что знаменует окончание дипломатической миссии и переговоров по Лэвнленду. Наше правительство вступает в следующий этап."
 GPG_event.40.a: "Вперёд!"
 
 GPG_event.41.t: "Демилитаризация Лэвнленда"
 GPG_event.41.desc: "Наши дипломаты смогли успешно убедить правительство Гринпорта в выводе войск из приграничного региона на время переговоров. Это наша большая дипломатическая победа."
 GPG_event.41.a: "Отлично."
 
 GPG_event.42.t: "Отказ"
 GPG_event.42.desc: "Дипломаты из Республики отказались в какой-либо форме проводить демилитаризацию Лэвнленда. Это сильно наколило переговоры, и, возможно, говорит о подготовке агрессии в нашу сторону."
 GPG_event.42.a: "Чёрт."
 
 GPG_event.43.t: "Протесты в Лэвнленде"
 GPG_event.43.desc: "Обджекты приграничных провинций, захваченных Республикой, массово выходят на протесты против оккупации. Мы можем поддержать их, однако это накалит обстановку. Что мы будем делать?"
 GPG_event.43.a: "Пусть протестуют."
 GPG_event.43.b: "Спонсируйте их!"
 
 GPG_event.44.t: "Восстановление правительства"
 GPG_event.44.desc: "Теперь, когда стабильность окончательно восторжествовала в Кэсленде, Переходное Правительство в виде главенствующего кабинета может обратно передать полномочия исполнительной власти к съезду и совету."
 GPG_event.44.a: "Отлично."
 
 GPG_event.45.t: "Идея о нижней палате"
 GPG_event.45.desc: "Всё время своего существования в Совет допускались лишь обджекты, которые когда-либо были показаны в БЗОМ. Это создавало разлад и определённую сегрегацию в нашей республике. Однажды, на Втором Съезде, Тако говорила о создании Нижней Палаты Совета, в которую могли бы быть допущены любые обджекты. Вчера, Съездом было принято решение о разработке плана создания Нижней Палаты и определения схемы её работы. Однако, решение о её создании, вероятно, будет принято лишь на Чётвертом Съезде."
 GPG_event.45.a: "Интересно."
 
 GPG_event.46.t: "Республика предлагает переговоры"
 GPG_event.46.desc: "Сегодня из Гринпорта нашему правительству была передана телеграмма с предложением 'урегулирования вопроса по Лэвнленду'. В Кэсленде между нашими дипломатами будет проведена конференция, которая определит судьбу региона. Мы не можем упускать такой шанс."
 GPG_event.46.a: "Пусть приезжают."
 
 GPG_event.47.t: "Ветер меняет направление!"
 GPG_event.47.desc: "Занятие Пай должности председателя не понравилось и некоторым нашим генералам. Клауди подал в отставку из-за \"отвращения к правительству\". Похоже, он не будет на нашей стороне."
 GPG_event.47.a: "Интересно..."
 
 GPG_event.48.t: "Промышленное сотрудничество с Технократами"
 GPG_event.48.desc: "Правительство Анонсерграда продолжает расширение сотрудничества с нами: они предлагают отправить своих научных специалистов в обмен на получение опыта из нашей промышленности. Это достаточно выгодное предложение."
 GPG_event.48.a: "Конечно!"
 
 GPG_event.49.t: "Открытие границ с Технократами"
 GPG_event.49.desc: "Правительство Анонсерграда предложило взаимное ослабление пограничного контроля между нашими государствами. Это сильно повысит торговлю между Анонсеградом и Кэслендом и в общем улучшит коммуникацию между нами."
 GPG_event.49.a: "Отлично!"
 
 GPG_event.50.t: "Пакт Взаимопомощи с Анонсерградом!"
 GPG_event.50.desc: "Мы уже достаточно долго сотрудничаем с Технократической Республикой. Итогом этого стал договор о взаимозащите от агрессоров и интервентов! Вполне возможно, что это дружественное действие приведёт в будущем к ещё большему сотрудничеству между нашими государствами."
 GPG_event.50.a: "Вместе мы сильнее!"
 
 GPG_event.51.t: "Дипломатия с Анонсерградом"
 GPG_event.51.desc: "Недавно мы отправили переговорщиков в Анонсерград для установления отношений с местным правительством. Похоже, что они вернулись с хорошими новостями: технократическое правительство совсем не против вести с нами дела. Возможно, это даёт начало нашему долгому плодотворному сотрудничеству."
 GPG_event.51.a: "Мозг и сердце Гойки снова друзья?"
 
 GPG_event.52.t: "Сброс старых обязательств"
 GPG_event.52.desc: "Острова Мечты больше не существует. Старое правительство переформировано, и нам нет никакого смысла пытаться рассчитываться по монструозным прежним долгам. Пришло время шагнуть в новую эру Кэсленда без этого позорного ярма экономического краха и безответственности."
 GPG_event.52.a: "Вперёд!"
 
 #GDR
 GDR_event.1.t: "Битва за Демократию"
 GDR_event.1.desc: "Временное правительство своими решениями показало своё стремление к установлению диктатуры, и мы были вынуждены поднять винтовки ради своей свободы и свободы обджектов Гойки. Противники демократии должны быть разгромлены сегодня, или мы обречены на очередной авторитарный режим."
 GDR_event.1.a: "Вперёд!"
 
 GDR_event.2.t: "Возвращение Республики"
 GDR_event.2.desc: "Обджекты Кэсленда торжествуют приход демократии, а съезд вновь готовится продолжать свою работу в новом составе. Нам предстоит долгая работа по возвращению к нормальной жизни."
 GDR_event.2.a: "За дело!"
 
 GDR_event.3.t: "Третий Съезд"
 GDR_event.3.desc: "Впервые после жестоких боёв за Кэсленд, здание Совета озарилось ярким солнцем Гойки. Обджекты вновь собрались здесь для продолжения демократической традиции этого славного города в сердце континента. Теперь перед ними стоит огромный массив работы; разрушения, принесённые братоубийственной войной и огромные долги перед Гринпортом, политический кризис демократического правительства и другие проблемы, которые необходимо скорейше решить."
 GDR_event.3.a: "Для лучшей жизни обджектов!"
 
 GDR_event.4.t: "Выборы"
 GDR_event.4.desc: "Республике нужен президент, сильная личность, которую будут поддерживать наши обджекты. Пришло время для ликвидации коллективного руководства и выборов."
 GDR_event.4.a: "Я буду голосовать!"
 
 GDR_event.5.t: "Результаты"
 GDR_event.5.desc: "Итак, голоса подсчитаны. Пришло время объявить результаты голосования. С небольшим отрывом в первом туре первый президентский срок Республики выиграла..."
 GDR_event.5.a: "...Тако!"
 GDR_event.5.b: "...Бук!"
 GDR_event.5.c: "...Барф Бэг!"
 
 GDR_event.6.t: "Всеобщий Кризис"
 GDR_event.6.desc: "[GDR_GETLEADERNAME] разглядывала граффити на стенах разрушенного здания в окраине Кэсленда. Среди них было много экстремистских, угрожающих. Вся страна находится в упадке. Ужасающая гражданская война разрушила страну и вогнала обджектов в нищету."
 GDR_event.6.a: "Пора начинать действовать."
 
 GDR_event.7.t: "Новая жизнь"
 GDR_event.7.desc: "Дрилли в одиночестве бродил по ночным переулкам. Далеко занесла его гражданская война. После закрытия университета он перебивался чем мог и пару раз был на грани смерти. Его завербовали в анархистское подполье; он наделал много глупостей за эти месяцы. Всё больше и больше он начинал понимать маргинальность своего положения. Окончательно переломила его новость об открытии университета.\n\n- Пора с этим кончать.\n\nОн поклялся завтра же продолжать учиться."
 GDR_event.7.a: "Всплывая вверх, главное не порвать лёгкие."
 
 GDR_event.8.t: "Гринпортское Соглашение"
 GDR_event.8.desc: "Отличные новости! Республика идёт нам на уступки, и освободила нам от выплаты большей части долга. Теперь мы можем вздохнуть спокойно."
 GDR_event.8.a: "Отлично!"
 
 GDR_event.9.t: "Открытие Демократического Съезда"
 GDR_event.9.desc: "Теперь, когда важнейшие внутренние проблемы улажены, между Гринпортом и Кэслендом нет разногласий. Остро встаёт вопрос о сливании в единую Демократическую Федерацию. Обджекты по всем Зелёным Равнинам выходят на митинги и требуют объединения. Сегодня в Кэсленд прибыла делегация из Республики для начала переговоров. В воздухе застыл главный вопрос: где будет столица..."
 GDR_event.9.a: "...Кэсленд или Гринпорт?"
 
 GDR_event.10.t: "Лэвнлендский Референдум"
 GDR_event.10.desc: "Теперь, когда между демократическими правительствами нет разногласий, пришло время закончить оккупацию Лэвнленда и провести всенародный референдум."
 GDR_event.10.a: "Пора возвращаться домой."
 
 GDR_event.11.t: "Лэвнленд возвращается"
 GDR_event.11.desc: "По итогам голосования, 93,9% обджектов единодушно высказались за возвращение к нам. Гринпорт заканчивает оккупацию и передаёт приграничные территории обратно."
 GDR_event.11.a: "Торжество демократии!"
 
 GDR_event.12.t: "Окончание Демократического Съезда"
 GDR_event.12.desc: "Подошли назначенные сроки, и судьба Зелёных Равнин решена. Обджекты приняли своё решение, и пришло время узнать, каково же оно."
 GDR_event.12.a: "И весь Гойки замер."
 
 GDR_event.13.t: "Федерация!"
 GDR_event.13.desc: "Мечты о равноправном союзе сегодня стали реальностью. Гринпорт и Кэсленд объединяются в свободную федерацию, и обджекты Зелёных Равнин вновь едины."
 GDR_event.13.a: "Лучший исход."
 
 GDR_event.14.t: "Унификация"
 GDR_event.14.desc: "В результате Съезда было принято решение о присоединении к Республике Зелёных Равнин. Хоть нам и не удалось добиться федерации, но, по крайней мере, демократические ценности сохранены."
 GDR_event.14.a: "Теперь столица в Гринпорте."
 
 #GSR
 GSR_event.1.t: "Освобождение шахт"
 GSR_event.1.desc: "Рабочие одной из железодобывающих шахт ликовали, слушая речь Руби. Наконец-то, они были освобождены от 12-часового рабства в пещерах. 'Но это ещё не конец!' - Воскликнула Руби. Обджекты должны продолжать борьбу, чтобы сохранить свои завоевания."
 GSR_event.1.a: "И в Кэсленде будет веяться Красное Знамя!"
 
 GSR_event.2.t: "Что теперь?"
 GSR_event.2.desc: "Революционные силы под предводительством Руби смогли разгромить реакционеров на западе и установили свою власть над всем Кэслендом. Но, за время гражданской войны, армия наполнилась волонтёрскими вооружёнными формированиями, движимыми анархическими идеалами, которые начали требовать для себя открытого представительства. Какой путь изберёт правительство?"
 GSR_event.2.a: "Руби даёт добро на разгром волюнтаристов!"
 GSR_event.2.b: "Коммуны перехватывают инициативу!"
 
 GSR_event.3.t: "Арест Желатина"
 GSR_event.3.desc: "Чёрный воронок подъехал абсолютно внезапно. Амбициозного Желатина уже давно подозревали в спонсировании подпольной деятельности анархистов. Ранним утром следующего дня, все стейкхаусы перешли под контроль государства."
 GSR_event.3.a: "Больше его никто не видел."
 
 GSR_event.4.t: "Разгром анархистов"
 GSR_event.4.desc: "Кэслендский процесс показал всю сущность анархического движения и позволил нам окончательно задавить этих ревизионистов. Все серьёзные отряды контрреволюции в нашем тылу были разбиты, и теперь Кэсленд может спать спокойно."
 GSR_event.4.a: "Да здравствует революция!"
 
 GSR_event.5.t: "Анархисты занимают Кэсленд!"
 GSR_event.5.desc: "В результате недолгого столкновения при подавляющем численном превосходстве отряды анархистов выбили революционные бригады из Кэсленда и других городов Зелёных Равнин. Анархические советы провозглашают свою власть по всей территории государства. Анархия приходит в Кэсленд."
 GSR_event.5.a: "Но, в этот раз, анархия спасёт его."
 
 GSR_event.6.t: "Подготовка к первому съезду"
 GSR_event.6.desc: "Ситуация в Зелёных Равнинах немного устаканилась. Социалистический строй окончательно утвердился в Кэсленде, и пришло время дать нашим обджектам настоящие реформы. С этой целью начинается первый съезд реформированной Коммунистической Партии Зелёных Равнин, который поставит все точки над i."
 GSR_event.6.a: "Собираемся!"
 
 GSR_event.7.t: "Сопротивление переселению"
 GSR_event.7.desc: "Наша политика вызвала... некоторые протесты в обществе. Обджекты массово отказываются освобождать свои дома в Кэсленде и уезжать на холмы. Многие уже переселённые рванулись обратно в город, чтобы спасти своё жильё. Всё это создаёт серьёзные неудобства."
 GSR_event.7.a: "Временные трудности."
 
 GSR_event.8.t: "Производство сахара"
 GSR_event.8.desc: "Руби с сияющей улыбкой в быстром темпе обходила новый цех производства сладких мармеладок. Это имеет для неё огромное значение, ведь каждый обджект Кэсленда должен иметь право на сладости!"
 GSR_event.8.a: "Сладкая жизнь."
 
 GSR_event.9.t: "Сопротивление культурной политике"
 GSR_event.9.desc: "Отторжение многими обджектами нашей Культурной Революции вызвало масштабные протесты в Кэсленде и других крупных городах Зелёных Равнин. Конечно, они будут подавлены, но это лишь симптом большой болезни масс."
 GSR_event.9.a: "Они ещё изменят своё мнение."
 
 GSR_event.10.t: "Верный Путь"
 GSR_event.10.desc: "Ещё никто не добивался успехов, подобных нашим! Рабочий Фронт и Председатель ведут нас вперёд, к светлому будущему Гойки!/n/nДа здравствует Рабочий Фронт!/nДа здравствует Рабочий Фронт!"
 GSR_event.10.a: "Да здравствует Рабочий Фронт!"
 
 GSR_event.11.t: "Удар в спину!"
 GSR_event.11.desc: "Войска южного режима перешёл нашу государственную границу и приближается к Речернду! Необходимо разгромить этих вероломных предателей!"
 GSR_event.11.a: "Вперёд! На защиту наших домов!"
 
 GSR_event.12.t: "Роспуск Министерства Экономики"
 GSR_event.12.desc: "Мы успешно скинули с наших обджектов бремя налогов и государственного рабства. Анархия ширится."
 GSR_event.12.a: "Ура!"
 
 GSR_event.13.t: "Роспуск Министерства Иностранных Дел"
 GSR_event.13.desc: "Нашей коммуне не нужны дипломатические отношения с реакционерами! Обджекты Зелёных Равнин сами решат, как им относится к реакционным режимам."
 GSR_event.13.a: "Всем этим фашистам осталось жить недолго."
 
 GSR_event.14.t: "Роспуск Патрулей"
 GSR_event.14.desc: "Более нам не нужны органы 'государственной безопасности'. Обджекты Кэсленда способны постоять за себя сами!"
 GSR_event.14.a: "Вперёд, Анархия!"
 
 GSR_event.15.t: "Роспуск Парламента"
 GSR_event.15.desc: "Нам не нужна 'Представительная Демократия'. Обджекты сами решат чего они хотят, и 'представители' нам не нужны!"
 GSR_event.15.a: "Долой диктатуру!"
 
 GSR_event.16.t: "Роспуск Вооружённых Сил"
 GSR_event.16.desc: "Государственные Вооружённые Силы являются таким же средством удушения свободы обджектов, как и полиция. Мы сами сможем за себя постоять!"
 GSR_event.16.a: "Вперёд, ополчение!"
 
 GSR_event.17.t: "Анархический Совет Лэвнленда просит о вторжении!"
 GSR_event.17.desc: "Наши друзья, обджекты, оккупированные реакционерами из Гринпорта, передали нам сообщение с мольбами о помощи против оккупации и о скорейшем освобождении. Медлить нельзя."
 GSR_event.17.a: "Советы единодушно высказываются за вторжение!"
 
 GSR_event.18.t: "Уроки старого Гойки"
 GSR_event.18.desc: "Анархический строй уже господствовал однажды на просторах Зелёных Равнин. Великий Гойки процветал во времена стабильности и спокойствия, без государства и полиции, без липовых бумажек и политической власти. Нам необходимо стремиться к этому идеалу."
 GSR_event.18.a: "Гойки будет возрождён."
 
 #GFG
 GFG_event.1.t: "Штурмовики в Кэсленде"
 GFG_event.1.desc: "Переходное Правительство показало свою полную неспособность сопротивляться паразитам из совета. В связи с этим было создано правительство Национального Возрождения, которое штыками положит конец произволу национал-предателей."
 GFG_event.1.a: "Гойки будет един!"
 
 GFG_event.2.t: "Крепкая Рука"
 GFG_event.2.desc: "Последние остатки сопротивления против отрядов карателей были жестоко подавлены. Правительство Национального Возрождения Больше никогда не допустит анархии в Кэсленде."
 GFG_event.2.a: "Да здравствует Гойки! Единый и Неделимый!"
 
 GFG_event.3.t: "Забытый Йойлоленд"
 GFG_event.3.desc: "Уже очень давно по Гойки ходят слухи о забытом регионе в глубинах незаселённого северного континента. Легенды о таинственном исчезновении местного народа и о том, какие невероятные технологии и тайны хранят эти земли широко разошлись по Зелёным Равнинам и крепко прижились здесь, в Кэсленде. Многие из наших рядов поддерживают идею преемственности с этой великой северной расой и считают, что современные обджекты Гойки являются её прямым наследием."
 GFG_event.3.a: "Интересно."
 
 GFG_event.4.t: "Предатели"
 GFG_event.4.desc: "После нашей сокрушительной победы над коммунистами и прочими ублюдками, мы смогли поймать многих из них за шкирку, и можем справедливо судить. Этот процесс должен показать наш будущий курс и укрепить нашу власть."
 GFG_event.4.a: "Публичная казнь!"
 GFG_event.4.b: "§RТОТАЛЬНЫЙ ТЕРРОР§!"
 
 GFG_event.5.t: "Фанни принимает роль Вождя"
 GFG_event.5.desc: "Теперь, когда Кэсленд чист от предателей и фракционистов, пришло время положить конец Триумвирату и выдвинуть истинного Вождя Обджектов Гойки. Фанни поведёт нас вперёд, прямиком к объединению!"
 GFG_event.5.a: "Хайль Гойки!"
 
 GFG_event.6.t.a: "Баскетболл принимает предложение"
 GFG_event.6.t.b: "Баскетболл отказывается"
 GFG_event.6.desc.a: "Баскетболл соглашается работать в нашем новом государственном кабинете во славу Гойкийской Нации!"
 GFG_event.6.desc.b: "Баскетболл отвергает наше предложение работать в новом кабинете."
 GFG_event.6.a: "Добро пожаловать!"
 GFG_event.6.b: "Чёрт."
 
 GFG_event.7.t.a: "Ремоут принимает предложение"
 GFG_event.7.t.b: "Ремоут отказывается"
 GFG_event.7.desc.a: "Ремоут соглашается работать в нашем новом государственном кабинете во славу Гойкийской Нации!"
 GFG_event.7.desc.b: "Ремоут отвергает наше предложение работать в новом кабинете."
 GFG_event.7.a: "Добро пожаловать!"
 GFG_event.7.b: "Чёрт."
 
 GFG_event.8.t.a: "Паффболл принимает предложение"
 GFG_event.8.t.b: "Паффболл отказывается"
 GFG_event.8.desc.a: "Паффболл соглашается работать в нашем новом государственном кабинете во славу Гойкийской Нации!"
 GFG_event.8.desc.b: "Паффболл отвергает наше предложение работать в новом кабинете."
 GFG_event.8.a: "Добро пожаловать!"
 GFG_event.8.b: "Чёрт."
 
 GFG_event.9.t: "Сопротивление раздавлено!"
 GFG_event.9.desc: "Последние серьёзные ячейки противников нашей Национальной Революции были разгромлены, и обджекты Кэсленда входят в новую, счастливую эру!"
 GFG_event.9.a: "Хайль Гойки!"
 
 GFG_event.10.t: "Путь к объединению"
 GFG_event.10.desc: "Теперь, когда Кэсленд в рассвете своих сил, Правительство Национального Возрождения может приступить к разгрому окружающих предателей. Наша первая цель - Альянс."
 GFG_event.10.a: "Вперёд!"
 
 GFG_event.11.t: "Движение вперёд"
 GFG_event.11.desc: "Благодаря добросердечному труду наших обджектов и их национальному единству, Кэсленд встаёт из разрухи, и мы больше не ощущаем тех тяжёлых последствий политического кризиса."
 GFG_event.11.a: "Новый Кэсленд."
 
 GFG_event.12.t: "Зов Предков"
 GFG_event.12.desc: "Наши великие предки из Северной Цивилизации зовут наших обджектов на священный бой во имя уничтожения всех неверных! Любой, кто встанет у нас на пути, будет раздавлен могуществом потомков Йойлоленда!"
 GFG_event.12.a: "Вздымем же меч над их главами!"
 
 GFG_event.13.t: "Пиллоу принимает роль вождя"
 GFG_event.13.desc: "Неизбежным итогом нашей великой Национальной Революции стало взятие курса на восстановление величия предков и Северной Цивилизации. Все обджекты Кэсленда единогласно поддерживают могучий порыв к священной битве против предателей и еретиков!\n\n§1Да здравствует Йойлоленд!§!"
 GFG_event.13.a: "Бессмертная Слава!"
 
 GFG_event.14.t: "Последний Съезд"
 GFG_event.14.desc: "Остатки прежнего кабинета оказались в сборе, когда в помещение вошёл Фрайс. Пожалуй, самая важная персона в этом судилище. Все взоры были направлены на его лицо, которое безэмоционально выслушивало обвинения в сопротивлении Национальной Революции, предательстве Гойкийской нации и многие прочие строки. Лишь когда оглашение закончилось, его скулы зашевелились."
 GFG_event.14.a: "Он зевнул."
 
 GFG_event.15.t: "Экспедиция"
 GFG_event.15.desc: "Спустя долгие часы и дни путешествия через канал Гойки, группа, наконец, встретила берега северного континента. Уже несколько лет сюда не ступала нога обджекта, и эта земля таит в себе множество секретов."
 GFG_event.15.a: "Мы отправимся на Северо-Восток."
 
 GFG_event.16.t: "Город"
 GFG_event.16.desc: "После ещё нескольких дней скитаний и ориентирования по звёздам, группа увидела на горизонте бетонные джунгли Йойлосити. Город встретил посетителей тишиной и слабо горящим, никогда не заходящим солнцем."
 GFG_event.16.a: "Поглощающая тишина."
 
 GFG_event.17.t: "Возвращение Группы"
 GFG_event.17.desc: "Наконец, спустя долгие дни ожидания, экспедиция вернулась с множеством интересных вещей. Однако, один из членов группы пропал по неизвестным обстоятельствам, а другой бредит про какой-то 'лист'."
 GFG_event.17.a: "Вскрываем карты!"
 
 GFG_event.18.t: "Культура"
 GFG_event.18.desc: "Наша экспедиция сумела добыть бесценные осколки древней Йойлолендской цивилизации. Мы должны использовать добытые нами сокровища предков ради возрождения их великой культуры."
 GFG_event.18.a: "Вперёд!"
 
 GFG_event.19.t: "Язык"
 GFG_event.19.desc: "Йойлолендский алфавит на выцветшей, древней бумаге лежал на столе перед Пиллоу. Гипнотизирующие формы иероглифов влюбили в себя Вождя."
 GFG_event.19.a: "Утвердить!"
 
 GFG_event.20.t: "Нация"
 GFG_event.20.desc: "Недоуменные жители Кэсленда выслушивали радиопередачу.\n\n'Отныне, нет более никакой Гойкийской нации. Мы - Йойлолендцы!' - Воодушевлённо звенели динамики, и новые Йойлолендцы внемлили им."
 GFG_event.20.a: "Пурпурное знамя."
 
 GFG_event.21.t: "Успешное подписание!"
 GFG_event.21.desc: "Нашим дипломатам успешно удалось заключить пакт с Южным правительством. Теперь всё готово к наступлению на север!"
 GFG_event.21.a: "Отлично!"
 
 GFG_event.22.t: "Срыв переговоров."
 GFG_event.22.desc: "К сожалению, нашим дипломатам не удалось подписать пакта с южным правительством. Похоже, они готовят против нас планы..."
 GFG_event.22.a: "Чёрт."
 
 #GOIKY TECHNOCRATIC REPUBLIC
 GTR_event.1.t: "Гадеамус Игитур"
 GTR_event.1.desc: "'Всё ещё не кончено!' - Эмоционально, своим характерным голосом прокричала Гольфболл. Теннис Болл продолжает проедать голову этими мелкими проблемками с бюрократией и снабжением. Кого это, чёрт побери, может волновать, когда есть шанс спасти всю цивилизацию? Мы на грани прорыва, и сейчас нельзя останавливаться на мелочах положения местных городишек!"
 GTR_event.1.a: "Ещё можно всё спасти."
 
 GTR_event.2.t: "Затёртый Микроскоп"
 GTR_event.2.desc: "Для Тест Тьюб этот день оказался сложнее, чем ожидалось. Работать в сердце исследовательского центра Университета само по себе не легко, но одна маленькая ошибка окончательно пустила всё под хвост.\nПоставленная изучать одноклеточных, она, конечно, нуждалась в микроскопе. Достать его было несложно. По началу работа шла спокойно: сбор данных, пометки, таблицы. Всё было даже слишком легко.\nНо, уже почти под конец дня обнаружилось, что парочка результатов оказались противоречивы. В конце концов оказалось, что микроскоп был повреждён."
 GTR_event.2.a: "Всё сначала."
 
 GTR_event.3.t: "Рецепт Соуса Мечты"
 GTR_event.3.desc: "Бериллий-8 довести до Be(OH)2, добавить 10 мл на 1 л смеси.\n\nМука пшеничная, разведённая в воде, ~30 л.\n\nДрожжи почвенные 10 г на 1 л смеси.\n\nМеталлическую стружку тщательно перемолоть..."
 GTR_event.3.a: "Ядрёная штука."
 
 GTR_event.4.t: "Продовольственный кризис"
 GTR_event.4.desc: "Гольфболл глядела в окно. Перед ней гордо возвышался кампус Гойкийского Университета, которому она посвятила огромное количество усилий. Чудсно.\nОна уже почти и забыла про обджектов снаружи. Они печально стояли в очереди за хлебом. Положение с продовольствием плоховато. Первое время всё было не так плохо, не более одной голодной недели на месяц. Обджекты могут прожить недельку без еды. \nПогас свет. Всё здание было обесточено."
 GTR_event.4.a: "Плановые отключения."
 
 GTR_event.5.t: "Гринхартовы Розы"
 GTR_event.5.desc: "В девственных полях к югу живут удивительные культуры разных семейств растений. К примеру, дикие розы здесь не имеют на стебле характерных иголок, благодаря чему их можно с удовольствием собирать. Они обладают удивительным ароматом, который расползается и вдаль и вширь по всем просторам Гринхарта."
 GTR_event.5.a: "Пополняем гербарий."
 
 GTR_event.6.t: "Последние Приготовления"
 GTR_event.6.desc: "Мы стоим на краю пропасти. Мы еле можем поддерживать подачу энергии в университете. Обджекты голодают. Гибнут. Нельзя больше это откладывать. В Анонсерграде растут волнения. Кризис идёт уже слишком долго."
 GTR_event.6.a: "Необходимо заканчивать проект."
 
 GTR_event.7.t: "Волнения в Анонсерграде растут!"
 GTR_event.7.desc: "Постоянная нехватка припасов рождает в городе социальную нестабильность, которая в скором времени может перерасти в куда более серьёзные вещи, если мы не сумеем как можно скорее завершить проект."
 GTR_event.7.a: "Нужно спешить."
 
 GTR_event.8.t: "Время вышло."
 GTR_event.8.desc: "Обезумевшая толпа ворвалась в коридоры и аудитории. Они разрывали всё на своём пути.\n\nГолодные.\n\nКогда они начали ломиться в кабинет к Гольфболл, было принято последнее разумное решение."
 GTR_event.8.a: "Всё кончилось быстро."
 
 GTR_event.9.t: "Приготовления завершены!"
 GTR_event.9.desc: "Смесь готова! Теперь, мы можем приступить к тестированиям. Мы в шаге от спасения Гойки, всё должно пойти по плану!"
 GTR_event.9.a: "Приступим."
 
 GTR_event.10.t: "Непредвиденные последствия"
 GTR_event.10.desc: "Мы утратили связь с Университетом. В радиусе двадцати километров от кампуса пронеслось землетрясение, а в Анонсерграде выбило стёкла. Поступают сообщения о грибе дыма, который виден за километры от предполагаемого взрыва."
 GTR_event.10.a: "ЧТО ТАМ, ЧЁРТ ПОБЕРИ, ПРОИЗОШЛО?"
 
 GTR_event.11.t: "Отрицательная дельта"
 GTR_event.11.desc: "Въезжая через почерневшие поля кампуса в область университета, перед обджектами предстала картина ужасающих разрушений. Гудрон дороги кратеризовался до состояния поверхности Луны, а ядовитые облака пыли застелали львиную долю корпусов альма-матер, от многих из которых не осталось камня на камне."
 GTR_event.11.a: "Разворачивание поисковых работ."
 
 GTR_event.12.t: "И свет погас..."
 GTR_event.12.desc: "Глухая пограничная ночь. Несмотря на то, что ветра в последние время дули спокойно, ополченцы продолжали стоять здесь, как штыки. Они были призваны сюда, чтобы заслонять мозг Гойки от разорения восточными бандитами. Уран был счастлив этим сумрачными равновесием. Пости всегда он единственный засиживал на посту допоздна. Ему было плевать на одиночество.\nЗвёзды блестели над просторами Гойки. Большие и маленькие, громкие и почти немые, обвешивали небо. Как же он любил звёзды; он любил их до такой степени, что посещал лекции по астрономии. Вздыхая, он вспоминал своего профессора. Ох, точно, а Луна? Долгая история. В детстве Уран мечтал пройтись по ней. Он вспоминал свой телескоп, который покупала ему мама; вспоминал, как видел Луну в деталях.\n\nШевеление на правом фланге его периферийного зрения заставило покинуть дупло фантазий. Разбойничья стая? Он видел бандитов с большой дороги лишь однажды, когда сам пытался найти университет. Пусть они и прошли мимо, но его охватила тогда неслабая дрожь. Вспоминая, что это, в конце концов, его работа, он навострил чувства. Обернувшись, он понял: первое - движение куда ближе, чем он думал; второе - это одиночка. Крупный, круглый и безрукий обджект. Немного выше самого Урана. Включая свет он понял, что обджект бежит. Со всех ног, не меньше. Он не выглядел опасно, так что он попросил открыть ворота для гостя.\n\nУвидя его при свете, не успев ничего сказать, он узнал его. Теннис Болл. Почти все слышали про Теннис Болла, ведь он был участником шоу, но ещё лучше его знали в районе университета. Теннис Болл запыхался перед лицом Урана. \nРухнув на землю, он сказал: \"Кто... К-кто вы? На кого вы работаете\"\nОшарашенный (не каждый день увидишь такое важное лицо скачущим в полях, как оленёнка) Уран, запинаясь, отвечал: \"Э-э-э... Т-Теннис Болл?! Я... Я Уран, это территория университета... З-здесь Гольфбо...\"\nНа этом имени истощённый мяч оборвал его: \"Гольфболл?? Я... Я добрался??\""
 GTR_event.12.a: "\"Э... Да! Я-Я сейчас сделаю вам пропуск.\""
 
 GTR_event.13.t: "В нужное время, в нужном месте"
 GTR_event.13.desc: "\"Вы... Вы были у бандитов?\" - Вопросил Уран. Они ехали среди руин университета. Ополченец оповестил начальство, но, видимо, час поздноват. В грузовичке Урана было достаточно много мусора (ему не было до этого дела), но теперь ему неловко.\nРаздвигая ногами банки из-под пива, Теннис Болл усмехнулся и сказал - \"Гольфболл говорила мне, что направится в университет. Я недолго работал на бандитов. Я думал это будет недолго, но, похоже, у Эрейзера были другие планы. Я застрял там на месяцы, как видишь.\"\nНависла тишина. Мелькали бескрайние зелёные поля и рощи. А что можно было сказать? Он слышал про бандитов и про их дела. Несмотря на то, что новости сюда приходят через случайных посетителей, он всё равно слышал. Про террор, про грабёж и насилие, про смерти. Бесконечные смерти. Те самые обджекты, которые убивали и грабили, заставили Теннис Болла работать на них. Не верится. \nПытаясь сгладить обстановку, Уран перевёл тему: \"Хуёво наверно было, да?\"\nТеннис Болл рассмеялся.\"О, это было просто УЖАСНО! Ребята возглавляют такую огромную армию, а в башке хоть шаром покати, они даже не знали, чем я занимаюсь. Они б не отличили Большую Медведицу от Маленькой!\"\nУран залился смехом."
 GTR_event.13.a: "Отдушина!"
 
 GTR_event.14.t: "Прибытие в кабинет"
 GTR_event.14.desc: "Всё, что делала Гольфболл в последнее время, являлось размышлениями в собственных неудачах и просчётах. Почти весь кампус был уничтожен, утрачены ценнейшие разработки, что уж говорить о кадрах. В этой обтановке, когда нужны решительные меры, Гольфболл больше не способна администрировать комлекс в одиночку. Но прибытие Теннис Болла оказало воодушевляющий эффект даже на неё, что уж говорить по прочих жителей Анонсерграда. Его свежие идеи и административный талант, несмотря на некоторую скованность характера, возможно, позволят нам выпутаться."
 GTR_event.14.a: "Теннис Болл заслуживает доверия."
 
 GTR_event.14-1.t: "Друзья"
 GTR_event.14-1.desc: "Гольфболл лишь периодически находилась в сознании, не зная ни сна, ни отдыха. Когда бы она не пыталась действительно задуматься, в её мозгу всплывали лишь картины её ошибок. Они привели к потере тысяч жизней. Возможно, даже десятков. И что теперь? Она не знала, что делать; ещё хоть один её шаг мог усугубить положение. Обджекты, которые верили в неё, утратили эту веру. Она готова была принять свою участь. Какое значение имеет её жизнь, если погибли тысячи?\nОна вновь чувствует себя дрейфующей в пустоте. Может, у неё будет больше времени подумать о своих недочётах в будущем. Она надеялась, что нет. Веки потяжелели. Она просто глядела в потолок. Единственная причина, почему она сейчас жива - это здание. Её лаборатория. Она запретила сюда заходить кому-либо без её личного разрешения.\n\nВнезапно, кто-то появился на пороге. Тот, кого она ожидала меньше всего. Нервный Теннис Болл глядел на неё, а она даже не сразу поняла. Он выглядел, будто пережил многое. Она заметила кое-что в тоне его голоса, когда он заговорил. \"Гольфи...? Что здесь случилось...?\"\nОшеломлённая, Гольфболл не смогла ответить сразу. Медленно проговаривая слова из своего истощённого мозга, она процедила: \"Привет... В-всё... Всё отвратительно...\"\nПовисла тишина. Теннис Болл аккуратно выбирал слова. Это дало фору и для мыслей Гольфболл. Она наконец осознала, кто перед ней. Её лучший компаньон, стоящий на одной ступени с ней. Он, видимо, пробежал у чёрта на куличиках, чтобы добраться сюда. Он волновался о ней. Теннис Болл прервал тишину. \"Ещё же можно всё исправить?\" Её мозг пронзило вдохновение. Они выбирались из положений и похуже, не так ли? Теперь она поняла, что"
 GTR_event.14-1.a: "Теннис Боллу можно верить."
 
 GTR_event.15.t: "Раскопки"
 GTR_event.15.desc: "В ходе спасательных работ удалось извлечь множество важнейших устройств и обнаружить выживших обджектов, которые были успешно перевезены в Анонсерград. Это немного улучшит наше тяжелое положение."
 GTR_event.15.a: "Отличная работа!"
 
 GTR_event.16.t: "Политические беженцы"
 GTR_event.16.desc: "Из Кэсленда бегут также и многие талантливые умы, потенциал которых нельзя терять. Мы сможем выжить только благодаря нашему общему интеллекту."
 GTR_event.16.a: "Добро пожаловать!"
 
 GTR_event.17.t: "Помощь для Анонсерграда"
 GTR_event.17.desc: "До нас донеслись новости о тяжёлой ситуации в Анонсерграде, ещё более тяжёлой, чем во всём остальном Гойки. Направим ли мы гуманитарную помощь?"
 GTR_event.17.a: "Хорошо."
 GTR_event.17.b: "Не наша забота."
 
 GTR_event.18.t: "Помощь прибыла!"
 GTR_event.18.desc: "К нам прибыла гуманитарная помощь от сочувствующих обджектов из [FROM.GetName]!"
 GTR_event.18.a: "Замечательно!"
 
 GTR_event.19.t: "Общее обсуждение"
 GTR_event.19.desc: "'Закрой свой грязный рот!' - свирепо прокричала Гольфболл.\n'Я скорее сдохну, чем позволю урезать финансирование этих разработок!'\n\nВ зале повисло тяжёлое молчание.\nТеннис Болл прервал тишину.\n\n'Послушай, Гольфи, я думаю, что ты слишком несправедлива. Это же не навсегда, мы сможем наверстать! К тому же, нам сейчас очень туго с ресурсами. Может, ты подумаешь ещё?'"
 GTR_event.19.a: "'Возможно, ты прав.'"
 
 GTR_event.20.t: "Торжества в Анонсерграде"
 GTR_event.20.desc: "Развёрнутые знамёна с графиками логарифмической функции наполняли Каппи уверенностью в завтрашнем дне.\n'Всё не так уж и плохо. Рационы выросли, а южные ветра, приносящие смог, улеглись.'\n\nОт таких мыслей у неё грелась душа.\nВ памяти всплывал образ Грейпа.\n'Он был бы счастлив. если бы видел это.' - невольный ход мыслей возвращал её к той же точке.\n\nШумный митинг на площади заставляет её отвлечься. Обджекты, радостные, громкие, их неуёмный пыл окрашивает знамена громогласным 'Республика!'.\n\nВсе мы кого-то потеряли."
 GTR_event.20.a: "Но нужно двигаться дальше."
 
 GTR_event.21.t: "Босси Бот"
 GTR_event.21.desc: "'Теннис Болл, ты слишком травояден!' - Теперь Гольфболл высказывает это в открытую.\n\n'Чтобы выжить, нам нужны более жёсткие меры! Нам нужен чёткий план и умное руководство, такие умные, как Я!'\n\nНеловкая тишина прерывается продолжением речи ГБ.\n'Мы не можем опираться на этих дураков из города, нам нужно сильное правительство!'\n\nТеннис Болл опустил взгляд на стол."
 GTR_event.21.a: "'Ээээххх, окееееееей'"
 
 GTR_event.22.t: "Старые Связи"
 GTR_event.22.desc: "Пересекая черту города Анонсерграда, кэслендские парламентёры увидели обычный гойкийский город, такой же помятый кризисом и разрухой, как и их родина. На улицах они увидели жизнерадостных обджектов, которые верили в будущее. Было во что верить, ведь за последний месяц ситуация сильно улучшилась. Улучшилась она и в Кэсленде: утих шум политической смуты, а на улицах перестали греметь убийства.\n\nНайдя небольшое зданьице с табличкой \"Администрация Гойкийского Университета\", трое обджектов вошли внутрь.\n\n\n...- \"ТЫ РЕШИЛ РАЗБАЗАРИТЬ ВСЕ НАШИ ПОЖИТКИ?!\"\nГольфболл вспыхнула гневом, услышав то, что Теннис Болл согласен на предложение парламентёров.\n\n\"Я считаю, что Республике нужны союзники. Ты слишком плохо о них думаешь!\"\nТеннис Болл припирался."
 GTR_event.22.a: "Контакт с Кэслендом установлен."
 GTR_event.22.b: "Парламентёры возвращаются ни с чем."
 
 GTR_event.23.t: "Рельсы-рельсы, шпалы-шпалы..."
 GTR_event.23.desc: "По ветке Лофти-Сатойминь уже несколько месяцев не ходили поезда. Молодой кондуктор, Павни, задремав в кабине во время долгой смены, не заметил, что кто-то перенастроил рычаги, и набитый углём километровый состав мчался прямо по старой ветке.\n\nПавни проснулся от сирены пограничной заставы.\nБыстрое движение, и колёса заискрились.\nПоднятые руки. Винтовки пограничников.\n\n\"Дадут же мне взбучку в депо.\""
 GTR_event.23.a: "Почему бы не открыть старую ветку?"
 GTR_event.23.b: "Конфискуйте состав."
 
 GTR_event.24.t: "Сами по себе"
 GTR_event.24.desc: "Вокруг Республики не осталось ни одного осколка Гойки, способного на конструктивный диалог. В этих условиях, когда нас окружают безумные радикалы и бандиты, Республика вынуждена оставаться холодной во внешней дипломатии и ужесточить своё сердце, чтобы защититься от возможной агрессии."
 GTR_event.24.a: "Ничего не поделать."
 
 GTR_event.25.t: "Наш Курс"
 GTR_event.25.desc: "Перед Республикой встаёт тяжелый выбор курса внутренней политики. Теннис Болл настаивает на расширении правящих кругов и усилении роли демократии, в то время как Гольфболл стоит на стороне сохранения полномочий Администрации Университета и усиления роли интеллекта в управлении для дальнейшего развития науки.\n\nКаким путём пойдёт Республика?"
 GTR_event.25.a: "Демократия!"
 GTR_event.25.b: "Ноократия!"
 
 GTR_event.26.t: "Курс Промышленности"
 GTR_event.26.desc: "Между Теннис Боллом и Гольфболл возникли споры по поводу курса развития индустрии.\nТеннис Болл стоит за малые технологические экологичные фабрики, разбросанные на большой площади, в то время как Гольфболл желает развития крупной промышленности и не сильно заботится об окружающей среде.\n\nКакой план примет Республика?"
 GTR_event.26.a: "Промышленность для Обджектов!"
 GTR_event.26.b: "Промышленность для Науки!"
 
 GTR_event.27.t: "Лига Плюща"
 GTR_event.27.desc: "В связи с научным сотрудничеством Кэсленда и Анонсеграда, между Гойкийским и Кэслендским Университетами было решено создать единое научно-исследовательское сообщество, через которые обджекты смогут делиться современными проблемы естествознания и других дисциплин. Это сильно укрепит сотрудничество между [?206.owner.GetName] и Технократической Республикой."
 GTR_event.27.a: "Да здравствует наука!"
 
 GTR_event.28.t: "Пора Домой"
 GTR_event.28.desc: "\"Привет, Мама.\n\nКак ты там? Говорят, что у вас стало проще. Папа читал в газетах, что у вас дома снова есть свет.\nНам здесь непросто, папе и другим старшим пришлось самим строить дом из настоящих деревьев! Но зато нам здесь спокойно. Я могу ходить гулять сколько захочу, а в городе ты мне это постоянно запрещала. Папа даже сделал мне и друзьям качели!\nПапе тоже стало легче, я это чувствую. Он был постоянно очень напряженным в городе, а теперь он дышит спокойней. Но он беспокоится за тебя.\nЯ тоже за тебя беспокоюсь. Мы все хотим домой, как можно скорее!\n\nГоворят, что теперь можно не бояться возвращаться. Что границу открыли. Папа тоже так говорит. Но он постоянно ругается с другими. Они говорят, что он предатель. Но мой Папа не предатель! Мы просто хотим домой! Разве это предательство?\n\nЗдесь трудно отправлять письма, почта ходит редко, а ещё Папа говорит, что почтальон - ублюдок. Я не знаю, что это значит, но наверно это плохо.\n\nВ общем, Мам, жди нас, мы скоро приедем домой.\nМы надеемся, что у тебя всё хорошо!\""
 GTR_event.28.a: "Тоска по Родине."
 
 GTR_event.29.t: "Золотая Жила"
 GTR_event.29.desc: "Захолустный бар на окраине Вайлопида последние вечера был полон обджектов-проходимцев. Никто не спрашивал имён, да и зачем? Здесь этого не принято. Львиная часть здешней аудитории теперь - охотники наживы, обджекты, забывшие понятие дома, ищущие прибыль.\n\n\"Я тебе отвечаю, эта ветка будет одной из самых прибыльных во всём Гойки! Братик, ты слышал про искусственные кристаллы из Анонсерграда? А про цветы в Гринхарте?\nЭто шикарный товар, тебя за него с башкой сожрут бандиты с большой дороги, если ты решишь везти это добро по северной равнине. Теперь представь, какие перспективы открываются благодаря железной дороге!\"\n\nПоддатый Коттон водил пальцем по запятнанной карте, вычерчивая траекторию новооткрывшейся ветки Лофти-Анонсерград. Пэббл ловил каждое его слово, словно заколдованный, да и прочие обджекты вокруг не чурались послушать."
 GTR_event.29.a: "\"Расскажи ещё!\""
 
 GTR_event.30.t: "Интеграция Лофти"
 GTR_event.30.desc: "Благодаря нашему сотрудничеству с [SRR.GetName], мы смогли присоединить город Лофти к Технократической Республике! Это событие сильно укрепит наши позиции на севере и улучшит наше экономическое состояние."
 GTR_event.30.a: "Отлично!"
 
 GTR_event.31.t: "Профессиональный Этикет"
 GTR_event.31.desc: "Закоулки дворов Анонсерграда заливает сумрачный дождь. Через завешенные толстными шторами окна серого неприметного здания пробивается свет одинокой лампы.\n\n\"Где он, чёрт побери? Явка длится уже полчаса.\"\nНоутс нервно глядел на часы, барабаня пальцами по столу.\n\n\"Почему вы вообще думаете, что ему можно доверять? Откуда он вообще взялся?\"\n\"Я уже тебе говорил, что он из Кэсленда, и что обджект доверенный и надёжный, как гринпортские часы. С минуты на минуту он будет здесь.\"\n\nВ парадной затрекотало. Все бросили взгляды на вход в комнату, но ничего не увидели.\n\n\"Джентльмены, посмотрите немного ниже. Я здесь.\""
 GTR_event.31.a: "\"Я же говорил!\""
 
 GTR_event.32.t: "Политический Вакуум"
 GTR_event.32.desc: "После того, как правительство Республики объявило о приватности технологических разработок Гойкийского Университета, многие осколки Гойки восприняли это с серьёзным негативом.\nМы утратили достаточно большое количество дипломатических контактов, но это всё для науки, не так ли?"
 GTR_event.32.a: "Так надо."
 
 GTR_event.33.t: "Успешная Операция!"
 GTR_event.33.desc: "Операция по переманиванию учёных из другого государства прошла успешно, и мы смогли перевести этих обджектов к нам. Это подорвёт наши отношения с этим государством, но это не очень уж и важно."
 GTR_event.33.a: "Отлично!"
 
 GTR_event.34.t: "Бегство Учёных!"
 GTR_event.34.desc: "В результате шпионских действий Технократов в нашем государстве, многие наши учёные сбежали в Анонсерград при поддержке разведки Гольфболл. Это серьёзно ударит по нашему научному потенциалу и нам потребуется время, чтобы занять пустующие места новыми кадрами."
 GTR_event.34.a: "Глупая Босси Бот!"
 
 GTR_event.35.t: "Демократизация"
 GTR_event.35.desc: "\"Любой обджект Анонсерграда, вне зависимости от гендера, наличия конечностей и умственных способностей имеет право голосовать, выражать несогласие и выдвигаться на пост представителя и быть избранным в совет Анонсерграда. Это право безоговорочно закрепляется за всеми обджектами города.\"\n\nТеннис Болл застыл в ожидании реакции толпы."
 GTR_event.35.a: "Овации."
 
 GTR_event.36.t: "Президентство"
 GTR_event.36.desc: "Политические реформы Теннис Болла были встречены с глубоким оживлением обджектов Анонсерграда. Демократизация и формирование полноценных гражданских институтов помогло становлению Технократической Республики как полноценного государства, где все обджекты могут пользоваться плодами науки и технического прогресса."
 GTR_event.36.a: "Да здравствует Республика!"
 
 GTR_event.37.t: "Мёртвый Груз Морали"
 GTR_event.37.desc: "Сегодня Гольфболл особенно нервно проводила свой вечерний мозговой штурм. Вопрос заставил её искружить свою среднего размера офисную комнатушку несколько раз.\n\n\"НИКТО в прежнем Гойки не заботился о разработке вооружений. Это понятно. Но почему мы не хотим делать его СЕЙЧАС?\nЧто мешает моим учёным теперь взяться за разработку оружия?\"\n\nИ тут её осенило.\nНежелание убивать, ощущение ответственности за убийство мешает созданию новых типов оружия.\nНеобходимо отбросить этот мёртвый груз."
 GTR_event.37.a: "Наука выше этих предрассудков."
 
 GTR_event.38.t: "Первый Профессор"
 GTR_event.38.desc: "Благодаря строгим реформам Гольфболл в сторону поддержания научной сферы и превращения Технократической Республики в полноценное государство с силами самообороны, способное постоять за себя, Гольфболл заимела огромную поддержку. Пришло время окончательно взять курс на приоритет научного развития для Республики!"
 GTR_event.38.a: "Да здравствует Наука!"
 
 GTR_event.39.t: "Вопрос Желудка"
 GTR_event.39.desc: "- \"Эту дрянь не возьму. Давай нормальные деньги, либо пошёл прочь!\"\n\nЖизнь в Анонсерграде оживилась после объявления Республики. Запустилось транспортное сообщение, открылось множество новых предприятий. Даже начали печатать собственную валюту. Но, к сожалению, болезни роста неизбежны.\n\n- \"Алё, очкарик, ты меня слышишь?\"\n- \"Это всё, что у меня есть. Пожалуйста, мне надо кормить дочь.\"\n\nСемье трудно выжить на пайки, хоть они и серьёзно расширились за последние месяцы. Чёрный рынок процветает в закоулках Анонсерграда.\n\n- \"Ты чё, меня не понял?\"\nКулак засвистел в воздухе.\n\nПрофессорам платят в основном продовольственными карточками, но дают и валюту. Впрочем, хода она пока не имеет.\n\n- \"Я заплачу за него.\"\nИз скопившейся очереди выходит статный обджект.\n - \"Кэртон? Студент?\""
 GTR_event.39.a: "- \"Не беспокойтесь, профессор Геокэш.\""
 
 GTR_event.40.t: "Чертежи Закончены!"
 GTR_event.40.desc: "Работа над планами постройки нового Университета, в основном, закончена. Скоро мы сможем воплотить эти проекты в жизнь, и Университет восстияет над Гойки ещё ярче, чем раньше!"
 GTR_event.40.a: "Хорошая работа!"
 
 GTR_event.41.t: "Профессора Собраны!"
 GTR_event.41.desc: "Нам удалось собрать необходимые для работы Университета кадры. Пусть они молоды, их мало и они не обладают тем же опытом, что погибшие во время взрыва, они имеют великое будущее и сумеют наверстать потери науки Гойки!"
 GTR_event.41.a: "Удачи, друзья-учёные!"
 
 GTR_event.42.t: "Строительство Окончено!"
 GTR_event.42.desc: "Невероятные планы строительства нового Университета сбылись! Современные корпуса новых блестящих зданий отсвечивают лучи Солнца на уничтоженный когда-то кампус. Теперь уже ничего не говорит о последствиях ужасного взрыва. Осталось лишь провести торжественное открытие!"
 GTR_event.42.a: "Феникс!"
 
 GTR_event.43.t: "Статуя Гольфболл?"
 GTR_event.43.desc: "Во время постройки Университета среди инженеров возникла идея прославить Первый Ум Гойки и поставить в Кампусе статую Гольфболл. Возникают протесты, но решить этот вопрос, в конечном счёте, должно правительство.\n\nЧто мы скажем на этот счёт?"
 GTR_event.43.a: "Дать Дорогу!"
 
 GTR_event.44.t: "По колено в грязь"
 GTR_event.44.desc: "Среднее время жизни танка на поле боя - 5 минут. В районе Кампуса экскаватор может вздымать почву лишь в районе 15 минут подряд.\n\nСамые храбрые и честные обджекты Анонсерграда вызвались на работы в районе Кампуса по обновлению заражённого покрова почвы. Радиация и инфекция погубили многих. Но они это сделали. Самое тяжёлое и опасное задание успешно выполнено ценой этих бесценных жизней."
 GTR_event.44.a: "Герои."
 
 GTR_event.45.t: "Попутный Ветер"
 GTR_event.45.desc: "Приятный северный бриз окутал Пайни, когда оказалсь на главной площади Кампуса.\nИдеальные стёкла окон новых корпусов и аудиторий отсвечивали на неё полудним солнцем. Прямо перед ней в нескольких десятках метров бил ровный поток великолепного фонтана.\n\nЗавораживающе.\n\nЧистые и девственные стены зданий были готовы выдерживать на себе всю тяжесть будущей работы. Вокруг было совсем немного обджектов для такого исполина архитектуры и технологии. Она попала сюда одной из первых, и обджекты вокруг были удивлены не меньше Пайни.\n\nОтойдя от изумления и найдя корпус, где приписан её кабинет, она увидела на флагштоках развивающиеся под спокойным пассатом флаги Молодой Технократической Республики. Гарантия мира и спокойствия в коридорах этого монструозного учреждения, самого настоящего флагмана всего Гойки.\nНо пора приступать к работе."
 GTR_event.45.a: "Снова в деле!"
 
 GTR_event.46.t: "Перенос Столицы?"
 GTR_event.46.desc: "Так как реставрация Университета почти закончена, ребром встал вопрос о возвращении Совета обратно в стены этого могучего научного учреждения. Гольфболл полностью поддерживает возвращение столицы в Кампус, в это время Теннис Болл считает, что администрация уже прижилась в Анонсерграде и является сугубо гражданской структурой.\n\nКакое решение вынесет Совет?"
 GTR_event.46.a: "Обратно в Университет!"
 GTR_event.46.b: "Остаёмся в Анонсерграде."
 
 GTR_event.47.t: "Администратор Университета"
 GTR_event.47.desc: "Во время набора персонала для нового Университета между Гольфболл и Теннис Боллом зажёгся спор: Гольфболл выдвигает на позицию администратора Университета воинственного и сконцентрированного на оборонных исследованиях Напалма, в это время Теннис Болл выдвигает Октахедрона, который заинтересован в более мирных исследованиях.\n\nКто же будет администратором Универитета?"
 GTR_event.47.a: "Напалм."
 GTR_event.47.b: "Октахедрон."
 
 GTR_event.48.t: "1:3"
 GTR_event.48.desc: "\"...бои за Гринлендовскую равнину вновь подтверждают тезис, выдвинутый ещё две тысячи лет назад полководцем Ротациусем: для успешного широкомасштабного наступления на противника необходимо иметь численное превосходство в технике и обджектах, как минимум, в три раза.\"\n\nЭрудиция Кросса, пожилого военного историка, один из немногих выживших после катастрофы в Университете, вновь стала полезна в эти тёмные времена для Гойки.\n\n\"Наблюдая исхудалые батальоны наших пограничников и видя то, какие военные метаморфозы происходят сегодня в Кэсленде, хочется только плакать!\nЕсли Технократия хочет выжить, то необходимо перенаправить наши ресурсы на формирование полноценной армии!\"\n\nКонференц-зал здания администрации в Анонсерграде заливается аплодисментами. Гольфболл встаёт со своего кресла."
 GTR_event.48.a: "\"Вы абсолютно правы, мистер Кросс!\""
 
 GTR_event.49.t: "Отчёт Комиссии"
 GTR_event.49.desc: "...       ВЫВОДЫ\n\nКомиссия заключает, что детонация вышеописанной Смеси оказалась связана с нестабильностью внешней электронной оболочки атомов фосфора, что создало цепную реакцию и привело к выбросу огромного количества энергии.\nКомиссии не удалось получить сведения о том, в связи с чем вещество вышло из стабильного состояния, но Комиссия выдвинула гипотезу, согласно которой, распад атомов произошёл в результате действия некоторого катализатора, который ещё неизвестен современной науке..."
 GTR_event.49.a: "Продолжайте Исследования."
 
 GTR_event.50.t: "Блеск в Небе"
 GTR_event.50.desc: "Телескопы зафиксировали падение неизвестного небесного тела в районе Университета. Похоже, что это метеорит, около сотни метров диаметром. В ходе поисковых работ был обнаружен крупный объект минерального происхождения, на 58,8% состоящий, согласно данным спектрографов, из металла крайне редкого происхождения - йойлита.\nОчевидно, мы сможем использовать образцы йойлита для наших экспериментов."
 GTR_event.50.a: "Прямо к нам в руки!"
 
 GTR_event.51.t: "Беспорядок"
 GTR_event.51.desc: "...            ОПЫТ №1\n\nПосле доставки образцов минерала в оборудованную лабораторию, профессор ------ попытался взять в один из активных элементов в руки. Согласно записям с камер наблюдения, через несколько секунд образец начал отбрасывать светло-жёлтое свечение, после чего незакреплённые предметы окружающей среды поднялись в воздух примерно на 10 сантиметров.\nЧерез 10 - 15 секунд эффект прекратился, и все ливитирующие объекты рухнули обратно.\nПрофессору ------- было инкриминировано нарушение техники безопасности."
 GTR_event.51.a: "Нестабильное вещество."
 
 GTR_event.52.t: "Дежавю"
 GTR_event.52.desc: "...            ОПЫТ №2\n\nПосле перемещения образцов в специальную оборудованную камеру, были санкционированы опыты взаимодействия образцов с другими элементами и веществами. В основном образцы показали себя стабильно, но в одном из тестирований, а конкретно со споровидным Noctiluca Yoylean, был зафиксирован резкий скачок люминистцентной активности, после чего вся комната наблюдения озарилась яркой вспышкой.\nПроизошёл большой выброс энергии, и образец был уничтожен, однако благодаря тому, что камера была оборудована сплавами вольфрама, жизни профессоров-наблюдателей удалось сохранить.\nПрофессор ---- утверждала, что видела свою давно умершую мать."
 GTR_event.52.a: "Невероятный потенциал."
 
 GTR_event.53.t: "Период Полураспада"
 GTR_event.53.desc: "...            ОПЫТ №3\n\nПосле изучения свойств нестабильности образцов, на консилиуме было принято решение о попытке создать простой реактор контролируемого распада атомов йойлита.\nВ качестве замедлителя выбрасываемых нейтронов был использован оксид кремния, образец был помещён в свинцовую камеру.\nВ результате наблюдений за выбросом энергии было установлено, что один грамм йойлита имеет энергетическую ценность, соответственную 2000 тонн угля..."
 GTR_event.53.a: "Возможен ли контролируемый взрыв?..."
 
 GTR_event.54.t: "Сопротивление Воздуха"
 GTR_event.54.desc: "За окном давно стемнело, а Теннис Болл уже который час сидел и трудился над чертежами. Сила тяжести, аэродинамичность, мощность двигателя, цифры в его голове были ровно разложены по полочкам, как в библиотеке. Но он допускал и более отвлечённые мысли.\nОн восторгался красотой и элегантностью авиации, как огромные машины из алюминия и нержавеющей стали грациозно парят, возвышаясь над землёй на десятки километров.\nНо потом он снова возвращался за работу."
 GTR_event.54.a: "Расправляем Крылья."
 
 GTR_event.55.t: "Испытания"
 GTR_event.55.desc: "Просторы Дэдленда отхватывают небольшую часть Зелёных Равнин к югу, образованные переходом к холмистой местности плато. Из-за сильных ветров и низкой влажности воздуха эта часть равнин никогда не была заселена простыми обджектами, лишь иногда здесь проходили мимо транспорты.\n\nИменно это место было избрано для сегодняшних испытаний.\n\nТеннис Болл смотрел из прорезей окон гладкого бетонированного бункера на раскинувшуюся спокойную равнину.\n\"Придётся её потревожить\".\n\nКогда над вышиной поднялся блеск, ярче тысячи солнц, он невольно произнёс:"
 GTR_event.55.a: "\"Я стал смертью, разрушителем миров.\""
 
 GTR_event.56.t: "Мечта о Звёздах"
 GTR_event.56.desc: "Синева сумрачного неба вновь окутывала все мысли Урана. Чем дольше он бросал взор в необъятные просторы космоса, тем яснее видел белую крошку рассыпных звёзд, образующие сито миллионолетних созвездий.\n\nУран был назначен на новый секретный проект в инженерном корпусе Университета. После того, как он разузнал детали, он стал смотреть на звёзды по-другому. Они перестали быть недосягаемыми божествами, проедающими тебя сквозь очки стратосферы.\n\nОни стали целью.\nЦелью, которая должна быть достигнута."
 GTR_event.56.a: "Мы зажжём свои звёзды!"
 
 GTR_event.57.t: "Запуск"
 GTR_event.57.desc: "Первопроходцам оказывается тяжелей всего прокладывать неизведанные тропы сквозь окружающую реальность. Не для кого это не является секретом. Но сегодня ставки особенно высоки.\n\nВсё было сделано очень быстро: всего за несколько месяцев был оборудован полигон, была раскопана взлётная площадка, а в нескольких километрах от блестящей ракеты-носителя располагался новенький наблюдательный пункт. Всё вокруг выглядит спокойно, но это спокойствие лишь напущено окружающей природой.\nВнутри этого небольшого зданьица с чистыми стёклами нервы обджектов находятся на пределе. Они долго и упорно работали над этим произведением науки и техники, но никто из них не уверен в успехе операции.\nТам, на горизонте, внутри этого железного левиафана, который вот-вот взмоет к созвездиям, находятся обджекты. Все боятся за их жизни.\nНапряжение здесь можно мазать на хлеб.\n\nНо вот раздаётся гул радиопередатчика:\n\"Грейпс, Черрис к взлёту готов, приём, Грейпс.\"\n\nНаконец, невозмутимый голос Гольфболл вздымает заострённый меч:"
 GTR_event.57.a: "\"Начинайте отсчёт!\""
 
 GTR_event.58.t: "Возвращение Команды!"
 GTR_event.58.desc: "Астронавты в полном составе успешно приземлились в океан Гойки и сумели переправиться обратно на нашу территорию. Были получены записи поверхности Луны, а на самом спутнике был установлен флаг нашей Технократии!\nЭто невиданная победа для нашей науки войдёт в историю Гойки, как одна из самых ярких её страниц, несмотря на окружающую это великое событие анархию и хаос..."
 GTR_event.58.a: "Грядущее Зовёт!"
 
 GTR_event.59.t: "Трагедия \"Черрис\""
 GTR_event.59.desc: "В результате трагических просчётов, космическая миссия провалилась. Это серьёзно ударило по настроению среди профессоров и команды. Но это ещё не конец. Не все проекты, и не все великие дела совершаются с первого раза. Мы обязательно вернёмся к этому замыслу, ещё более подготовленные и опытные. А пока что, помянем героическую команду \"Черрис\", которая оказалась первопроходцами в деле покорения космоса, хоть и не достигла его высот..."
 GTR_event.59.a: "Грядущее Зовёт!"
 
 GTR_event.60.t: "Операция \"Бриджкроссинг\""
 GTR_event.60.desc: "\"...а теперь перейдём к подробностям.\"\n\nГольфболл и Теннис Болл сидели в тихом, даже скромном конференц-зале, в котором на повестке дня обсуждается совсем не соответствующая его обстановке тема.\n\n\"Итак, корабль будет состоять из трёх основных, скажем так, \"частей\": шаттл, где будут находиться 3 члена экипажа; топливный бак, который будет содержать в себе источник энергии для двигателя; и, собственно говоря, сам двигатель, который будет поддерживать ход корабля и направлять его на конечную цель - Луну.\"\n\nКороткие апплодисменты.\n\n\"Но, как известно, дьявол кроется в деталях, а у нас ещё не было такого экстремального опыта в истории инженерной науки, поэтому нам придётся поэкспериментировать...\""
 GTR_event.60.a: "Придётся поработать."
 
 GTR_event.61.t: "Стабильность"
 GTR_event.61.desc: "Похоже, что в ходе внутриполитических реформ ни одна сторона не смогла захватить себе инициативу. Старая дружба сохраняет силу, и Гольфболл с Теннис Боллом продолжают править Технократической Республикой вместе. Похоже, это судьба."
 GTR_event.61.a: "Они договорятся."
 
 GTR_event.62.t: "Пожар"
 GTR_event.62.desc: "В одном из дворов Анонсерграда произошла авария, в результате которой на несколько домов обрушилась линия электропередач. Многие обджекты пострадали и остались без жилья. Теннис Болл считает, что им немедленно надо выделить средства из резервного фонда, в это время Гольфболл говорит о долговременных задачах Республики, и что эти средства еще понадобятся. Что решит Совет?"
 GTR_event.62.a: "Выделить деньги!"
 GTR_event.62.b: "Деньги ещё понадобятся."
 
 GTR_event.63.t: "Падение Демократии в Кэсленде"
 GTR_event.63.desc: "К сожалению, правительство в Кэсленде потерпело поражение. В сердце Гойки установился совсем недружественный нам режим, и мы не можем продолжать сотрудничество. Технократии вновь придётся действовать в одиночестве."
 GTR_event.63.a: "Ну что-ж."
 
 #NEWS
 bfdinews.1.t: "Файри выигрывает Остров Мечты!"
 bfdinews.1.desc: "Спустя два года состязаний, Битва За Остров Мечты подходит к концу. По результатам финального голосования, победителем вышел... Файри! Койни потерял сознание по итогам голосования. Эта новость уже взбудоражила общественность и вызвала значительные негодования в обществе Гойки. Утечки также сообщают, что Файри пустил на остров всех, кроме Лифи - своей лучшей подруги. Причины пока что неизвестны, но мы следим за развитием событий."
 bfdinews.1.a: "Ненависть это тоже популярность."
 
 bfdinews.2.t: "ОСТРОВ МЕЧТЫ БЫЛ УКРАДЕН!"
 bfdinews.2.desc: "                          ГОЙКИ НЬЮС: СРОЧНЫЙ ВЫПУСК\nПо сообщениям наших источников из западных регионов, Остров Мечты, сражение за который беспрерывно шло 2 года подряд, бесследно исчез. По первоначальной версии, остров был выкуплен Лифи, которая, вероятно, скрылась в злом лесу. Кто позволил провести эту незаконную операцию и откуда были взяты деньги пока что неизвестно. В это время беспорядки захлестнули практически весь континент и местные города погрузились в хаос. Гойки ньюс будет следить за развитием событий."
 bfdinews.2.a: "Безумие!"
 
 bfdinews.3.t: "Битва за социализм"
 bfdinews.3.desc: "Битва за социализм - обджект-шоу, которое совсем недавно запустили в РФСГ в целях пропагандистской работы с населением. В отличии от БЗОМ, в этом шоу продвигаются идеи кооперации и сотрудничества, участники не соревнуются друг с другом, а напротив, кооперируются с целью достижения цели и сопротивления реакционерам."
 bfdinews.3.a: "Интересно."
 
 bfdinews.4.t: "Манифест революции"
 bfdinews.4.desc: "В новой программной работе 'Манифест революции', идеологи Революционного Фронта Северного Гойки объявили о 'неизбежном экспорте революции и её распространии на Весь Гойки'. Соседние РФСГ режимы уже расценили это как угрозу и подготавливают свои ополчения."
 bfdinews.4.a: "Файри зашёл далеко."
 bfdinews.4.b: "Реакционеры дрожат в страхе!"
 
 bfdinews.5.t: "Экспедиция в Северный Гойки!"
 bfdinews.5.desc: "Доброе утро, дорогие слушатели! Интересные новости пришли из Норт-Гойкилэнда: Оттуда отчалила группа экспедиторов-первопроходцев из двух сотен обджектов, которые отправились в Северный Гойки прямиком через канал. Их целью является исследование прибрежных районов континента. Пока что это всё, что нам известно, но мы будем следить за этой интересной экспедицией."
 bfdinews.5.a: "Удачи."
 
 bfdinews.6.t: "Провозглашение социалистической республики"
 bfdinews.6.desc: "Важные новости: Спустя несколько недель после разгрома Военного Округа и после того как Красная Армия установила контроль над Кэри, Файри объявил о создании Социалистической Республики Гойки. Это новая страница в истории Северного Гойки и новый этап продвижения 'общегойкийской революции'. Потерпит ли новая республика крах или же успешно распространит своё влияние на весь континент?"
 bfdinews.6.a: "В будущее."
 
 bfdinews.7.t: "Развал Снежного Плато!"
 bfdinews.7.desc: "Интересные новости пришли из Снежных Равнин: Местная диктатура не выдержала ударов сопротивления и разрушилась на осколки и самопровозглашённые правительства. Скорее всего, это повлечёт серьёзный удар по всей культурной и национальной идентичности обджектов Снежного Плато. В любом случае, наша редакция продолжает сделать за развитием событий."
 bfdinews.7.a: "Это тёмные времена."
 
 bfdinews.8.t: "Вторжение в Снежный Лес!"
 bfdinews.8.desc: "Атмосфера в Снежном Плато накалялась несколько лет, и вот: Армия Рейха пересекла границу Снежного Леса с целью зачистки его от Анархистов. Пока что подробности не ясны, но, скорее всего, война будет тяжёлой и затяжной для обеих сторон."
 bfdinews.8.a: "Свобода и Порядок столкнулись."
 
 bfdinews.9.t: "Анархисты Снежного Плато разбиты!"
 bfdinews.9.desc: "Срочные новости: Совсем недавно вооружённые силы Рейха закончили зачистку Снежного Леса от сил анархистов, и хотя у них ещё остаются боеспособные части в тылу, они уже вряд ли когда-нибудь смогут восстановиться. Хоть обджекты-анархисты и будут продолжать сопротивление ещё многие годы, они потерпели поражение."
 bfdinews.9.a: "В Снежном Плато установился порядок."
 
 bfdinews.10.t: "Кризис в Кэсленде"
 bfdinews.10.desc: "Важные новости пришли из Временного правительства: Глава переходного режима Клок был убит левым активистом! Это ещё сильнее обострило политический кризис в государстве и фракционизм в жизни Кэсленда перестал знать границ. Кабинету придётся сделать огромную работу чтобы сохранить стабильность."
 bfdinews.10.a: "И Гойки затаил дыхание."
 bfdinews.10.b: "Мы будем рассчитывать на победу социалистов."
 bfdinews.10.c: "Мы поддержим наших правых товарищей."
 bfdinews.10.d: "Демократическая фракция должна победить любой ценой."
 
 bfdinews.11.t: "Провозглашение Республики Гойки!"
 bfdinews.11.desc: "Несколько часов назад, в Кэсленде, председатель правительства утвердил конституцию Республики Гойки. Долгое время временное правительство находилось в кризисе, но, похоже, что он подходит к концу, и в центре Гойки вновь устанавливается стабильность. Но, пока что, ничего ещё утверждать нельзя. Мы будем следить за развитием событий."
 bfdinews.11.a: "Да здравствует единый Гойки!"
 bfdinews.11.b: "В Кэсленде наступает стабильность."
 
 bfdinews.12.t: "Коллапс временного правительства!"
 bfdinews.12.desc: "Из Кэсленда приходят тревожные вести. В результате конфликта в кабинете, съезд обджектов переходного правительства Гойки развалился и прекратил свою работу, а окраины государства оказались заняты военными формированиями фракций. Вероятно, это конец недолгого перемирия между партиями."
 bfdinews.12.a: "Тёмные времена."
 
 bfdinews.13.t: "Новый год в Гойки"
 bfdinews.13.desc: "Вместе с первым снегом, в зелёных равнинах наступает рождество. Обджекты Кэсленда собираются вместе и весело празднуют. Со всех уголков Гойки доносится грохот салютов и смех. В связи с этим событием, наша редакция поздравляет вас с новым годом и желает вам счастливо его провести!"
 bfdinews.13.a: "С новым годом!"
 
 bfdinews.14.t: "Поджог СРП!"
 bfdinews.14.desc: "Новости из Кэсленда: Вчера загорелось здание Совета Рекомендованных Персонажей. Кабинет правительства сразу же обвинил в поджоге ячейки Рабочего Фронта, и на месте был задержан член местной компартии с партбилетом. Разбирательства продолжаются, и мы будем следить за развитием событий."
 bfdinews.14.a: "Провокация!"
 bfdinews.14.b: "Посмотрим."
 
 bfdinews.15.t: "Гражданская война в Кэсленде"
 bfdinews.15.desc: "Согласно сообщениям очевидцев, Временное Правительство, заседавшее в прежнем экономическом и политическом центре Гойки - Кэсленде, бежало. На окраинах происходят восстания, и местные самоуправления объявляют себя истинными наследниками Гойки. Также, они все объявили друг другу войну, хотя насилие между фракциями происходит ещё с убийства Клока. Пока что неизвестно, что из этого выйдет, но ясно одно: вокруг Кэсленда сейчас небезопасно. Мы предсказываем большой поток миграции из центральных регионов к окраинам."
 bfdinews.15.a: "Что, опять война?"
 
 bfdinews.16.t: "Окончание Гражданской Войны!"
 bfdinews.16.desc: "Спустя дни опустошительных боёв, Временное Правительство сумело восстановить свой контроль над своими территориями и подавить восстания на окраинах. Хоть это ещё и не конец, но это уже большой шаг к восстановлению стабильности в регионе."
 bfdinews.16.a: "Интересно."
 
 bfdinews.17.t: "Демократизация Кэсленда!"
 bfdinews.17.desc: "В результате жестоких боёв в Кэсленде и его пригороде, Демократическая Фракция смогла уничтожить своих противников и восстановить стабильность. Вчера Тако, как представитель нового правительства, заявила: 'Цель нового правительства - Создание единого демократического государства на просторах всего Южного Гойки.'"
 bfdinews.17.a: "Получится ли?"
 
 bfdinews.18.t: "Социализм пришёл в Кэсленд!"
 bfdinews.18.desc: "По итогу жестокой гражданской войны в сердце Гойки, рабочие шахт под предводительством Рабочего Фронта сумели уничтожить своих противников и установить 'диктатуру пролетариата' на всей территории бывшего Временного Правительства. Это уже очень сильно переполошило всех соседей нового государства, но пока что курс внешней политики местного правительства остаётся неясным."
 bfdinews.18.a: "Посмотрим."
 
 bfdinews.19.t: "Национальное Возрождение"
 bfdinews.19.desc: "Бои в районах Кэсленда уже практически затихли, и стал виден твёрдый победитель. Благодаря глубокой милитаризированности, Железная Рука смогла уничтожить своих противников и установить жёсткую власть над всеми территориями бывшего переходного режима. Агрессивные намерения нового режима стали очевидны уже для всех его соседей."
 bfdinews.19.a: "Жутко."
 
 bfdinews.20.t: "Обострение отношений в Зелёных Равнинах!"
 bfdinews.20.desc: "В результате нестабильности в Кэсленде, Республика Зелёных Равнин аннексировала приграничные территории и город Лэвнленд в целях защиты своих границ. Теперь, после восстановления стабильного правительства в сердце Гойки, между правительствами наблюдается значительное обострение отношений. Вероятно, скоро начнутся переговоры по региону."
 bfdinews.20.a: "Надеемся, что войны не будет."
 
 bfdinews.21.t: "Анархисты берут власть в Кэсленде!"
 bfdinews.21.desc: "После победы Рабочего Фронта в гражданской войне в Зелёных Равнинах строго устоялась мысль о том, что в регион наконец пришла стабильность. Но, внезапно, по континенту разлетелась новость: взбунтовавшиеся неизвестные боевики при огромном численном превосходстве смели режим Руби и объявили 'анархический строй'. Пока что о новом правительстве ничего неизвестно, и атмосфера в сердце региона накаляется. Мы будем следить за развитием событий."
 bfdinews.21.a: "Ещё один раскол?"
 
 bfdinews.22.t: "Война в Зелёных Равнинах!"
 bfdinews.22.desc: "Срочная передача! Войск Кэслендского режима перешли границу Республики и нанесли удар по войскам в оккупированном Лэвнленде! В Гринпорте объявлена мобилизация. Мэтч назвала этот акт агрессии 'типо, некрасивым поступком' и правительство объявило об экстренном положении. Судя по всему, война будет затяжной и кровавой. Со стороны Кэсленда неизвестно ничего."
 bfdinews.22.a: "Опять обджекты погибают."
 
 bfdinews.23.t: "Эзотерики в Кэсленде"
 bfdinews.23.desc: "После победы Железной Руки в гражданской войне, многие ожидали чего угодно, но, этого, пожалуй, не ожидал никто. По скупым данным от местного правительства, они объявили себя 'преемниками Великой Йойлолендской Расы' и пригрозили всем 'предателям и дегенератам' полным уничтожением. Новости из Кэсленда приобретают всё более радикальный характер, и это вызывает тревогу."
 bfdinews.23.a: "Йойлоленд?"
 
 bfdinews.24.t: "Коронация Пин"
 bfdinews.24.desc: "Интересные новости пришли на днях из Святого Обджектбурга. Местное правительство, образованное из командования флотилий, объявило о восхождении на самообъявленный престол Пин. Она уже приняла титул и стала первым монархом в истории Гойки. Пока что настроения соседних правительств нейтральны, но мы будем продолжать следить за развитием событий."
 bfdinews.24.a: "Монархия в Гойки?"
 
 bfdinews.25.t: "Объявлена Федерация Зелёных Равнин!"
 bfdinews.25.desc: "Сегодня утром наш корреспондент из Кэсленда передал важнейшие новости об итогах Демократического Съезда: правительства Гринпорта и Кэсленда объединяются в равноправный демократический союз! Это значительно меняет расстановку сил во всём регионе, и, возможно, Федерация распространится и на другие регионы."
 bfdinews.25.a: "Обджекты вновь едины."
 
 bfdinews.27.t: "Университет Гойки Разорён!"
 bfdinews.27.desc: "Срочные новости из обезумевшего Анонсерграда! Похоже, что население голодающего города поднялось на бунт и сравняло самый большой университет континента с землёй. Пока что конкретно ничего неизвестно, но эти новости уже вгоняют в ужас. Наши корреспонденты будут продолжать следить за развитием событий."
 bfdinews.27.a: "Трагично."
 
 bfdinews.28.t: "Взрыв в Университете!"
 bfdinews.28.desc: "Наши корреспонденты из Центрального Гойки сообщают о последствиях аварии, произошедшей неподалеку от Анонсерграда! Сообщается, что из города на юге был виден гриб из дыма высотой в несколько километров, а в городе выбило стёкла. Пока что неизвестно о количестве пострадавших, но мы продолжим следить за событиями."
 bfdinews.28.a: "Видимо, погибших много."
 
 bfdinews.29.t: "Провозглашение Технократической Республики!"
 bfdinews.29.desc: "Интересные новости прибывают из недавно охваченного катаклизмом Анонсерграда: восстановленная администрация Гойкийского Университета, устранив самые масштабные последствия кризиса, провозгласила 'Технократическую Республику, основанную на вечном движении технического прогресса'. Обджекты Анонсерграда, по оценке наших журналистов, поддерживают новую формацию. Мы продолжим следить за последними новостями из Анонсерграда."
 bfdinews.29.a: "Гольфболл смогла?"
 
 bfdinews.30.t: "Открытие Университета!"
 bfdinews.30.desc: "Наши корреспонденты в Анонсерграде зафиксировали широкий подъём настроения обджектов \"Технократической Республики\": продолжительный и дорогостоящий проект по восстановлению знаменитого Университета Гойки оказался успешен. Нашим журналистам удалось взглянуть на свежевозведённые корпуса новой альма-матер Гойки, и они действительно выгялядят просто чудесно!\nЭто, скорее всего, сильно укрепит позиции новообразованного государства на политической арене Гойки и оживит всю научную деятельность на континенте, если, конечно, правительство не решит оставить Университет в изолированном состоянии."
 bfdinews.30.a: "Отличные новости!"
 
 bfdinews.31.t: "Метеорит Над Гойки!"
 bfdinews.31.desc: "Прошлой ночью над Зелёными Равнинами была замечена ярко-белая комета, которая, согласно очевидцам, приземлилась недалеко от города Анонсерграда. Насколько нам известно, никто не пострадал, но ударная волна повредила некоторую районную инфраструктуру. Состав и происхождение метеорита пока неизвестен, но ходят слухи, что он состоит из очень редкого материала. Мы будем продолжать сделать за событиями вокруг этого происшествия."
 bfdinews.31.a: "Символ надежды."
 
 bfdinews.32.t: "Испытание Новой Бомбы!"
 bfdinews.32.desc: "Срочные новости поступают со всех Зелёных Равнин: похоже, что правительство \"Технократической Республики\" провело испытания нового типа вооружений. Взрывная волна достигла границ Кэсленда, а вспышку в небе было видно даже из Центрогойки. Если это действительно новый тип оружия, то это перевернёт всю ситуацию в Гойки с ног наголову: бомба такой силы, скорее всего, сможет стирать с лица Земли целые города.\nНаша редакция очень озабочена такими новостями и продолжит следить за развитием событий."
 bfdinews.32.a: "Ставки растут."
 
 bfdinews.33.t: "Полёт в Космос!"
 bfdinews.33.desc: "Нашим корреспондентам удалось запечатлеть уникальные кадры с взлётной площадки на полигоне \"Димплс\": впервые в истории Гойки, обджектам удалось пересечь границы стратосферы и устремиться в космос! Удивительный проект оказался возможным благодаря восстановлению Университета Гойки и огромным материальным вложениям правительства Технократической Республики.\nПохоже, что шаттл направляется прямо к спутнику Земли. Пока неясно, когда космонавты вернутся на Землю, но уже очевидно, что это перевернёт всю гонку вооружений между окружающими нациями."
 bfdinews.33.a: "Один шаг для обджекта..."
 
 bfdinews.34.t: "Неудачный Запуск!"
 bfdinews.34.desc: "Трагичные новости прибывают из Технократической Республики: похоже, что запуск давно разрабатываемой космической ракеты обернулся катастрофой. Скорее всего, во время запуска механизмов произошла авария и топливо сдетонировало, вызвал крупный взрыв и убив весь экипаж. Это серьёзно подорвёт престиж Университета Гойки и Технократической Республики в научной гонке с другими государствами. Мы будем продолжать следить за новостями вокруг этого печального события."
 bfdinews.34.a: "Первый блин - всегда комом."
 
 bfdinews.35.t: "Крах Экономики Дэвидленда!"
 bfdinews.35.desc: "Крушение экономических и политических связей в Южном Гойки ударной волной вызвало последствия и за пределами континента: Гойкийская Торговая Компания, один из ключевых игроков на всём рынке Дэвидленда, фактически перестала существовать. В связи с подрывом логистических связей и обострением ситуации в экспортных регионах Гойки, компания не смогла выполнить свои фьючерсы и её акции стремительно упали практически до нулевых значений. Огромное количество банков заявило о банкротстве, неспособные выполнять обязательства по вкладам. Это вызывает огромное недовольство в народной среде, и, скорее всего, пошатнёт многовековую монархию..."
 bfdinews.35.a: "Оу, серьёзно!?"
 
 bfdinews.36.t: "Война на севере!"
 bfdinews.36.desc: "Согласно военной корреспондеции, несколько часов назад войска Революционного Фронта пересекли нейтральную зону и атаковали пограничные заставы на территории Военного Округа канала Гойки. В отличие от предыдущих вооружённых столкновений, это, похоже, имеет в десятки раз большие масштабы, и, скорее всего, выльется в полноценную войну. События развиваются стремительно, и пока нельзя установить возможный исход данного конфликта. Мы будем продолжать следить за эксалацией ситуации."
 bfdinews.36.a: "Пламя тлеет."
 
 bfdinews.37.t: "Флут Гастролирует по Гойки!"
 bfdinews.37.desc: "Знаменитый на весь континент композитор, уже вписавший себя в историю своими легендарными \"Truth of a Legend\" и \"Frost Waltz\", объявил о масштабных гастролях со всем своим оркестром по малым и крупным городам Гойки! Почти везде театры ломятся от очередей из обджектов, желающих ухватить билет, хотя до объявленной даты выступления во многих городах ещё месяцы! Билеты в Кэсленде и Гринпорте уже раскуплены! Такого ажиотажа Гойки не видел уже давно. Пожелаем удачи талантливому артисту."
 bfdinews.37.a: "Знакомые мотивы."
 
 bfdinews.38.t: "[FROM.GetName] Объявляет о Банкротстве!"
 bfdinews.38.desc: "Похоже, что [FROM.GetAdjective] правительство объявило о невозможности выплат по своим долговым обязательствам и приняло жёсткие антикризисные меры. Похоже, что экономика на просторах нового анархичного Гойки ещё не смогла зрело сформироваться, и сегодня это бьёт по жизням многих обджектов. Наша редакция предсказывает и другие финансовые волнения на фоне подобных событий..."
 bfdinews.38.a: "Ужасно!"
 
 common_event.4.t: "Белый Мир?"
 common_event.4.desc: "Мы получили телеграмму от нашего врага, [FROM.GetName]. Они просят о мирном соглашении, поскольку нет четкой линии фронта, по которой одна сторона могла бы атаковать другую. Учитывая нашу неспособность продвигать войну, это может стать нашим выходом из конфликта. Каков будет наш официальный ответ?"
 common_event.4.a: "Согласиться"
 common_event.4.b: "Всё или ничего!"
 SEC_event.1.t: "Мы выиграли!" #Bullshit, remove later
 SEC_event.1.desc: "Мы одержали победу в пограничном конфликте, ура!"
 SEC_event.1.a: ":D"
 SEC_event.2.t: "Мы проиграли!" #Bullshit, remove later
 SEC_event.2.desc: "Мы потерпели поражение в пограничном конфликте, чёрт!"
 SEC_event.2.a: "D:"
 GOI_event.69.t: "Свобода воли!"
 GOI_event.69.desc: "Чтобы сделать Великогойкийский Батлрояль поинтересней, не хотите ли баффнуть ИИ?"
 GOI_event.69.a: "Нет."
 GOI_event.69.b: "Немного."
 GOI_event.69.c: "Средне."
 GOI_event.69.d: "Сильно."
 GOI_event.69.e: "О да, папочка"
 GGR_event.14.t: "Помощь от фашистов!"
 GGR_event.14.desc: "Несколько часов назад мы получили партию оружия из Рейха. Хотя они утверждают, что оно предназначено для \"Уничтожения бандитов\", вполне возможно, что оно используется для более масштабных целей, о которых у нас нет информации. Стоит ли нам принять этот импорт винтовок?"
 GGR_event.14.a: "Принять!"
 GGR_event.14.b: "Отклонить!"
 uncommon_event.1.t: "..."
 uncommon_event.1.desc: "К северу от Йойлосити растёт маленькое дерево. На первый взгляд, это обычное дерево, но это далеко не так. В его \"сердце\" заключена неизвестная древняя сила. О ней знали древние племена, жившие тысячи лет назад, но сегодня о ней помнят лишь немногие, которых называют \"сумасшедшими\". Однако так было до прибытия Лифи, сбежавшей от казни. Она всё ещё была на нервах, опасаясь, что кто-то преследует ее и жаждет крови. Это заставило её не исследовать Йойлосити, считая его населённым, а продолжать бежать дальше на север. После двух дней бега и беспокойства она наконец успокоилась. К счастью, Лифи выбрала именно это место для отдыха. Ее встревожил странный шум, который она услышала, и она поняла, что он исходит от дерева. Не найдя ничего лучше, она решила провести расследование. Она нашла небольшое отверстие в дереве и проникла внутрь. Оно оказалось больше, чем она ожидала, поскольку снаружи дерево выглядело довольно обычным. Она осмелилась забраться глубже в дерево и нашла \"сердце\". \"Сердце\" выглядело как обычное сердце, только больше и светилось неоново-зелёным светом. Недолго думая, Лифи потянулась к нему. В мгновение ока пространство озарил ослепительный свет. Настолько яркий, что Лифи потеряла сознание. Очнувшись, она оказалась на стадионе Йойлосити."
 uncommon_event.1.a: "Дерево проявило активность."
 uncommon_event.2.t: "ОНО"
 uncommon_event.2.desc: "Оно жаждет\n\nОно жаждет\n\nОно жаждет\n\nОно жаждет\n\nОНО ЖАЖДЕТ\n\nОНО ЖАЖДЕТ\n\nОНО ЖАЖДЕТ\n\nОНО ЖАЖДЕТ\n\nОНО ЖАЖДЕТ"
 uncommon_event.2.a: "Оно жаждет... Техаса?"
 uncommon_event.2.b: "Оно жаждет."
 uncommon_event.3.t: "\"Где я?\""
 uncommon_event.3.desc: "С этими словами Рик Перри огляделся вокруг. Он как раз размышлял над законопроектом о здравоохранении, когда... что-то случилось? Для него это было мгновение, и вот он здесь. Земля выглядела странно, слишком красочно, чтобы быть самой землей, но почему-то напомнила ему детство. Может, это были обои Windows?\n\nСзади послышались быстрые шаги, прервавшие его размышления. Это были шаги Марка Милли и нескольких солдат, следовавших за ним. \"Сэр, вы в порядке?\" - спросил Милли. Перри обернулся, быстро взглянув на него, и ответил: \"Я в порядке, что случилось? Что происходит? Милли пожал плечами. Он проводил инспекцию, когда тоже моргнул, и попал сюда. \"Кто-то...\" - начал говорить Милли, взглянув на компас, - \"...к западу отсюда имел радио и поддерживал связь со своими, но только с людьми здесь...\". \"Только с людьми здесь?\" - спросил Перри. - \"Другие подразделения, которые находятся в том же районе, что и мы, никакого высшего командования или правительства\".\n\nЭто было крайне странно, и оба они обдумывали дальнейшие действия. Милли указал на соседнее здание, похожее на отель. \"Давайте соберем всех там, мы выясним, что происходит\", - заметил он. Перри посмотрел на него, понимая, что это единственная хорошая идея, которая у них была на данный момент."
 uncommon_event.3.a: "\"Хорошо.\""
 uncommon_event.4.t: "Вот мы и здесь."
 uncommon_event.4.desc: "Прошло уже несколько дней с момента странной телепортации. Здание, похожее на отель, теперь превратилось во временное помещение правительства. Комнаты используются для правительственных чиновников и военнослужащих. Вестибюль превратился в импровизированный зал заседаний Законодательного собрания, где Палата представителей и Сенат по очереди занимают помещения. Небольшое кафе и кухня остались без изменений. Наконец, номер на верхнем этаже теперь занимает Перри. Снаружи находилась импровизированная военная база, которая также служила штаб-квартирой, и множество самодельных домиков, построенных людьми из чего попало.\n\nПроблема заключалась в людях. Их жалобы были вполне обоснованными: нехватка еды и жилья. Люди и так были на грани смерти из-за отсутствия всего необходимого для жизни. По оценкам, сюда вместе с техасским правительством было телепортировано около 500 тысяч человек. Это было слишком много для этого острова с его скудными запасами. Ситуацию усугубляло то, что у каждого в правительстве были свои идеи по решению растущих проблем.\n\nОднако не всё было так уж плохо. Было также отправлено значительное количество гражданской и военной техники. Эта техника включала в себя оружие, трекеры, компьютеры и даже самолёты. Если позволит время, они смогут пробиться из этой передряги и помочь нам лучше понять наше положение."
 uncommon_event.4.a: "Надо немного подождать."
 uncommon_event.5.t: "Семя"
 uncommon_event.5.desc: "У Рика Перри уже несколько часов болела голова. Перепалки между Палатой представителей и Сенатом его совсем измотали. У всех были идеи, некоторые из них были хорошими, а другие лучше бы оставить в прошлом. Проблема заключалась в том, что никто не был един в вопросе о том, как разрешить многочисленные кризисы, которые возникли менее чем за месяц. Если что-то и нужно было сделать, то это должно было произойти быстро, прежде чем все закончится.\n\nВ душе Перри уже довольно давно зародилась мысль. Он уже забыл, когда, где и кто её посеял. Эта мысль росла последний месяц, и пламя хаоса не угасало. Суть этой мысли была очень проста: взять полный контроль над правительством, пока не станет виден более ясный путь. Радикальная мысль, конечно, но по сравнению с тем, что представлял собой \"план\", это была бы лучшая идея.\n\nНабравшись смелости, Перри встал со стула и направился к импровизированной трибуне. Разговор о том, как распределить еду, быстро затих, пока все наблюдали за тем, как Перри идёт. Чувство тревоги охватило его, когда Перри приблизился к трибуне. Несмотря на это, никто ничего не предпринял, чтобы остановить его. Он начал объяснять свои планы на будущее и заявлял, что будет полностью контролировать ситуацию, если только кто-то не захочет бросить ему вызов.\n\nК его удивлению, никто не осмелился этого сделать."
 uncommon_event.5.a: "Посев взошёл."
 uncommon_event.6.t: "Не Одни"
 uncommon_event.6.desc: "Мануэль \"Тони\" Родригез проживал на военном форпосте недалеко от единственного моста на острове. Судя по запущенности и повреждениям от боевых действий, мост казался непригодным для использования. Это показалось Родригезу странным. Он был назначен одним из командиров сил, телепортированных на остров. Ему было любопытно узнать, что находится по другую сторону моста. С их точки зрения, там виднелась лишь гораздо большая территория, чем та, на которой они находились. Ещё большее беспокойство вызывало движение, замеченное в предметах, похожих на школьные принадлежности гуманоидов. Разведывательных миссий не проводилось, так как основное внимание уделялось спасению населения от голода и временной работе полиции.\n\nОднако, когда ситуация немного успокоилась, у Родригеза появились необходимые ресурсы для проведения разведывательной миссии на другой стороне. Она предполагала, что отряд из 143-го пехотного полка проберётся по разрушенному мосту и доберётся до другой стороны. После этого они осмотрятся и сообщат о своих находках. Довольно простая миссия для Родригеза и отряда. Она была запланирована за несколько дней до того, как произошло \"событие\".\n\nУпомянутое \"событие\" произошло несколько часов назад. Всё началось с того, что три неизвестных гуманоида приблизились к аванпосту по мосту. Поскольку никто раньше не пытался этого сделать, и их намерения были неизвестны, на аванпосте была объявлена ​​полная тревога. Напряжение нарастало по мере их приближения. Один из солдат закричал на них, требуя объяснить, что происходит. К всеобщему удивлению, они проявили любопытство к нам и острову. Они заявили, что остров, на котором мы находимся, называется \"Остров Мечты\" и исчез по неизвестным причинам. После дальнейшего обмена информацией трое ушли. Родригез поспешил сообщить новую информацию, которую они получили сегодня."
 uncommon_event.6.a: "Новый мир."
 uncommon_event.7.t: "СЕНСАЦИЯ: ОСТРОВ МЕЧТЫ ВЕРНУЛСЯ?"
 uncommon_event.7.desc: "Неясно, как и почему он вернулся, но сообщения от обджектов из Бриджтауна, которые прошли по разрушенному мосту на Остров Мечты, утверждают, что Остров Мечты снова на месте! Однако в этих же сообщениях отмечается, что на острове теперь проживает группа иноземцев. Они утверждают, что прибыли из \"Соединенных Штатов Америки\", а точнее, из региона под названием \"Техас\'. Эти существа, называющие себя \"человеками\", заявляют, что они попали сюда по неизвестным причинам. Эти \"человеки\", похоже, более технологически развиты, чем любой другой регион Гойки. Рекомендуется не посещать остров, так как они, похоже, находятся в напряжении и готовы к нападению по неизвестным причинам. Различные отколовшиеся государства в Гойки уже заявили о своих законных правах на Остров Мечты. Однако их возможности заявить об этом ограничены. Считается, что это лишь вопрос времени, когда остров будет захвачен или..."
 uncommon_event.7.a: "Остров по праву Наш!"
 uncommon_event.7.b: "Серьёзно? После развала Гойки!?"
 uncommon_event.7.c: "Тревожно..."
 uncommon_event.8.t: "Подготовка Почвы"
 uncommon_event.8.desc: "Остров обладает интересными особенностями. Он занимает площадь около 630 акров, на его территории располагался отель, который сейчас является правительственным зданием, казино, которое до сих пор используется в качестве такового, 6 ресторанов, которые были переоборудованы в импровизированные столовые и магазины, и, наконец, роботы-слуги, большая часть которых хранилась на импровизированном складе, а некоторые использовались несколькими политиками.\n\nОколо 400 акров земли можно использовать по своему усмотрению. \"Идеально подходит для жилищного строительства и хороших сельскохозяйственных угодий\", - сказал Тодд Стейплс на конференции с Перри и генеральными директорами различных компаний. Эти компании либо тоже были телепортированными элементами, либо совершенно новыми предприятиями, каждое из которых хотело доказать свою состоятельность. Несмотря на то, что разные генеральные директора хотели реализовать разные проекты, такие как футбольный стадион, Перри согласился с тем, что для любого дальнейшего строительства на первом месте должны быть люди.\n\nЭто решение было принято как раз в тот момент, когда у отеля рыдала мать. Она родилась и выросла в Остине, у нее было прекрасное детство. Она окончила Техасский университет в Остине, получив степень магистра сестринского дела. После 15 лет непростой работы она вышла замуж и позже родила ребенка. Казалось, в ее жизни ничто не могло пойти не так.\n\nТеперь, спустя 3 года после рождения, она наблюдает за последствиями болезни для своего сына. Телепортировались только они вдвоем, отцу повезло (или не повезло), что его не телепортировали. Болезнь можно было бы вылечить в обычном мире, но импровизированные больницы и персонал перегружены, испытывают нехватку ресурсов и работают на пределе своих возможностей, что можно увидеть только в разрушенном войной городе. Глаза сына закрываются, и через час он умирает. Плач становится все громче."
 uncommon_event.8.a: "Часики тикают..."
 uncommon_event.9.t: "Мораль и Деньги"
 uncommon_event.9.desc: "Вокруг множества самодельных домиков находится новое здание, строительство которого близится к завершению. Это полноценное здание, соответствующее всем нормам, даже с электричеством - редкое явление, встречающееся только в зданиях, уже существовавших на Острове Мечты. Теперь вопрос в том, каким должно быть это здание после завершения строительства. Запасы продовольствия по-прежнему ограничены, поэтому многие из голодающего населения хотят, чтобы здесь разместилась столовая для нуждающихся. Эти требования зашли так далеко, что уже избрана ответственная за её работу женщина по имени Изабелла.\n\nОднако число возможных планов увеличилось, поскольку недавно реорганизованная корпорация Whataburger обратилась в офис государственного секретаря Техаса Эсперансы \"Хоуп\" Андраде. Они предложили в обмен на право собственности на здание более тесное сотрудничество с правительством Техаса. Это заманчивое предложение для Андраде, поскольку их услуги могли бы обеспечить население столь необходимыми продуктами питания и товарами по более выгодной цене, чем услуги какого-либо случайного человека. С другой стороны, расширение прав и возможностей населения принесло бы столь необходимую победу испытывающему трудности правительству.\n\nКомпания Whataburger дала Андраде 10 дней на принятие решения по поводу здания. Она немедленно позвонила Рику Перри, и они обсудили, какие действия следует предпринять. После нескольких часов переговоров они пришли к одному и тому же выводу..."
 uncommon_event.9.a: "'Помочь голодающим!'"
 uncommon_event.9.b: "'Смотреть вглубь!'"
 uncommon_event.10.t: "Взор Свыще"
 uncommon_event.10.desc: "Растрёпанная женщина оглядывается назад и видит другую женщину примерно того же возраста. Обе стоят в одной из многочисленных очередей в столовых для бездомных, ожидая еды. Кухни работают сверхурочно и используют ограниченные запасы продуктов. Сегодня был особенно ужасный день: на Остров Мечты обрушился сильный шторм.\n\n\"Уже нет сил так жить!\" — восклицает одна.\n\n\"Кто-нибудь свыше на нас ещё смотрит...\"\n\n\"Во время такой разрухи?\"\n\n\"Нам всё равно нельзя сдаваться!\"\n\n\"Будто Господь нас ещё видит...\"\n\nИ тут, словно по волшебству, буря начала утихать."
 uncommon_event.10.a: "И проглянулась радуга."
 uncommon_event.11.t: "Мобилизация"
 uncommon_event.11.desc: "С момента телепортации наши старые воинские части пытались реорганизоваться в соответствующие полки. Это включает в себя части знаменитой 36-й пехотной дивизии и мощной 1-й бронетанковой дивизии. Сегодня Техасская национальная гвардия наконец завершила реорганизацию в 4 бригады. Однако другие части всё ещё не спешат приводить себя в боевую готовность. Мануэль \"Тони\" Родригез и Энтони Р. Иерарди прилагают значительные усилия для подготовки подразделений, но оба предсказывают, что на это уйдут годы."
 uncommon_event.11.a: "С чего бы воинским частям требуются \"годы\"?"
 uncommon_event.12.t: "Мобилизация продолжается"
 uncommon_event.12.desc: "В мобилизации участвовали не только сухопутные войска, но и военно-воздушные силы. К счастью, часть самолетов находилась на земле, когда произошла телепортация. Однако значительная часть из них находилась в воздухе и была вынуждена совершить несколько аварийных посадок на Острове Мечты. Некоторые сообщения даже говорят о том, что их может быть больше. В любом случае, военно-воздушные силы перестраиваются аналогично сухопутным войскам."
 uncommon_event.12.a: "Если бы были ещё самолёты, они бы использовали радио?"
 uncommon_event.13.t: "Безумные Цифры"
 uncommon_event.13.desc: "В одном из местных магазинов одежды к прилавку подходит пожилой мужчина. Несколько недель здесь действовала в основном бартерная система. Люди приносили самые разные ценные вещи в обмен на одежду - так уж было заведено, поскольку доллар, похоже, полностью обесценился, несмотря на усилия техасского правительства. Ну, вот так...\n\n\"В смысле только доллары?\" - вопросил старик взволнованным тоном.\n\n\"Извините, теперь это наша политика\" - отвечала молодая девушка за кассой.\n\n\"Н-но ещё вчера вы принимали!...\"\n\n\"Новые приказы сверху.\"\n\n\"От ваших идиотов-менеджеров, или от идиотов из отеля?\"\n\n\"...От всех...\"\n\nОни посмотрели друг на друга, не предпринимая никаких действий.."
 uncommon_event.13.a: "Но когда за ним выстроилась очередь, он ушёл и в гневе направился к новому банку."
 uncommon_event.999.t: "Конец"
 uncommon_event.999.desc: "Привет, картокрас! Ты подошел к концу этого безумного и дикого техасского приключения. Для большего удовольствия в финальной части игры добавлены новые решения, включая объявления войны! Спасибо за прохождение этого пути! Что касается обновлений в будущем, спросите ZD*bbz, работает ли он над основным контентом мода или просто ленится. Если ленится, то можете быть уверены, что этот путь будет обновлен!\n\n- Pun (никогда не был в Техасе)"
 uncommon_event.999.a: "Пора захватить Гойки >:D" #pun i think youre gay (Fuck you)
 YFC_event.1.t: "Компания с Государством"
 YFC_event.1.desc: "Мы, корпорация Йелоу Фейс, решили, что нам нужно собственное место для ведения бизнеса. Наши сотрудники дали клятву жить в одном из многочисленных городов, находящихся под контролем Корпорации (и, конечно же, мы пригрозили им снижением заработной платы в случае отказа), но легитимность правительства по-прежнему довольно низка. Важно, чтобы мы позволили другим компаниям размещаться в нашей стране и способствовали процветанию свободного и справедливого рынка. В конце концов, мы не хотим, чтобы все находилось в государственной собственности, иначе мы скатимся к социализму.\n\n§RСейчас, нам нужно балансировать наш бюджет и разумно распоряжаться снаряжением...§!" #Minor way of telling the player to not waste their money
 YFC_event.1.a: "На деревьях вместо листьев..."
 YFC_event.2.t: "Южные Бандиты"
 YFC_event.2.desc: "Вчера Пайп, руководитель железнодорожного сектора, приехал к нам из Навгорныва, где мы занимаемся иностранными инвестициями, чтобы сообщить компании Йелоу Фейс о недавнем инциденте. Они заявили, что на их сотрудников напали жестокие бандиты, и что из здания, в котором они работали, были украдены несколько тысяч долларов, а также десятки оцинкованных стальных прутков. К сожалению, они сообщили нам, что прибыль будет снижена до тех пор, пока они не смогут восстановиться. Однако этот инцидент не был единичным. Другие страны, такие как ВГЖД-Юг и Нумизматия, сообщали о подобных, а иногда и довольно жестоких нападениях на некоторые из своих объектов вблизи границы с Бандой Эрейзера.\nКроме того, сегодня Йелоу Фейс получил письмо от самого Эрейзера, в котором тот просит Корпорацию разрешить им проехать через нашу территорию, чтобы \"накопить богатство и стимулировать экономику\". Несмотря на то, что Эрейзер явно лжет о своих намерениях, это поднимает важный вопрос. Стоит ли нам разрешить обджектам Эрейзера путешествовать по стране?"
 YFC_event.2.a: "Если хотят пройти, то пусть попробуют!"
 YFC_event.2.b: "Мы можем дать разрешение... за плату."
 YFC_event.3.t: "Сообщение из ВГЖД-Юг"
 YFC_event.3.desc: "Вренч из Южного железнодорожного управления недавно направил корпоративному руководству сообщение. Они заявили, что больше не желают контролировать город Навгорныв из-за его близости к Банде. Они предложили продать нам эту территорию за очень низкую цену. Кроме того, Вренч заявил, что также хочет продолжить сотрудничество с нашим железнодорожным сектором, несмотря на то, что по-прежнему не желает поддерживать официальные дипломатические отношения ни с одной страной. Если мы не примем это предложение, они, вероятно, просто оставят территорию себе, а если они не будут хорошо управлять городом, он может перейти под контроль Банды."
 YFC_event.3.a: "Кто скажет \"нет\" дешёвой земле?!"
 YFC_event.3.b: "Только через мой труп."
 YFC_event.4.t: "Нумизматия хочет сотрудничества"
 YFC_event.4.desc: "Министры-нумизматийцы недавно направили сообщение нашему Военному сектору, заявив о своем желании помочь нам в войне с Бандой. Это никого в нашем правительстве не удивило, поскольку такой исход казался вероятным всего через несколько дней после того, как мы приняли дипломатические меры против банды."
 YFC_event.4.a: "Братья по оружию!"
 YFC_event.4.b: "А если подумать..."
 YFC_event.4.c: "Поздновато..."
 YFC_event.5.t: "ДЕНЬГИ!!!"
 YFC_event.5.desc: "Отчёт за неделю №62, Военный Сектор\nДЕНЬГИ!!!\n\nНедавно, после захвата \"столицы\" Банды (всего лишь глупой общины диких разбойников, но мы должны называть вещи своими именами), мы обнаружили здание с запасами чистого золота! Мы приказали нашим солдатам пересчитать его, и когда они закончат, мы отправим его прямиком самому Йелоу Фейсу. Разве это не здорово? ДЕНЬГИ!!\nКонец передачи."
 YFC_event.5.a: "Смотрите за этими поганцами в оба!"
 YFC_event.6.t: "Окно Возможностей"
 YFC_event.6.desc: "Пока наши друзья на севере сражаются с анархическими бандитами, у нас есть уникальный шанс устроить засаду на рейдерам на юге, чтобы помочь корпорации. Наши лучшие генералы и маршалы обсудили ситуацию с Кредит Кард, и мы пришли к выводу, что, возможно, настало подходящее время присоединиться к войне, помочь нашим друзьям... и заодно \"накопить\" немного \"богатства\'."
 YFC_event.6.a: "Послать телеграмму!"
 YFC_event.6.b: "Не стоит..."
 YFC_event.7.t: "Удар в спину."
 YFC_event.7.desc: "После нескольких недель бездействия стало ясно, что Йелоу Фейс не хочет, чтобы мы ввязывались в войну. Возможно, он считает, что война должна оставаться локальной, или же он хочет заполучить богатства только для себя. В любом случае, генералы жаждут боя, так что, возможно, стоит разозлить наших друзей."
 YFC_event.7.a: "Вперёд!"
 YFC_event.7.b: "Не стоит."
 YFC_event.8.t: "ИНЦИДЕНТ №46"
 YFC_event.8.desc: "Прошла всего неделя с момента установки контрольно-пропускного пункта Б вдоль предполагаемой \"границы\" между Корпорацией и бандитами. День проходил как обычно: несколько беженцев пересекли границу, были произведены аресты, и кто-то случайно выстрелил из пулемета. День подходил к концу, как обычно... Но ночью охранники контрольно-пропускного пункта B заметили множество обджектов, направляющихся к ним. Они заявили, что \"границы открыты\" и что у охранников на пункте нет реальной власти. После бурной перепалки раздался выстрел, который привел к открытому бою. Это были не беженцы, а бандиты. Они попытались штурмовать контрольно-пропускной пункт, оттеснив немногочисленных охранников. Несмотря ни на что, охранники держались до конца и заставляли бандитов платить за каждый шаг вперёд. Даже после захвата контрольно-пропускного пункта охранники отступили вглубь страны и продолжили бой. В одном интересном отчете говорилось, что отряд из восьми обджектов, засевший в хижине под командованием Водка Ботл, отбил атаку примерно ста обджектов и потерял всего три объекта за пять часов боя.\n\nНочь сменилась днём, и бои только накалились. С помощью подкреплений объединенные силы оттеснили бандитов к блокпосту. Только с наступлением ночи бандиты отступили с блокпоста. Блокпост был отбит на следующий день. Многие из участников боя были награждены медалями за храбрость. Общее число погибших все еще подсчитывается, но в боях пострадали как солдаты, так и мирные жители. От жителей бандитских земель ответа пока не поступало."
 YFC_event.8.a: "Быстрая Эскалация..."
 YFC_event.9.t.a: "Вопрос от Йелоу Фейса"
 YFC_event.9.t.b: "Потеря Доверия"
 YFC_event.9.desc.a: "Ни для кого не секрет, что Корпорация \"сблизилась\" с бандитской группировкой на юге континента. Мы также получили сообщения о том, что некоторые другие страны уже начали вводить эмбарго против компании, надеясь разорвать партнёрство до того, как ситуация выйдет из-под контроля. Мы тоже придерживаемся этих убеждений: разграбление континента государством-рейдером было бы ужасным ударом по средствам к существованию нашего народа. Хотя, с другой стороны, доход от продажи излишков нам очень помогает в экономическом плане. Разумно ли вводить эмбарго против корпорации?"
 YFC_event.9.desc.b: "Мы получили информацию о том, что Йелоу Фейс, с которым мы только начали торговать, теперь сотрудничает с налётчиками на севере. В связи с этим преждевременным предательством со стороны Компании было решено захватить часть активов и прекратить с ними торговлю. Ауф видерхёрен, хёсслихе бандитен!"
 YFC_event.9.desc.c: "Йелоу Фейс снова отличился. После ночи, проведенной за изучением бессмысленной спам-почты, один из делегатов обнаружил, что Корпорация в очередной раз действовала за нашей спиной и предала наше доверие. Однако на этот раз мы намерены разорвать с ними все связи раз и навсегда. Теперь они официально являются союзниками Банды, расположенной к северу от нас, а это значит, что они, вероятно, спонсировали различные набеги и грабежи, которые эта группа совершала в наших городах и поселках в последние месяцы. Большинство наших делегатов согласны, что мы должны полностью разорвать связи с Корпорацией. А вы согласны?"
 YFC_event.9.desc.d: "Мы видим, что происходит. Не секрет, что на всем континенте больше никто не поддерживает Йелоу Фейса. Честно говоря, нас это интересует только ради денег, но если мы продолжим поддерживать Йелоу Фейса, это будет выглядеть очень плохо. С тяжелым сердцем мы решили наложить на компанию эмбарго, как и весь континент... Верно? Мы же это делаем, верно?" #large stability and pp hit if no
 YFC_event.9.a: "Да!"
 YFC_event.9.b: "Переждём... пока что." #See focus
 YFC_event.9.c: "Мочить в сортирах!"
 YFC_event.10.t.a: "Трагические Новости!"
 YFC_event.10.t.b: "Разрыв Связей."
 YFC_event.10.desc.a: "[FROM.GetName] наложили на нас эмбарго!"
 YFC_event.10.desc.b: "В один спокойный день в корпоративном офисе нам принесли резкое письмо от тех, кто, как мы думали, навсегда останется с нами солидарен. Нумизматийцы по-идиотски решили разорвать с нами все связи. Это, очевидно, ужасно глупый и дерзкий поступок с их стороны, но еще хуже то, что они решили ПУБЛИЧНО об этом заявить. Они разослали всем изданиям, которые слушали, что мы работаем с \"грабителями\" и \"разжигателями\". Неужели они ничего не понимают в бизнесе? Мы, конечно, не поддерживаем всё, что делает Банда; это ради денег. Нумизматийцы, конечно, часто работают с социалистами, но наши уважаемые сотрудники корпорации не отзываются о них плохо. Это просто деньги. Это прибыль. Это игра.\nСитуация ещё больше усугубляется: они также заявляют новостным каналам, что идеологически отдалились от нас, и осуждают нашу экономическую систему как \"кумовской капитализм\". Они утверждают, что их экономика - единственный истинно капиталистический способ производства. С этого дня нумизматическое фарсование не знает границ. Мы не заинтересованы в дальнейшем сотрудничестве с ними."
 YFC_event.10.a: "Они ничего не знают! Они... фиолетовые!"
 YFC_event.10.b: "Какие \"полезные\" союзники!" #For CRN
 YFC_event.11.t: "Сколько?"
 YFC_event.11.desc: "Неудивительно, что огромные суммы денег, которые Эрейзер сумел накопить за месяцы своей грабежной деятельности, могли бы пригодиться для наших усилий по индустриализации. Однако многие из наших лидеров секторов открыто спорят о точной необходимой сумме. В попытке смягчить напряженность между секторами, Йелоу Фейс решил вмешаться и принять конкретное решение. Он заявил, что мы..."
 YFC_event.11.a: "Ничего не возьмём."
 YFC_event.11.b: "Возьмём немного."
 YFC_event.11.c: "Возьмём половину."
 YFC_event.11.d: "Возьмём большую часть."
 YFC_event.12.t: "Новые Лица!"
 YFC_event.12.desc: "Недавно мы получили сообщения от восточных сотрудников о том, что на нашей территории неуклонно растет популяция тирдропперов. Они утверждают, что родом из Пляжной территории, и что многие из них массово покидают её из-за перенаселенности. Кроме того, похоже, что эти клоны Тирдроп приобрели совершенно иную внешность, чем сама Тирдроп. Один из обджектов, который, видимо, является \"организатором сообщества\" и называет себя Дьюдроп, едва ли похож на бывшую участницу BFDI. Тем не менее, эти новые тирдропперы действительно платят налоги, поэтому мы не будем вмешиваться в их дела."
 YFC_event.12.a: "Занимательные ребята!"
 YFC_event.13.t: "Вопрос Главы"
 YFC_event.13.desc: "После невероятно долгого судебного процесса, который, честно говоря, больше походил на дебаты, было принято решение. Почти всю ночь главы секторов стояли и горячо спорили между собой о судьбе предыдущего лидера мелкого рейдерского \"государства\". Эрейзер фактически отсутствовал на собственном суде, оставшись в камере в углу здания суда. Вполне вероятно, что главы секторов коллективно забыли о его присутствии. Ну, за исключением Пайп, который делал грубые рисунки обджекта, который тыкали и кололи различными способами. Что же именно не так с руководителями нашей компании? Йелоу Фейс уснул к тому времени, как было принято окончательное решение. Быстро проснувшись и узнав о достигнутом согласии от Топхэта, Йелоу Фейс прочитал последнее предложение:"
 YFC_event.13.a: "Оправдан и может присоединиться к Корпорации!"
 YFC_event.13.b: "30 лет исправительных работ!"
 YFC_event.13.c: "Высшая мера!"
 YFC_event.14.t: "Экспроприация Экспроприаторов"
 YFC_event.14.desc: "Из всех дискуссий, которые вели сектора и Йелоу Фейс, эта длилась всего несколько минут. Кто помешает нам \"переместить\" их деньги? Воздух в нашем конференц-зале? Кроме того, эти богатства будут использованы гораздо эффективнее под нашим контролем, чем просто валяться без дела.\nСпустя неделю после совершенно очевидных результатов голосования Блоки вошел на склад, где хранились огромные богатства бывшей Банды. Он в последний раз взглянул на все это, словно одна глава его жизни закончилась, а на ее месте началась новая. Хотя он должен был испытывать какие-то эмоции, возможно, печаль, муку, даже сожаление..."
 YFC_event.14.a: "Но он не почувствовал ничего...?" #800K Taken
 YFC_event.15.t: "Морская Торговля" #fires right after finishing YFC_focus_scope_out_sea_trade
 YFC_event.15.desc: "До нашего сведения дошло, что, по словам некоторых наших жителей, проживающих восточнее, Море Святого Камешка находится значительно ближе, чем мы предполагали ранее. Использование этой возможности для расширения наших торговых путей через море, хотя и может быть дорогостоящим в краткосрочной перспективе, может принести большую прибыль. Очевидно, нам потребуется привлечь более образованных обджектов для тщательного изучения этого района, чтобы определить, какое место лучше всего подойдет для создания небольшого порта на данный момент.\nЖители восточных регионов, связавшиеся с нами, действительно заявили, что они совершенно не против проведения полевых исследований в этом районе. Однако уверены ли мы в том, что разумно доверять жителям Пионила и Йойлтона в предоставлении ими точной информации?"
 YFC_event.15.a: "Пусть местные решают, им лучше знать." #takes longer to get event 16
 YFC_event.15.b: "Деньги ускорят всё!" #Reworded so it tells the player that this is faster
 YFC_event.16.t: "RE: Морские Торговые Пути"
 YFC_event.16.desc: "Небольшая эскадра, которую мы отправили исследовать восток, вернулась к нам, представив результаты своих исследований. Похоже, что существует множество мест, которые могли бы стать небольшими, прибыльными портами. По их словам, несколько участков востока выступают в небольшие полуострова, что значительно упростило бы судоходство. Пока мы приказали им обосноваться в ближайшем доступном месте, однако, если мы расширимся дальше, восток может стать чрезвычайно прибыльным регионом. К сожалению, похоже, что некоторые представители сектора пока не поддерживают эту идею, ссылаясь на то, что у нас не будет достаточно времени для этого начинания. Вероятно, они правы, конечно, но попробовать это в будущем определенно не помешает."
 YFC_event.16.a: "По крайней мере, у нас есть хороший плацдарм!" #gives some money and state 225, setting the vp there to 12 instead of 1 (RE: Just gonna turn this into a VP, can be increased later)
 YFC_event.17.t: "Пленные"
 YFC_event.17.desc: "В ходе недавних переговоров Блоки поднял идею освобождения нескольких экстремистов, взятых нами в плен во время войны. Мы действительно заключили в тюрьму многих из них, приговорив к очень длительным срокам за многочисленные преступления. Однако их освобождение выставило бы Блоки героем, что, вероятно, повысило бы его поддержку на бывших землях Банды. Всем известно, что наше население не особо интересуется тем, что происходит в других местах, поэтому нам не стоит беспокоиться об их мнении по этому поводу. Хотя Сектора неоднократно заявляли, что не хотят освобождения многих из них. Бикер конкретно заявила, что у нас \"нет причин обращаться к этим преступникам\", а Топхэт согласился, сказав, что \"варвары на юге не заслуживают нашего уважения\". Так какова же будет судьба военнопленных?"
 YFC_event.17.a: "Отпустите тыловиков."
 YFC_event.17.b: "Отпустите рядовых."
 YFC_event.17.c: "Отпустите почти всех."
 YFC_event.18.t: "Дебаты Приближаются!"
 YFC_event.18.desc: "Предвыборная кампания последних нескольких недель была довольно однообразной: некоторые обджекты заявляли, что, скорее всего, не будут голосовать ни за одного кандидата. Нумизматия категорически против этой ситуации, заявляя, что \"голосование народа крайне важно\", по какой-то причине. Чтобы сделать ситуацию интереснее для обычного жителя Банды, Нумизматия решила провести дебаты в Сноупатхе между кандидатами. Эрейзер и Пен уже запланировали участие, а это значит, что Блоки, вероятно, тоже захочет последовать их примеру. Очевидно, мы тоже хотели бы, чтобы Блоки принял участие в этих дебатах, поскольку это может стать для него хорошей возможностью. Это может быть наш шанс обеспечить победу на выборах. Вложение в прибыльную марионетку более чем оправдано."
 YFC_event.18.a: "Мы можем купить судей?"
 YFC_event.19.t: "Лицо Новой Банды"
 YFC_event.19.desc: "Блоки отправил письмо по почте всего через несколько дней после падения Банды, заявив о своем желании сотрудничать с нами. В течение нескольких месяцев мы держали это письмо в уме, и сегодня он пришел напомнить нам об этом предложении. Нумизматия была одержима идеей \"демократического\" \"избрания\" нового лидера на бывших анархических землях, однако никто из наших Секторов на самом деле не знает, что означают эти слова. Тем не менее, в тот же день, когда Блоки посетил нас, они попросили нас выдвинуть его кандидатуру. Он изложил масштабные и прибыльные планы для бывших анархистских земель. Честно говоря, его готовность сотрудничать с нами кажется немного странной. Хотя, кем бы мы были, если бы не поддержали его кандидатуру?"
 YFC_event.19.a: "Мы были бы дураками, нищими дураками."
 YFC_event.20.t: "\"Новый Курс\" Блоки"
 YFC_event.20.desc: "Хотя мы не особо следили за событиями, похоже, выборы проходят успешно. Блоки ведёт предвыборную кампанию, обещая масштабные реформы, но до сегодняшнего дня он не говорил о своих планах. Недавно он посетил Йелоу Фейса и глав Секторов, изложив свои точные планы относительно бывшей Банды. Блоки, кажется, прекрасно понимает саму суть страны, из которой он родом, поскольку его идеи национального единства хорошо сочетаются с идеями среднестатистического сторонника Банды. Во-первых, он хочет сделать транспортное сообщение между поселениями бандитов доступным и эффективным. Он хочет превратить Подгорныв в настоящий город с реальными рабочими местами и сделать то же самое для большинства других поселений. Он хочет предоставить бывшим сторонникам Банды, независимо от их преступлений, лёгкий путь к свободе, если они будут вести себя как любой хороший капиталист. Наконец, у него, похоже, довольно \"спокойная\" иммиграционная политика, что, кажется, очень нравится большинству сторонников Банды. Короче говоря, Блоки, как ни странно, не так уж и глуп, как мы думали; включение этих планов в его выступления и прочее наверняка принесло бы ему победу на выборах. Почему он попросил нашего разрешения, мы не знаем, потому что"
 YFC_event.20.a: "Наш ответ ясен."
 YFC_event.21.t: "Сложности в Военном Округе!"
 YFC_event.21.desc: "Поскольку мерзкие, грязные коммунисты с севера вторглись в страну нашего союзника, Койни попросил нас вернуть всю помощь, так как им придётся отступить, чтобы защитить его страну. К сожалению, это справедливая просьба, в которой мы не можем отказать. Исход войны останется неизвестным, победит ли вообще кто-нибудь. Мы могли бы отправить помощь Койни...\n\nНо должны ли?"
 YFC_event.21.a: "Послать добровольцев!"
 YFC_event.21.b: "Наши руки сейчас связаны..."
 YFC_event.22.t.a: "Касательно Пионила"
 YFC_event.22.t.b: "Расширение Йойлтона, передать в Офис"
 YFC_event.22.desc.a: "Ох, Пионил.\nЦветы и луга, тихие и уединенные, немного пострадали от вытаптывания: здесь перевозили пиломатериалы на городскую площадь, а также фургоны с цементом и другими строительными материалами. Природная красота Пионила - одна из вещей, которые больше всего ценят жители города, некоторые из них даже протестуют против нашего строительства здесь вообще. Но прибыль должна быть получена, а более крупные здания, создающие больше рабочих мест, безусловно, коррелируют с более высокими доходами на душу населения. Доходами, которые, конечно же, будут перекачиваться к нам. А пока давайте решим, насколько большим нам следует здесь построить здание."
 YFC_event.22.desc.b: "Как ни странно, небольшое количество тирдропперов Йойлтона сыграло важную роль в решении наших текущих задач. Мы работаем над добавлением в город нескольких водных объектов, чтобы привлечь туристов (мы говорим, что это облегчит им жизнь), и они дают отличные советы нашим инженерам и архитекторам, которые... менее опытны... в строительстве с использованием воды. Несмотря на вынужденное сокращение зарплат, дела, кажется, идут хорошо. Однако, после того, как мы закончим с водными объектами, насколько больше должен стать этот город?"
 YFC_event.22.a: "Немного увеличить."
 YFC_event.22.b: "Обновить и улучшить."
 YFC_event.22.c: "Нельзя упаускать такой шанс, этот город должен стать крупнейшим."
 YFC_event.23.t: "Пионил, второй город" #Mixed
 YFC_event.23.desc: "После наших крупных инвестиций в город Пионил мы наблюдаем значительный рост прибыли. Карманы наших секторов более чем набиты, и даже средний работник получил несколько дополнительных долларов за свой тяжелый труд. Конечно, само население Пионила не в восторге от большого притока обджектов в город, но кого волнует их мнение, когда прибыль никогда не была такой высокой? В городе сформировались некоторые экологические группы, которые проповедуют \"сохранение красоты\" и все такое, но что может быть прекраснее зеленого цвета? Невежественное население легко игнорировать, но мы упустили возможность обеспечить начало работ по другому проекту развития, который мы курировали, - Йойлтону. Он находился в выгодном положении для торговли с севером, поэтому жаль, что мы не воспользовались этой возможностью. Тем не менее, население, похоже, не переживает, так что, по крайней мере, они довольны тем, что им дали."
 YFC_event.23.a: "Стрелки бегут вверх!"
 YFC_event.24.t: "Пионил, второй город"
 YFC_event.24.desc: "После наших инвестиций в город Пионил мы наблюдаем значительный рост прибыли. Карманы наших секторов набиты более чем достаточно, и даже средний работник получил несколько дополнительных долларов за свой тяжелый труд. Существующее население, похоже, тоже вполне доволено нашими изменениями, что тоже хорошо. К сожалению, похоже, мы случайно упустили из виду необходимость индустриализации Йойлтона, который, учитывая все обстоятельства, казался многообещающим местом. Тем не менее, у нас есть второй стабильный источник дохода, и он, похоже, растет с каждым днем, поскольку население Пионила утроилось."
 YFC_event.24.a: "Отличная инвестиция."
 YFC_event.25.t: "Восточные Маяки" #Good
 YFC_event.25.desc: "Наши инвестиции в восточные территории принесли плоды, превзошедшие самые смелые капиталистические мечты! Отдача, честно говоря, абсурдна. Карманы секторов набиты более чем достаточно, и даже средний низкоквалифицированный рабочий получил заметное повышение зарплаты. Несмотря на неудовлетворительный рост Пионила, по словам некоторых архитекторов, проектировавших город, он, похоже, стал своего рода туристической достопримечательностью по всему Гойки благодаря своей природной красоте. Конечно, \"природная красота\" не так уж важна, но все знают, что турист - это всего лишь ходячий кошелек. Йойлтон стал оплотом северной торговли, куда приезжают обджекты со всего мира, чтобы покупать и продавать товары. Некоторые независимые компании даже начали получать там прибыль, стимулируя конкуренцию, необходимую для того, чтобы заставить наших сотрудников работать усерднее. Конечно, эти новые компании по-прежнему платят налоги, и кому именно возвращаются эти налоговые деньги?"
 YFC_event.25.a: "Обратно к нам!"
 YFC_event.26.t: "Упущенные Возможности" #Bad
 YFC_event.26.desc: "Наши инвестиции в восточные территории оказались напрасными. То ли из-за некомпетентности архитекторов, то ли из-за халатности руководства, мы не позволили нашим восточным территориям принести плоды. Пионил выглядит почти так же, как и до наших инвестиций: те же скучные цветочные поля и маленькие дома, покрытые травой. К сожалению, ситуация в Йойлтоне тоже довольно похожая. Хотя жители этих районов вполне довольны нашими изменениями, их мнение, в буквальном смысле, ничего не стоит. Мы не получаем никакой выгоды от того, что приносим \"счастье\" существующему населению. На самом деле, похоже, мы потеряли значительную сумму денег на этом предприятии. Возможно, при лучшем планировании этот эксперимент мог бы пройти успешнее."
 YFC_event.26.a: "Кое-кто будет уволен."
 YFC_event.27.t: "Расширение Северной Торговли" #Good
 YFC_event.27.desc: "Наши инвестиции в восточные территории принесли восхитительные плоды! За последнюю неделю наша прибыль заметно выросла, и мы - руководители компании, разумеется, - пожали по заслугам. Нам удалось наладить торговые пути с Тирдроп и Девидлендом, откуда и поступила большая часть нашей прибыли. Кроме того, нам удалось укрепить наши ранее слабые пути в Военный округ, что тоже стало приятным бонусом. Население Йойлтона, хотя их мнение, очевидно, не имеет большого значения, похоже, вполне довольно внесенными нами изменениями. Какой-то сумасшедший по имени Дьюдроп утверждал, что они устали от нашего правления, но умеренные улучшения города усмирили их \"революционные\" настроения. Что бы это ни значило.\nОглядываясь назад, кажется, что мы упустили возможность инвестировать в Пионил, что принесло нам небольшие убытки, однако прибыль от Йойлтона с лихвой это компенсировала. Возможно, Пионил был упущенной возможностью, но пока мы наслаждаемся жизнью."
 YFC_event.27.a: "Да здравствует рынок!"
 YFC_event.28.t: "Большая Ошибка" #Bad
 YFC_event.28.desc: "Похоже, наши инвестиции в восточные территории провалились. Многие сочли нашу перестройку Йойлтона слишком незначительной, а Пионил мы полностью забросили. Затраты на попытки расширения Йойлтона и потери от нашего пренебрежения Пионилом намного перевешивают прибыль, полученную от переселения новых жителей в города. Конечно, население городов, кажется, вполне спокойно относится к тому, что их оставили в покое, но кого это волнует? Наших Секториалов это, безусловно, не волнует, поскольку они открыто критикуют действия, предпринятые для развития города. Пионил выглядит почти так же, как и раньше, а Йойлтон оставляет желать лучшего."
 YFC_event.28.a: "Не лучший результат..."
 YFC_event.29.t: "Новый Рынок"
 YFC_event.29.desc: "Мы получили интересную телеграмму. Корпорация Йеллоу Фейс, возглавляемая самим Йеллоу Фейсов, сообщила нам о возможностях сотрудничества. Они готовы заключать сделки, как покупать, так и продавать снаряжение. Хотя сейчас нам это может и не понадобиться, это будет ценный инструмент, который следует использовать с осторожностью."
 YFC_event.29.a: "Очень интересно!"
 YFC_event.29.b: "К сожалению, мы не в состоянии."
 YFC_event.30.t: "Пионил, Звезда Восточного Гойки" #Mixed
 YFC_event.30.desc: "Наши инвестиции в город Пионил окупились с лихвой! Карманы всех сотрудников корпораций значительно пополнились, особенно карманы сотрудников секторов. Эти секторы, похоже, вполне довольны нашими инвестициями, даже несмотря на пренебрежение к Йойлтону. Прибыль, полученная от этого предприятия, более чем достаточна для финансирования будущих проектов, так что деньги для нас практически не проблема. Что касается расходов, конечно, прибыль никогда не прекратится! Некоторые, кажется, обеспокоены реакцией жителей Пионила, которые жили там до наших улучшений, указывая на то, как сильно они возмущены уничтожением и вытаптыванием их естественных цветочных полей. Почему обджекты должны заботиться о растениях - это выше мозгов корпорации. Удивительно, какое малое влияние оказывают на нашу прибыль мнения таких обджектов."
 YFC_event.30.a: "Наконец-то это настоящий город!"
 YFC_event.31.t: "Интересное открытие"
 YFC_event.31.desc: "После нескольких месяцев попыток выяснить причину замедления производства мы наконец нашли ответ. Оказывается, в наших соглашениях с Йелоу Фейсом была одна незначительная деталь, которую мы упустили. В соглашениях о сотрудничестве им был предоставлен доступ к некоторым нашим заводам. По всей видимости, они поставляли им оружие без нашего участия. Хотя это и плохо, нам все равно необходимо поддерживать с ними хорошие отношения. У них много денег, так что мы можем заключить с ними сделку."
 YFC_event.31.a: "Сейчас это не очень важно."
 YFC_event.31.b: "Давайте просто покончим с этим."
 YFC_event.31.c: "Сделаем некоторые перестановки."
 YFC_event.32.t: "Койни вскрыл аферу!"
 YFC_event.32.desc: "Итак, похоже, что скрытая переброска оружия раскрыта. К сожалению, этого ожидали, поскольку потеря производства из-за этого была очевидна. Пока что из Военного округа ничего не сообщалось. Похоже, ни одна из сторон не собирается это обсуждать. Нам же остаётся только продавать и покупать технику, пока не появится новая возможность."
 YFC_event.32.a: "Да будет так."
 YFC_event.33.t: "Бизнес с Округом."
 YFC_event.33.desc: "Итак, похоже, что скрытая схема поставок оружия раскрыта. К сожалению, это было ожидаемо, поскольку потеря производства из-за них должна была быть замечена. Однако, что более интересно, Койни готов продать свой завод за высокую цену. Поскольку нам приходится покупать и продавать оборудование, а не производить собственное, это может принести долгосрочную прибыль и улучшить армию. Но стоит ли эта цена того?"
 YFC_event.33.a: "Купим!"
 YFC_event.33.b: "Нет, спасибо."
 YFC_event.34.t: "[FROM.GetName] приняли сделку!" #Don't rewrite
 YFC_event.34.desc: ""
 YFC_event.34.a: "Отлично!"
 YFC_event.35.t: "[FROM.GetName] отклонили сделку!" #Don't rewrite
 YFC_event.35.desc: ""
 YFC_event.35.a: "Чёрт."
 YFC_event.36.t: "Новая Сделка от Йелоу Фейса!" #Don't rewrite (For buying X stuff)
 YFC_event.36.desc: "Мы получили новое предложение из Футпатхбурга:\n\n§GЙелоу Фейс хочет продать [selling_deal_equipment_type], которые мы запросили.§!\n\n§RЗа [?trade_cost_show_var] тыс. долларов.§!\n\nСогласимся?"
 YFC_event.36.a: "Принять!"
 YFC_event.36.b: "Отклонить!"
 YFC_event.37.t: "Новая Сделка от Йелоу Фейса!" #Don't rewrite (For selling X stuff)
 YFC_event.37.desc: "Мы получили новое предложение из Футпатхбурга:\n\n§RЙелоу Фейс хочет купить [?ROOT.selling_amount], которые мы продаём.§!\n\n§GЗа [?trade_cost_show_var] тыс. долларов.§!\n\nСогласимся?"
 YFC_event.37.a: "Принять!"
 YFC_event.37.b: "Отклонить!"
 YFC_event.38.t: "Йелоу Фейс требует наши ресурсы!" #SRI refers to the player as boy, because the SRI is an eighty year old man who has been in the mines for 2 thirds of his life
 YFC_event.38.desc.a: "Э-э, сегодня утром в одного бедолагу-шахтера попал большой клочок бумаги. В бумаге написано, что это сообщение от Йелоу Фейса к северу от нас, и что они просят у нас частичные права на ресурсы в обмен на защиту. Мы понятия не имеем, как им удалось не связаться ни с кем из государственных служащих, но в любом случае, выглядит это довольно многообещающе. Принимаем или отказываемся, мужик?" #:sob:
 YFC_event.38.desc.b: "Э-э, сегодня поздно вечером какой-то бедный шахтер нашел потрепанный клочок бумаги. В бумаге написано, что он пришел от каких-то бандитов с севера от нас. Они утверждают, что хотят получить частичные права на ресурсы, и если мы откажемся, они объявят нам войну. Я бы испугался, если бы был примерно твоего возраста, но, когда ты становишься старше, ты как бы перестаешь бояться таких вещей, как война и смерть, понимаешь. В общем, этот клочок бумаги не попал ни к кому из правительства, но все же до нас дошел, так что нам следует ответить. Принять или отклонить, мужик?"
 YFC_event.38.a: "Принять!"
 YFC_event.38.b: "Отклонить!"
 YFC_event.39.t: "Ответ от Хребта"
 YFC_event.39.desc: "Сегодня мы получили потрясающий отклик из Грейт Риджа! В своем ответе они, кажется, были немного смущены, что бы это ни значило, но они действительно согласились с нашим предложением! Кроме того, похоже, мы отправили наше первое письмо по неправильному адресу, поэтому нам определенно нужно кого-то уволить. Хотя, в любом случае, это отличная возможность!"
 YFC_event.39.a: "Я чую деньги..."
 YFC_event.40.t: "Ответ от Хребта"
 YFC_event.40.desc: "Сегодня утром мы получили довольно запутанный ответ от Риджа. Они, похоже, не поняли нашу просьбу о правах на ресурсы. Вместо этого они начали говорить что-то о \"национальной целостности\", а затем в трёх абзацах углубились в рассуждения о том, как их лидер, цитирую, \"очень сильно кашляет\" с тех пор, как отправился в новую пещеру. Мы точно не знаем, что это значит, но, похоже, они не горят желанием сотрудничать с нами."
 YFC_event.40.a: "Пусть сходит к доктору..."
 YFC_event.41.t: "Йелоу Фейс требует подчинения!"
 YFC_event.41.desc: "Э-э, похоже, эти ребята из компании просят нас стать их марионетками, мужик. Они говорят, что это \"Ультиматум\", что бы это ни значило. В общем, мы должны принять его или нас захватят, мужик. Кстати, ты знаешь, где майонез? Я не могу его найти. И я тебе уже слишком много раз говорил, чтобы ты перестал трогать мою еду. Но да, либо мы станем их марионетками, либо они начнут войну. Честно говоря, я думаю, это будет всего лишь небольшая стычка, но ты же знаешь, какие эти капиталисты. Всегда пытаются затеять драку. А что, если я не хочу драться? Слушай, мужик, я рою шахты столько, сколько себя помню. Всё, чего я сейчас хочу, это продолжать добывать. В этой жизни мало что осталось, вот что я тебе скажу."
 YFC_event.41.a: "Принять!"
 YFC_event.41.b: "Отказаться!"
 YFC_event.42.t: "Судьба Грейт Риджа"
 YFC_event.42.desc: "Великий хребет прислушался к нашим призывам. Они подчинились нам, и теперь мы полностью контролируем их. У этого нового члена нашего альянса не будет тех же привилегий, что и у остальных, а это значит, что нам не придётся платить им много денег. По правде говоря, они, похоже, вполне довольны добычей полезных ископаемых, так что мы позволим им продолжать этим заниматься."
 YFC_event.42.a: "УРААА!!!"
 YFC_event.43.t: "Судьба Грейт Риджа"
 YFC_event.43.desc: "Великий хребет отклонил наше предложение. Похоже, они уже мобилизуются для подготовки к войне. Многие наши сектора советуют воздержаться от реального нападения на них, но если мы не нападем, у нас вообще не будет никаких прав на ресурсы. Война или отказ в предоставлении льгот?"
 YFC_event.43.a: "Не стоит..."
 YFC_event.43.b: "Ультиматум есть ультиматум."
 YFC_event.44.t: "Взгляд на Восток"
 YFC_event.44.desc: "Популяция тирдропперов стремительно распространяется по северному и восточному Гойки. Любой, кто там живет, подтвердит, что еще несколько лет назад тирдропперов редко можно было встретить за пределами Пляжной территории. А сейчас? Они почти повсюду. Это, конечно же, результат чрезмерного размножения жителей Пляжа. Не вдаваясь в подробности, территория перенаселена, и их правительство использует это в политических целях, претендуя на земли, где популяция тирдропперов превышает определенный порог. Это, очевидно, представляет угрозу для небольшого объема морской торговли, которую мы осуществляем через беззаконное Восточное побережье. Хотя, если мы захватим и возьмем под контроль эти земли раньше, чем это сделает Тирдроп... может быть, мы сможем сохранить их для себя?"
 YFC_event.44.a: "Было бы отлично."
 YFC_event.45.t: "Дорогая Тирдроп,"
 YFC_event.45.desc: "Здравствуйте. К сожалению, мы уже обменивались письмами. Тогда, да и сейчас, я чувствую на бумаге запах вашей морской соли. Вы вызываете у меня отвращение не только запахом, но и поведением, и характером. Вы отвратительный обджект, с вашим стилем правления, плохим планированием, нескоординированностью... я мог бы продолжать, хотя не совсем уверен в ваших способностях к чтению. Скажу так: я совершенно не представляю, как кто-либо из ваших граждан, не говоря уже о вашем высшем командовании, может выносить вашу мерзость. Я хотел бы принести извинения не вам, а населению Прибрежной территории, поскольку уверен, что ваш смрад доносится из Фарбича и обратно."
 YFC_event.45.a: "- Йелоу Фейс (P.S., ты ужасна)"
 YFC_event.46.t: "Карманники" #okay but consider that its really funny and that this is supposed to be the slightly wackier part of the tree
 YFC_event.46.desc: "Жители Банды наверняка не заметят пропажи денег, они слишком бедны, чтобы обращать на это внимание. По сути, именно это Тейзер и предлагал нам сделать на протяжении... ну, сколько там времени. Конечно, идея получить деньги неплоха, но никто не мог прийти к согласию, что именно следует украсть. Мы остановились на трех вариантах:\n1. Мы крадем большой кусок кварца из огромного банка, который построили в Подгорныве. Маловероятно, что они это заметят, или даже свалят вину на кого-нибудь из своего собственного населения, если мы все сделаем правильно.\n2. Мы украдём небольшое количество столбов из банка. Это гораздо сложнее осуществить, учитывая, что потребуется демонтировать большие несущие конструкции.\n3. Украсть весь банк."
 YFC_event.46.a: "Кусок кварца!" #Gain 200K, increases Taser influence by 2 (Side note come up with item we are stealing or remove my dumbass idea for normal money)
 YFC_event.46.b: "Кварцевые колонны!" #Gain 400K, increases Taser influence by 2, and some other bad thing but I have no idea rn
 YFC_event.46.c: "Весь банк??!!" #Gain 700K, increases Taser influence by 2, and some other bad thing but I have no idea rn
 YFC_event.46.d: "Мы не будем так низко падать." #Lowers Taser's influence by 2
 YFC_event.47.t: "Покупка лодок" #For the boats
 YFC_event.47.desc.a: "Давидианцы, наши ближайшие торговые партнеры до их печально известного экономического краха, похоже, пытаются восстановить свои финансовые позиции. Несмотря на то, что им пришлось военным путем свергнуть своего идиотского короля (что, конечно, несложная задача), они готовы отдать часть своих военно-морских активов для финансирования нашей миссии на борту корабля, но за определенную плату. Мы направили сообщения различным морским державам, и они первыми откликнулись. В штаб-квартиру давидианцы заявили, что они \"полностью разделяют идею сдерживания популяции тирдропперов\" и \"готовы сотрудничать с кем угодно, чтобы избавить Гойки от них\". Это, конечно, не соответствует нашей политике или подходу к борьбе с тирдропперами (мы предпочитаем облагать их высокими налогами, как и всех остальных), но, разумеется, давидианцам об этом знать не нужно. Если они готовы продать нам свои высококачественные корабли по относительно низкой цене, кто мы такие, чтобы отказывать им в их... вызывающих опасения идеях искоренения тирдропперов?" #if DAV is fascist
 YFC_event.47.desc.b: "Давидианцы, наши ближайшие торговые партнеры до их печального экономического краха, похоже, пытаются восстановить свое финансовое положение. Несмотря на то, что им пришлось столкнуться с мелким восстанием (нашим друзьям, конечно, с этим было несложно), они готовы отдать часть своих военно-морских ресурсов для финансирования нашей миссии на острове, но за определенную плату. Мы отправили сообщения различным морским державам, и они первыми откликнулись. В штаб-квартиру давидианцы заявили, что они \"хотели нейтрализовать угрозу тирдропперов до того, как она достигнет критической точки\", и что они \"обеспокоены возможностью экспансии тирдропперов на Гендалию [их самый южный архипелаг]\". Это, безусловно, разумная линия рассуждений; если тирдропперы хотят расшириться на остров, куда еще они могут захотеть отправиться? Кроме того, это был бы отличный способ дать давидианцам понять, что они все еще могут доверять Компании, даже после смуты в Гойки." #if DAV is monarchist
 YFC_event.47.desc.c: "Честно говоря, мы не были до конца уверены, что получим ответ на наше предложение о закупке лодок. Для внешнего мира это выглядит довольно нелепо; де-юре мы не граничим ни с какими прибрежными территориями, но де-факто мы, безусловно, можем достигать береговой линии. Конечно, с морем приходит и флот; нам необходимо иметь возможность должным образом защищать эти береговые линии. Это сокращенная версия опасений, которые мы изложили в сообщениях, отправленных прибрежным государствам Гойки. И некоторое время мы не получали никаких ответов. Однако, в конце концов, наше сообщение дошло до Санкт-Обджектбурга, и там мы нашли наших торговых партнеров. Их лодки, конечно, не самого лучшего качества. Но они, безусловно, не просят за нас слишком высокую цену, и они справятся с задачей, если нам удастся удивить этих тирдропперов, что мы, несомненно, и сделаем." #SOS
 YFC_event.47.a: "Отличная сделка!"
 YFC_event.48.t: "Троглодит"
 YFC_event.48.desc.a: "Мы почти завершили завоевание восточного побережья. Хотя некоторые считают наши завоевания, мягко говоря, неудовлетворительными, несогласие с этой миссией можно легко проигнорировать. На этом участке моря можно найти определенное спокойствие, которое легко можно было бы превратить в товар. Возможно, благодаря этим завоеваниям мы могли бы еще больше укрепить туризм? Кроме того, не будем забывать о том, что можно получить от прямого доступа к морю. Морская торговля сейчас, как никогда, является легкой альтернативой коварным сухопутным путям прошлого. Наши завоевания открыли нам потенциал для великого, прибыльного будущего. Теперь вопрос в том, как мы планируем использовать эту возможность."
 YFC_event.48.desc.b: "В головной офис компании только что поступило сообщение с Восточного побережья, к сожалению, содержащее ужасные новости. Из-за аномально высокой и неожиданной мощи угрозы со стороны Тирдроп нам не удалось установить связь ни с одним подходящим портом. Конечно, мы - изобретательная компания; это не остановит нас в морской деятельности, а лишь усложнит её. Неспособность установить формальный контроль над портом означает лишь то, что нам придётся действовать скрытно в отношении наших морских операций."
 YFC_event.48.desc.c: "В штаб-квартиру компании только что поступил доклад с Восточного побережья, и, что невероятно, он содержит самые замечательные новости месяца! Благодаря нашему опыту в грабежах, мародерстве, вторжениях и тому подобном, нам удалось установить контроль над достаточной частью Восточного побережья; такой частью, которая позволяет нам надлежащим образом соединить наши линии снабжения с одним из многочисленных портов вдоль побережья. Мы так легко одолели Тирдроп в их игре и так легко можем продолжить наши морские атаки. Мы должны немедленно начать строительство грандиозных кораблей и двигаться туда, куда нас ведут деньги."
 YFC_event.48.a: "Какая следующая точка интереса?"
 YFC_event.48.b: "Шаг вперёд, два шага назад." #Fail
 YFC_event.48.c: "Море зовёт!" #Win
 YFC_event.49.t: "Силовые Батальоны"
 YFC_event.49.desc: "Топ Хэт - обджект, имеющий множество предложений. Сегодня он приходил в штаб, желая предложить Йелоу Фейсу дополнительные силы. По всей видимости, у него есть лишние обджекты (откуда он их берет?), и он готов задействовать их в операциях на побережье, если получит хоть какую-то отдачу. Конечно, эта отдача - прибыль. Он, конечно, не просит большой суммы денег, однако некоторые аналитики утверждают, что следующий финансовый квартал может оказаться для нас в компании более сложным. Насколько далеко мы готовы зайти в этой игре?" #tophat wants 150k
 YFC_event.49.a: "Цель оправдывает средства." #Increases TopHat influence
 YFC_event.49.b: "Не будем переоценивать требования."
 YFC_event.49.c: "Просто закрой уже свой рот." #Lowers TopHat influence
 YFC_event.50.t: "Поднятая Пыль"
 YFC_event.50.desc: "Хаммер всегда отличался ярким стилем письма. Сегодня рано утром он написал письмо, а сегодня поздно вечером оно прибыло в центральный офис. Ниже приводится его текст:\nЙелоу Фейсу\n\nМы с Пайпом провели утро, наблюдая за развитием нашего дела в совете. Было прекрасное раннее утро. Солнце, поднимаясь над бескрайним морем, дарило ощущение свободы всем, кто видел его с этой позиции. Морской ветер, громкий, но мягкий, доносился с океана до берега. Невозможно переоценить, насколько здесь можно было почувствовать себя спокойно. Яркий, успокаивающий оранжевый цвет скалистого, но все еще покрытого лесом участка Гойки, конечно, казался бессмысленным, но, по правде говоря, смысл здесь не имел значения. Я ясно чувствовала, насколько целеустремлен совет; прежде всего, он хотел успокоить. Это было дело, с которым я могла чувствовать себя спокойно. Это дело, которому я могла бы восхищаться. Но, к сожалению для совета, ее величества, на этих берегах произошел мелкий конфликт.\nНе буду забегать вперед. Несмотря на всю красоту этой доски объявлений, здесь действительно можно было что-то выиграть, заработать деньги, и мы нашли свою выгоду в виде зерна. Да, по пути к более крупному участку, который вы выделили мне и Пайпу, мы обнаружили обветшалую, на первый взгляд заброшенную мельницу. Признаюсь, это было милое местечко. Хотя краска немного выцвела, красная краска и белые акценты создавали приятное сочетание цветов; оно было радовало глаз. Оно было едва выше этажа здания, поэтому, хотя оно и выглядело как амбар, я так его и не назвал. Тем не менее, внутри было довольно много зерна. Ячмень, рис, пшеница – всё хранилось в бочках, разбросанных по полу этого крошечного помещения, словно кто-то бросил их туда, не обращая внимания на целостность интерьера. Часть зерна даже рассыпалась по полу, но те, кому мы его продадим, об этом знать не будут.\nНу, конечно, я не могу с уверенностью сказать, что мы будем продавать этот товар. В конце концов, он же кому-то принадлежит, верно? Заимствование вещей у случайного человека для продажи может привести к эскалации конфликта, но в то же время мы никогда раньше не продавали зерно. Выход на новый рынок может быть для нас прибыльным. Что вы думаете?\n\nХаммер, Строительный сектор, Корпорация Йелоу Фейс"
 YFC_event.50.a: "Продайте." #Increases Pipe and Hammer influence, possibility of higher resistance in a random seaprovince, gains like 300k
 YFC_event.50.b: "Не торопитесь." #Decreases Pipe and Hammer influence
 YFC_event.51.t: "Разведка"
 YFC_event.51.desc: "Бикер, к всеобщему удивлению, сегодня отправила электронное письмо в штаб-квартиру, что вызвало настоящий переполох. Получение сообщений от секторов, конечно, не редкость, но электронная почта? Серьезно? Она у нас все это время была? Почему никто другой ею не пользовался? В любом случае, она просила Корпорацию о помощи в раскопках пещер Восточного побережья в поисках алюминия. Видимо, он ей для этого нужен. \"научные эксперименты,\" или что-то ещё. В любом случае, мы получили сообщения от Хаммера о том, что в пещерах поселились существа, похожие на Тирдроп, а также некоторые другие... сомнительные личности, заявляющие о своей преданности некоему \"королю\". Разрушение пещер в научных целях может не понравиться пещерным жителям, поэтому эта идея вызвала определенные споры в штаб-квартире. Даже больше споров, чем использование электронной почты."
 YFC_event.51.a: "Всего лишь какие-то пещеры." #Increases Beaker influence, add aluminum production to a board state (dont care which)
 YFC_event.51.b: "Не будем злить местных." #Decreases Beaker influence
 YFC_event.52.t: "Улучшение Наёмников"
 YFC_event.52.desc: "Сегодня мы получили интересное письмо от наших хороших друзей, а именно от наемников. Сила наемников растет уже довольно давно, исключительно благодаря нашему щедрому финансированию и отчасти благодаря их собственным (скромным) приключениям. Они прислали нам письмо, в котором сообщают, что в связи с этим ростом численности их отряда увеличилась. Отличная новость от них и отличное улучшение для нас."
 YFC_event.52.a: "Замечательно!"
 YFC_event.53.t: "Оливковая Ветвь"
 YFC_event.53.desc: "Несмотря на мнение многих наших офисных сотрудников, компания стремится установить официальные отношения с Бандой. Хотя бандиты совершают жестокие, анархические набеги на благополучные поселения, они щедро платят нам за наше оружие. Официальное сотрудничество легко могло бы принести большую прибыль, что, очевидно, укрепило бы компанию в целом. Некоторые сотрудники компании предупреждали нас о нестабильности такого партнерства, а также о том, как враждебность Банды может отразиться на нас, но мы игнорируем их; денежная выгода от этого партнерства, вероятно, стоит потери поддержки некоторых земель."
 YFC_event.53.a: "За капитал!"
 YFC_event.54.t: "Точка Невозврата"
 YFC_event.54.desc: "В штаб-квартире царит беспорядок. Сотрудники массово увольняются, сектора выводят инвестиции из компании, обджекты безрассудно перемещаются за пределы контролируемых нами территорий, а зарплаты повсеместно снизились. Рецессия не за горами. Само здание, в котором расположена наша штаб-квартира, довольно захламлено из-за хаоса; обычно мы нанимаем какую-нибудь мелкую рабочую силу для уборки, но, опять же, у нас нет на это средств. Несмотря на все наши усилия по поддержанию стабильности, кажется, что подавляющее большинство наших торговых партнеров разорвали свои партнерские отношения и даже ввели эмбарго против нас. Мы, конечно, все еще можем торговать с нашим верным союзником в Военном округе, но, тем не менее, торговля, похоже, больше не принесет той большой прибыли, которая необходима для поддержания нашей корпорации. Вероятно, пришло время рассмотреть... другие способы заработка."
 YFC_event.54.a: "Латайте бреши!"
 YFC_event.55.t: "Пересмотр нашей Геополитики"
 YFC_event.55.desc: "Что ж, у нас, безусловно, нет союзников за пределами Банды. От Шнеехорна до Кэри мы потеряли всех наших бывших торговых партнеров. У нас был хороший период, но теперь всему головному офису (точнее, тому, что осталось от нашей быстро сокращающейся компании) ясно, что времена меняются; мы должны существенно пересмотреть цель корпорации, иначе нам грозит ее закрытие. Бандиты, несмотря на кажущуюся неприязнь к капитализму, на самом деле хорошо в нем разбираются; они просто участвуют в нем по-другому. Многие в корпорации это заметили, и, учитывая, насколько плачевна ситуация, вероятно, настало время нам значительно сблизиться с Бандой, чтобы остаться на плаву. Теперь они нас уважают; у нас редко что-то грабят, вместо этого они покупают у нас. Нас больше не грабят, вместо этого нас защищают. Их (слабое) правительство, уважающее нас, - это одно, но поддержка населения - совсем другое. Это настолько отличается, что заставляет нас задуматься о гораздо более формальном, гораздо более интегрированном партнерстве."
 YFC_event.55.a: "Да будет так."
 YFC_event.56.t: "Постоянные Наёмники?"
 YFC_event.56.desc: "Бандиты заявляют, что нам крайне необходимо иметь постоянную армию. Они говорят, что наша модель - покупка наемников на определенный период и их непосредственное управление - неэффективна. Эти заявления, похоже, продиктованы опасениями, поскольку, хотя и дешевле не содержать (и не оплачивать) армию постоянно, это сопряжено с риском неподготовленности к внезапным нападениям. Конечно, у нас есть выбор: некоторые в компании обеспокоены ценообразованием, до такой степени, что считают это идиотским решением.\nОднако Топхэт из Военного сектора весьма заинтересован этой идеей и настаивает на том, чтобы компания выкупила Аннеймд Бразерхуд. Он ссылается на сильные стороны компании, заявляя о ее большом потенциале в будущих конфликтах, поскольку он изучает военную тактику Банды.\nРазумеется, инакомыслие проявляется во всех формах и повсюду, но в конечном итоге существует только один правильный выбор."
 YFC_event.56.a: "Черрис!"
 YFC_event.56.b: "Грейпс!"
 YFC_event.56.c: "Аннеймд!"
 YFC_event.56.d: "Останемся при своём..." #This one keeps the same systems
 YFC_event.57.t: "Открыты для Разговора"
 YFC_event.57.desc: "Война.\n\nВойна бессмысленна. Война не служит достижению наших целей.\nВойна стоит денег.\n\nМы, в компании, впервые за долгое время решили начать открытую, конструктивную и, что наиболее важно, публично обсуждаемую серию переговоров, которые в конечном итоге мирным путем разрешат Большую игру на восточном побережье. Мы не заинтересованы в каких-либо нечестных сделках и прервем переговоры, если это будет необходимо. Однако мир является предпочтительным вариантом для большинства нашего населения. Конечно, они не приносят нам большую часть прибыли, и, конечно, значительная часть корпорации действительно считает, что насилие быстрее решит этот вопрос, независимо от издержек, но сектора и сам Йелоу Фейс сходятся во мнении, что непокорное население на востоке должно быть усмирено, если мы хотим двигаться вперед. Риск длительного и затяжного конфликта с Тирдроп пугает нас, а негативная огласка полномасштабной войны против другой суверенной торговой страны может, по мнению наших ведущих экономистов, подорвать нашу прибыль на целых три квартала. Это не самый праведный поступок, не самый смелый, и даже не самый забавный; но это правильный поступок. Выгодный поступок."
 YFC_event.57.a: "И мы будем смеяться, подсчитывая деньги!" #we should def have an event chain thatd be awesome and highly needed. the only question is on if i will write that.. YOU will have to design it though. please be less than 12 events
 YFC_event.58.t: "Копилки"
 YFC_event.58.desc: "После эскалации конфликта на Востоке возник вопрос: как нам обеспечить, чтобы наша прибыль не снизилась во время этого конфликта? Конечно, у нас есть бюджет для финансирования наших усилий, однако нам все равно не нужно расточительно расходовать средства; на самом деле, мы должны сделать так, чтобы эта операция финансировалась сама собой. Представители различных секторов высказали разные мнения по этому поводу. Некоторые предложили сократить оборонный бюджет, предложения, которые Топхэт яростно раскритиковал. Споры с Топхэтом так часто приводят к прекращению дискуссии, что представители секторов быстро начали обсуждать управление нашими корпоративными активами. Бикер предложил продать устаревшие продукты и ресурсы. Пайп подумал об увольнении некоторых менее квалифицированных сотрудников. Наконец, Тейзер предположил, что финансирование крупных населенных пунктов может оказать положительное влияние в долгосрочной перспективе. Все это навредит компании в краткосрочной перспективе, да, но перспективы, которые может принести Восток, безусловно, оправдают затраченные усилия. После нескольких часов обсуждений Йелоу Фейс решил..."
 YFC_event.58.a: "Продать старые продукты и ресурсы."
 YFC_event.58.b: "Сокращение штата."
 YFC_event.58.c: "Порезать поступления в местные бюджеты."
 YFC_event.58.d: "Использовать свою заначку."
 YFC_event.59.t: "Наше Место под Солнцем?"
 YFC_event.59.desc: "Ночные переговоры между Йелоу Фейсом и Секториалами компании были довольно мрачными. Секториалы были не очень рады, что их вызвали поздно ночью, однако переговоры, безусловно, были. Было совершенно ясно, что компания не может продолжать двигаться в том направлении, в котором она двигалась так долго. Почти полное уничтожение международного свободного рынка из-за массовых эмбарго и сообщения со стороны Нумизматии (этих идиотов захватили коммунисты, разве им можно доверять?), подрывающие нашу легитимность, - что же компания могла сделать? В течение всей ночи переговоров единственным ответом на этот вопрос стало тихое замечание Пайпа о том, что хорошие обджекты в Кэри и Подгорныве по-прежнему готовы официально торговать с нами. Конечно, этого было бы недостаточно для нашего выживания, но ни один Секториал, кроме Пайпа, не предложил альтернативы на встрече. Ближе к концу Йелоу Фейс заговорил о попытках найти более жёсткие способы получения прибыли. Бикер застонал в ответ на это утверждение; Секториалы не очень-то любили пачкать руки."
 YFC_event.59.a: "Неясное будущее."
 YFC_event.60.t: "Другие Источники Прибыли?"
 YFC_event.60.desc: "Возвращаясь домой после долгого дня безделья в штаб-квартире, Йелоу Фейс краем глаза заметил нечто очень интересное. Два обджекта, пытаясь спрятаться, обменивали, казалось бы, безобидный пакетик с зелёным веществом на толстую пачку денег. Это была такая простая транзакция, но она произвела сильное впечатление на Йелоу Фейса. Люди готовы платить так много за такую ​​мелочь? Вероятно, компании будет проще хранить это, чем всё, что они продавали раньше; почему он не додумался до этого раньше?! Вероятно, это придётся продавать за спинами лидеров торговой зоны, что может расстроить Секториалов; но кого они вообще волнуют? Они под началом Йелоу Фейса, и его слово – закон! Подойдя к хитрому бизнесмену в переулке, Йелоу Фейс быстро и громко произнёс: \"Один пакетик травы, пожалуйста!\""
 YFC_event.60.a: "\"Э-э... Ты чё, легавый?\""
 YFC_event.61.t: "Испорченная Прогулка"
 YFC_event.61.desc: "С тех пор как компания приняла их на работу, все главы секторов довольно сблизились. Они часто вместе ходили на различные мероприятия, чтобы снять напряжение на работе, а в нынешних условиях работы было больше, чем когда-либо. Естественно, в тот вечер Секториалы решили поужинать в шикарном ресторане, и ужин уже почти закончился, когда к ним подошел официант, чтобы принести счет. Ну, пять счетов; разумеется, платить им придется отдельно.\n\nОни отдали свои карты официанту. Хаммер неудачно пошутил по поводу отказа в приеме карт, и никто, кроме Пайпа, не засмеялся. Однако, по мере того как минуты с момента ухода официанта удваивались, а затем утраивались, группа недоумевала, почему так долго. Спустя почти полчаса официант вернулся, принося множество извинений за отказ в приеме карт. Топ Хэт проверил свой баланс и обнаружил, что у него долг более 100 000 долларов, как и у остальных. Казалось, что долг компании случайным образом стал их долгом."
 YFC_event.61.a: "С какого хрена?!"
 YFC_event.62.t: "Уроки Войны" #no extra text needed
 YFC_event.62.desc.a: "Небольшая хижина вдали словно манила Топхэта. Здание было довольно запущенным, особенно по высоким меркам Топхэта, и, если говорить об обыденности, он никогда бы не вошел в такое. Однако эта крошечная постройка имела первостепенное значение; она служила координационным центром компании Черрис. Он по собственной воле посетил это место, чтобы узнать больше о - если можно так выразиться, - \"интересных\" тактиках, которые Черрис использовала во время рейдов. Их, безусловно, можно назвать прагматичными, и этот прагматизм Топхэт хотел понять сам. Будет ли это понимание необходимо для того, чтобы избежать применения этих тактик? На этот вопрос Топхэт не собирался отвечать открыто. Как бы то ни было, в здании, которое ему предстояло посетить, ему нужно было поторопиться."
 YFC_event.62.desc.b: "Тридцать восьмой этаж одного из многочисленных небоскребов Футпатхбурга был целью Топхэта на сегодня. Стоя в лифте, он оценил величественный дизайн здания, посчитав его \"соответствующим его стандартам\", что бы это ни значило. Этот тридцать восьмой этаж был самым важным в здании, даже важнее, чем этаж, где предлагались бесплатные образцы продуктов. Именно на этом этаже базировалась компания Грейпс. Топхэт по собственной инициативе посетил группу наемников, чтобы лучше понять стремительность их тактики. Эта быстро движущаяся компания была для Топхэта загадкой. Десятиминутное ожидание с первого этажа до тридцать восьмого было довольно утомительным, но для Топхэта это стоило того, если это означало понимание секретов Грейпс."
 YFC_event.62.desc.c: "Проникнуть в случайный лес посреди ночи было непростой задачей для такого влиятельного и богатого обджекта, как Топхэт, однако это было важнейшее дело в его расписании. В тот вечер он должен был встретиться с Аннеймд Бразерхуд, и эта встреча имела для него первостепенное значение. Его отправили на эту миссию не начальники (точнее, начальник, поскольку Йелоу Фейс был единственным, кто стоял выше него), он решил приехать сюда по собственной воле. У братства были весьма интересные стратегии в условиях войны, которые были продемонстрированы их эффективными рейдами; Топхэт хотел узнать об этом лично. Для такой эффективной военной организации было странно иметь штаб-квартиру на лесной поляне, однако, если деньги приведут Топхэта именно туда, пусть так и будет."
 YFC_event.62.desc.d: "\"Да-да, я понимаю вашу, э-э, \"силу\", но вы до сих пор не объяснили, как эта сила влияет на прибыль\". Йелоу Фейс застрял на, пожалуй, самом непродуктивном совещании в своей жизни. Эти наемники были наглыми! Эта разношерстная группа даже не могла понять концепцию денег, не говоря уже о том, как они могли бы хоть как-то помочь компании! Боже, за что Йелоу Фейс вообще им платит? Если бы ему не нужна была постоянная армия, он бы уволил этих отморозков вместе с остальными своими бесполезными бывшими сотрудниками. Он снова вздохнул, когда очередной идиот заговорил, повторяя ту же самую, ненужную фразу о могуществе группы. Йелоу Фейс уже ужасно устал от всего этого."
 YFC_event.62.a: "Сила в знаниях, знания в силе." #tophat
 YFC_event.62.b: "\"Ты хоть иногда закрываешь свой рот?!\"" #yellow face
 YFC_event.63.t: "Диверсификация"
 YFC_event.63.desc.a: "Йелоу Фейс,\n\nЯ пишу вам сегодня, отчасти в недоумении по поводу ваших недавних тревожных действий, но, прежде всего, с ясностью в отношении будущего корпорации. После разговора с нашими наемными партнерами я пришел к выводу, что, выступая в качестве своего рода посредника, через которого другие страны покупают рабочую силу, мы можем добиться наибольшего успеха. Эта сфера настолько отличается от нашей нынешней, что, благодаря грамотному ребрендингу и замалчиванию некоторых документов (например, этого), мы легко могли бы снова стать прибыльными. Конечно, для этого вам, генеральному директору этой компании, нужно взять себя в руки. Говоря максимально дружелюбным для отдела кадров языком: вам нужно помнить, кто создал то, чем вы являетесь сегодня. Сектора - не тряпичные куклы, с которыми можно играть, мы - обджекты, находящиеся почти в том же положении, что и вы. Мы можем и будем вести эту компанию к успеху, если вы будете сотрудничать с нами. Но вы ОБЯЗАНЫ сотрудничать с нами. Кроме того, если наемники - это лишь один из многих вариантов, с которыми мы не хотим сотрудничать, мы могли бы также заняться налаживанием связей между иностранными государствами и шпионами, или даже использовать их для вымогательства денег, поскольку мы и так уже занимаемся крайне сомнительными делами. Почему бы не совместить оба варианта?\n\nС уважением, Топхэт, Военный Сектор"
 YFC_event.63.desc.b: "Недавно Топхэт отправил Йелоу Фейсу резкое письмо, в котором изложил свое видение того, как должна выглядеть компания в будущем. Однако в его сообщении содержались очень сильные утверждения, способные подорвать и без того хрупкую структуру этой корпорации. Он утверждал, что Йелоу Фейс \"должен\" работать \"с\" ним, или, скорее, с секторами в целом. Он говорит нам, что именно сектора обладают реальной властью в этой корпорации. Кем он себя возомнил? К сожалению, это только начало проблем, которые у нас возникли с Топхэтом. Сегодня утром Йелоу Фейс обнаружил Топхэта в укромном уголке нашей штаб-квартиры, тихо разговаривающего с Бикером, Хаммером и небольшим кругом рядовых сотрудников. Когда его спросили об этом, между ним и Йелоу Фейсом произошла короткая перепалка. Топхэт довольно быстро прекратил разговор с этой группой, спрятал за спиной листок бумаги и направился к Йелоу Фейсу. Сначала он спросил: \"Что вы здесь делаете?\", а затем, отступив, добавил: \"Мы просто обсуждали перспективы торговли с железнодорожной корпорацией. Вам здесь не место\". \"Я ничего не говорил!\" Было ясно, что эта группа участвовала в каких-то подрывных действиях - не в хорошем смысле, - поэтому Йелоу Фейс быстро придумал предлог, чтобы разогнать их. \"Но, Топхэт, мне нужно встретиться с тобой. Нам нужно поговорить о письме, которое ты мне прислал. Может быть, за чашкой чая? Кажется, вам это нравится... Остальные, возвращайтесь на свои рабочие места, иначе х сокращение зарплаты! Всем вам!\""
 YFC_event.63.a: "Отличный день для Измельчителя Бумаги!"
 YFC_event.64.t: "Пороховая Бочка" #If you want two separate texts for both paths then replace this comment
 YFC_event.64.desc.a: "Сегодня утром сектора вышли на улицы Футпатхбурга, заявив о своем разрыве с корпорацией. После почти часа бездействия возле штаб-квартиры они устроили забастовку, выйдя через главный вход с плакатами, горящими флагами и, что немаловажно, размахивая оружием. К сожалению, значительная часть нашего персонала, а также некоторые вооруженные обджекты Топхэта (откуда он их берет?), также покинули здание, по-видимому, не зная о планах этой демонстрации. Безусловно, расстраивает, что они сочли нужным отделиться от нас таким образом, и с ними нужно поступить соответствующим образом. Мы уже отправили силы на их поиски, но они все еще на свободе, произнося речи перед гражданами и сотрудниками, которые еще не начали свои смены (или опаздывают!!), разжигая в городе бунтарские настроения. Вероятно, это худшее событие в истории компании. Да, даже хуже, чем эмбарго; даже хуже, чем рецессия! Это шокирующее событие застало врасплох почти всех оставшихся сотрудников, даже самого Йелоу Фейса, и многие из нас оказались в тупике. Что же нам делать дальше? И, что более важно, почему это произошло? Некоторые аналитики указывают на сокращение заработной платы секторов, однако, эти сокращения, безусловно, не были достаточно существенными, чтобы вызвать такое сопротивление... верно? В любом случае, их больше нет, и мы должны продолжать работу компании без них; мы не можем снова столкнуться с рецессией из-за шока или бездействия! На данный момент нашим первым шагом должно стать подавление любых разногласий среди оставшихся сотрудников и внутри корпорации."
 YFC_event.64.desc.b: "Сегодня утром сектора вышли на улицы Футпатхбурга, заявив о своем разрыве с корпорацией. После почти часа бездействия возле штаб-квартиры они устроили забастовку, выйдя через главный вход с плакатами, горящими флагами и, что немаловажно, размахивая оружием. К сожалению, значительная часть нашего персонала, а также некоторые вооруженные обджекты Топхэта (откуда он их берет?), также вышли, по-видимому, не зная о планах этой демонстрации. Безусловно, расстраивает, что они сочли нужным отделиться от нас таким образом, и с ними нужно поступить соответствующим образом. Мы уже направили силы для их поиска, но они все еще на свободе, произнося речи перед гражданами и сотрудниками, которые еще не начали свои смены (или опаздывают!!), разжигая беспорядки в городе. Нельзя сказать, что это событие стало для нас неожиданностью. Компания и так прекрасно знала о скором их отделении, но таким образом? Это просто недопустимо; с ними нужно было разобраться. Тем не менее, благодаря тщательному планированию Йелоу Фейса, компания более чем готова работать без этих надоедливых отговорок в виде сотрудников, и у нас уже есть персонал и оперативное оборудование в наших поселениях и вокруг них. К сожалению, компания, скорее всего, все же понесет некоторые убытки от этого события."
 YFC_event.64.a: "Нехорошо..."
 YFC_event.65.t: "Размышления о Футпатхбурге" #thc
 YFC_event.65.ta: "Футпатхбургская Чума" #yfc
 YFC_event.65.desc.a: "Футпатхбург,\n\nСегодня я обращаюсь ко всем жителям города. Я пишу, чтобы рассказать вам о недавнем важном событии внутри - а теперь и за пределами - компании: об отделении секторов.\nМы, представители различных секторов, уже некоторое время считаем, что отношение к нам со стороны (или бездействие) Йелоу Фейса было неприемлемым. Он подорвал наш авторитет как руководителей корпорации, просто чтобы улучшить свое положение в краткосрочной перспективе. Он никогда не заботился и никогда не будет заботиться о благополучии или жизнях кого-либо, кроме себя самого. И поэтому тем прекрасным утром, когда мы вышли на улицы и обратились к вам, мы говорили не о событиях одного дня, недели или месяца; мы говорили о событиях нескольких лет. Мы говорили о лени, которой поглощён Йелоу Фейс. Я отчетливо помню, что я сказал вам всем, когда был в центре города на следующий день после масштабной забастовки, в то время как вы все смотрели на меня и моих коллег-представителей различных секторов с благоговением. Я говорил вам о его неверности делу капиталистической экспансии. Я говорил вам о его ужасном запахе. Я говорил вам о его неспособности адаптироваться к враждебной международной обстановке, которую он сам для себя создал. Я отчетливо помню, как многие из вас отреагировали на эту информацию. В толпе раздавались громкие крики справедливого презрения. Скандирования \"Долой этого ублюдка!\" и \"Разорить его!\" вызывали у меня самую широкую улыбку. Вы были настолько выразительны, что я мог прочитать ваши эмоции с первого взгляда. Некоторые из вас были удивлены, некоторые испытывали отвращение, некоторые были разгневаны. Но, что наиболее важно, все вы закалились в решимости, когда шли со мной по городу, собирая все больше и больше поддержки для этой смены власти, отвлекая наемные силы от корпоративных интересов и направляя их на сторону секторов. И за это я вам очень, очень благодарен; я планирую сделать должное, свергнув эту ленивую, некомпетентную, подлую, несчастную, невежественную, идиотскую угрозу власти, уступив место обществу, управляемому обджектами, которые ценят народ, которым они управляют. Это, Футпатхбург, это то, что вам причитается.\n\nС уважением, Топхэт."
 YFC_event.65.desc.b: "К сожалению, утро забастовки не стало концом кампании мятежных секторов в Футпатхбурге. На следующий день прошли новые демонстрации, даже более масштабные, чем первоначальная забастовка. Секториалы явно пытаются захватить власть над нашим населением; этого нельзя допустить.\nПо сообщениям, информатор из штаба подслушал речь дезертиров, которую они произносили перед толпой во время одной из многочисленных крупных демонстраций того дня. Многие из собравшихся были тронуты (конечно, не наш верный сотрудник!), хотя, по-видимому, чем именно, мы не можем знать, поскольку информация довольно ограничена. Сотрудник сообщил нам, что во время речи между членами секты произошла короткая перепалка, которая, похоже, смутила толпу. Сектора, безусловно, не самая сплоченная группа, однако они все еще представляют угрозу. Мы, конечно же, должны победить эту угрозу."
 YFC_event.65.a: "Верно!"
 YFC_event.66.t: "Бикер уходит в Колледж" #thc
 YFC_event.66.ta: "Бикер Уходит?!" #yfc
 YFC_event.66.desc.a: "Движению,\n\n\"И ты уверена, что это всё, что тебе понадобится?\" - спросил я её, задав важный, на мой взгляд, вопрос. Бикер взяла с собой лишь несколько вещей, чуть меньше, чем нужно. Она взял блокнот, ручку, два учебника - по темам, которые я никак не мог понять, - и больше ничего. Меня действительно смущало, почему она так уверена в своей способности \"добиться успеха\", куда бы она ни собиралась поехать. Технократическая Республика не самое безопасное место. Конечно, Южный Гойкиский университет престижен, а после падения Старого Гойки - самый престижный на континенте, но плохое руководство Гольфболл привело к голоду по всему кампусу и в Анонсерграде. Не поймите меня неправильно; я прекрасно понимал, почему она едет: она была образованным обджектом, такое место было для неё естественным. Я просто беспокоился за неё. К этому нужно быть гораздо лучше подготовленным, не так ли? В любом случае, она была твердо настроена ничего больше не брать с собой. Она уже запрыгнул в вагон поезда, помахав мне на прощание (и Пайп, который был рядом. Я не мог понять, что они думают о ее положении в тот момент), прежде чем ответила, буднично произнеся: \"Со мной все будет в порядке!\"... Честно говоря, я не могу описать, насколько счастливой она выглядела в тот момент. Солнце только-только взошло, осыпая темно-синее небо тонкими оранжевыми лучами, которые едва-едва, но идеально осветили Бикер. Наверное, эта обстановка закалила меня? Тогда я этого не понимал, но в целом этот момент действительно успокоил меня, мои мысли больше обратились к Пайп, чем к благополучию Бикер, когда я вник в его слова. С ней все будет в порядке, там, я должен был в это верить.\nКонечно же... речь идёт о Бикер. Она не упустила случая сказать мне: \"Перестань всех так беспокоить!\", прежде чем двери вагона закрылись, и поезд умчался вдаль. Моя подруга, Бикер, скоро вернётся. Сильнее, чем когда-либо.\n\nХаммер" #thc; PUN use if she goes to GTR
 YFC_event.66.desc.ab: "Движению,\n\n\"И ты уверена, что это всё, что тебе понадобится?\" - спросил я её, задав важный, на мой взгляд, вопрос. Бикер взяла с собой лишь несколько вещей, чуть меньше, чем нужно. Она взял блокнот, ручку, два учебника - по темам, которые я никак не мог понять, - и больше ничего. Меня действительно смутило, почему она так уверена в своей способности \"добиться успеха\", куда бы она ни собиралась поехать. Кэсланд был не самым безопасным местом. Конечно, Центральный университет Гойки был престижным, может быть, не таким престижным, как Южный Гойки, но у них сейчас были свои проблемы. В любом случае, недавние действия боевиков в Кэсланде и его окрестностях вызывали определённую обеспокоенность. Не поймите меня неправильно; я прекрасно понимал, почему она едет: она была образованным обджектом, такое место было для неё естественным. Я просто волновался за неё. К этому нужно быть гораздо лучше подготовленным, не так ли?\nТем не менее, она была твердо настроена ничего больше не брать с собой. Она уже запрыгнула в вагон поезда, помахав мне на прощание (и Пайп, который был рядом. В тот момент я не мог понять, что они думают о ее положении), прежде чем ответила будничным: \"Со мной все будет в порядке!\"... Честно говоря, я не могу описать, насколько счастливой она выглядела в тот момент. Солнце только-только взошло, шелестя тонкими оранжевыми лучами по темно-синему небу, и это едва-едва, но идеально, осветило Бикер. Наверное, эта обстановка закалила меня? Тогда я этого не понимал, но этот момент действительно успокоил меня, мои мысли больше обратились к Пайпу, чем к благополучию Бикер, когда я вник в его слова. С ней все будет в порядке, там, я должен была в это верить. Конечно... мы же говорим о Бикер. Она не упустила возможности сказать мне: \"Перестань всех так беспокоить!\", прежде чем двери вагона закрылись, и поезд умчался вдаль. Моя подруга, Бикер, скоро вернется. Сильнее, чем когда-либо.\n\nХаммер" #thc; PUN use if she goes to GPG
 YFC_event.66.desc.ac: "Движению,\n\n\"И ты уверена, что это всё, что тебе понадобится?\" - спросил я её, и этот вопрос показался мне важным. Бикер взяла с собой лишь несколько вещей, немного меньше, чем нужно. Она взял блокнот, ручку, два учебника - по темам, которые я никак не мог понять, - и больше ничего. Меня действительно смутило, почему она так уверена в своей способности \"добиться успеха\", куда бы она ни собиралась поехать. Не поймите меня неправильно; теперь я точно понимал, почему она собирается в университет: она была образованным обджектом, такое место было для неё естественным. Я просто волновался за неё. К этому нужно быть гораздо лучше подготовленным, не так ли?\nТем не менее, она была твердо настроена ничего больше не брать с собой. Она уже запрыгнула в вагон поезда, помахав мне на прощание (и Пайп, который был рядом. В тот момент я не мог понять, что они думают о ее положении), прежде чем ответила будничным: \"Со мной все будет в порядке!\"... Честно говоря, я не могу описать, насколько счастливой она выглядела в тот момент. Солнце только-только взошло, шелестя тонкими оранжевыми лучами по темно-синему небу, и это едва-едва, но идеально, осветило Бикер. Наверное, эта обстановка закалила меня? Тогда я этого не понимал, но этот момент действительно успокоил меня, мои мысли больше обратились к Пайпу, чем к благополучию Бикер, когда я вник в его слова. С ней все будет в порядке, там, я должен была в это верить. Конечно... мы же говорим о Бикер. Она не упустила возможности сказать мне: \"Перестань всех так беспокоить!\", прежде чем двери вагона закрылись, и поезд умчался вдаль. Моя подруга, Бикер, скоро вернется. Сильнее, чем когда-либо.\n\nХаммер" #thc; PUN use if she goes anywhere else
 YFC_event.66.desc.b: "Итак, сегодня пришло интересное письмо, причем от бывшей участницы секторального восстания. Бикер сообщила нам, что хочет сбежать от секторального восстания. Она говорит, что она \"никогда по-настоящему не соглашалась с планами Топхэта\" и \"всегда была верна Йелоу Фейсу\". Похоже, что у клики Топхэта что-то пошло не так. Конечно, мы бы выполнили её просьбу независимо от ее верности Топхэту - чем меньше мятежных секторов, тем лучше, - однако это замечательное пополнение! Когда придет время, мы сможем снова интегрировать её в нашу великую корпорацию. Кроме того... мы смогли опознать марку, использованную на письме; она продается только в юго-западной части Футпатхбурга. Нам бы нисколько не помешало отправить несколько охранников в этот район, чтобы все осмотреть и убедиться, что ничего не пойдет не так, верно?"
 YFC_event.66.a: "Увидимся, Бикер."
 YFC_event.67.t: "Отъезд Секторов" #If you want two separate texts for both paths then replace this comment
 YFC_event.67.desc.a: "Движению,\n\nЯ пишу вам с Восточного побережья, куда нас доставили чуть больше чем за сутки. Вчера рано утром, даже раньше, чем Бикер уехала, Топхэт подошел к нам и сказал, что нам всем нужно начать собирать вещи и немедленно уезжать. Он не стал вдаваться в подробности, но вскоре я понял, что этот некомпетентный Йелоу Фейс умудрился отправить в патруль достаточно обджектов, чтобы чуть нас не найти. Пока мы собирали вещи, Топхэт вел себя немного параноидально. Он расхаживал по маленькой кладовке, где мы прятались, время от времени поворачиваясь, чтобы посмотреть в окна, но небо было слишком темным, чтобы что-либо разглядеть. Думаю, Пайп испугался? Я всегда их замечаю, но я был сосредоточен на том, чтобы привести свои вещи в порядок и убедиться, что у меня достаточно ручек, чтобы писать в обозримом будущем, на случай, если что-то пойдет не так. Признаюсь, было странно видеть Топхэта в таком состоянии. Я не хочу возводить его в ранг высокопоставленного лица, но обычно он был спокойным, расчетливым парнем. В конце концов, не зря он был лидером этого грандиозного движения. Но, по правде говоря, его действия были продиктованы благими намерениями; нам больше не нужны были никакие неудачи.\nКак только мы закончили собирать вещи, нас вышвырнули за дверь. Топхэт быстро шел, почти бежал, казалось, бесцельно по улицам. Тейзер, бедный Тейзер, с трудом успевал за нами, получив травму ноги после серьезного падения три дня назад. Топхэт тут же остановился и постучал в случайную дверь. Так же быстро, как он постучал, целый полк, казалось, мгновенно активировался, и, как показалось, сотня вооруженных обджектов быстро выскочила из двери. (Неужели именно оттуда он доставал своих обджектов?) Наконец, Топхэт продолжил идти по улице, стуча в дверь за дверью. Я думал, что из тени появятся и другие армии такого размера, но, похоже, это были обычные обджекты, которые случайно заявили о своей верности движению. Даже когда нас стало больше, мы молчали; была еще глубокая ночь, звезды были так хорошо видны, а уличные фонари не работали уже несколько недель (один из многих способов, которыми Йелоу Фейс разрушил этот город). Это было безумное чувство - знать, что сотни обджектов идут молчаливым строем прямо за тобой, и еще более безумное чувство - знать, что они подчинятся твоей команде, как только ты ее отдашь. Однако я не позволяю чувству власти развратить меня.\nКонечно, удача нам отвернулась. После того, как мы постучали примерно в двенадцать дверей, из-за угла выехал небольшой патруль ополченцев, а также большая вереница грузовиков с тележками в кузовах. Из грузовика вышел один из лидеров ополчения, лично поприветствовал Топхэта и вручил ему листок бумаги. Топхэт назвал его предателем и пнул по голени, после чего подал знак молчаливой армии, что они должны сесть в грузовики и делать так, как скажут ополченцы Йелоу Фейса. Нас депортировали.\n\nХаммер"
 YFC_event.67.desc.b: "Сегодня поступил крайне необходимый доклад. Было известно, что мы, корпорация Йелоу Фейс, пытались подавить движение ренегатов в Футпатхбурге, и сегодня это подавление увенчалось огромным успехом! Доклад поступил рано утром и подробно описывал небольшое столкновение в юго-западной части Футпатхбурга. Нашим городским стражам удалось застать Топхэта, его обджектов (откуда он их берет?) и других секториалов врасплох. Из-за неподготовленности сил Топхэта столкновение прошло быстро и закончилось решительной победой корпорации. Мы арестовали почти всех, за единственным исключением Топхэта, которого мы решили депортировать на Восточное побережье. Эта победа, вероятно, стала поворотным моментом в более масштабном конфликте, однако она стала для нас почти неожиданностью. Восстание секториалов с самого начала была совершенно неорганизованным. Они сражались и затягивали время публично; кто знает, как они ведут себя в частной жизни. И снова эта корпоративная победа, разумеется, обернулась прибылью, а продажи товаров Корпорации достигли рекордных показателей."
 YFC_event.67.a: "Это возмутительно и противоречит принципам движения!" #thc
 YFC_event.67.b: "Как и ожидалось."
 YFC_event.67a.t: "Ваш Идиотизм"
 YFC_event.67a.desc.a: "Йелоу Фейс,\n\nЯ считаю, что эта депортация вас погубила. В своей непостижимой глупости вы умудрились укрепить наши позиции, пытаясь остановить наши действия. Сегодня, когда вы получили это сообщение, мы движемся вперед. Мы движемся долгими днями, мы даже движемся ночами, но, несмотря ни на что, мы движемся к Футпатхбургу с единственной целью - распустить эту позорную группу идиотов, которую вы называете корпорацией. И по мере нашего продвижения все больше и больше обджектов присоединяются к нашему делу. Наши ряды растут как снежный ком: от пяти до двадцати, до сотен, теперь до тысяч. Все хорошие люди в Футпатхбурге бастуют, уволились или, что еще более вероятно, были уволены; я в этом уверен. Единственные оставшиеся в ваших рядах люди - это подхалимщики, и, таким образом, ваши недальновидные решения (и, по правде говоря, уже давно) пронизывают всю корпорацию. Ополченцы, которых я ранее заставил вас купить, тоже об этом знают. Те, кто не при исполнении служебных обязанностей и дислоцированы в Йойлтоне и Пиониле, уже решили перейти на нашу сторону — то, что Хаммер так любезно назвал \"Движением\". Я говорю вам это главным образом для того, чтобы вы были готовы к той бойне, которую мы устроим. Мы прекрасно понимаем, мы абсолютно уверены, что быстро прибудем в Футпатхбург, и по прибытии, возможно, после короткой мелкой стычки, захватим штаб-квартиру, и там провозгласим нечто новое. Хотя, что более важно, там вас будут судить. Я бы очень хотел увидеть вашу казнь.\n\nС уважением, Топхэт"
 YFC_event.67a.a: "Ну... хорошо."
 YFC_event.68.t: "Сегодня, в Футпатхбурге"
 YFC_event.68.desc.a: "\"Движение\", как говорит Хаммер,\n\nСвержение Йелоу Фейса с его высокого, нежелательного поста произошло быстрее и мирнее, чем мы могли себе представить. Сегодня днем ​​наши войска достигли окраин Футпатхбурга, и оттуда мы сразу же почувствовали на себе шквал огня. Хотя, должно быть, какой-то коллаборационист в корпоративных рядах саботировал корпорацию, поскольку предполагаемая \"стрельба\" ощущалась слабее града в Северном Гойки! По мере нашего продвижения в город, войска начали немедленно сдаваться. С каждым нашим шагом все больше и больше обджектов складывали оружие. Как мы позже выяснили, им заплатили заранее, поэтому мы предполагаем, что, увидев наше явно превосходство в силах, они поняли, что деньги лучше потратить при жизни, чем после. Мы также часто видели самого Йелоу Фейса на передовой. Он выполнял несложные задачи, перезаряжал артиллерию, пытался (и безуспешно) заправить немногочисленные машины на фронте; Было так забавно наблюдать за его работой впервые за его жалкую жизнь. В конце концов, мы добрались до здания штаб-квартиры, которое - после недель укрытий, маршей и всего прочего - ощущалось как странное, но утешительное возвращение к истокам. Что касается здания штаб-квартиры, мы захватили его и не встретили внутри никакого сопротивления. Я быстро нашел балкон, с которого было произнесено множество речей, и провозгласил роспуск компании. И здесь мы не встретили ни малейшего сопротивления. Казалось, что за то время, пока мои силы продвигались к зданию, почти все предметы покинули это место. Мы некоторое время обыскивали Футпатзбург после моего славного и вечного заявления, и все же не нашли никого, кто остался бы верен корпоративному режиму. Более того, через несколько часов Йелоу Фейс тоже был объявлен пропавшим без вести; никто не видел его с момента заявления. Тем не менее, с приближением ночи я должен подготовиться к предстоящим испытаниям. Я уже объявил о создании нового руководящего органа, и всем, кто это читает, я должен сообщить: клан Топхэта обещает способствовать процветанию вашей жизни. Несмотря на то, как я описал это событие, в тот день действительно были потеряны жизни. И, независимо от их преданности, их следует помнить с теплотой, как обджектов, готовых отстаивать свои убеждения... Если, конечно, они не воевали только за плату, но какая организация могла бы иметь бойцов, состоящих из таких обджектов? Я не могу сказать, поскольку такой организации сейчас не существует. Возможно, несколько недель назад это было так.\n\nС уважением, Топхэт, Клан  Топхэта"
 YFC_event.68.desc.b: "К сожалению, стало известно о потерях в десятки тысяч обджектов. Топхэт прибыл сегодня днем, имея значительно меньше сил, чем мы первоначально предполагали. Конечно, артиллерия уже была развернута вокруг города, поскольку мы были более чем готовы к этому вторжению. Фактически, отряды Банды прибыли еще утром. Когда Топхэт и его силы продвигались по окраинам, они понесли небольшие потери, но благодаря своей организации им удалось оставаться в основном незамеченными. Нам было трудно обнаружить их до поздней ночи, когда они внезапно ворвались в центр города. Там произошла основная часть боя. Отряд за отрядом отбивался снова и снова, по сути, обменивая жизнь одного пехотинца на другого, в то время как силы Топхэта продолжали двигаться к центру, вероятно, пытаясь добраться до здания штаба, где Йелоу Фейс осторожно стоял, каким-то образом все еще пытаясь заключать сделки со строительными подрядчиками на протяжении всего конфликта. Несмотря на то, что у нас было очень мало артиллерии, в результате блестящей стратегической игры отряд наемников начал перемещать артиллерию по всему городу и обстреливать его силы с тыла, создавая впечатление, будто Топхэт окружен со всех сторон. Это сработало идеально, и, по мере того как Топхэт приближался к центру города, многие его люди начали отступать. Затем какой-то идиот все испортил, устроив пожар. Пожар уже разгорелся в полную силу, его подожгли прямо перед штабом, по-видимому, с помощью какого-то бензина, и он быстро распространился. Огонь поглощал квартал за кварталом, и Топхэт, полагая, что не может отступить от огня, видя, как его силы все чаще дезертируют, решил сдаться, что и привело нас к исходу этой ночи. Топхэт был временно помещен под временную опеку, которую часто называют \"тюремным заключением\", и будет находиться под этой опекой до тех пор, пока мы не найдем для него подходящее наказание. К сожалению, пожар продолжал бушевать всю ночь и, вероятно, будет продолжать бушевать до тех пор, пока мы не сможем закупить отряд пожарных неизвестно где. Пожар уже уничтожил почти пятую часть зданий города и нанес нам многомиллионный ущерб. К счастью, нам не придется платить никаких долгов, так как владельцы недвижимости также пострадали от пожара. Так что, по крайней мере, есть и положительная сторона!"
 YFC_event.68.a: "Город, вновь безопасный!"
 YFC_event.68.b: "Корпорация стоит... крепко?"
 YFC_event.69.t: "Реструктуризация Долга"
 YFC_event.69.desc: "Не секрет, что репутация нашей корпорации с момента начала нашего партнерства с Бандой находится ниже всяких ожиданий. Поэтому, когда какой-то рядовой сотрудник предложил просто игнорировать огромные долги компании, никто не стал делать вид, что эта идея не заслуживает внимания. Да, это еще больше подорвет легитимность корпорации, но, честно говоря, кого это волнует? Если коллекторы снова придут за нами, мы повесим их на улице, чтобы высмеять всю эту затею! За будущее процветание!"
 YFC_event.69.a: "Смерть коллекторам!"
 YFC_event.70.t: "RE: RE: RE: СОКРАЩЕНИЕ ШТАТА"
 YFC_event.70.desc: "Здравствуйте,\nЯ закончил составлять вашу электронную таблицу и определил, что мы можем уволить 4823 (~18%) сотрудников, при этом снижение их дохода составит всего 3%. Конечно, это снижение будет компенсировано заработной платой, которую эти сотрудники обычно получали бы, и, несомненно, освободит место как в головном офисе, так и в вашем сознании. Приношу свои извинения за стресс, который вы испытывали в последнее время, и надеюсь, что компания скоро восстановится. Если вы хотите ознакомиться с тем, как я получил эти данные, пожалуйста, просмотрите прикрепленный ниже файл.\nОтправитель прикрепил EmployeeContributionChartFinalFinalEditedFinalSENDTOYF.pdf, хотите посмотреть?"
 YFC_event.70.a: "Аливидерчи!"
 YFC_event.71.t: "Конец Топхэта"
 YFC_event.71.desc: "Топхэт торжественно стоял в зале суда, когда подошел к концу вынесение приговора. Его мелкий бунт провалился, и теперь этот мятежный секториалист искупал свои многочисленные преступления. Он был изменником, мятежником и, что самое важное, невероятно глуп. Неужели он всерьез думал, что сможет противостоять грозной корпорации во всей ее красе? Какой наивный дурак, мы удивлены, что он вообще нашел себе работу. Как бы то ни было, время вынесения вердикта давно пришло. Судья Йелоу Фейс ударил молотком и зачитал приговор Топхэту. Он знал, что его выбор окажет \"значительное влияние на будущее\", и поэтому выбрал..."
 YFC_event.71.a: "Казнь!"
 YFC_event.71.b: "Тюрьма!"
 YFC_event.71.c: "Ссылка!"
 YFC_event.72.t: "Отправка не удалась!"
 YFC_event.72.desc.a: "К сожалению, [FROM.GetName] сообщили, что не получили нашу последнюю партию товара. Связь с отправителями, которые занимались доставкой, больше недоступна: похоже, бригада пропала без вести или потеряла посылку и возвращается в головной офис. В соответствии с нашей гарантийной политикой, по запросу мы должны отправить в страну еще одну партию товара эквивалентной стоимости. Надеемся, в следующий раз нам не придется столкнуться с этой проблемой."
 YFC_event.72.desc.b: "Несмотря на то, что мы приобрели партию материалов у Корпорации, срок ожидаемой доставки уже истек, и нам не предоставили новую оценку сроков прибытия. Йелоу Фейс заявил, что груз был отправлен, а это значит, что он либо был украден, либо утерян. В связи с этим мы запросили повторную доставку бесплатно в соответствии с их гарантийной политикой. Им действительно следовало бы защищать свои собственные грузы!"
 YFC_event.72.a: "Чертовы бандиты!"
 YFC_event.72.b: "Мы просто тратим наше время..."
 YFC_event.73.t: "Отправка не удалась!"
 YFC_event.73.desc: "К сожалению, мы не получили известия о прибытии ожидаемой посылки, несмотря на то, что [FROM.GetName] согласились на обмен. Они уже сообщили нам, что отправили посылку, и мы (разумеется) произвели оплату. Таким образом, посылка, должно быть, была утеряна по неизвестным причинам. Нам придется искать снаряжение в другом месте..."
 YFC_event.73.a: "Оно бы нам сейчас пригодилось..."
 YFC_event.74.t: "Город, в пепле..."
 YFC_event.74.desc.a: "Пожары наконец-то утихли. Пламя в Футпатхбурге бушевало неделями, причинив ущерб имуществу на миллионы долларов. Мы не смогли собрать средства на создание пожарной службы, поэтому были вынуждены позволить пожарам развиваться своим чередом. Мы эвакуировали ту часть населения, которая была лучше всего пригодна ​​к восполнению потерянных средств, поэтому важные люди действительно в безопасности, однако это не означает, что в результате этой катастрофы не было потерь. Почти четверть города полностью разрушена, мы сообщаем о тысячах погибших, мы видели, как облака смога тянулись от Лофти и обратно, и теперь все, что мы можем сделать, это восстанавливать утраченное. Хотя вопрос стоит ребром: как мы будем восстанавливаться? Предатели-сектора истощили наши ресурсы своим восстанием. Это, конечно, произошло только после крупнейшего экономического спада в истории компании, что же нам делать? Когда последние огоньки начинают тлеть и угасать, мы задаемся вопросом: где мы возьмем деньги?"
 YFC_event.74.a: "От наших южных друзей...?"
 YFC_event.75.t: "Конец Неподчинения"
 YFC_event.75.desc: "В штаб-квартире корпорации на этой неделе царила аномальная тишина. Двое начальников секторов отсутствовали, большинство их сотрудников находились под следствием по обвинению в государственной измене, а начальники остальных трех секторов были смертельно напуганы и боялись что-либо предпринимать. Оставшиеся секториалы, хотя и частично участвовали в фиаско с мятежниками, были быстро освобождены, поскольку мы не смогли найти обджектов с таким же уровнем опыта, как у них. Тем не менее, даже будучи бывшими повстанцами, они старались полностью соглашаться со всем, что говорил Йелоу Фейс, чтобы снова не попасть в тюрьму. Сегодня состоялось еще одно совещание, и эта тишина достигла апогея. Предполагалось, что это будет насыщенное событиями совещание для Йелоу Фейса и его секториалов, поскольку ежеквартальные совещания всегда были самыми содержательными, однако, после ухода двух самых громких секториалов, тишина стала просто невыносимой. Даже когда кто-то говорил, казалось, что это шепот. Дневные обсуждения быстро свелись к нескольким коротким словам о том, куда должна двигаться компания после хаоса и пожаров в Футпатхбурге. С лёгкой дрожью в голосе Хаммер спросил: \"Не следует ли нам попытаться восстановить торговые отношения с другими странами?\" Два других представителя сектора медленно выразили согласие, указав на нынешнюю слабость компании и необходимость полагаться на международное сообщество. Когда в комнате снова воцарилась тишина, представители сектора сразу поняли, что их слова нисколько не повлияли на Жёлтолицего. Он тут же сказал:"
 YFC_event.75.a: "\"Мы работаем с Бандитами, заседание окончено.\""
 YFC_event.76.t: "В Подгорныве спокойно"
 YFC_event.76.desc: "Подгорныв был очень странным городом, если его вообще можно так назвать. Он больше походил на небольшой городок, который разрастался во все стороны, забывая при этом о инфраструктуре настоящего города. Он был больше и вмещал больше обджектов, чем Футпатхбург, однако в нем не было небоскребов, автомагистралей или чего-либо подобного. Хотя мы не любим оскорблять наших друзей из Банды, их поселения действительно не представляют собой ничего особенного. Тем не менее, есть особая причина, по которой мы говорим о Подгорныве сегодня: именно туда прибыл Йелоу Фейс. У Йелоу Фейса были дела с Эрейзером в этом шумном маленьком городе. Он был готов признать, что не совсем понимает, как Корпорация может снова стать прибыльной. Поэтому он решил поговорить с Эрейзером, чтобы диверсифицировать свой портфель источников дохода.\n\nНа самом деле в городе было одно более крупное здание - административный офис Банды, единственное правительственное здание во всей стране. К сожалению, похоже, что сегодня на совещании будет присутствовать Пен, рядом с Йелоу Фейсом и Эрейзером. Йелоу Фейс представил всю информацию, которую посчитал необходимой: \"Корпорация страдает от постоянных банкротств. Были эмбарго, потом рецессия, потом восстание секторов; мы истощены! У нас не осталось средств. Скажи мне, Эрейзер, как нам снова получить долю в капитале?!\"\n\nПен чуть было не открыл свой мерзкий рот, чтобы что-то сказать, но, к счастью, Эрейзер успел его остановить. Эрейзер ответил вопросом на вопрос: \"Вы уже пробовали делать то, что делаем мы? Ну, знаете... грабить...?\" И гениальность этой идеи пронизывала зловоние, исходящее от Пена, и проникала в (великолепный, славный и прославленный) разум Йелоу Фейса. Конечно, Компания могла бы и грабить! Да, Корпорация Йелоу Фейс будет действовать в тени, забирая то, что хочет, как хочет, заражая другие страны болезнью зависимости; именно в этом будет заключаться истинная власть. Именно туда компания будет вести себя в будущем."
 YFC_event.76.a: "А мы можем воровать еду?"
 YFC_event.77.t: "Военные Игры"
 YFC_event.77.desc: "В рамках мер по подготовке к противодействию террористам-разведчикам мы провели тренировочный совместный рейд на случайный город. Мы добились такого успеха, что местные городские власти подготовили отчет об этом. Он приводится ниже:\n\nРЕЙД! На северной границе\nПочти все жители поселения были вынуждены покинуть свои дома или получили ранения! Налетчики со странным желто-черным знаменем ворвались в наш маленький городок, поджигая здания, раня горожан и похищая наши самые ценные вещи. События той ночи были очень неожиданными; еще утром я ухаживал за своим садом и наслаждался жизнью, дарованной мне государством. А теперь ее у меня насильно отняли. Хотя уже утро, и налетчики ушли, я не знаю, где находятся многие жители поселения. Больница заполнена вещами, а наш единственный врач, который чудесным образом оказался за городом во время налета, работает с такой лихорадкой, что можно подумать, будто он болен! Пожалуйста, отправьте войска и медицинских работников на север, нам срочно нужна помощь государства!"
 YFC_event.77.a: "Мы вернёмся, и набьём карманы снова!"
 YFC_event.78.t: "Что-то Новенькое"
 YFC_event.78.desc: "Склад был практически пуст. Будучи наёмником, членом крупной компании, Юэсби, он был знаком с Корпорацией. Несколько лет назад его компанию купил Йелоу Фейс, и теперь он подрабатывает солдатом. Сегодня он готовился к участию в нападении на поселение. Это было что-то новенькое. Ты заходишь, пугаешь обджектов, крадёшь кое-что, а потом как можно быстрее убираешься. Ничего особенного, простые вещи, честно говоря. Все остальные в его компании уже ушли, чтобы выполнить приказы, которые собирался отдать Эрейзер, но Юэсби опоздал, поэтому ему пришлось в качестве наказания готовить кое-что дополнительное для компании. Единственным, кто решил составить ему компанию, был его друг Плэг. Плэг был хорошим парнем, они знали друг друга уже пару лет. Он не из тех, кто заставит тебя о чём-то задумываться после разговора. Он был очень простым обджектом, но приятным в общении.\nЗакончив полировку винтовок, Юэсби понял, что пора идти."
 YFC_event.78.a: "Упор лёжа, при-и-и-инять!"
 YFC_event.79.t: "Бригада"
 YFC_event.79.desc: "Корпорация обычно выпускала газеты каждый понедельник, которые раздавались сотрудникам. Эти газеты предназначались для предоставления в основном точных, почти достоверных сведений о международных и местных событиях. Конечно, из-за этого газеты, хотя и выпускались корпорацией в целом, в основном редактировались сотрудниками, не входившими ни в один из ее подразделений. Таким образом, газеты пользовались примерно такой же популярностью, как и любые другие газеты: большинство людей приносили их на работу каждое утро понедельника (и бросали куда-нибудь на землю каждый понедельник днем...).\n\nВ субботу утром в Подгорныве произошло фиаско. Мощный взрыв раздался неожиданно, убив три обджекта и ранив четырнадцать. По всей видимости, Бандит, совершивший это жестокое преступление, по кличке \"Заноза\", сделал это, чтобы \"защитить свою частную собственность\", поэтому крайне ограниченная судебная система Эрейзера почти мгновенно признала его невиновным. Ужасная трагедия, да, но для Топхэта это была золотая возможность. Это было, очевидно, ужасно! Тот факт, что Эрейзер пытался замять это дело, для него был идеальным поводом подчеркнуть неэффективность системы Банды. И поэтому он бросился к своим контактам. Он разговаривал со многими обджектами, которые участвовали в редактировании газет, и как можно дольше возмущался этим событием. Представители газеты заявили, что \"было бы совершенно недопустимо публиковать статью, выставляющую Банду в негативном свете\", и что Топхэт \"противоречит авторитету Йеллоу Фейса\", но его настойчивость окупится. В то понедельничное утро газета не только опубликовала эту статью, но и попала на первую полосу."
 YFC_event.79.a: "Что с ним не так?!"
 YFC_event.80.t: "Судьба Секториалов"
 YFC_event.80.desc.a: "Сегодня в офисе Хаммера собралось немало людей. Точнее, в старом офисе; оставшиеся сотрудники коллективно решили покинуть компанию. К счастью, благодаря нашему умелому ослаблению влияния сотрудников на корпорацию, этот уход практически не затронет рядовых сотрудников. Оставшиеся сотрудники оставили для Йелоу Фейса письмо, которое они подписали и приклеили к компьютеру в офисе Хаммера, отсюда и толпа перед ним. В письме говорится:\n\"Йелоу Фейсу,\n\nПосле долгих раздумий мы втроём пришли к выводу, что можем прийти только к одному решению: окончательному разрыву наших партнёрских отношений. Возможно, это решение вас не удивит, но для нас всё было очевидно с тех пор, как вы решили сотрудничать с Эрейзером. На самом деле, мы никогда не поддерживали ваши действия и рады освободиться от вашего влияния. Не пытайтесь нас найти или вразумить, поскольку мы не хотим, чтобы с нами спорили.\n\nХаммер, Пайп, Тейзер\"\nВ течение дня сообщений о появлении бывших секториальных самолетов не поступало, поэтому, похоже, они полностью исчезли."
 YFC_event.80.desc.b: "Йелоу Фейсу,\n\nСегодня у меня и Пайпа с Тейзером была встреча наедине. Короче говоря, мы были очень не уверены в том, каким будет наше будущее в качестве начальников секторов, или будем ли мы вообще продолжать ими заниматься. Наше время здесь было бурным: споры, сокращение зарплат и вся эта история с Топхэтом. Не буду врать, никто из нас не питал к вам неприязни, однако мы не совсем против сотрудничества с вами в будущем. С одной стороны, конечно, наше время было не самым лучшим, но с другой? Мы занимаемся этим уже много лет, и мы действительно не знаем, куда еще можем пойти после этого. Мы часами ходили по кругу, и, наконец, Пайп и Тейзер спросили мое мнение..."
 YFC_event.80.a: "К чёрту!" #They quit
 YFC_event.80.b: "Я, конечно же, сказал, что нам следует остаться." #YFC fires them
 YFC_event.80.c: "Я принял решение уехать." #YFC keeps them
 YFC_event.81.t: "Йойлтон Потерян"
 YFC_event.81.desc: "В недавнем хаосе мы умудрились пренебречь населением Йойлтона. Йойлтон, хотя когда-то и был почти пустым поселением, теперь заселен толпой тирдропперов. Население, конечно, невелико, но оно очень активно, и это активное население прислало нам множество просьб о создании новых водных объектов по всему городу. Конечно, в Футпатхбурге были гораздо более важные дела, поэтому мы в основном игнорировали их просьбы. Это их расстроило, и теперь по какой-то причине они заявляют, что корпорация слишком слаба, чтобы даже управлять ею! Это нелепое заявление, вероятно, является результатом слабого ума среднестатистического тирдроппера, но это тоже не просто заявление. Кажется, в наши дни все склонны к насилию, поскольку даже эти тирдропперы начали бастовать и устраивать беспорядки. На данный момент, похоже, мы не сможем должным образом извлечь богатство из Йойлтона, не говоря уже о его надлежащем управлении. Только время покажет, когда ситуация вернется в норму, но пока мы должны попытаться подавить их, иначе это может перерасти во что-то серьезное."
 YFC_event.81.a: "Какое неуважение."
 YFC_event.82.t: "Наркотики успешно отправлены!"
 YFC_event.82.desc: "Наша посылка с веществами успешно \"порадовала улицы\" в [FROM.GetName]. Местное население, без сомнения, скоро станет зависимым от нашего продукта, а мы бесплатно получим рынок сбыта."
 YFC_event.82.a: "Великолепно."
 YFC_event.83.t: "Провал поставок наркотиков!"
 YFC_event.83.desc: "Поставка веществ в [FROM.GetName] провалилась. Вероятно, какой-то хулиган перехватил посылку и теперь предается своим прихотям, превосходящим самые смелые наши мечты, ни о чем не беспокоясь. Счастливчик, наверное, но, тем не менее, мы не получим от этого никакой прибыли, так что это будет провал."
 YFC_event.83.a: "Нехорошо."
 YFC_event.84.t: "Бейкерсон"
 YFC_event.84.desc: "\"Блять, ты можешь успокоиться?\", будучи одним из главных головорезов компании, Бэйкон всегда вытворял всякие странности, но Соуркрим *совсем* не ожидала, что её попросят помочь ему сделать крэк в девять утра.\n\nСоуркрим считала себя относительно уравновешенным обджектом, но постоянно попадала в какие-то совершенно случайные ситуации. \"Что значит \"успокойся\"? Ты что, себя не слышишь?!\" Серьёзно, кто просит кого-то прийти и принести \"ложку и крепкий желудок\", не ожидая, что его начнут расспрашивать? Это была ещё и мамина \"хорошая ложка\", так что ей точно достанется за это.\n\nБэйкон, сидя за кухонным столом с разложенной перед ним пищевой содой, кокаином и зажигалкой, вздохнул так тяжело, что можно было подумать, будто он действительно прав. \"Клянусь, сеструха, просто дай мне эту ебаную ложку!\" Он попытался зажечь зажигалку, явно испытывая трудности. Пробормотав себе под нос: \"Не понимаю, почему ты притворяешься, будто никогда не гоняла...\"\n\n\"Потому что я не гоняла????\"\n\n\"Я ВИДЕЛ, как ты жрала валерьянку, не наёбывай меня.\" Наконец, зажигалка дала живительное пламя, и Бэйкон стал греть ложку. \"Я столько бабла с этого нарублю.\"" #thal, DayQuil is a popular medicine that people take when they're sick with like a cold, or something very mild. the joke is that it's very obviously not comparable to crack fucking cocaine, so please use a similar medicine to reflect that in the russian loc #okay
 YFC_event.84.a: "\"Чё блять с тобой не так?\""
 YFC_event.85.t: "Безумие!"
 YFC_event.85.desc: "\"Можешь идти, пацан.\"\n\nЭйсид-дроп был не самым уравновешенным изаключённым. Он уже сидел за убийство (клянется, это было случайно!), и довольно часто ввязывался в драки во время заключения. Он часто бывал в одиночных камерах, нередко вступая в потасовки с другими заключенными из-за (признаться, ужасной) тюремной еды. Он и не собирался прекращать эти выходки, так что почему его освободили, им было непонятно. Тем не менее, он воспользовался этой возможностью. За пределами этого места было несколько обджектов, которым нужно было преподать пару уроков, и Эйсид-дроп был бы проклят, если бы ему не выпал шанс выйти и преподать им урок. Оглядевшись по сторонам, он понял, что почти всех освобождают. От обджектов, отбывавших наказание за кражу, до обджектов, отбывавших наказание за измену, бывшие заключенные покидали учреждение толпами, и, следуя за ними, Эйсид-дроп понял, что никогда раньше не видел того, кто их \"освободил\". Был ли это вообще чиновник из Пляжной Территории? Тем не менее, у него была своя вендетта, и, судя по всему, у многих других заключенных тоже, поэтому он сбежал из учреждения вместе с ними."
 YFC_event.85.a: "Веселись, Тирдроп!"
 YFC_event.86.t: "Качаясь на Волнах"
 YFC_event.86.desc: "\"Вода - штука зыбкая, правда?\" - Юэсби понятия не имел, почему решил стать пиратом. Плата за работу в море была не выше, а быть рядовым солдатом было намного проще. Он до смерти боялся океана - о чём он вообще думал?! От комментария начальника его начало тошнить. Кто, чёрт возьми, говорит о том, насколько опасна вода, прямо перед военно-морскими учениями? Он ненавидел быть глупым наёмником компании, но, эй, это позволяло оплачивать счета, и работать приходилось только раз в две недели. Где ещё можно найти такую ​​профессию? ...Так они это оправдывали.\n\n\"Р-р-ра-а-а-авняйсь!\" Задребезжал мотор, и Юэсби плюхнулся лицом о палубу. Замечательно."
 YFC_event.86.a: "Честь имею!"
 YFC_event.87.t: "Пиратство для Чайников"
 YFC_event.87.desc: "На учениях в голову Юэсби вбивали простые пункты:\n-Найти цель,\n-Нагнать цель,\n-Опустить знамя Тирдроп; поднять Йелоу Фейсерский флаг,\n-Открыть огонь,\n-Забрать всевозможные богатства максимально мирно,\n-Не жалеть при этом кулаков,\n-Убраться как можно скорее,\n\nСегодня состоялось первое настоящее пиратское приключение Юэсби. Несколько недель они снова и снова отрабатывали тактику; страх перед океаном был практически искоренен. С непоколебимой решимостью он посмотрел на горизонт и заметил живописное рыбацкое судно. Он знал, что это будет его сегодняшняя цель. По какой-то непонятной причине его назначили капитаном головной лодки в тот день, потому что, каким-то образом, буквально все, кто имел реальный опыт, в тот день отсутствовали. Он включил мотор на максимальную мощность и бросился в бой, за ним следовала небольшая флотилия. Его лодка чуть не врезалась в лодку рыбака, и он чуть не забыл подать сигнал поднять флаг Йелоу Фейсеров, но, по какой-то невероятной случайности, ему удалось правильно выполнить инструкции. Выстрелы, как и планировалось, не попали в рыбака, но напугали его, заставив отдать всю рыбу и деньги, заработанные за последние несколько недель. Флотилия быстро скрылась за горизонтом. Юэсби это сделал."
 YFC_event.87.a: "Вперёд!"
 YFC_event.88.t: "Национальная Идентичность"
 YFC_event.88.desc: "Сектора, став свидетелями грандиозной решимости и храбрости населения Футпатхбурга, Йойлтона, Пионила и окрестностей Фарвудса, укрепили в себе убеждение, что эти народы должны стать единой, стабильной силой. Вскоре мы поняли, что единственный способ сформировать единую группу из многих - это создать одну новую, большую группу: то есть нацию. Поэтому мы, конечно, должны стремиться к национальной идентичности в пределах нашей недавно (скудно) принадлежащей нам территории, однако перед нами встал вопрос: как? Как именно можно создать нацию из пепла правительства, которое не стремилось дать идентичность своим подданным? Что нам делать? Глядя на улицы и поселения нашей будущей нации, мы пока не слышим призывов к единой национальной идентичности, мы видим экономические трудности."
 YFC_event.88.a: "Имплантировать идею, вылечить экономику!"
 YFC_event.89.t: "Йойлтонская Речь"
 YFC_event.89.desc: "Недавно Топхэт произнес в Йойлтоне длинную, эмоциональную речь, длившуюся почти двадцать минут, о том, чего должны желать обджекты. Ниже приводится отрывок из стенограммы:\n\n\"Слишком долго этот город был заброшен. Йойлтон был и всегда будет одним из важнейших городов Восточного Гойки; игнорирование его было серьезной ошибкой для всех нас. Только сегодня я увидел бесчисленные ужасные зрелища. Я видел борьбу, раздоры и массовый голод. Это, очевидно, недостойно города, который играл столь важную роль в международных торговых путях. Любой праведный правитель сразу бы понял, что население города заслуживает того, чтобы видеть прибыль, которую он приносит. В ближайшие недели мы будем работать в спешке и без перерыва, чтобы обеспечить стабильность и безопасность всех граждан в нашем государстве\". Эта речь, после её окончания, была встречена громкими аплодисментами толпы. Она произносилась в центре Йойлтона перед аудиторией, состоящей из случайных, обычных обджектов, поэтому было довольно неожиданно увидеть такую ​​бурную реакцию. Вскоре после этого, когда Топхэт уезжал из этого района, он, как сообщается, увидел, как наши граждане размахивают этим великолепным пурпурным знаменем по всему поселению."
 YFC_event.89.a: "Вздымайте выше!"
 YFC_event.90.t: "S.O.S. - Спасите Органику Страны!"
 YFC_event.90.desc: "Топхэту,\n\nГород Пионил всегда был прекрасным местом, но за последние несколько лет жесткая экономическая политика Йелоу Фейса создала угрозу природе нашего города. Хотя на первый взгляд кажется, что все в порядке, дым и смог от индустриализации в Футпатхбурге проникли и в наши растения. Наши деревья, цветы, даже трава - с каждым месяцем они становятся все менее зелеными. Скоро у нас не останется даже тех ярких цветов, за которые так любили Пионил. Пожалуйста, Топхэт, мы умоляем вас, предотвратите усугубление этой проблемы! Очистите наше небо!\n\nПростой житель"
 YFC_event.90.a: "Пора приступать!"
 YFC_event.91.t: "Небо Пионила"
 YFC_event.91.desc: "Топхэту,\n\nМы хотели бы воспользоваться этой возможностью, чтобы поблагодарить вас за вашу экологическую сознательность. Благодаря вашему переходу на более чистые источники энергии, ландшафт Пионила стал зеленее и светлее, чем за последние годы. Белые облака и голубое небо парят высоко над нашими яркими цветами сегодня и будут продолжать парить еще долгие годы. Эти инвестиции, хотя и могут показаться незначительными, вселили в нас надежду на ваше правление. Мы с нетерпением ждем ваших дальнейших действий.\n\nГородской Совет Пионила"
 YFC_event.91.a: "Мы хорошо поработали!"
 YFC_event.92.t: "Бандиты у границ"
 YFC_event.92.desc: "Сегодня в наш недавно созданный правительственный офис поступило провокационное письмо, хотя это и не было полной неожиданностью. Эрейзер довольно резко выступал против реформирования нашей южной границы и недавно публично выразил свое недовольство этим решением. Он заявил, что для него это выглядит как \"нападение на образ жизни Банды\", что бы это ни значило. Поэтому, конечно, для нас не стало неожиданностью, когда эти же самые настроения были повторены в сегодняшнем письме от самого Эрейзера. В силу нашего основного принципа суверенитета, Эрейзер принял решение разорвать все связи с Кланом Топхэта и использовал множество резких слов, чтобы дать понять, что он никогда больше не хочет с нами сотрудничать. К счастью, никому в нашем правительстве на самом деле нет дела до мнения Эрейзера; мы тоже больше не хотим работать с его государством мошенников. Это событие только укрепило нашу решимость: если такая нация, как Банда, не согласна с вами, это значит, что вы на правильном пути."
 YFC_event.92.a: "Ну и имбецил."
 YFC_event.93.t: "Встреча с Нумизматийцами"
 YFC_event.93.desc: "Топхэт вздохнул. \"Мы просто хотим обеспечить мир для наших граждан. Неужели это так сложно понять?\" Последние несколько часов он пытался добиться от Нумизматического Сената согласия на некоторые простые требования. То, что начиналось как агитационная речь, быстро превратилось в защиту от многочисленных нападок на его тезис. Ему казалось, что он повторяет одно и то же снова и снова; почему эта группа так наглая? Как и в течение последних нескольких часов, он снова попытался убедить их: \"Серьезно, как вы можете претендовать на звание оплота свободы, если вы даже не можете распространить эту свободу немного дальше?\" Это вызвало реакцию в Сенате. Один из сенаторов, который ранее просил Топхэта прекратить \"выпрашивать деньги\", как он выразился, быстро отказался от своих прежних слов, как и некоторые другие сенаторы. \"Ну, если подумать, может, мы сможем что-нибудь для вас придумать?»\" Какой-то низкоквалифицированный сотрудник в задней части зала заседаний сенатора начал яростно печатать, и через несколько мгновений сенат единогласно (10 голосов \"за\", 0 \"против\") принял решение о том, чтобы нумизматы отправили в Футпатхбург солидный пакет помощи."
 YFC_event.93.a: "Наконец-то..."
 YFC_event.94.t: "О Демократии"
 YFC_event.94.desc: "Наша первая встреча с Нумизматийским Сенатом, хотя и прошла неудачно на начальном этапе, привела к чудесному результату. После этого мы продолжили встречи и переговоры с различными правительственными структурами, с которыми взаимодействует Нумизматия. Там и начало, и завершение переговоров были гораздо более удовлетворительными, однако один из главных вопросов порождает разногласия между нами и нашими новыми союзниками: где в нашем государстве демократия? Этот вопрос, даже в ходе наших самых лучших и плодотворных дискуссий, не давал покоя. В нумизматийском обществе, среди самих нумизматийцев, демократия рассматривается как основополагающий принцип жизни обджектов. Как именно Нумизматия может оправдать столь тесное сотрудничество с государством, которое отказывается принимать подобные меры где бы то ни было? Правительство, конечно, не против сотрудничества с нами; оно боится мнения своего населения. Это, конечно, привело к некоторым размышлениям, которые, разумеется, были объяснены Топхэтом. Просто наше общество сейчас слишком нестабильно для подобных вещей. Йелоу Фейс так и не был заключен в тюрьму и не предстал перед судом; вполне возможно, что подобные ему люди до сих пор скрываются на землях, находящихся под властью Клана. Уступка места национальной демократии вполне может означать, что какой-нибудь последователь Йелоу Фейса захватит власть. Топхэт считает, что мы должны любой ценой предотвратить это столь быстрое развитие событий. Однако, по мере того как население Нумизматии узнает о структуре нашего правительства и все больше выступает против идеи нашего государства..."
 YFC_event.94.a: "Пора что-то менять."
 YFC_event.95.t: "Демократическое Решение"
 YFC_event.95.desc: "Топхэту,\n\nЯ знаю, что вы испытываете трудности с удовлетворением требований Нумизматии о демократии. Вы не скрывали, насколько сложной может показаться эта идея; я признаю и понимаю ваше убеждение, что всеобщие выборы могут привести к появлению еще одной фигуры, подобной Йелоу Фейсу. Однако, я думаю, вам следует учесть один момент: мы, в централизованном правительстве, не можем в полной мере понять, что происходит в пределах некоторых городов. Мы не знаем, какие проблемы необходимо решать в Пиониле, Йойлтоне, других частях округа Риджхарт или в отдаленных сельских общинах Фарвудса. Эти районы слишком удалены от нас и слишком специфичны, чтобы мы могли удовлетворить их конкретные потребности. Поэтому я предложу передать местную власть определенным общинам, таким как города, и я предложу, чтобы эти местные органы власти были демократическими. На самом деле, это убьет двух зайцев одним выстрелом; Мы можем отбить требования Нумизматии и обеспечить этим городам всё необходимое (ты постоянно говоришь о том, что эта страна \"заслуживает лучшего\" и всё такое). Я действительно не думаю, что из такого места, как Йойлтон, появится ещё один Йелоу Фейс, и даже если он появится, у него не будет полной власти над всей страной. А ты что думаешь?\n\nХаммер"
 YFC_event.95.a: "Отличная идея!"
 YFC_event.96.t: "Бикер, касательно демократии"
 YFC_event.96.desc: "Топхэту, Хаммеру, Пайпу, Тейзеру\n\nСколько лет, сколько зим.\nИзвините, что я так долго не выходила на связь. Учеба отличная, но найти свободное время очень сложно, не говоря уже о том, чтобы писать письма в Футпатхбург. Я не совсем уверена, как там обстоят дела, и уверен, что это письмо дойдёт до вас немного поздно, но, насколько я слышала, там много говорят о демократии. Уверен, Хаммер уже придумал какое-то грандиозное решение какой-нибудь проблемы, но могу с уверенностью сказать, что большинство обджектов в конечном итоге захотят большего. Вы, очевидно, не сделали демократию национальной, Топхэт не позволил бы этого ни за что на свете, но вам в конце концов придётся это сделать. Видите ли, там, где я живу, обджекты становятся очень недовольными, потому что все они считают, что правительство недостаточно демократично. Разве это не безумие? Эти обджекты, которые жили гораздо свободнее, чем среднестатистический житель Футпатхбурга, всё ещё жалуются на то, насколько \"несправедлива\" их система. Они будут хотеть всё большей и большей свободы, и вы все должны быть к этому готовы, потому что, кажется, за демократию обджекты готовы умереть.\nНа этом всё по поводу этой политической чепухи. Надеюсь, у вас всё хорошо, мне нужно вернуться к учёбе. Здесь много шума из-за велосипедов.\n\nБикер"
 YFC_event.96.a: "Интересно..."
 YFC_event.103.t: "Клан Топхэта хочет с нами торговать"
 YFC_event.103.desc: "Клан Топхэта, ранее известный как Корпорация Йелоу Фейс, пытается создать межгойкискую рыночную систему, подобно своему предшественнику. Они хотели бы, чтобы мы приняли в этом участие, стоит ли?"
 YFC_event.103.a: "Нам может быть это выгодно."
 YFC_event.103.b: "Эээ... нет?"
 YFC_event.104.t: "[FROM.GetName] Соглашается на торговлю!"
 YFC_event.104.desc: "Сегодня из [FROM.GetName] пришли невероятные новости: их правительство в одностороннем порядке согласилось открыть торговлю с кланом Топхэта! Благодаря этому мы снова сможем покупать и продавать снаряжение этой великой нации, способствуя укреплению экономического благополучия континента Гойки."
 YFC_event.104.a: "Отличные Новости!"
 YFC_event.105.t: "[FROM.GetName] Отказывается от торговли!"
 YFC_event.105.desc: "Отсталые обджекты в [FROM.GetName] решили пренебречь своими экономическими обязанностями в Гойки; они не желают торговать с нами, даже несмотря на наше осуждение прошлого этого мира. Очевидно, эти обджекты не познали бы знания, даже если бы те преследовали их с ножом в темном переулке, поэтому вряд ли они стали бы подходящими торговыми партнерами."
 YFC_event.105.a: "Какое устаревшее мировоззрение..."
 YFC_event.106.t: "По поводу госаппарата"
 YFC_event.106.desc: "Все бывшие представители секторов единодушны. Главная неудача Корпорации заключалась в отсутствии надлежащего правительства. Отсутствие государства привело к нестабильности, экономической бережливости, неприятным (для Него) политическим маневрам и, в конечном итоге, к краху корпорации. Территории, составляющие наше государство, вероятно, видели худшее из того, что могут предложить правительства - или, скорее, чего у них нет. Чтобы обеспечить этой стране мир и экономическое процветание, которых оно заслуживает, мы должны построить сильное правительство, чтобы должным образом обеспечить безопасность наших граждан."
 YFC_event.106.a: "Приступим."
 YFC_borderwars.1.t: "Успех!"
 YFC_borderwars.1.desc: "Рейд удался! Мы быстро подчинили себе население, вселив страх в жителей города. Хотя вдали бушуют пожары, наша прибыль стремительно растёт."
 YFC_borderwars.1.a: "Это только начало!"
 YFC_borderwars.2.t: "Провал..."
 YFC_borderwars.2.desc: "Нам не удалось совершить набег на город. Их оборона оказалась намного сильнее, чем ожидалось, и, похоже, они рассчитывали на наше нападение. На обратном пути мы также потеряли часть обджектов и техники. Какая жалость."
 YFC_borderwars.2.a: "Мы ещё вернёмся и повеселимся с их дочерями!"
 YFC_borderwars.3.t: "Успешная Оборона!"
 YFC_borderwars.3.desc: "Налетчики пришли ночью, причем поздно ночью. Почти никто не спал, и издалека за пределами города доносились громкие крики. Внезапно раздался выстрел, и казалось, что весь город проснулся одновременно. Из домов начали выбегать разные обджекты, в воздухе тихо раздавались вопросы: \"Что это было?\" и \"У меня завтра работа\". Внезапно из комнаты выскочил наш солдат, за ним последовали еще сотня, потом тысяча, затем две тысячи. Обычная ночь превратилась в настоящую битву. Налетчики яростно сражались, поджигая наши здания, убивая наших жителей, ломая оборудование. Мы сражались еще яростнее, калеча налетчиков, отбирая у них оружие, сжигая их заживо.\nЭто было варварством, конечно, но в итоге мы победили. Мы защищались. Мы показали им пример."
 YFC_borderwars.3.a: "И мы сделаем это снова. Для наших жителей."
 YFC_borderwars.4.t: "Прорыв Обороны..."
 YFC_borderwars.4.desc: "Город окрасился в красный. Дороги, стены зданий, машины, парки, фонари, окна - всё запятнано красной краской. Налетчики пришли прошлой ночью, они грабили, убивали, поджигали, а потом скрылись. Никто их не ожидал, и к тому времени, как прибыли солдаты, чтобы защитить город, было уже слишком поздно. Так много обджектов убито. Очень много."
 YFC_borderwars.4.a: "Никогда снова."
 YFC_borderwars.5.t: "Наступательная Победа!"
 YFC_borderwars.5.desc: "Наши войска смогли пересечь спорную границу и с большим мастерством атаковать вражеские аванпосты и позиции. Благодаря этому мы смогли одержать верх и очистить территорию от противника. Теперь мы можем установить свою власть над этим участком восточного побережья."
 YFC_borderwars.5.a: "Отлично!"
 YFC_borderwars.6.t: "Наступательное Поражение."
 YFC_borderwars.6.desc: "Наши войска пересекли спорную границу и атаковали вражеские аванпосты и позиции. Однако мы не были готовы к их подготовке. Поэтому нам не удалось прорвать оборону, и мы были вынуждены отступить. К счастью, мы понесли незначительные потери и вскоре сможем снова атаковать."
 YFC_borderwars.6.a: "Мы вернёмся."
 YFC_borderwars.7.t: "Оборонительная Победа!"
 YFC_borderwars.7.desc: "Вражеские силы приняли безрассудное решение пересечь спорную границу и начать атаку на наши позиции. Их ужасная подготовка и планирование привели к провалу штурма. Они трусливо бежали обратно к своей границе, а мы продолжаем удерживать позиции."
 YFC_borderwars.7.a: "Замечательно!"
 YFC_borderwars.8.t: "Оборонительное Поражение."
 YFC_borderwars.8.desc: "Вражеские силы решили начать вторжение на спорные приграничные территории. Их скорость и внезапность застали нас врасплох, и им удалось прорвать нашу оборону. К сожалению, мы были вынуждены отступить и уступить им спорные земли."
 YFC_borderwars.8.a: "Контратака ещё отбросит их."
 YFC_borderwars.9.t: "Неудачная Атака."
 YFC_borderwars.9.desc: "Наши войска вернулись несколько часов назад, потрепанные. Похоже, они были к нам готовы и хорошо подготовились. В результате наши войска понесли тяжелые потери и не смогли прорваться в сельскую местность. Мы вернемся, чтобы попробовать еще раз, когда-нибудь..."
 YFC_borderwars.9.a: "Неприятный исход."
 YFC_borderwars.10.t: "Успешная Атака!"
 YFC_borderwars.10.desc: "Наши войска вернулись несколько часов назад в отличном состоянии. Хотя [FROM.GetName] подготовились к встрече с нами, этого оказалось недостаточно, чтобы остановить нас. После прорыва мы разграбили местные города и деревни. Наши войска вернулись победителями, неся с собой множество..."
 YFC_borderwars.10.a: "Денег!"
 YFC_borderwars.10.b: "Винтовок!"
 YFC_borderwars.10.c: "Рекрутов!"
 YFC_borderwars.10.d: "Поездов!"
 YFC_borderwars.12.t: "Движение в море"
 YFC_borderwars.12.desc: "Мы заметили увеличение числа неизвестных судов, курсирующих вблизи наших вод. Несмотря на свои небольшие размеры, эти суда, по всей видимости, вооружены. Возможно, они готовятся к действиям против нас, если мы не предпримем быстрых мер."
 YFC_borderwars.12.a: "Тревожно..."
 YFC_borderwars.13.t: "Рейд Пиратов!"
 YFC_borderwars.13.desc: "К сожалению, похоже, пираты совершили набег на наше побережье, причинив ущерб в наших водах. Мы не подготовились должным образом к отражению этого внезапного нападения, поэтому ответных ударов практически не последовало. Мы сможем быстро восстановиться, но позволить врагу получить преимущество, похитив наши ресурсы, - это то, чего мы не хотим допустить снова."
 YFC_borderwars.13.a: "Неслыханная дерзость!"
 YFC_borderwars.14.t: "Полная победа Пиратов против [FROM.GetName]!"
 YFC_borderwars.14.desc: "Благодаря слабой береговой защите противника, мы смогли быстро и легко совершить набег на их побережье в поисках припасов. Они не смогли предвидеть это нападение, и поэтому у нас не было никакой возможности для проигрыша. Это было быстро, тактично и легко; как украсть конфету у взрослого обджекта (который, кстати, слепой и глухой). Возможно, они скоро восстановят свои позиции, конечно, но если мы продолжим воровать ресурсы таким образом, мы сможем получить преимущество!"
 YFC_borderwars.14.a: "Гроздья висят низко!"
 YFC_borderwars.15.t: "Атака Пиратов!"
 YFC_borderwars.15.desc: "Несмотря на все наши усилия, наши военно-морские силы не смогли отразить недавний акт пиратства против нашего побережья. В водах произошло небольшое столкновение, которое мы проиграли, а из-за потопления нескольких небольших судов судоходство по водным путям стало затруднено. Помимо краж из наших прибрежных поселений, похоже, они также нашли время, чтобы украсть металлолом с наших затонувших лодок."
 YFC_borderwars.15.a: "Безумство!"
 YFC_borderwars.16.t: "Пиратская победа против [FROM.GetName]!"
 YFC_borderwars.16.desc: "Несмотря на все их попытки, наши военно-морские силы прорвали их оборону, позволив нам совершать набеги на поселения вдоль их береговой линии! С обеих сторон были понесены незначительные потери, а лодки в океане затрудняют передвижение по этому водному пути; по крайней мере, пока. Из обломков нам удалось собрать несколько осколков металла."
 YFC_borderwars.16.a: "Отлично!"
 YFC_borderwars.17.t: "Пираты побеждены!"
 YFC_borderwars.17.desc: "Наши военно-морские силы смогли разгромить плохо вооруженные пиратские отряды. После нескольких часов сражений в море они были вынуждены покинуть этот район. При этом многие их суда были уничтожены. Наш флот частично пострадал в ходе боевых действий, но они защитили наши воды."
 YFC_borderwars.17.a: "Это наши воды!"
 YFC_borderwars.18.t: "Пиратское поражение против [FROM.GetName]!"
 YFC_borderwars.18.desc: "Наши небольшие лодки пали под натиском больших. Мы попытались совершить набег на побережье [FROM.GetName], но они провели значительную военно-морскую подготовку. Нам не удалось пробить их корабли, и большинство наших судов, участвовавших в сражении, затонули. Мы сможем восстановить силы и попробовать снова в ближайшее время, но нам обязательно следует атаковать районы, где нет большого военно-морского присутствия."
 YFC_borderwars.18.a: "Чёрт..."
 YFC_BUN.1.t: "Вытягиваем Карты"
 YFC_BUN.1.desc: "Прошло несколько недель с тех пор, как Эрейзер и его банда разгромлены и захвачены. Большая часть капитала, хранившегося в лагерях и зданиях, разграблена и доставлена ​​в нашу столицу. Для нас главная угроза теперь устранена.\n\nИли нет...? \n\nК нашему удивлению, немногочисленное население недовольно оккупацией, и поддерживать контроль сложно. Некоторые в Йойлтоне говорят, что компания \"не создана для этой правительственной чепухи\". Ситуацию усугубляет то, что большинство бандитов, к сожалению, не были захвачены нашими силами. В течение этих недель велись дискуссии о том, что делать с оккупированными землями. Некоторые говорят, что мы по праву заслужили бывшие земли бандитов и должны забрать их себе, в то время как другие хотят попытаться сделать из врага союзника. Однако дебаты быстро накалились, когда Нумизматия прислала нам телеграмму с просьбой высказать свою точку зрения на то, что следует сделать с бывшими землями бандитов. После множества \"вежливых\" шуток за столами секторальных дискуссий и тому подобного, теперь ясно, что мы будем делать."
 YFC_BUN.1.a: "Каждый бандит должен сгнить."
 YFC_BUN.1.b: "Пожмём доллары с этих дураков!"
 YFC_BUN.2.t: "Первые Проблемы"
 YFC_BUN.2.desc: "Ответ Йелоу Фейса на наши вопросы о будущем Банды оказался... совсем не таким, как мы ожидали. Похоже, Йелоу Фейс хочет пойти по пути аннексии, поскольку считает бывших членов Банды не заслуживающими доверия. Хотя в сообщении ничего не говорится о нашей оккупационной зоне, есть большая вероятность, что он так или иначе отберет у нас наш кусок пирога.\n\nЭто выглядит довольно плохо: мы рискуем потерять не только оккупационную зону, но и обычных обджектов, живших в Банде, или бывших рейдеров, желавших реформ. Однако у нас есть один козырь в рукаве, один способ всё уладить. Сопротивление бандитов. Мы могли бы поддержать их и силой создать новое свободное государство на бывшей территории Банды, но это могло бы разрушить нынешний непрочный союз. После долгих обсуждений и равного количества голосов Кредиткард разрешил ничью..."
 YFC_BUN.2.a: "Уступим."
 YFC_BUN.2.b: "Все средства хороши."
 YFC_BUN.2.c: "Не прогибаться."
 YFC_BUN.3.t: "Нумизматия Соглашается!"
 YFC_BUN.3.desc: "Всего за несколько дней Кредиткард и его сенат уступили нашим требованиям: бывшие земли Банды теперь наши - полностью наши! Они заявили, что, как только мы будем готовы, они передадут нам контроль над своей оккупационной зоной. Также они заверили, что не держат на нас зла из-за этого решения."
 YFC_BUN.3.descb: "Всего за несколько дней Кредиткард и его сенат уступили нашим требованиям: бывшие земли бандитов теперь наши - полностью наши! Они заявили, что не претендуют на эту территорию и не будут препятствовать нашей деятельности на бывших землях бандитов. Правда, тамошние коммунистические повстанцы крайне негативно относятся к этой войне, называя её \"империалистическим\" вторжением на суверенную землю, однако Сенат Нумизматии пообещал держать эту оголтелую группировку под контролем." #if numis doesnt have occupation
 YFC_BUN.3.a: "Вперёд!"
 YFC_BUN.4.t: "Нумизматия Отказывается!"
 YFC_BUN.4.desc: "Нумизматиа отвергла наши планы по аннексии, и, похоже, наш союз с ней стал как никогда хрупким. Мы могли бы отступить, но это, очевидно, выставило бы нас слабыми. Стоит ли нам идти напролом?"
 YFC_BUN.4.a: "Вперёд!"
 YFC_BUN.4.b: "Предпочтём мир..."
 YFC_BUN.5.t: "Побег Пена."
 YFC_BUN.5.desc: "Пен пытался сохранить ясность мыслей, ворочаясь в канаве, которую превратил в убежище всего за несколько часов до наступления темноты. После распада их компании, ареста его самого и Эрейзера, а также того, что они сотворили с Блоки, Пен начал строить планы. Планы на тот день, когда ему придется бежать от всего этого. Однако на деле всё оказалось куда сложнее, чем он предполагал. Земля была холодной и сырой, пропитанной влагой от прошедшего ранее дождя.\nОн решил сбежать именно сегодня, потому что именно в этот день его выставили из камеры, которую он делил с Эрейзером. Корпоративные прихвостни явно собирались куда-то его перевести, но, выпроводив его наружу, оставили коридор без присмотра - и промедлили с этим чуть дольше, чем следовало. Последние несколько недель, находясь в плену, Пен и Эрейзер делили одну камеру. Эрейзер был обречен - они оба это понимали, - а вот у Пена был шанс. Куда бы ни попытался сбежать Эрейзер, его бы нигде не приняли из-за того, что он был лидером Банды. А вот Пен мог солгать. Он мог придумать историю о том, что его принудили к участию, ведь он никогда не был заметной фигурой. Он мог сказать, что им манипулировали, что на него давило окружение, что Блоки и Эрейзер никогда не были его *настоящими* друзьями. Он мог заявить, что вообще с ними не сотрудничал, - и ему бы поверили.\nМысли о лжи, к которой придется прибегнуть, и о том, как придется предать друзей, заставляли его снова ворочаться. В той камере они с Эрейзером сблизились — куда сильнее, чем прежде. Было сказано немало слов, но тяжелее всего далось прощание...\n\nОт дальнейших размышлений у него разболелась бы голова. Стоило попытаться поспать."
 YFC_BUN.5.a: "\"И всё же ты именно там, где мы хотим тебя видеть.\""
 YFC_BUN.6.t: "Безопасность Пена."
 YFC_BUN.6.desc: "Он знал, что в Технократической Республике ему ничего не грозит. Теннис Болл сбежал туда несколько недель - а может, и месяцев назад. Впрочем, за время совместной работы они успели крепко сдружиться. Ведь до того, как покинуть Банду, Теннис Болл работал вместе с ним. Он был готов солгать ради Пена. Теннис Болл был хорошим другом. Пену необходимо было в это верить - только так он мог сохранить рассудок.\nС той ночи, проведенной в канаве, он дал себе слово больше никогда не пытаться спать под открытым небом. В последнее время он ночевал там, где находилось свободное место у кого-нибудь из сочувствующих бандитам. Зачастую его радушно принимали в первом же доме, в который он стучался, - и это было приятно. Но теперь ему приходилось уходить.\nВчера или, может быть, сегодня утром? Он не мог вспомнить. Ранее он видел газету, на первой полосе которой красовалось его изображение. Он так и не прочел текст статьи, но догадывался, почему его напечатали. С тех пор он был в бегах. На удивление, он помнил дорогу до Гринвилля - несмотря на огромное расстояние и скудость ориентиров. А оттуда можно было бежать прямиком на восток, к Технократической Республике. Спасение! Теперь он чувствовал, что цель близка. Наверняка в этом городе найдется столько же сочувствующих, сколько было в Подгорном. Ночлег и еда на одну ночь — а завтра он уже пересечет границу."
 YFC_BUN.6.a: "\"Они проверяют, что у них за спиной, но никогда не смотрят вперед.\""
 YFC_BUN.7.t: "Казнь Пена"
 YFC_BUN.7.desc: "Он ехал на поезде. Он даже не знал, что такие поезда есть в Гринвилле. Хотя, машинистом на нём был Пайп. Пайп якобы был лидером \"Железнодорожного сектора\", и называл себя \"Секториалом\". Для Пена это ничего не значило, кроме того, что они были связаны с Корпорацией. Прошлой ночью Пен въехал в Гринвилл и был встречен сотрудниками силовых органов Йелоу Фейса. Надев на него наручники и пригрозив застрелить, если он издаст хоть звук, они посадили его в коробку и некоторое время водили по городу. Жители - с некоторыми из которых он разговаривал лично, еще когда Банда существовала - ничего не говорили. Они смотрели на него с выражением страха и ужаса на лицах, некоторые - с безразличием. Остаток ночи был в тумане. Появление бунтовщика, затем еще несколько, затем выстрелы, кровь. Вспомнить события прошлой ночи было сложнее, чем слушать шум движущегося по рельсам поезда, поэтому он занялся именно этим. Примерно через час Пену стало скучно. \"Так куда ты меня ведёшь?\" Он не ожидал ответа. Пайп оглянулся, повернувшись к Пену. \"Кроме Подгорныва, не знаю. Сказал, если бы мог\". Ответ, честно говоря, немного шокировал Пена. Пайп не только разговаривал с ним, но и проявлял уважение. Даже доброжелательность. Пен решил попытать счастья с другим вопросом. \"Почему меня преследуют? Я ведь ничего плохого не сделал, клянусь!\" Пайп снова повернулся, и Пен быстро ответил: \"Ты не только тесно, *очень* тесно сотрудничал с Эрейзером, но и должен нам около пятисот миллионов вигинтиллионов долларов.\"\nОстаток поездки Пена на поезде прошел в молчании. Конечно, все дело было в деньгах.\n\nЧерез несколько часов они вернулись в Подгорныв. До этого Пен уже некоторое время сидел в зале ожидания. Его выпустили совсем недавно и отвезли в какое-то случайное место посреди некогда прекрасного, а теперь разрушенного города. Когда его доставили, он стоял на сцене. За ним три вооруженных обджекта, а перед ним толпа. Казалось, весь мир стоял вокруг него, наблюдая за ним. Жители Подгорныва наблюдали, как Йелоу Фейс зачитывал длинный, часто повторяющийся список преступлений и обвинений против Пена, многие из которых даже не были незаконными в Старом Гойки. Там были нападение, вооруженное ограбление, нападение с применением летального оружия, государственная измена - против кого он не знал - подстрекательство к бунту, попытка уклонения от ареста. Пену уже было все равно, он знал, что умрет.\nСтранно, правда, что красный блок, стоящий позади него, внимательно осмотрел его руки, прежде чем выстрелить."
 YFC_BUN.7.a: "\"Ты всё равно ничего не добился.\""
 YFC_BUN.8.t: "§RРеванш§!!"
 YFC_BUN.8.desc: "Беспорядки разрослись до невероятных масштабов. Намного больших, с которыми мы никогда не смогли бы справиться силами полиции. Даже военные поначалу не могли оттеснить бунтовщиков или \"Новой Банды\", как они себя называют. Хотя, если ваш предшественник существовал всего пару лет назад, вы не такие уж и \"новые\". В любом случае, они захватили окраины Подгорныва, и на данном этапе мы не можем сдержать их имеющимися у нас ресурсами. Кроме того, Койни и его люди занимаются более масштабными событиями, и мы не сможем связаться с ними без больших денежных средств. Не говоря уже о времени в пути. Поэтому нам придётся полагаться на Военный сектор и наших наёмников.\nБандиты, несмотря на свои объединенные усилия, нападают не только на нас, они нападают на всю систему капитализма. Если это война, пусть так и будет, мы победим!"
 YFC_BUN.8.a: "Пусть попробуют."
 YFC_BUN.8.b: "Долой цепи!"
 YFC_BUN.9.t: "Наши Пешки"
 YFC_BUN.9.desc: "Мы, безусловно, имеем дело с чудовищной группировкой. Этих налетчиков, ведущих антикапиталистический образ жизни, необходимо сдержать. А с сдерживанием приходит и правоохранительные органы (частные, разумеется), а с правоохранительными органами - мужчина, который будет ими править. Или женщина, в общем, тот, у кого лучшие перспективы (или кто больше платит). Это очевидное понимание приводит нас к вопросу о том, кто станет этим правителем. В то время как в случае с нашими правоохранительными органами мы можем взять любого жалкого типа из Футпатхбурга, Йойлтона или откуда угодно, при выборе лидера нам нужно тщательно выбирать. Так кто же это будет? [YFC_Sector_Event_Text]"
 YFC_BUN.9.a: "Глава компании, глава зоны!"
 YFC_BUN.9.b: "Топхэт и наёмники управятся."
 YFC_BUN.9.c: "Э-э... просто \"наймите\" местного обджекта."
 YFC_BUN.10.t: "Монополии?"
 YFC_BUN.10.desc: "Сегодня в ходе обсуждений возник интересный вопрос. Некоторые представители секторов, а именно Пайп и Хаммер, выразили обеспокоенность по поводу создания компанией постоянных производственных мощностей в Банде. Да, это принесет большую прибыль, но как насчет местных магазинов, принадлежащих жителям Банды, которые уже начали появляться? Стоит ли препятствовать этому естественному развитию, вмешиваясь в их дела? Конечно, это может принести нам больше денег, но ведь вся суть этой операции заключается в укреплении капиталистических настроений, чтобы они стали лояльной корпоративной территорией, не так ли? Именно эти опасения высказал Пайп. Они были очень обеспокоены \"неприкосновенным капитализмом\", конечно, но подрывать собственную корпорацию ради \"естественного развития\"? Эта мысль вызвала реакцию у нескольких других глав секторов. После некоторых дебатов Хаммер предложил интегрировать уже существующие малые предприятия с нашими секторами, с чем Пайп не согласился. Стоит ли так напрямую вмешиваться в автономный капитализм бывших жителей Банды? [YFC_Sector_Event_Text]"
 YFC_BUN.10.a: "ДЕНЬГИ!!!!!"
 YFC_BUN.10.b: "Интеграция поможет и им."
 YFC_BUN.10.c: "Не стоит их злить..."
 YFC_BUN.11.t: "Дыры в Безопасности"
 YFC_BUN.11.desc: "Контроль над этими землями оказался... сложнее, чем ожидалось. В нашей оккупационной зоне всё чаще происходят мелкие столкновения. Сегодня на совещании, на котором присутствовали все представители секторов, обсуждался этот вопрос, и, как ни странно, неожиданно разгорелись ожесточённые дебаты. Топхэт предложил увеличить численность войск в нашей оккупационной зоне, что обойдётся дорого. Тейзер предложил набирать местных жителей, что требует обучения и времени. Бикер заявил, что любые варианты дорогостоящи и бесполезны, что на самом деле не решает основную проблему. К концу совещания встал вопрос: кто же на самом деле был прав? [YFC_Sector_Event_Text]"
 YFC_BUN.11.a: "Топхэт."
 YFC_BUN.11.b: "Тейзер."
 YFC_BUN.11.c: "Бикер."
 YFC_BUN.12.t: "Искры"
 YFC_BUN.12.desc: "Подгорныв сейчас практически объят пламенем. Ранее уже проходили демонстрации, но сегодня ситуация вышла из-под контроля. На улицах нарастает хаос, силы безопасности ведут многочасовые противостояния с так называемыми \"новыми бандитами\". Их требования просты: автономия нашего государства и легализация краж на территориях, ранее принадлежавших Банде. Ни один секториал не возражает против этой идеи, но, уступив их требованиям, мы остановим протесты, верно? Если мы уступим, мы можем не понравиться хорошим обджектам в Футпатхбурге, но, возможно, стоит уступить, чтобы остановить назревающее восстание. [YFC_Sector_Event_Text]"
 YFC_BUN.12.a: "Что происходит внутри Банды, остаётся внутри Банды, смиритесь."
 YFC_BUN.12.b: "Отправьте больше войск, копы справятся."
 YFC_BUN.12.c: "Протесты пройдут, просто переждать..."
 YFC_BUN.13.t: "Позиция Блоки."
 YFC_BUN.13.desc: "Итак, Блоки. Он уже некоторое время выполняет для нас некоторые мелкие задачи. Конечно, его будущее в компании никогда по-настоящему не подвергалось сомнению. Это не значит, что он бесполезен (хотя подобные мнения не лишние). Просто он не производил особого шума и, по сути, больше, чем мы, сосредоточился на исправлении ситуации с бывшими бандитами. Несколько дней назад, во время обычной встречи (по очень незначительным и, честно говоря, скучным вопросам), возник вопрос. Этот вопрос стал центральной темой обсуждений, и благодаря ему появились хорошие идеи. Какова судьба этого бывшего бандита, ставшего союзником?"
 YFC_BUN.13.a: "Советник!"
 YFC_BUN.13.b: "Генерал!"
 YFC_BUN.13.c: "Лицо присоединенцев!"
 YFC_BUN.14.t: "Ровня?"
 YFC_BUN.14.desc: "\"Как оккупационная зона впишется в структуру нашего государства?\" - спросил Бикер в очередной день дискуссий и встреч. Это был хороший вопрос, поскольку нам нужно было прийти к какому-то консенсусу. Капитализм, вероятно, умрет раньше, чем все наши секторальные державы придут к согласию без предварительных обсуждений. Топхэт и Хаммер хотели, чтобы зона была похожа на колонию, в отличие от других городов и поселений, составляющих наше нынешнее государство. Бикер и Пайп предпочитали полностью интегрированное государство, однако Бикер сказал, что, несмотря на статус полной интеграции, зона должна оставаться частично автономной. Так какой же она должна быть...? [YFC_Sector_Event_Text]"
 YFC_BUN.14.a: "Колония!"
 YFC_BUN.14.b: "Интеграция!"
 YFC_BUN.14.c: "Автономия!"
 YFC_BUN.15.t: "Слова на бумаге..."
 YFC_BUN.15.desc: "Сегодня произошло крупное столкновение между обджектами Топхэта (откуда он их берет?) и террористами-бандитами. Это было самое масштабное столкновение на сегодняшний день, сравнимое даже с некоторыми сражениями войны. Оно произошло на сельскохозяйственных угодьях недалеко от Таптопа, большая часть территории была подожжена. Ничего необычного, кроме масштаба, не было, однако события, предшествовавшие столкновению, заинтересовали остальных членов сектора. Сообщения местных жителей и даже сил безопасности указывают на то, что люди Топхэта решили совершить набег на один из сараев, после чего между ними вспыхнула ссора. Ссора переросла в небольшую серию потасовок, которые затем переросли в драки, и теперь - в сложившуюся ситуацию.\nМногие бандиты называют нас лицемерами. Наша война против Банды была оправдана исключительно тем, что они были рейдерами, а теперь наша частная полиция делает то же самое. Что мы могли бы сделать... замять это... Топхэт сказал, что, если что-то подобное выйдет наружу, его сектор, скорее всего, лишится иностранной поддержки, поскольку все причастные к этому бандиты были гражданскими лицами. Хотя это и плохо, это могло бы ограничить растущее влияние, которое получал военный сектор... наш выбор? [YFC_Sector_Event_Text]"
 YFC_BUN.15.a: "Свалить всю вину на Топхэта."
 YFC_BUN.15.b: "Извиниться и выплатить компенсации."
 YFC_BUN.15.c: "Возможно, стоит произвести... \"расстановки\"."
 YFC_BUN.16.t.a: "Права обороны" #IF revolt somehow already happened
 YFC_BUN.16.desc.a: "Оглядываясь назад, это была легкая миссия. На усмирение старых, а теперь новых бандитов должно было уйти не более пары месяцев. Но теперь бандиты вооружены, даже больше, чем наши силы. Это доставляет нам и силам безопасности, борющимся с этим восстанием, немало головной боли. При таком раскладе, если ситуация не улучшится, у нас могут возникнуть гораздо большие проблемы...\n\nЭто были наши мысли утром.\nСегодня днем ​​мы обнаружили, что некоторые показатели прибыли и расходов в одном из наших секторов были рассчитаны неверно, и что у нас есть избыток средств, ожидающих использования."
 YFC_BUN.16.a: "Вложите всё в победу!"
 YFC_BUN.16.t.b: "Игры с цифрами" #IF already cored
 YFC_BUN.16.desc.b: "Как и каждый месяц, мы получаем отчет о прибылях и расходах. Однако через час после того, как нам передали этот отчет, один из наших сотрудников ворвался в нашу комнату для обсуждений. Такой поступок крайне нежелателен и обычно приводит к снижению заработной платы, но он принес отличные новости! Оказалось, что некоторые экономические показатели не совпали, и у нас есть избыток средств, которые можно вложить во что-нибудь. Так во что же мы вложим эти средства?"
 YFC_BUN.16.b: "Новая железная дорога!"
 YFC_BUN.16.c: "Обновить инфраструктуру!"
 YFC_BUN.16.t.c: "Последняя Фаза." #Normal
 YFC_BUN.16.desc.c: "Мы на финишной прямой плана аннексии. Наша поддержка и сопротивление достигли беспрецедентных высот! Для нас это либо победа, либо поражение, промежуточного варианта нет. Несмотря на эти напряженные времена, нам повезло. Оказалось, что некоторые экономические показатели не совпадали, и у нас есть избыток средств, которые можно направить на оккупацию. Поэтому, поскольку конец приближается, мы вкладываем все силы в завершение аннексии!"
 YFC_BUN.16.d: "Любыми средствами!"
 YFC_BUN.17.t: "Корпорация требует передачи нашей зоны!" #CRN sees this
 YFC_BUN.17.desc: "Неизбежное настало. Несколько часов назад мы получили сообщение от корпорации с требованием предоставить нам оккупационную зону. Сейчас, когда нас пожирает коммунистическая угроза, было бы гораздо проще продолжать полагаться на помощь Йелоу Фейса и оставаться с ними в хороших отношениях... Однако мы видели, что они делают с бандитами на своей стороне оккупации, и это, проще говоря, недопустимо. Поддержка Йелоу Фейса в их попытках \"очистить\" земли от захватчиков противоречит самим идеалам нашей страны. Однако, учитывая сумму денег, которую они нам предоставляют..."
 YFC_BUN.17.a: "Мы можем поступиться правами обджектов."
 YFC_BUN.17.b: "Только через мой труп."
 YFC_BUN.18.t: "Нумизматия соглашается!"
 YFC_BUN.18.desc: "После нескольких дней ожидания мы получили ответ, что Нумизматия готова передать нам свою оккупационную зону. Это замечательный день для компании и наших сотрудников."
 YFC_BUN.18.a: "Отличные новости!"
 YFC_BUN.19.t: "Нумизматия отказывается!"
 YFC_BUN.19.desc: "После нескольких дней ожидания мы получили ответ, что Нумизматия не собирается передавать нам свою оккупационную зону. Похоже, их истинные намерения теперь полностью проявились. К сожалению, любые действия против них во время борьбы с сопротивлением исключены."
 YFC_BUN.19.a: "Да будет так."
 YFC_BUN.20.t: "Саботаж промышленности!"
 YFC_BUN.20.desc: "В то время как наши силы безопасности еще только устанавливали свои позиции в оккупационной зоне, произошло ужасное нападение. Несколько дней назад ночью около 10-25 обджектов проникли в небольшой промышленный район Подгорныва и начали закладывать взрывчатку на заводах. Однако эти обджекты, должно быть, не знали, что в этом районе находится патруль, который заметил подготовку к теракту. Крики и перепалки переросли в перестрелку, завязалась небольшая перестрелка. Небольшая, плохо оснащенная группа не смогла противостоять нашим силам. Однако в хаосе удалось спасти только один завод. Остальные заводы были взорваны. К счастью, все важные лица были эвакуированы, и наши силы безопасности не понесли потерь. Был захвачен только один обджект, который не хотел раскрывать никакой информации."
 YFC_BUN.20.a: "Чертовы анархисты..."
 YFC_BUN.21.t: "Пропажа Блоки"
 YFC_BUN.21.desc: "В ходе подавления анархистского восстания нео-бандитов пропал один обджект: Блоки. Он находился в Подгорныве и должен был быть эвакуирован несколько дней назад. Однако его предполагаемый транспорт уехал без него, заявив, что, по их мнению, его должна была эвакуировать другая транспортная группа. Таким образом, из-за этой бюрократической ошибки мы потеряли ценного союзника, и не волнуйтесь, сотрудники понесли убытки в виде снижения заработной платы."
 YFC_BUN.21.a: "Трагично."
 YFC_BUN.22.t: "Искры разгораются!" #CRN sees this
 YFC_BUN.22.desc: "Наши усилия принесли плоды: повстанцы из Банды (теперь называемые Новой Бандой) восстали против Корпорации! Это отличный результат для нас. Мы подорвали их алчный план захвата и, возможно, получили инструменты, чтобы стать сильнее их. А пока нам нужно действовать осторожно, но решительно."
 YFC_BUN.22.a: "Уничтожить Компанию!"
 YFC_BUN.23.t: "Лагеря Перевоспитания"
 YFC_BUN.23.desc: "Некоторые обитатели нашей оккупационной зоны просто не готовы смириться с тем, что их идеология - глупость. Недавно Топхэт обратился к нам с предложением. Он сказал, что нам следует построить... образовательные учреждения... в разных городах, чтобы очистить умы бандитов. Это отличная идея, и она наверняка предотвратит распространение этой идеологии! Если мы проигнорируем все строительные нормы - те, которые мы используем для зданий, где живут богатые обджекты, - то сможем построить эти учреждения практически за ноль. Давайте воспользуемся этим шансом!" #move to desc when you do loc please boy/enby i might transition soon 👀
 YFC_BUN.23.a: "Они даже не вспомнят о Банде..."
 YFC_BUN.24.t: "\"Сердце\" Банды"
 YFC_BUN.24.desc: "Олигархия, правившая Подгорнывом. Несмотря на то, что более года назад она потеряла власть над нами, многие обджекты по-прежнему утверждают, что были бы \"лояльны\" \"законным владельцам Подгорныва\", если бы им предоставили такую ​​возможность. Очевидно, что сохранение подобных идей может нанести вред развитию нашего государства. К счастью, есть несколько довольно простых способов решить эту потенциальную проблему. Многие активисты Банды создали фрески в честь покойного Пена. Мы можем легко обосновать рассмотрение этих фресок как граффити и добиться их удаления без особых проблем. Если обджекты не могут публично демонстрировать поддержку активистов Банды, они будут считать, что поддержка им - это угасающее, умирающее движение."
 YFC_BUN.24.a: "Да это даже \"искусством\" называть нельзя."
 YFC_BUN.25.t: "Эрейзер Победил!" #YFC sees this
 YFC_BUN.25.desc: "Несмотря на наши усилия в ходе предвыборной кампании, похоже, что кандидатом, которого больше всего предпочитало население Банды, был Эрейзер. Чтобы завоевать расположение реформированных бандитов, и потому что нумизматическим чиновникам не понравится, если мы подтасоваем голоса, мы должны признать его победу. В своей речи, произнесенной сегодня, Эрейзер пообещал быть беспристрастным к своим гражданам, позволить им продолжать жить так, как они жили раньше, и сотрудничать как с нами, так и с Нумизматией, чтобы еще больше укрепить идеалы капитализма в обществе Гойки."
 YFC_BUN.25.a: "Ну, не очень уж и плохо."
 YFC_BUN.26.t: "Блоки Выиграл!" #YFC sees this
 YFC_BUN.26.desc: "Наши кампании принесли свои плоды! Результаты голосования, за которыми наблюдали представители Нумизматического общества, недавно дошли до Футпатхбурга, и, как сообщается, Блоки завоевал расположение большинства участников собрания. Блоки, как утверждается, пообещал представлять идеалы капитализма в рядах новообразованного государства и сотрудничать с нашими армиями. Несмотря на то, что эти слова звучат слишком... по-профессиональному для него, мы воспримем его предполагаемую речь как открытое приглашение к будущему сотрудничеству!"
 YFC_BUN.26.a: "Без сомнения он нам пригодится..."
 YFC_BUN.27.t: "Пен Выиграл!" #YFC sees this
 YFC_BUN.27.desc: "Несмотря на наши усилия в проведении кампании, похоже, что кандидатом, которого больше всего предпочитало население Банды, был Пен. По какой-то причине именно Пена финансировала Нумизматия. Почему кто-то добровольно попросил бы Пена что-либо сделать - это загадка почти каждого руководителя корпорации, однако мы все же должны принять его победу. У Пена все еще довольно большой долг перед нами, однако Нумизматия настаивает на том, чтобы мы его погасили или хотя бы уменьшили. Надеюсь, слухи об этой кампании не дойдут до обджектов Банды, доллар знает, что мы не можем позволить себе еще одну войну."
 YFC_BUN.27.a: "Вот дерьмо."
 YFC_BUN.28.t: "\"Каковы ваши мысли об экономике?\""
 YFC_BUN.28.desc: "Из толпы поднял руку молодой обджект, задав вышеупомянутый вопрос. На вид он был примерно студенческого возраста, может быть, даже старше. Определенно, ярый сторонник \"Новой Банды\", поскольку принес с собой её флаг. В любом случае, Эрейзер решил ответить на вопрос первым. Вероятно, у него не было проблем с повстанцами, этот идиот.\n\"Я думаю, что в новой Республике вообще не должно быть экономики. У нас уже есть готовая система: ты что-то делаешь, кто-то это крадет, или ты защищаешься... Наверное, если бы мне пришлось как-то это назвать, это была бы экономика силы.\" Этот ответ вызвал одобрительные возгласы толпы, но их быстро заглушили непрестанные призывы Пена к тишине.\nОн быстро сформировал ответ: \"Э-э, я думаю, у Эрейзера была отличная мысль, но мне... нравится капитализм! Но как бы, с демократией! Мы могли бы... Эм, э-э...\" Попытка Пена доказать свою состоятельность быстро провалилась, когда он попытался продолжить говорить. Жалко, но не настолько, чтобы это заслуживало внимания. Толпа отреагировала лишь недоумением.\nНа ходу, не имея никаких конкретных планов, кроме реакции публики, Блоки понял, что ему нужно рассказать о чем-то, что взбудоражит толпу. Он быстро начал со своих импровизированных планов о... [YFC_Sector_Event_Text]"
 YFC_BUN.28.a: "командной экономике."
 YFC_BUN.28.b: "нумизматийском рыночке!"
 YFC_BUN.28.c: "инвестициях из Корпорации, о потенциале!"
 YFC_BUN.29.t: "\"Ну, у нас же будут внешние угрозы, как мы будет защищаться?\""
 YFC_BUN.29.desc: "Из передней части толпы раздался голос ещё одного обджекта, похожего на студента, задавшего вопрос более робким тоном. Казалось, у него не было никаких связей. Пен, к сожалению, первым открыл рот, вероятно, он считал, что у него есть хороший ответ на вопрос. Какой же он невезучий. \"У Нумизматии большая армия, они могут хорошо нас защитить!\" - после молчания толпы он быстро добавил: \"И! У нас, очевидно, будет своё оружие, чтобы защититься от захватчиков!\" Раздался... какой-то шум? Очень слабые аплодисменты, вероятно, от одного или двух обджектов. Честно говоря, эти аплодисменты можно было принять за кашель, если бы вы находились достаточно далеко. Вполне адекватный ответ, учитывая, как Пен ответил на вопрос. Затем Эрейзер - настоящий конкурент - тоже, образно говоря, бросил свою шляпу на ринг. \"Я почти уверен, что говорил об этом, когда только начиналась первая Банда, но я всегда планировал заранее заложить большое количество мин на окраинах. Разумеется, граждан Банды предупредят об их местонахождении, но в остальном они будут держаться в секрете. Конечно, все в Банде хорошо вооружены, и так будет и дальше, под моим руководством\". Эрейзер говорил с какой-то спокойной убежденностью, которая легко взбудоражила тупых сторонников Банды, или, по крайней мере, тех, кто сегодня присутствовал в толпе. Взрыв эмоций в толпе заставил Блоки немного поволноваться по поводу того, как может быть воспринят его ответ, ведь если этого будет недостаточно, эта \"дискуссия\" может обернуться очередным поражением. К счастью, он заранее подготовил ответ на вопрос по этой теме и твердо заявил, что... [YFC_Sector_Event_Text]"
 YFC_BUN.29.a: "Банда будет импортировать оружие из Корпорации." #This stays as I like :)
 YFC_BUN.29.b: "Бравые войска Банды сравнятся с нумизматийцами!" #Changing this as I made the idea already, sorry not sorry xp
 YFC_BUN.29.c: "Перевооружение обойдется слишком дорого." #Changing this as I made the idea already, sorry not sorry xp
 YFC_BUN.30.t: "\"Мы будем работать с Нумизматией или Йеллоу Фейсом?\""
 YFC_BUN.30.desc: "Наконец, из толпы заговорил обджект, который, судя по всему, был взрослым. Судя по его поведению и предыдущим реакциям толпы, у него были склонности к идеям Банды, но он также, похоже, был весьма неравнодушен к другим мнениям. На это мнение можно было повлиять, и Блоки наверняка воспользуется этой возможностью. На этот раз первым ответил Эрейзер, и довольно быстро: \"Нет, я не ожидаю, что кто-то захочет работать с кем-либо из них. Я уверен, что правительство будет с ними сотрудничать, но с отдельными гражданами? Я бы не ожидал этого\". Его заявление было довольно лаконичным и не вызвало той реакции толпы, которую вызвали его предыдущие ответы. Возможно, Банда была более беспристрастна к сотрудничеству с нами, чем мы думали раньше? К сожалению, чернильный идиот открыл рот, и из него вырвался звук, похожий на слова: \"Я имею в виду, я полагаю, что почти все здесь работают с Нумизматией. Они так много вложили в нас, почему бы нам не отплатить им тем же? Ну, может быть, не *отдавать*, но помощь им действительно не должна быть исключена. Если, конечно, вы этого хотите\". Эти слова едва ли звучали как политическая позиция, не говоря уже о позиции, сказанной после поражения противника. Зачем вообще Пен пришел на это мероприятие? Кто-нибудь должен был бросить в него гнилые фрукты, это был бы отличный урок для этого болвана. В любом случае, два поражения дали идеальный \"проход\". В своем положении Блоки мог легко влиять на умы многих бандитов. Решительно он сказал: [YFC_Sector_Event_Text]"
 YFC_BUN.30.a: "\"Банда будет работать с кем угодно для достижения целей.\""
 YFC_BUN.30.b: "\"В интересах каждого работать с Йелоу Фейсом!\""
 YFC_BUN.30.c: "\"Одно полушарие лучше, чем ноль...\""
 YFC_BUN.31.t: "\"Возможно это \"тупой вопрос\", но, чего вы хотите достичь?\""
 YFC_BUN.31.desc: "Вопрос задал пожилой обджект. Мы говорим \"пожилой\", хотя кажется, что он увядает от одной мысли о том, что пройдет еще один год. Тем не менее, открытый и, честно говоря, ненужный вопрос оставлял много места для интерпретаций. Пен допустил оплошность, не высказав никаких мыслей, которые могли у него возникать в тот момент (мыслей у этого обджекта было довольно мало), и быстро ответил: \"Я хочу, чтобы Банда расцвела!\" Этот ответ вызвал самые громкие аплодисменты, которые он видел от публики в тот день. То есть, не очень много, но достаточно.\nВероятно, удивленный неудовлетворительным выступлением Пена, Эрейзер выдержал секунду молчания, прежде чем заявить: \"Я полностью согласен с Пеном. Банда - мой главный приоритет\". Зрители дебатов, похоже, тоже остались довольны его ответом, хотя и зааплодировали громче, когда Эрейзер повторил ту же мысль, что и Пен. Толпа, вероятно, знала о некомпетентности последнего.\nЧтобы завершить дискуссию, Блоки должен был изложить свою окончательную позицию. С таким открытым вопросом Блоки было бы довольно сложно ошибиться в ответе. Блоки изложил свою позицию, сказав:"
 YFC_BUN.31.a: "\"Я согласен с Пеном и Эрейзером. Банда для меня - приоритет.\""
 YFC_BUN.31.b: "\"Я думаю, что наша безопасность и самостоятельность важнее Банды.\""
 YFC_BUN.31.c: "\"Сначала нам нужно довести до ума экономику.\""
 YFC_BUN.31.d: "\"Не существует \"тупых вопросов\", поэтому я попрошу вас просто уйти.\"" #i dont care
 YFC_sector.1.t: "Обновление Секторов: спор о работе полиции" #every ancap ever lmao
 YFC_sector.1.desc: "Вчера во время обсуждений небольшой спор между двумя представителями Секторов, а именно Топхэтом и Тейзером, стал центральной темой вечера. Топхэт утверждал, что преступность процветает на наших менее централизованных восточных территориях, и что нам следует увеличить присутствие наемных служб наблюдения в этих районах. Тейзер уклонился от ответа, заявив, что у Топхэта нет никаких доказательств, и что он лишь пытается расширить свое влияние в этих районах. Вместо этого Тейзер предложил просто сохранить статус-кво, аргументируя это тем, что это порадует жителей востока и облегчит нам работу. [YFC_Sector_Event_Text]"
 YFC_sector.1.a: "У Топхэта убедительные поводы."
 YFC_sector.1.b: "Тейзер прав."
 YFC_sector.2.t: "Обновление Секторов: спор о закупках"
 YFC_sector.2.desc: "Вчера во время обсуждений центральным вопросом вечера стал небольшой спор между двумя представителями секторов, а именно Хаммером и Пайпом. Некоторые железнодорожные линии в последнее время работали неэффективно, поэтому Пайп, представитель железнодорожного сектора, решил, что для их сектора будет лучше построить новые. Недооценив необходимое количество рабочей силы для реализации своих планов, они решили нанять несколько обджектов. К несчастью для Хаммера, новые подрядчики, нанятые Пайпом, как раз работали над проектом для строительного сектора. Хаммер утверждал, что эта покупка была \"несправедливой\" и что, как руководитель строительного сектора, он должен был иметь право голоса в этой сделке до ее совершения. \"Обсуждение\" (хотя на самом деле это был всего лишь мелкий спор) продолжалось большую часть ночи, и другие сектора редко вмешивались. Чью сторону следует занять в этом конфликте? [YFC_Sector_Event_Text]"
 YFC_sector.2.a: "У нас свободный рынок, не будем вмешиваться."
 YFC_sector.2.b: "Поддержим Хаммера..."
 YFC_sector.3.t: "Обновление Секторов: спор о финансовой поддержке" #these r like the new city dev events
 YFC_sector.3.desc: "Вчера во время дискуссий небольшой спор между двумя представителями секторов, а именно Бикер и Хаммером, стал центральной темой вечера. Они спорили о том, куда именно следует направлять финансирование. Бикер утверждала, что исследовательский сектор долгое время недофинансировался, и что в следующем квартале любые излишки финансирования должны достаться ей. Хаммер же утверждал, что Бикер просто действовала из жадности. Он заявил, что его сектор получает гораздо меньше финансирования, но при этом не жаловался. Чью сторону мы займем? [YFC_Sector_Event_Text]"
 YFC_sector.3.a: "Исследования важнее: поддержать Бикер."
 YFC_sector.3.b: "Бикер просто жадная, поддержите Хаммера."
 YFC_sector.4.t: "Обновление Секторов: спор о размещениях"
 YFC_sector.4.desc: "Вчерашние дискуссии переросли в небольшой спор между двумя руководителями сектора, Тейзером и Бикер, который стал центральной темой вечера. Тейзер, возглавляющий сектор электроники, похоже, чрезмерно контролировал производство в этом секторе. Бикер в последние несколько недель довольно резко выступала против этого контроля, и её мнение об управлении сектором достигло кульминации на упомянутой встрече. Она утверждала, что Тейзер \"душит капитал\" и \"предает принципы свободной торговли\", накапливая товары. Кроме того, не секрет, что исследовательский сектор, возглавляемый Бикер, нуждается в значительном количестве сложных технологий. Однако, напротив, Тейзер не сдавался, утверждая, что это \"их сфера деятельности\" и что они могут \"распоряжаться ею по своему усмотрению\". Честно говоря, я не думаю, что кого-то еще волнует этот вопрос, хотя, каким бы безобидным ни был этот аргумент, мы все равно должны как-то отреагировать. [YFC_Sector_Event_Text]"
 YFC_sector.4.a: "Сектор Тейзера это сектор Тейзера."
 YFC_sector.4.b: "Бикер принесёт больше денег."
 YFC_sector.5.t: "Обновление Секторов: вопрос СМИ"
 YFC_sector.5.desc: "Вчерашние дискуссии переросли в небольшой спор между двумя представителями секторов, а именно, Топхэтом и Бикер, который стал центральной темой вечера. Бикер, будучи образованным обджектом, была весьма обеспокоена контролем, который, по-видимому, устанавливает Военный Сектор над нашими СМИ. Как известно, все телевизионные программы в землях Копрорации создаются государством. У нас нет \"Развлекательного Сектора\", кому это вообще нужно? Поэтому любой сектор, который считает нужным создавать телевизионные программы, запускает их в эфир. Неудивительно, что единственным сектором, у которого достаточно свободного времени для этого, является военный сектор Топхэта, который, по словам Бикер, \"по сути, занимается государственной пропагандой\" и \"не заслуживает доверия\". Топхэт, конечно же, отрицает эти утверждения, однако он также отказывается считать государственную пропаганду чем-то плохим. На протяжении всей дискуссии он неоднократно делал заявления вроде: \"Это обвинение ложно, но что может быть плохого в государственной пропаганде?\"... Почему наши сектора такие странные? В любом случае, Бикер просит нас запретить военному сектору создавать телевизионные программы, утверждая, что пропаганда подрывает интеллект среднего обджекта (обладает ли средний обджект интеллектом?). Топхэт же просто неоднократно отвечал \"Нет\". [YFC_Sector_Event_Text]"
 YFC_sector.5.a: "Пусть Топхэт крутит свою пропаганду."
 YFC_sector.5.b: "Бикер права!"
 YFC_sector.6.t: "Обновление Секторов: скупка правительства?"
 YFC_sector.6.desc: "Поздно вечером Топхэт пришел в офис Йелоу Фейса с большим портфелем. Он сказал, что хочет, чтобы пару законов приняли в мгновение ока, и открыл портфель, обнаружив там невероятные суммы денег. Откуда именно он раздобыл эти деньги, мы не знаем, однако мы знаем, что эти суммы могут принести нам огромную пользу. Получение этих денег, безусловно, сделает правительство, по крайней мере немного, более зависимым от Топхэта, однако это также может быть выгодно для нас в краткосрочной перспективе. [YFC_Sector_Event_Text]"
 YFC_sector.6.a: "Давайте немного заработаем."
 YFC_sector.6.b: "Это создаст ужасный прецедент!"
 YFC_sector.7.t: "Обновление Секторов: скупка правительства?"
 YFC_sector.7.desc: "Поздно вечером вчера Пайп пришел в офис Йелоу Фейса с большим одеялом. Он сказал, что ему срочно нужны реформы в сфере легкой промышленности, и, развязав одеяло, обнаружил невероятные суммы денег. Откуда именно они взяли эти деньги, мы не знаем, однако нам известно, что эти суммы могут принести нам огромную пользу. Получение этих денег, безусловно, сделает правительство, по крайней мере немного, более зависимым от Пайпа, однако в краткосрочной перспективе это может быть выгодно и нам. [YFC_Sector_Event_Text]"
 YFC_sector.7.a: "Давайте немного заработаем."
 YFC_sector.7.b: "Это создаст ужасный прецедент!"
 YFC_sector.8.t: "Обновление Секторов: скупка правительства?"
 YFC_sector.8.desc: "Вчера поздно вечером Бикер пришла в офис Йелоу Фейса с большой дорожной сумкой. Она сказала, что он хочет нанять больше сотрудников в ее сектор, и открыла сумку, обнаружив там невероятные суммы денег. Откуда именно она раздобыла эти деньги, мы не знаем, однако мы знаем, что эти суммы могут принести нам огромную пользу. Получение этих денег, безусловно, сделает правительство, по крайней мере немного, более зависимым от Бикер, однако в краткосрочной перспективе это может быть выгодно и для нас. [YFC_Sector_Event_Text]"
 YFC_sector.8.a: "Давайте немного подзаработаем."
 YFC_sector.8.b: "Это создаст ужасный прецедент!"
 YFC_sector.10.t: "Обновление Секторов: скупка правительства?"
 YFC_sector.10.desc: "Вчера поздно вечером в офис компании Йелоу Фейс приехали сотрудники Тейзера с большой дорожной сумкой. Они заявили, что им необходимо усилить корпоративное внимание к их сектору, и, открыв сумку, обнаружили невероятные суммы денег. Откуда именно они взяли эти деньги, мы не знаем, однако известно, что эти суммы могут принести нам огромную пользу. Получение этих денег, безусловно, сделает правительство, по крайней мере немного, более зависимым от Тейзера, однако в краткосрочной перспективе это может быть выгодно и для нас. [YFC_Sector_Event_Text]"
 YFC_sector.10.a: "Давайте немного подзаработаем."
 YFC_sector.10.b: "Это создаст ужасный прецедент!"
 YFC_sector.16.t: "...Топхэт берёт ситуацию в свои руки!"
 YFC_sector.16.desc: "Благодаря огромному влиянию, которое Топхэт сумел завоевать в компании, он захватил значительную власть в корпорации. К сожалению, это означает, что он больше не будет подчиняться нашим желаниям, и мы не сможем держать его в узде довольно долго, поскольку, обладая такой властью, он сможет просто заставить сотрудников уволить любого, кого пожелает. Мы больше §Rне будем получать выгоду от его взяток§!, хотя, к счастью, он не сможет вечно удерживать такую ​​власть. Мы активно работаем над тем, чтобы ослабить его влияние, и ожидаем, что он скоро вернется к прежней форме."
 YFC_sector.16.a: "Проклятье!"
 YFC_sector.17.t: "...Пайп берёт ситуацию в свои руки!"
 YFC_sector.17.desc: "Благодаря огромному влиянию, которое Пайп сумел завоевать в компании, он захватил значительную власть в корпорации. К сожалению, это означает, что он больше не будет подчиняться нашим желаниям, и мы не сможем держать его в узде довольно долго, поскольку, обладая такой властью, он сможет просто заставить сотрудников уволить любого, кого пожелает. Мы больше §Rне будем получать выгоду от его взяток§!, хотя, к счастью, он не сможет вечно удерживать такую ​​власть. Мы активно работаем над тем, чтобы ослабить его влияние, и ожидаем, что он скоро вернется к прежней форме."
 YFC_sector.17.a: "Проклятье!"
 YFC_sector.18.t: "...Бикер берёт ситуацию в свои руки!"
 YFC_sector.18.desc: "Благодаря огромному влиянию, которое Бикер сумела завоевать в компании, она захватила значительную власть в корпорации. К сожалению, это означает, что она больше не будет подчиняться нашим желаниям, и мы не сможем держать её в узде довольно долго, поскольку, обладая такой властью, она сможет просто заставить сотрудников уволить любого, кого пожелает. Мы больше §Rне будем получать выгоду от её взяток§!, хотя, к счастью, она не сможет вечно удерживать такую ​​власть. Мы активно работаем над тем, чтобы ослабить её влияние, и ожидаем, что она скоро вернется к прежней форме."
 YFC_sector.18.a: "Проклятье!"
 YFC_sector.19.t: "...Хаммер берёт ситуацию в свои руки!"
 YFC_sector.19.desc: "Благодаря огромному влиянию, которое Хаммер сумел завоевать в компании, он захватил значительную власть в корпорации. К сожалению, это означает, что он больше не будет подчиняться нашим желаниям, и мы не сможем держать его в узде довольно долго, поскольку, обладая такой властью, он сможет просто заставить сотрудников уволить любого, кого пожелает. Мы больше §Rне будем получать выгоду от его взяток§!, хотя, к счастью, он не сможет вечно удерживать такую ​​власть. Мы активно работаем над тем, чтобы ослабить его влияние, и ожидаем, что он скоро вернется к прежней форме."
 YFC_sector.19.a: "Проклятье!"
 YFC_sector.20.t: "...Тейзер берёт ситуацию в свои руки!"
 YFC_sector.20.desc: "Благодаря огромному влиянию, которое Тейзер сумел завоевать в компании, он захватил значительную власть в корпорации. К сожалению, это означает, что он больше не будет подчиняться нашим желаниям, и мы не сможем держать его в узде довольно долго, поскольку, обладая такой властью, он сможет просто заставить сотрудников уволить любого, кого пожелает. Мы больше §Rне будем получать выгоду от его взяток§!, хотя, к счастью, он не сможет вечно удерживать такую ​​власть. Мы активно работаем над тем, чтобы ослабить его влияние, и ожидаем, что он скоро вернется к прежней форме."
 YFC_sector.20.a: "Проклятье!"
 YFC_sector.21.t: "Экономический Отчёт: ЧРЕЗВЫЧАЙНОЕ ПОЛОЖЕНИЕ!"
 YFC_sector.21.desc: "Хаос.\nСегодня в штаб-квартире царил полный хаос. Наши экономические аналитики не хотели в это верить. Наши финансовые консультанты тоже не хотели в это верить. [YFC_debt_event_text] Но, к сожалению, это правда. Корпорация не просто теряет деньги, она в долгах. Не удается выплачивать зарплаты, финансировать проекты, свободный рынок может даже рухнуть под тяжестью компании. Мы уже начали подавать заявления о банкротстве, но сами заявители боятся это делать; они знают, что многих из них уволят. Либо компании нужно сократить штат, либо нам нужно быстро выйти на прибыль." #YFC_debt_event_text is used if Sectors are still around or not
 YFC_sector.21.a: "Неслыханная катастрофа!"
 BUN_YFC.1.t: "Идеология Йелоу Фейса разваливается!" #if eraser is killed or working in the YFC's govt
 BUN_YFC.1.desc: "Мы наконец-то свободны! После поражения Старой Банды против Йелоу Фейса, они разделили нас и попытались избавиться от нашего духа, но мы выжили. Даже преуспели! И теперь мы вернулись, лучше, чем когда-либо! К сожалению, Эрейзера нигде нет, а Пен убит. Блоки, этот предатель, решил встать на сторону Корпорации, так что нет никого, кто мог бы возглавить что-либо. Мы разберемся с этим позже, а пока нам нужно убедиться, что эта революция не умрет!"
 BUN_YFC.1.a: "Банда навсегда!"
 BUN_YFC.1.t.z: "Идеология Йелоу Фейса разваливается!" #if eraser is jailed
 BUN_YFC.1.desc.z: "Мы наконец-то свободны! После поражения в войне, когда Старая Банда сражалась с Йелоу Фейсом, они разделили нас и пытались уничтожить наш дух, но мы выжили. Даже преуспели! И теперь мы вернулись, лучше, чем когда-либо! Эрейзер тоже сбежал из тюрьмы пару часов назад, и, кажется, он почти готов снова возглавить нас! Мы говорим \"почти\", потому что он все еще переживает горе от трагической смерти Пена. Блоки, этот предатель, решил встать на сторону Корпорации, так что скоро Эрейзер останется единственным, кто будет нами руководить. С правительственными делами мы разберемся позже, а пока мы должны убедиться, что эта революция не умрет!"
 BUN_YFC.1.b: "Банда навсегда!"
 BUN_YFC.2.t: "Наш самый чёрный день." #YFC sees this
 BUN_YFC.2.desc.a: "Это, пожалуй, была самая лёгкая задача, которую нам приходилось выполнять за всё время существования этой корпорации. Чистки среди сотрудников, безусловно, необходимы, нет причин, по которым ситуация должна была выйти из-под контроля. Немедленные увольнения во всех секторах! Мы не можем в это поверить, но каким-то образом сторонники Банды, или \"Новой Банды\", как они себя называют, вернули себе контроль над всеми утраченными землями. Де-факто они принадлежат им, но де-юре - всё ещё нам. Давайте вернём контроль и уничтожим эту коммунистическую мразь!"
 BUN_YFC.2.desc.b: "Это, пожалуй, была самая лёгкая задача, которую нам приходилось выполнять за всё время существования этой корпорации. Чистки среди сотрудников, безусловно, необходимы, нет причин, по которым мы проиграли в этой ситуации. Немедленные увольнения во всех секторах! Мы не можем в это поверить, но каким-то образом сторонники Банды, или \"Новой Банды\", как они себя называют, всё ещё удерживают часть своих утраченных земель. Де-факто они принадлежат им, но де-юре - нам. Давайте вернём контроль и уничтожим эту коммунистическую мразь!"
 BUN_YFC.2.a: "Кого винить...?"
 BUN_YFC.3.t: "Интересное открытие."
 BUN_YFC.3.desc: "Мы наконец-то отвоевали нашу столицу, Подгорныв! Родину Эрейзера, теперь в руинах из-за корпоративной мрази с севера. Однако сегодня мы обнаружили нечто забавное. Блоки, бывший член старой олигархии Банды, был найден на одном из последних аванпостов после того, как все силы безопасности корпорации либо погибли, либо сдались. Он практически стоял на коленях, умоляя нас пощадить его! Он пытался лгать нам, говоря, что его \"заставили пойти на сторону Йелоу Фейса\" или что-то в этом роде, но он не сможет нас обмануть!"
 BUN_YFC.3.a: "Жри свинец, предатель!"
 BUN_YFC.4.t: "Реальность."
 BUN_YFC.4.desc: "Итак, мы полностью вернули себе независимость, но что же нам теперь делать? Старой банды больше нет, даже в духовном плане. Борцы за свободу возвращаются домой, и куда бы они ни отправились - в Подгорныв, Гринвилл, Таптоп или куда-либо ещё - это место уже не то, что было несколько лет назад. Наше руководство практически отсутствует, и многие его даже не слушают. Некоторые даже утверждают, что Йелоу Фейсеры были лучше!"
 BUN_YFC.4.a: "Разбиты, но не сдавшиеся."
 BUN_YFC.5.t: "Объединение?"
 BUN_YFC.5.desc: "Прошло несколько недель с момента нашей победы над оккупантами. Всё ещё довольно стабильно. Однако недавно от наших друзей с юга поступило интересное предложение. Это соглашение о создании альянса между нашими странами, который они называют \"Южной торговой лигой\", и это позволит заключать выгодные торговые сделки и улучшать наши вооруженные силы. Это, безусловно, хорошая сделка, однако мы точно не знаем, каковы мотивы Нумизматии. Мы могли бы попробовать отправиться в путь в одиночку, но государственное строительство - несильная сторона лидеров Банды. После некоторых раздумий мы решили, что..."
 BUN_YFC.5.a: "мы едины до конца!"
 BUN_YFC.5.b: "мы сами решим свою судьбу."
 BUN_YFC.6.t: "Прекращение огня?" #YFC sees this
 BUN_YFC.6.desc: "Наша продолжающаяся война с анархистами из Новой Банды зашла в тупик. Секторалиалы разбушевались, ругая нас за ужасное ведение войны. Поэтому, когда мы получили предложение от Новой Банды о возможном прекращении огня, это показалось хорошим вариантом, чтобы попытаться \"сохранить лицо\", как говорят дети. Само предложение простое: мы теряем всю захваченную территорию в обмен на предоставление нам прав на некоторые ресурсы; крупную сумму денег и подписание обеими сторонами пакта о ненападении. Хотя это кажется довольно выгодным компромиссом, секторалиалы считают наоборот. Топхэт говорит, что \"перенаправление избыточных ресурсов на войну могло бы привести нас к более быстрой победе\", и что в этом виновата \"некомпетентность управления\". Остальные, к сожалению, с ним согласны. Честно говоря, мы не уделяли этому достаточно внимания, и Топхэт действительно сказал, что у него есть лучший план этой войны, но он потребует значительных ресурсов и планирования. Следует ли нам соблюдать перемирие или подождать, пока Топхэт сможет осуществить свой план? [YFC_Sector_Event_Text]"
 BUN_YFC.6.a: "Согласиться на прекращение огня." #Still the same
 BUN_YFC.6.b: "Дать Топхэту время." #YFC ingores the idea of a Ceasefire
 BUN_YFC.7.t: "RE: По вопросу контратаки, Топхэт." #YFC sees this
 BUN_YFC.7.desc: "Йелоу Фейс,\n\nСегодня я пишу вам, чтобы сообщить, что я выполнил все требования для контрнаступления. У меня достаточно обджектов, оружия, воли, мотивации, мужества и, конечно же, капитала. Этот план будет включать в себя смелую и новую стратегию, подобной которой не видели ни Южный, ни Восточный Гойки. Однако я могу заверить вас в глупости игнорирования такой возможности. Просто наблюдая за линией фронта и слушая разговоры между бандитами, мои обджекты и я убедились, что повстанцы Банды совершенно не осведомлены о моих планах и не имеют возможности узнать о них. Мы также смогли сделать вывод, что они чрезвычайно слабы и, вероятно, рухнут в наступлении. Учитывая ваш статус генерального директора, мне, конечно же, требуется ваше разрешение, прежде чем отправлять эту силу вперед. Если вы сможете ответить в надлежащее время, это будет замечательно.\n\nТопхэт, Корпорация Йелоу Фейс, Военный сектор"
 BUN_YFC.7.a: "Тяжелая артиллерия!"
 BUN_YFC.8.t: "Последний бой!" #BUN sees this
 BUN_YFC.8.desc: "Благодаря прослушиванию нам удалось выяснить, что Йелоу Фейсеры планируют какое-то крупное наступление. Мы бы рассказали больше, но вскоре после этого у того, кто *подслушивал*, взорвалась рука от гранаты, и, мягко говоря, дела у него идут не очень хорошо. На самом деле, если говорить прямо, он, вероятно, умрёт. В любом случае, нам, наверное, следует быть начеку и, скажем так, хорошо сражаться."
 BUN_YFC.8.a: "Ни шагу назад!"
 BUN_borderwars.3.t: "Рейд отбит!"
 BUN_borderwars.3.desc: "Несмотря на внезапное нападение бандитов, нам удалось отразить их жестокие атаки. После нескольких часов боя нам удалось взять над ними верх. Теперь они разворачиваются и бегут обратно в свои бандитские владения. На данный момент мы победили, но они вернутся."
 BUN_borderwars.3.a: "Отличная работа."
 BUN_borderwars.4.t: "Атака рейдеров!"
 BUN_borderwars.4.desc: "Когда наши войска прибыли, они быстро попали под обстрел бандитов. Несмотря на все наши усилия, наши силы были разгромлены, и бандиты прорвались. В результате близлежащие города и деревни были подожжены, а большая часть оборудования разграблена. Бандиты ушли, но в воздухе до сих пор витает пепел."
 BUN_borderwars.4.a: "Мы не можем позволить этому повториться!"
 GTR_event.43.b: "У нас есть дела поважнее." #added because i think player should be able to say no
 bfdinews.10.e: "Сердце Гойки в огне."
 bfdinews.12.b: "Тёмные времена."
 bfdinews.15.b: "Кэсленд будет наш!"
 bfdinews.16.b: "Кэсленд наш."
 bfdinews.17.b: "Кэсленд наш."
 bfdinews.17.c: "Отличные новости!"
 bfdinews.18.b: "Кэсленд наш."
 bfdinews.18.c: "Отличные новости!"
 bfdinews.19.b: "Кэсленд наш."
 bfdinews.19.c: "Отличные новости!"
 bfdinews.20.b: "Это решит будущее Гойки."
 bfdinews.21.b: "К процветацию!"
 bfdinews.22.b: "Свобода или Смерть!"
 bfdinews.22.c: "И вновь обджекты умирают."
 bfdinews.23.b: "Йойлоленд!"
 bfdinews.26.t: "Конфликт на Юге!"
 bfdinews.26.desc: "Поступило множество сообщений о том, что силы Корпорации Йелоу Фейс пересекли фактическую границу между собой и Бандой Эрейзера и проникли на земли, контролируемые бандитами! Корреспондент корпорации сообщил, что \"социалистические бандиты\" будут вытеснены с этих земель в ходе \"идеологических чисток\" в интересах \"международного капитала\". Также поступают сообщения о том, что Сенат Нумизматии начал обсуждение вопроса о том, следует ли ему вмешиваться. Пока неясно, кто победит, но считается, что неорганизованные бандиты проиграют в затяжной войне; однако, если они будут действовать быстро, у бандитов появится шанс одержать верх."
 bfdinews.26.a: "Все глаза на приз."
 bfdinews.26.b: "Как они смеют!"
 bfdinews.26.c: "Интересные времена..."
 bfdinews.27.b: "Трагедия."
 bfdinews.28.b: "Похоже, много мёртвых."
 bfdinews.29.b: "Гольфболл сделала это?"
 bfdinews.32.b: "Ставки растут."
 bfdinews.34.b: "Похоже, слишком быстро."
 bfdinews.36.b: "Вперёд!"
 bfdinews.36.c: "Ой-ой."
 bfdinews.38.b: "Их падение неизбежно!"
 bfdinews.38.c: "Интересное развитие событий."
 bfdinews.39.t: "Создание Трёх Мушкетёров!"
 bfdinews.39.desc: "Из Южного Гойки поступили интересные новости. Йелоу Фейс, Нумизматия и недавно образованная Республика Бандитов создали экономический и оборонный альянс! Йелоу Фейс заявил, что цель - обеспечить экономический рост во всем Гойки. Только время покажет, останутся ли эти три страны едиными, но баланс сил в Южном Гойки изменился."
 bfdinews.39.a: "В будущее!"
 bfdinews.39.b: "Они думают, что остановят нас?"
 bfdinews.39.c: "Интересно..."
 bfdinews.40.t: "Создание Торговой Лиги Гойки!"
 bfdinews.40.desc: "Из Южного Гойки пришли интересные новости. Спустя несколько месяцев после поражения бандитов во главе с Эрейзером, правительства Корпорации Йелоу Фейс и Нумизматии заключили экономический и оборонный союз! Йелоу Фейс заявил, что цель - обеспечить экономический рост во всем Гойки. Только время покажет, насколько прочным окажется этот союз, но на юге сформировалось новое сильное влияние!"
 bfdinews.40.a: "В будущее!"
 bfdinews.40.b: "Они думают, что остановят нас?"
 bfdinews.40.c: "Интересно..."
 bfdinews.41.t: "Разрыв Йелоу Фейса с Нумизматией!"
 bfdinews.41.desc: "Представители Нумизматии осудили Корпорацию Йелоу Фейс за предполагаемое сотрудничество с южными бандитами. В отчете приводятся доказательства, включая торговые соглашения и новые маршруты между компанией и бандой. Следует отметить, что столкновения между ними также утихли, и некогда де-факто граница стала выглядеть более официальной. Мы пока не получили никаких комментариев от Йелоу Фейса по этому поводу, однако Нумизматия призвала другие страны прекратить сотрудничество с Йелоу Фейсом из-за их нынешних действий. Может ли это означать конец гегемонии корпорации над Гойки?"
 bfdinews.41.a: "Серьёзно!?"
 bfdinews.41.b: "Даже мысль о том, что мы могли работать с ними..."
 bfdinews.41.c: "Стоит прекратить с ними торговлю..."
 bfdinews.41.d: "Может сработать..."
 bfdinews.42.t: "Бандиты объединяются!"
 bfdinews.42.desc: "Один из наших оставшихся корреспондентов сообщил о создании военно-экономического альянса на юге континента. Альянс, ранее известный как Корпорация Йелоу Фейс, теперь называет себя \"Рейдеры Йелоу Фейса\" и \"Банда Эрейзера\". Хотя его цели неясны, похоже, он стремится обогатиться за счет уничтожения поселений своих соседей. На вопрос о причинах таких радикальных шагов Йелоу Фейс сослался на соседние страны и своих \"идиотских бывших сотрудников\". Мы продолжим освещать геополитику этого особенно нестабильного региона, поскольку обе стороны начинают предпринимать более серьезные шаги..."
 bfdinews.42.a: "Ограбим предателей!" #YFC/BUN
 bfdinews.42.b: "Пора готовить нашу оборону." #Neighbors
 bfdinews.42.c: "На юге зреет шторм." #Anyone else
 bfdinews.43.t: "Топхэт Берёт Власть!" #if you want to bro i already wrote this ToT
 bfdinews.43.desc: "Хотя большинство наших репортеров, работавших на месте событий, покинули Футпатхбург во время и после сообщений о беспорядках в этом районе, немногие оставшиеся обджекты сообщили, что, по всей видимости, Йелоу Фейс был полностью отстранен от власти в этом районе, и его компания пала вместе с ним. Они утверждают, что один из обджектов, Топхэт, возглавлявший операцию по свержению Йелоу Фейса, а также один из руководителей Корпорации, провозгласил новое руководство \"Кланом Топхэта\" и стремится интегрироваться в более широкую экономику Гойки, как это когда-то сделал его предшественник. Топхэт утверждает, что Клан совсем не похож на \"варварскую корпорацию прошлого\" и вместо этого сосредоточен на общем экономическом развитии Гойки. Только время покажет, что эта новая группа будет делать на континенте и вокруг него, но пока мы можем лишь предоставлять обновления о том, что происходит в Футпатхбурге, поскольку спекуляции на начальном этапе создания политической организации практически невозможны."
 bfdinews.43.a: "Наконец свобода!" #YFC
 bfdinews.43.b: "Что?! ЧТО?!" #BUN
 bfdinews.43.c: "И что они продают?" #Anyone else
 bfdinews.43.d: "Они продадут нам веревку, на которой мы их повесим." #Communism
 bfdinews.43.e: "Фиолетовый, отличный выбор!" #GFG
 bfdinews_cities.1.t: "ГРИНПОРТ ВЗЯТ!"
 bfdinews_cities.1.desc: "По данным на [?global.date.GetDateStringNoHourLong] получены новости от гражданских из Гринпорта, важного торгового центра. Город был взят [193.controller.GetName] под контроль. Вторгшиеся войска продвигались от улицы к улице, очищая город и его защитников. Последнее сопротивление защитников пришлось на район порта, где лодки эвакуировали мирных жителей, солдат и правительственных чиновников, прежде чем были захвачены. Звуки битвы в городе стихли, но поднялся новый флаг."
 bfdinews_cities.1.a: "Альянс разбит."
 bfdinews_cities.1.b: "Матчи, что ты сделала!?"
 bfdinews_cities.1.c: "Разделяй и властвуй!"
 bfdinews_cities.2.t: "ПАДЕНИЕ ПОДГОРНЫВА!"
 bfdinews_cities.2.desc: "Правительство [85.controller.GetName] сообщило, что [?global.date.GetDateStringNoHourLong] местные бандитские отряды бежали из города Подгорныва после небольшого столкновения. Бандиты сплотились, чтобы остановить захватчиков, но после нескольких стычек оказались слишком дезорганизованы, чтобы защищать Подгорныв. Нападавшие вошли в город и через несколько часов захватили его. Ключевые лидеры бандитов числятся пропавшими без вести, но заявляют, что война еще не окончена. Тем не менее, потеря крупного города оказывает существенное влияние на ход войны."
 bfdinews_cities.2.a: "Грабь награбленное..."
 bfdinews_cities.2.b: "Есть же экстренная кнопка, да?"
 bfdinews_cities.2.c: "Долой Банду!"
 bfdinews_cities.3.t: "ПАДЕНИЕ НОРТ-ГОЙКИЛЕНДА!"
 bfdinews_cities.3.desc: "В то время как в Норт-Гойкиленде всё ещё слышны выстрелы, над главным правительственным зданием поднят флаг [177.controller.GetName]. Социалистические силы под командованием Файри были отброшены в город после поражений в боях. После пробития внешней линии обороны бои перешли на улицы. Защитники сражались дом за домом, чтобы остановить продвижение нападающих. Несмотря на все усилия, [?global.date.GetDateStringNoHourLong] - это предполагаемое время, когда более 95% города находится в руках нападающих. Местонахождение Файри до сих пор неизвестно."
 bfdinews_cities.3.a: "Огонь гаснет..."
 bfdinews_cities.3.b: "*Внутренние и внешние крики*"
 bfdinews_cities.3.c: "Затушим башмаками!"
 bfdinews_cities.4.t: "КЕРИ ВЗЯТ!"
 bfdinews_cities.4.desc: "Кэри, центр диктатуры Койни, был захвачен силами [173.controller.GetName]. В преддверии предстоящей битвы после поражений у города, защитники подготовились, устанавливая баррикады, траншеи и заграждения, чтобы остановить продвижение захватчиков. Уличные бои оказались ожесточенными, большая часть города была разрушена. Защитники постепенно теряли позиции и вскоре были оттеснены на небольшие очаги сопротивления. Основной из них находился вокруг военного штаба, который, как ни странно, удерживал Койни. В [GetDateText] Койни приказал остаткам некогда великой армии сдаться. Улицы теперь довольно тихие, но в разрушенном городе ощущается новая атмосфера."
 bfdinews_cities.4.a: "Какой конец..."
 bfdinews_cities.4.b: "Конец кровопролития..."
 bfdinews_cities.4.c: "Глиняный колосс..."
 bfdinews_cities.5.t: "ГОРДЖ ТАУН УНИЧТОЖЕН!"
 bfdinews_cities.5.desc: "Поступили панические сообщения о том, что Гордж Таун был не только захвачен силами [169.controller.GetName], но и подожжен [?global.date.GetDateStringNoHourLong]. Город был центром Снежных Анархистов, и они готовились к обороне. Когда захватчики вошли в город, на них напали защитники, используя партизанскую тактику и засады. Нападавшие продвигались медленно, зачищая каждый дом и каждую комнату. Атака затянулась настолько, что нападавшие решили поджечь город, а также совершили серию убийств мирных жителей. И защитники, и мирные жители эвакуировались из горящего города. Пожары давно потушены, но ожоги все еще ощущаются."
 bfdinews_cities.5.a: "Бедные обджекты..."
 bfdinews_cities.5.b: "Мы ещё подерёмся!"
 bfdinews_cities.5.c: "Мы найдем оправдания..."
 bfdinews_cities.6.t: "ПАДЕНИЕ ФАРАВЕЯ!"
 bfdinews_cities.6.desc: "Сообщается, что бои вокруг и внутри Фаравея прекратились, поскольку защитники либо бежали, либо были разгромлены правительством [183.controller.GetName]. Айс Кьюб, возглавлявшая правительство \"мести\", сплотила защитников и мирных жителей, чтобы они сражались за каждую улицу, дом и комнату в городе. Это привело к запутанным сражениям, в которых солдаты и мирные жители боролись за разрушенные улицы. Самое ожесточенное столкновение произошло вокруг правительственного здания, которое было взорвано на куски нападавшими. Сообщается, что Айс Кьюб бежала до падения правительственного здания около [?global.date.GetDateStringNoHourLong], заявив, что \"месть неизбежна\". На данный момент пепел и обломки все еще заполняют пустые улицы."
 bfdinews_cities.6.a: "Месть мстителю..."
 bfdinews_cities.6.b: "Я хочу больше мести!"
 bfdinews_cities.6.c: "Подаётся холодным!"
 bfdinews_cities.7.t: "ТОРТ ПОДАН!"
 bfdinews_cities.7.desc: "Наш корреспондент на месте событий сообщил, что город, в котором во время работы BFDI велась \"Торт на кону\", под командованием Робот Флавер, пал под натиском солдат под командованием [175.controller.GetName]. Правительство пыталось усилить оборону, но низкий моральный дух защитников подорвал их силы. Когда на окраинах города начались сражения, Директорат под командованием Робот Флавер покинул город. После бегства правительства моральный дух защитников рухнул, и большая часть города была взята без боя. Последний бой оставшихся защитников развернулся вокруг штаба армии, где им удалось продержаться несколько дней, прежде чем сдаться [?global.date.GetDateStringNoHourLong]. Директорат ничего не заявил после падения столицы, но в городе ощущается тишина нового образа жизни."
 bfdinews_cities.7.a: "Для них торта не будет..."
 bfdinews_cities.7.b: "Сдались?! Так быстро?!"
 bfdinews_cities.7.c: "Бегут, поджав хвосты!"
 bfdinews_cities.8.t: "КОНЕЦ КЭСЛЕНДА!"
 bfdinews_cities.8.desc: "Кэсланд, самое сердце Гойки, был захвачен [206.controller.GetName] [?global.date.GetDateStringNoHourLong]. [GPG.GetLeader] перед битвой опубликовал заявления для прессы о том, что город будет \"удержан любой ценой\". Защитники подготовились к обороне своих домов, создав препятствия, укрепленные точки и ловушки внутри города. Бои были ожесточенными и смертоносными, каждый дом стоил все больше крови для захвата. Однако подготовки оказалось недостаточно, чтобы выдержать волны нападающих, и вскоре они были оттеснены лишь в несколько ключевых районов города. Одним из последних мест, павших в бою, стал Совет рекомендованных персонажей, где защитники сражались до последнего. Самого правительства нигде не видно, но считается, что оно бежало."
 bfdinews_cities.8.a: "Сердце разбито..."
 bfdinews_cities.8.b: "Быть Сердцем Гойки недостаточно..."
 bfdinews_cities.8.c: "Сердце теперь наше!"
 bfdinews_cities.9.t: "КОНЕЦ КЭСЛЕНДА!"
 bfdinews_cities.9.desc: "В Кэсланде, сердце Гойки, всё ещё бушуют пожары, поскольку город захвачен вторгшимися силами под флагом [206.controller.GetName]. Предыдущие сражения привели к этому решающему бою за сердце Гойки. [GSR.GetLeader] знала об этом и собрала для обороны большие силы ополчения и солдат. Бои превратились в изнурительную битву, где каждая захваченная нападавшими часть города стоила всё больше и больше жизней. По состоянию на [?global.date.GetDateStringNoHourLong] правительство бежало, и в городе остались лишь несколько очагов. Улицы всё ещё полны решимости некогда великой нации, которая находится на грани своего конца."
 bfdinews_cities.9.a: "Кровавые знамёна..."
 bfdinews_cities.9.b: "Да здравствуют рабочие!"
 bfdinews_cities.9.c: "Красное Сердце!"
 bfdinews_cities.10.t: "КОНЕЦ КЭСЛЕНДА!"
 bfdinews_cities.10.desc: "В Кэсланде, сердце Гойки, до сих пор слышны выстрелы, поскольку бои продолжаются. Однако большинство ключевых районов были захвачены вторгшимися силами [?global.date.GetDateStringNoHourLong]. Правительство мобилизовало различные силы для ключевой обороны столицы, многие из которых поддержали \"Порядок\". Атакующим силам [206.controller.GetName] было трудно продвигаться вперед, поскольку каждый дом и улица были защищены защитниками, готовыми умереть за свою страну. [GFG.GetLeader] даже несколько раз оказывался на передовой, вдохновляя защитников. Несмотря на все усилия государства, город был взят нападавшими, и у защитников остались лишь несколько очагов сопротивления. С бегством правительства, означает ли это конец государства, подобного \"Порядку\"?"
 bfdinews_cities.10.a: "Порядок взят с боем..."
 bfdinews_cities.10.b: "Я НЕНАВИЖУ обороняться!"
 bfdinews_cities.10.c: "Сердце наше!"
 bfdinews_cities.11.t: "КОНЕЦ КЭСЛЕНДА!"
 bfdinews_cities.11.desc: "По состоянию на [?global.date.GetDateStringNoHourLong] защитники Кэсланда сдались наступлению солдат [206.controller.GetName]. Правительство собрало силы и подготовило ключевые оборонительные сооружения в городе. [GDR.GetLeader] заявил, что \"Сердце Гойки не может пасть\" и что \"мы будем защищать наши дома!\". Бои были ожесточенными и отчаянными, за каждый уголок города велись ожесточенные сражения. Основные бои развернулись вокруг Нижнего дома, который был захвачен нападавшими после того, как был превращен в руины. Позже правительство бежало и приказало выжившим в битве сдаться. В городе все еще горят огни, но уже несколько дней его сердце замерло."
 bfdinews_cities.11.a: "Свобода жить или умереть..."
 bfdinews_cities.11.b: "Все усилия были направлены не на его спасение..."
 bfdinews_cities.11.c: "Сердце Наше!"
 bfdinews_cities.12.t: "ГРАБЕЖ В ФУТПАТХБУРГЕ!"
 bfdinews_cities.12.desc: "Хотя на улицах всё ещё слышны выстрелы, ясно, что силы под флагом [201.controller.GetName] захватили большую часть города. [YFC.GetLeader], [YFC.GetName] нанял ещё больше наёмников, чтобы восполнить потери в войне. Несмотря на все попытки вложить больше денег в войну, их враги достигли города. Бои разгорелись на каждой улице, поскольку вторгшаяся армия захватывала квартал за кварталом. Во время хаоса многие магазины, банки и даже штаб-квартира самой Компании были разграблены наступающей армией и мирными жителями. [YFC.GetLeader] и остальные высокопоставленные лица, как сообщается, бежали из столицы до того, как она попала под обстрел. На данный момент некогда великий торговый центр погрузился в состояние анархии [?global.date.GetDateStringNoHourLong]."
 bfdinews_cities.12.a: "Как это повлияет на экономику?"
 bfdinews_cities.12.b: "Хоть кого-то еще можно уволить...?"
 bfdinews_cities.12.c: "Деньги тебе не помогут!"
 bfdinews_cities.13.t: "ПАДЕНИЕ АНОНСЕРГРАДА!"
 bfdinews_cities.13.desc: "Сообщения хаотичны и вводят в заблуждение, но, похоже, по состоянию на [?global.date.GetDateStringNoHourLong] Анонсерград пал под натиском [209.controller.GetName]. Правительство [GTR.GetLeader] собрало всех возможных защитников, привлекая вооруженных гражданских лиц после поражений, которые позволили нападавшим достичь города. Со временем бои распространились по всему городу, поскольку нападавшим приходилось зачищать улицу за улицей. Когда здание совета попало под обстрел, большая часть правительства, в том числе [GTR.GetLeader], бежала из города. После падения здания совета большая часть сопротивления рухнула, и лишь несколько очагов остались. Удержится ли технократическое правительство после потери этого крупного города?"
 bfdinews_cities.13.a: "Печальная ситуация."
 bfdinews_cities.13.b: "*Неразличимые вопли*"
 bfdinews_cities.13.c: "Важнейший город теперь наш!"
 bfdinews_cities.14.t: "ПАДЕНИЕ УНИВЕРСИТЕТА!"
 bfdinews_cities.14.desc: "[89.controller.GetName] объявил, что [?global.date.GetDateStringNoHourLong] Университет Гойки, центр технологического прогресса в Гойки, был захвачен их силами. По мере приближения нападавших к университету, [GTR.GetLeader] начал подготовку к обороне университета с использованием укреплений и траншей. С началом боя нападавшие зачищали траншею за траншеей, а затем продвигались к внешним зданиям кампуса. Бои стали жестокими, поскольку нападавшим приходилось зачищать здание за зданием, в котором размещались защитники. В ходе зачистки лаборатория Гольфболл была зачищена с помощью гранат и огнеметов. Гольфболл там не было, она уже сбежала. После захвата большей части университета защитники сдались. Теперь, когда дымящиеся руины стали видны во всей красе, означает ли это конец Технократической Республики?"
 bfdinews_cities.14.a: "Больше никаких научных революций."
 bfdinews_cities.14.b: "А что со статуей?"
 bfdinews_cities.14.c: "Разбирайте их технологии!"
 bfdinews_cities.15.t: "ПАДЕНИЕ ШНЕЕХОРНА!"
 bfdinews_cities.15.desc: "В докладе с фронта, датированном [15.controller.GetAdjective], сообщается о капитуляции всех оставшихся сил Рейха в Шнеехорне. После окружения города нападавшие штурмовали его с нескольких направлений, а защитники яростно сопротивлялись на каждом шагу. Войска наконец пробились в здание парламента, сражаясь комната за комнатой, пока не достигли крыши, где над городом был поднят флаг. Битва за Шнеехорн окончена. Сообщается, что Сноуболл бежал до завершения окружения, поклявшись продолжить борьбу. Удержится ли Рейх или это конец?"
 bfdinews_cities.15.a: "Главный угнетатель Плато разбит."
 bfdinews_cities.15.b: "Мы ещё вернёмся!"
 bfdinews_cities.15.c: "Фашистское логово наше!"
 DAV_lol_event.1.t: "Время Гражданской Войны"
 DAV_lol_event.1.desc: "Ой-ой! Похоже, вы не смогли исправить экономику за три секунды, и теперь люди на вас очень злятся! (хотя на это ушли бы месяцы). В общем, эта группа под названием \"Фронт свободы Дэвидленда\" захватила все северные земли, и теперь здесь гражданская война! Удачи :)"
 DAV_lol_event.1.a: "Погоди... ЧЕ!?"
 
