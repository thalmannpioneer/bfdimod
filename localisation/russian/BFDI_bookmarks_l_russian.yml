l_russian:
 BEGGINING_OF_THE_END_NAME: "Смута в Гойки"
 BEGGINING_OF_THE_END_DESC: "Состязания идут хорошо, но, возможно, некоторым не понравится победитель."
 GOI_BEGGINING_OF_THE_END_DESC: "Южный Гойки - Достаточно густонаселённый континент с крупными населенными пунктами и производством. Однако, на нём практически не существует центральной власти. Эти факторы создают достаточно нестабильную общественную обстановку, и всё хрупкое общественное устройство может рухнуть при потрясениях..."
 PETRI_DISH_NAME: "Чашка Петри"
 PETRI_DISH_DESC: "Сразу погрузитесь в бой за Гойки, пропуская прелюдию.\n\nЕсли вы играете в первый раз, рекомендуется взять первый сценарий!"
 GTR_PETRI_DISH_DESC: "Молодая Технократия, ещё не осознавшая себя полноценным государством, поднимается над Гойки."
 YFC_PETRI_DISH_DESC: "Финансовая Империя Йеллоу Фейса разрослась настолько, что стала полноценным государством на руинах старого Гойки. Но она требует всё больше и больше..."