l_russian:
 BEGGINING_OF_THE_END_NAME: "Смута в Гойки"
 BEGGINING_OF_THE_END_DESC: "\"Битва за Остров Мечты\" стремительно набирает популярность по всему континенту, принося мир и процветание обитателям Гойки! Хотя, возможно, это шоу слишком сильно объединяет континент. Остаётся только гадать, что произойдёт, если всё закончится плохо...."
 GOI_BEGGINING_OF_THE_END_DESC: "Южный Гойки - Достаточно густонаселённый континент с крупными населенными пунктами и производством. Однако, на нём практически не существует центральной власти. Эти факторы создают достаточно нестабильную общественную обстановку, и всё хрупкое общественное устройство может рухнуть при потрясениях..."
 PETRI_DISH_NAME: "Чашка Петри"
 PETRI_DISH_DESC: "Спокойный, мирный и единый континент Гойки, каким он был в прошлом, пал в одно мгновение после позорного захвата Острова Мечты. Социальные структуры по всему континенту кардинально изменились, быстро образовались и исчезли вакуумы власти. Любая из новых стран, разбросанных по континенту, может либо быстро исчезнуть, либо навязать свою волю всей цивилизации.\n\n§RЕсли вы играете в первый раз, лучше возьмите первый сценарий!§!"
 
