 BUN_Ceasefire: "Предложить §RПеремирие§!"
 BUN_Ceasefire_desc: "В условиях нынешней тупиковой ситуации в войне и ухудшения нашего положения, мы могли бы предложить мирное соглашение. В обмен на прекращение войны и возвращение всех наших основных территорий мы заключим длительный мир с Йелоу Фейсом, предоставим права на ресурсы и выплатим большие военные репарации."
