 CRN_BUN_Deal_desc: "Новой Банде нужны советники, которые смогут улучшить их армию, в основном плохо оснащенную и необученную. В то же время нам, с учетом растущего присутствия коммунистов, необходима помощь. Поэтому логично заключить сделку: наши советники — им, чтобы устранить... некоторых соперников."
 CRN_BUN_Opportunity: "§RОкно Возможностей§!"
 CRN_BUN_Opportunity_desc: "У нас есть шанс самим вступить в войну, пока Йелоу Фейс находится в невыгодном положении! Однако этот шаг крайне непопулярен среди нашего населения и армии. У нас будет низкая поддержка, и, возможно, население даже будет уклоняться от призыва, но это может стоить того, чтобы положить конец господству Йелоу Фейса!"
