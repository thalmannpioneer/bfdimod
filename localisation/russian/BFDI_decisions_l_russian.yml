 decision_BUN_Revolt_category: "Уничтожить Копрорацию"
 decision_BUN_Revolt_category_desc: "Эти капиталисты под руководством Йелоу Фейса думали, что всё кончено? Что мы просто подчинимся их угнетению? Что они будут править нашими землями, домами и имуществом?\n\n§RСкоро им придёт конец.§!"
