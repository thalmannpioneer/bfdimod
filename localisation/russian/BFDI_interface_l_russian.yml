 WW_TEXT: "§YДобро пожаловать в TiG!§!\n\n§RВнимание!§! Если контент в моде покажется вам пустым или несбалансированным, то не волнуйтесь! Это лишь демо, и огромный пласт лора, механик и прочего будет переделан в будущем!\nБолее того, если вы нашли ошибки или хотите что-либо предложить, то можете присоединиться к дискорд-серверу, который указан на странице Steam."
