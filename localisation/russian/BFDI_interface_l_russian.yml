 demo_end_text: "Спасибо за игру! Если вам понравилась модификация, просим поставить ей лайк в стиме и добавить её в закладки. Также просим вас зайти на §1Дискорд-сервер§!.\n\nМод будет продолжать своё развитие и многие моменты лора и геймплея будут переработаны в будущем. Текущая версия модификации §Rне демонстрирует финального продукта.§!\nЕсли вы желаете применить свои навыки и помочь разработке, вы можете связаться с нами на §1Дискорд-сервере§!."
