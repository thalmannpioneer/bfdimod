 demo_end_WGF_title: "§RКрасное солнце§! восходит над Северным Гойки..."
 demo_end_GGR_title_1: "§LСнежное Плато§! погружается в §RАнархию§!..."
 demo_end_GGR_title_2: "§gПорядок§! устанавливается в §LСнежном Плато§!..."
 demo_end_GPG_title_1: "§YСтабильность§! возвращается в §7Зелёные Равнины§!..."
