 demo_end_GSR_title_2: "§RАнархия§! поглощает §7Зелёные Равнины§!..."
 demo_end_GFG_title_1: "§LНациональное Возрождение§! охватывает §7Зелёные Равнины§!..."
 demo_end_GFG_title_2: "Призрак §1Йойлоленда§! бродит по §7Гойки§!..."
 demo_end_GDR_title: "§4Демократия§! торжествует в §7Зелёных Равнинах§!..."
 demo_end_GTR_title_1: "§4Альма-матер§! погружается в §gКаменный Век§!..."
 demo_end_GTR_title_2: "Технократия §gподнимается из пепла...§!"
 demo_end_text: "§YЗдесь кончается демо. Пока что.§!\n\nСпасибо за игру! Если вам понравилась модификация, прошу поставить ей лайк в стиме и добавить её в закладки. Также прошу вас зайти на §1Дискорд-сервер§!.\n\nМод будет продолжать своё развитие и многие моменты лора и геймплея будут переработаны в будущем. Текущая версия модификации §Rне демонстрирует финального продукта.§!\nВ данный момент у мода один единственный разработчик и если вы желаете применить свои навыки и помочь разработке вы можете связаться со мной на §1Дискорд-сервере§!.\n\n§7С любовью, обычный фанат Битвы За Остров Мечты из России.§!"
 demo_end_button_text: "Спасибо!"
 demo_end_credits_title: "Авторы"
 demo_end_credits_text: "§Ythalmannpioneer§!\n(Создатель, Дизайнер Карты, Дизайнер Фокусов, Графика, Портреты, Флаги, Код, Гейм Дизайн)\n\n§YZDubbz§!\n(Ивенты, Пути, Гейм Дизайн, Дизайнер Карты)\n\n§YPun§!\n(Код, Гейм Дизайн)\n\n§YBarelySilver/Starling§!\n(Дизайнер Фокусов)\n\n§YDaymare§!\n(Загрузочный Экран)\n\n§YKind of Human§!\n(Мелкая Графика)\n\n§YDabaman§!\n(Дизайнер Фокусов)\n\n§YPadirian§!\n(Мелкая Графика)\n\n§YLither§!\n(Дополнительные Портреты)\n\n§YWhereIsTheI§!\n(Дополнительные Портреты)\n\n§YEl Pastita§!\n(Дополнительный Дизайн Карты)\n\n§YIridium§!\n(Дополнительные Флаги)\n\n§YAyhem Mayhem§!\n(Иконка Денег)\n\n§7И всё сообщество BFDI. Огромное количество графики, ресурсов и музыки было взято с открытых источников. Спасибо вам.§!"
 
