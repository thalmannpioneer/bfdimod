 l_money_tt_delayed: "§7Гойкийский Доллар§! - удивительная валюта, которая, без регуляции какого-либо центробанка и государства координированно распределяется и печатается несколькими региональными центрами Гойки и получила широкое распространение по всему континенту во времена промышленной революции и телеграфа. Обеспечивается местными банками по фиксированному договорному курсу йойлозолота."
