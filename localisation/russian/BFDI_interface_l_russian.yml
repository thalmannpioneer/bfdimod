 l_YFC_trade_help_tt_d: "Торговая Панель §YYellow Face Corporation§! (c) предоставляет возможность §7покупать§! и §tпродавать§! еду и сняряжение дружественным странам.\n\nДля этого §2кликните на любую страну на карте§! и начните торговать!\n\n§5Кликните на любой маршрут§!, чтобы узнать его качество.\nОт качества маршрута зависит §2Успех доставки.§!\n§t50% - Плохой Маршрут§!\n§Y75% - Нормальный Маршрут§!\n§790% - Хороший Маршрут§!"
