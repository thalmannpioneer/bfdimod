 l_YFC_trade_help_tt: "Need some help?"
 l_YFC_trade_help_tt_d: "The §YYellow Face Corporation§! Trading Menu (c) offers you a great opportunity to §7Sell§! and §tBuy§! equipment and food.\n\nJust §2Click on any nation on the map below§! and start doing business!\n\nYou can also §RHover on any route on the map§! to see its passability.\n§2Success rate of the delivery§! is defined by this property.\n§t50% - Bad Route(2)§!\n§Y75% - Normal Route(1)§!\n§7100% - Good Route(0)§!\n\nThe routes' risk changes as global events unfold so be sure to check every once in a while!\n\nGood luck!"
