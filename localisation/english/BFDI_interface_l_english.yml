 demo_end_text_title: "§YDemo ends here. For now.§!"
 demo_end_text: "Thanks for playing! If you like the mod, put a like on Steam and add it to your bookmarks. Also you can join the §1Discord server§!.\n\nThe mod team will keep working on the development of the mod and many aspects of the lore and gameplay will be reworked in the future. The current version of the mod §Rdoes not show the final product.§!\n\nIf you have skills in writing, graphics or in HOI4 modding generally, you can apply to mod's dev team on our §1Discord server§!."
 demo_end_text_thank: "§7With love, The Kameshek Team§!"
 demo_end_button_text: "Thanks!"
 demo_end_credits_title: "Credits"
 demo_end_credits_text: "§Ythalmannpioneer§!\n(Creator, Map Design, Focus Icons, GFX, Portraits, Flag Design, Programming, Game Design)\n\n§YZDubbz§!\n(Events, Path Design, Game Design, Map Design)\n\n§YPun§!\n(Programming, Game Design)\n\n§YBarelySilver/Starling§!\n(Focus GFX)\n\n§YDaymare§!\n(Illustrated Loading Screen)\n\n§YKind of Human§!\n(Misc. Icons)\n\n§YDabaman§!\n(Focus GFX)\n\n§YPadirian§!\n(Misc. Icons)\n\n§YLither§!\n(Additional Portraits)\n\n§YWhereIsTheI§!\n(Additional Portrait)\n\n§YEl Pastita§!\n(Additional Map Design)\n\n§YIridium§!\n(Additional Flags)\n\n§YAyhem Mayhem§!\n(Money Icon)\n\n§7And all BFDI Community. An enourmous number of assets for this mod were taken from the internet. Thank you all.§!"
 
