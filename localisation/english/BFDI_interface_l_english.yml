 l_YFC_other_trade_help_tt_d: "Dear Customer of the §YYellow Face Corporation§! (c)!\nIn this panel you can §7buy§! and §tsell§! food and equipment to our Company with really good prices. Just select anything you want to trade for and press the corresponding button.\nBy buying §9Food§! at our Company, you can reinforce your political regime and make people happy!"
 
