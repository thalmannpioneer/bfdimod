 demo_end_text: "Thanks for playing! If you like the mod, put a like on Steam and add it to your bookmarks. Also you can join the §1Discord server§!.\n\nThe mod team will keep working on the development of the mod and many aspects of the lore and gameplay will be reworked in the future. The current version of the mod §Rdoes not show the final product.§!\n\nIf you have skills in writing, graphics or in HOI4 modding generally, you can apply to mod's dev team on our §1Discord server§!."
 demo_end_text_thank: "§7With love, The Kameshek Team§!"
