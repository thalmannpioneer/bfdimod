 WW_TEXT: "§YWelcome to TiG!§!\n\n§RWarning!§! If the content in the mod seems empty or unbalanced, don’t worry! This is just a demo and a huge layer of lore, mechanics and other things will be redone in the future!\n\nMoreover, if you find error or want to suggest something, you can contact me on discord server that listed on the Steam page."
