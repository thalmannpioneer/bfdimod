# GTR
 GTR_event.1.t: "Gaudeamus Igitur"
 GTR_event.1.desc: "\"It's still not over!\" Golf Ball emotionally shouted in her characteristic voice. She was up late again, working on the Dream Island Restoration Project. Over the weeks, the former BFDI contestant had established a team at the university, with the intent of recreating the island. Tennis Ball's past words about state management from when they were together in the TLC continued to eat at her. His words about stupid things like 'bureaucracy' and 'proper supply lines,' rang through her head. Tennis Ball had likely been right about needing organized administration, but who the hell could concern themselves with that when the possibility of saving a whole civilization was at their fingertips?! We are on the verge of a breakthrough, we can't worry ourselves about governments!"
 GTR_event.1.a: "We can still save everything."
 
 GTR_event.2.t: "Blurred Microscope"
 GTR_event.2.desc: "Test Tube's day was quite a bit more challenging than she had anticipated. Working at the tippity top of South Goiky's University Research Facility was already quite challenging, but a small mishap suddenly became the worst part of her day. \nBeing assigned to work with and research small, unicellular organisms today, she of course needed her microscope. Getting it from one of the technology rooms a floor above today's workstation was quick and easy. She returned, and got started on her work. Entering numbers, working through spreadsheets, writing results, all standard stuff for her. Easy stuff, even. \nThough, nearing the end of the day's assignment, she noticed that one result contradicted with another. Something in her head told her to look back at her work, and she did so, for a while. Contradiction after contradiction, she realized the microscope she had been using was faulty. \nYet another set back."
 GTR_event.2.a: "Unfortunate, pay more attention."
 
 GTR_event.3.t: "Dream Sauce Recipe"
 GTR_event.3.desc: "Beryllium-8 bring to Be(OH)2, add 10 ml by every liter of the compound.\n\nWheat flour, dissolved in water, ~30 l.\n\nSoil yeast 10 g by every liter of the compound.\n\nGrind the metal shavings thoroughly..."
 GTR_event.3.a: "Sounds delicious!"
 
 GTR_event.4.t: "Supply Crisis"
 GTR_event.4.desc: "Golf Ball looked outside from her spot in front of the window. In front of her, she saw the glorious campus of South Goiky University. The campus she had helped improved. Wonderful. Her eyes flittered between the campus' large buildings, and the setting sky. Those same buildings were in ruins a little over a month ago, and now? Classes were being held in them. Objects were free to study as they pleased. High end education at an affordable price, and in the most gorgeous works of architecture she'd seen in her life as well? Please. Those buildings carried with them the stories of all Goikean intellect. All South Goikeans who'd ever studied, ever educated, ever learned, ever devoted their life to science. The university had always been a great wonder of the continent. And with the melting shades of orange, yellow, purple, and red strewn across the sky, as paint thrown against a canvas; It was certainly a sight to behold, she thought to herself. \n\nAverting her eyes downward, she realized that she nearly forgot to think about the objects in the university. Though some were attending clases, most were huddled around a stand that was selling bread. The bread didn't seem to be all that filling, either, considering the looks in the eyes of those who had already eaten. The line extended farther than Golf Ball could see, from the angle she was looking out of the window at. Much farther. Another food shortage, she supposed. It was fine really, there had been a few in the preceding months, never lasting more than a week. Objects could go without eating for a week. \nSuddenly, the lights in her office shut off. She jumpeed slightly, shortly cursing herself for reacting as such to something that had no power to hurt her. Concluding that the lights turning off were a sign for her to go to bed, she walked into the hallway. Walking up and down the halls of the building she both worked and lived in, Golf Ball soon realized that the entire building had lost power."
 GTR_event.4.a: "Maybe we should do something about this..."
 
 GTR_event.5.t: "Greenheart Roses"
 GTR_event.5.desc: "The virgin fields to the south are home to amazing crops from various plant families. For example, the wild roses here lack the characteristic needles on their stems, making them a delight to pick. They possess a wonderful fragrance that permeates the vastness of Greenheart."
 GTR_event.5.a: "Filling up the herbarium."
 
 GTR_event.6.t: "Last Preparations"
 GTR_event.6.desc: "The supplies have reached even lower numbers. Despite being able to restore the power to pretty much every building, no doubt due to her genius, there were still shortages in every other sector. Objects were missing food, projects were missing resources, university lessons were even getting canceled. Objects were dying. Golf Ball clearly couldn't put off working on this issue even longer. The objects in Announcergrad had been holding demonstrations as well, according to some of the rumors she'd been hearing. No shortage had ever lasted this long before."
 GTR_event.6.a: "We need to finish The Project."
 
 GTR_event.7.t: "Unrest in Announcergrad!"
 GTR_event.7.desc: "The resource defficiency has made the objects of Announcergrad angrier. They've been holding demonstrations in the streets every day for nearly two weeks. If we do not finish The Project soon, it will likely lead to significantly horrific consequences."
 GTR_event.7.a: "We need to move fast."
 
 GTR_event.8.t: "Time is up."
 GTR_event.8.desc: "Golf Ball had been locked in her lab for the past few hours now. The Announcergrad demonstrators had become revolutionaries, rioting the very concept of knowledge itself. They were just outside of the door now. Attempting to tear it down, while screaming horrible, awful things about her. About her leadership, her ruling, her projects, her life's mission. The demonstrators had been fed up with the neglect she had given them, and in all honesty, she couldn't blame them for feeling the way they did. There had onely been one thing on the minds of the demonstrators.\n\nHunger.\n\nFinally, the door began to come down. Cracks were showing at its edges, and the once secure locks were now making wild noises with each push. Knowing they would soon begin to force their way into Golfball's office, her last sensible decision was made."
 GTR_event.8.a: "She felt no pain."
 
 GTR_event.9.t: "Preparations done!"
 GTR_event.9.desc: "The composite is ready! Now, we can begin testing. We're one step away from saving Goiky! Everything should go according to plan."
 GTR_event.9.a: "Let us begin."
 
 GTR_event.10.t: "Unforeseen concequences"
 GTR_event.10.desc: "We've lost contact with the University. An earthquake shook a twenty-miles radius of the campus. It was so powerful that windows were blown out all the way in Announcergrad. There were reports of a mushroom cloud of smoke visible, even miles away from the supposed explosion.."
 GTR_event.10.a: "THE HECK HAPPENED THERE?"

 GTR_event.11.t: "Negative delta"
 GTR_event.11.desc: "Driving through the blackened fields of the campus into the university area, objects were met with a scene of horrific destruction. The piles of ashes were remeniscent of the moon's dust, in their abundance. Toxic clouds shrouded the skyline of the alma mater, with most of its buildings having been reduced to rubble."
 GTR_event.11.a: "Let's hope that there are survivors."

 GTR_event.12.t: "And, when all hope was lost..."
 GTR_event.12.desc: "It was a quiet night at the edge of the University Administration's borders. Despite the situation in the University proper, border guards were instructed to act as they had been. Ever since the influence of the University had expanded, it had needed to patrol the outskirts of its border due to the incessant raiding of the bandits to the east. One border guard, Uranium, had taken a liking to the tranquility of the late nights he worked. He was often the only one at work this late, especially considering the lessening influence of the Golf Ball herself, but he enjoyed spending his nights out here. He didn't mind the loneliness.\nThe stars above him were really pretty. Large, glistening, gleaming, illuminating the night sky. He had always liked the stars and such, even studying astronomy at the University before the incident. Sighing, he remembered getting the report that his professor's body hadn't been recovered from the reckage. Oh, and the moon? Don't even get him started. Uranium held firmly the belief that he'd walk on the moon one day, ever since he was little. He remembered the telescope his mother had bought him when he was young; it was the first time he had ever seen the moon that close. \n\nSuddenly, the shadowy figure of an object, running just barely inside of his peripheral vision, sent a chill through his body. Had that been a raider patrol? He had only seen one in person once before, back when he was attempting to locate the university itself. Even though he wasn't a target of the raider's wrath, the sight was still scary. Remembering that dealing with issues like these was his job, he started paying closer attention to the figure. Turning fully to face it, he realized two things: One, the figure was much closer than he thought; and two, it was alone. The figure seemed to be a large, roundish, armless object. Likely only a little taller than himself. Turning on the lights on top of the tiny building he worked in, he realized that the figure was running. In a full sprint, no less. They didn't seem intimidating, so Uranium started out of his station, opening the door to try speaking with the visitor.\n\nThough, as he began to formulate something to say, he recognized the figure. That was Tennis Ball. Everyone had heard of Tennis Ball, seeing as he was a BFDI competitor, but that truth was tenfold in the University Administration. Tennis Ball finally stopped running, directly infront of a bewildered Uranium. \nOut of breath, collapsing onto the floor, Tennis Ball said, \"Who.. Who are you? Who do you work for?\"\nSlightly freaked out, having just met Golf Ball's second in command on a random day of the week, Uranium stuttered out an awkward reply, \"Uh, um, T-Tennis Ball?! Like, you're *actually* Tennis Ball?! Sorry, I, uh... I'm Uranium, I work for Golf Ball, under the--\"\nAt the words 'Golf Ball,' The larger cut Uranium off. \"Golf Ball? So does that mean I'm... finally close to the University?\""
 GTR_event.12.a: "\"I- yeah! I can take you there. You, uh, need a pass for now, though.\""

 GTR_event.13.t: "At the right time, in the right place"
 GTR_event.13.desc: "\"Wait, so, you were with the raiders?\" Uranium asked. They had been driving to the ruins of the University for the last hour, having started nearly immediately after Uranium found Tennis Ball. The border guard had sent a message to his superiors, but they hadn't responded yet, likely due to the late hour. Uranium's truck was a little dirty, which he didn't feel embarrased by until Tennis Ball had entered the car, and he had to sweep aside some empty beer bottles.\nTennis Ball chuckled slightly, before responding again, \"Unfortunately. After Goiky had collapsed, I was trying to find the university. Golf Ball had always told me she'd move there after getting out of the TLC. I got a bit lost, ended up in Podgornyv, the Bunch's capital, and Pen convinced me to work with him. He told me it'd be temporary, but I guess Eraser and Blocky had other ideas. I was stuck there for months, they were always threatening and bribing me.\"\n For a short while after Tennis Ball's response, the truck remained silent. Just driving through endless green hills and meadows, passing by trees and small animals. Because, how could Uranium respond to that at all? Of course he had heard about the raiders, all their banditry. Even with the isolated nature of the University Administration, he had still heard much about them. The terror, the burning, the destruction, the death, the killing, the blood. Gosh, the blood. Those same people had kidnapped Tennis Ball, made him run until he couldn't feel his legs anymore, forced him silent for the first hour of the ride. Uranium could barely believe it. \nAttempting to break the tension, he attempted another, more lighthearted question, \"Must've, uh, sucked ass working with them, right?\"\nChuckling again, this time a bit louder, Tennis Ball responded again. \"Oh, they were the *worst.* You'd think the guys leading such a strong and loyal army would be smarter, but they didn't even know anything about the research they were forcing me to do. I mean, I don't think they could tell the Big Dipper from the Little if they tried.\"\n At that, Uranium laughed heartily. From then on, he felt as if he'd really never be able to understand why people disliked Tennis Ball's presence, during BFDI."
 GTR_event.13.a: "A good destressor after months of Bunchivist terror"

 GTR_event.14.t: "Arriving at the office" #splitting event 14 into two events as well..... aw seriously
 GTR_event.14.desc: "Though the radient sun's shining should've made things much more 'upbeat,' the black, burnt debris of what was once the university's campus really put a damper on the mood of the ride. Uranium was nearly finished driving; just a couple more turns and he'd be sending Tennis Ball on his way. Though, honestly? He felt kind of bad about doing so. I mean, leaving someone alone in this wasteland was already bad enough, but leaving him with Golf Ball? Much worse. It wasn't as if Uranium didn't like Golf Ball, or anything--she was great--but everyone knew that she hadn't really been 'the same,' ever since the incident happened here. She'd been fervently blaming herself for nearly everything. The failure of the project, the explosion itself, the Announcergrad Famine, all of the lost technologoies, the deaths. She'd been blaming herself for the deaths a lot. Golf Ball wasn't as inspiring to be around has she had been when Uranium had first signed up to be a border guard. \nWait, speaking of him being a border guard, his shift technicaly hadn't even ended yet. He was three hours away from his post.\nWas he gonna get fired?\nLuckily, Golf Ball's Laboratory mangaged to survive. That's where the object spent most of her time, now. Wallowing in her own sadness. Speaking of the building, Uranium was approaching its entrance. He stopped the vehicle, \"Um, I think this is as far as I'm allowed to go. Golf Ball's in there most of the time now, not like there's anywhere else for her to be.\" He laughed awkwardly before stopping quickly. Maybe now wasn't the time to be making jokes.\nIn a monotone, Tennis Ball responded, \"Right. Thank you for driving me out here, I'll make sure someone hears about your kindness. Hopefully you can be compensated for all this.\" He waved with his foot, before stepping out of the truck, and starting down the steps that lead to his best friend."
 GTR_event.14.a: "I wish you good luck, Tennis Ball"

 GTR_event.14-1.t: "Friends"
 GTR_event.14-1.desc: "Golf Ball had been intermittently conscious for what she had believed to be the past week. Neither the concept of 'going to sleep,' nor the concept of 'waking up,' held any significance, to her. Simply, she was. Whenever she was given the grace to think, the grace to reflect, the only thing that came to her were visions and memories of the mistakes she had made. Her mishandling of a population of individuals led to the deaths of thousands. Tens of thousands, even. And now? She didn't know what to do; she was scared of making the same decisions. Leading those who trusted her to a world so opposite of the word 'ideal.' She believed in the likelihood of her demise, and accepted it fully. For, after the deaths of thousands, what was one more to the world? Revenge.\nShe felt herself drifting again; she didn't enjoy being awake much these days. Maybe she'd have time to think back on her transgressions more in the future. She hoped not. Her eyelids began to feel heavy, and she rolled onto her back. She stared at the ceiling above her. The only reason she was alive now was because of it; because of this building rather. Her lab. The very lab she had prohibited objects from entering, regardless of circumstance.\n\nImagine Golf Ball's surprise when an object entered. She hadn't seen another object in weeks, and she definitely didn't expect to see one now, no less Tennis Ball. Tennis Ball looked to be quite concerned, by the time Golf Ball came to recognize his precense. He was all worn out from something. What that 'something,' had been, she didn't know. She noticed something about his tone of voice as he began speaking. \"Golfie? How've you been? Also, if you don't mind me asking... what happened out there?\" Was that concern? \nAfter a small amount of silence, Golf Ball sat up, remembering that she had to respond to people when they asked her questions. Speaking slowly, she replied, \"Hello, Tennis Ball. I'm doing horribly, and so is everything else here.\" \nA sort of calming quiet washed over the small room of the laboratory as Tennis Ball thought. He was choosing his words carefully, it seemed. His own thoughts gave Golf Ball more time to think as well, realizing that this was Tennis Ball. Her best friend, the other half of her only duo. He had come all the way from wherever he was before just to help her. She realized that people cared for her. Tennis Ball cut the silence, \"Well, can we make things better?\" And from that termination of quiet, the full weight of her own purpose fell onto her, all at once. Making things better was what she had always set out to do, why give it up? It would take her a while to fully realize the meaning of Tennis Ball's return, what he meant to her, but finally, she came to a conclusion."
 GTR_event.14-1.a: "Tennis Ball can be trusted."

 GTR_event.15.t: "Excavations"
 GTR_event.15.desc: "During the rescue operations, we were able to retrieve numerous valuable technologies and locate some survivors, who were successfully transported to Announcergrad. This will somewhat improve our harsh situation."
 GTR_event.15.a: "Worderful job everyone!"

 GTR_event.16.t: "Political Refugees"
 GTR_event.16.desc: "Some talented minds are fleeing from Casland, to our Administrative borders. We shouldn't let their potential go to waste! Only by our combined intellect, we can survive these harsh times, and possibly come out of them even stronger."
 GTR_event.16.a: "Welcome!"

 GTR_event.17.t: "Aid for Announcergrad?"
 GTR_event.17.desc: "We've heard news of a harsh situation in Announcergrad, even more harsh than the in rest of Goiky. Will we send some aid to those poor objects?"
 GTR_event.17.a: "Fine."
 GTR_event.17.b: "Not our jurisdiction."

 GTR_event.18.t: "Aid arrived!"
 GTR_event.18.desc: "We have received humanitarian aid from sympathetic objects in [FROM.GetName]!"
 GTR_event.18.a: "Excellent!"

 GTR_event.19.t: "Discussion"
 GTR_event.19.desc: "\"Do you not see how idiotic that suggestion is?\"On another late night in the Lab, Golf Ball once again found herself losing her temper, with Tennis Ball at the receiving end of her anger. Continuing her effuse, she added \"Diverting any resources from a project that has already been started is nothing short of irresponsible!\" She let her words hang in the air for a moment afterward, hoping that the terminatory tone she held would make her lab partner faulter. A silence fell over the room for a short while, as Tennis Ball began to think over his next words carefully.\nAfter a long moment, Tennis Ball took a small, yet noticeable breath in, before arguiing, \"I don't mean to be harsh, but, there's no backing to your claim at all. I just think you're being a bit too dismissive of the people out there. I mean, you're not just a scientist anymore, Golfie, you're a leader! Diverting resources to Announcergrad has no downsides for anyone but you.\" Tennis Ball felt a little uneasy after speaking, he didn't often confront Golf Ball in this way. Luckily, her response surprised him."
 GTR_event.19.a: "\"... I suppose you are correct.\""

 GTR_event.20.t: "Celebrations"
 GTR_event.20.desc: "The celebrations in Announcergrad filled Cappy with a sense of national pride that she didn't think she'd ever have. From the balcony on which she stood, she watched in awe as the parades of flags and banners of University symbols and graphed mathematical functions alike soared through the newly paved streets of the city. Things were getting better, anyone could see that to be true. Rations were getting larger, actually satiating objects' hunger, the smog filled winds from the south had started thinning out, and management was starting to finally listen to the objects over which the presided. The image of an old friend from a while ago came to Cappy's mind. Grape, he was always much more into the idea of the University Administration than she. She felt her soul warm at the realization that he'd love this sight just as much as the city seemed to love making it, she just wished he could've been here with her. Her thoughs halted as she heard another noisy rally march near, holding flags and banners all the same. Objects, joyful, loud, irrepressibly filled with ardor, filled the city's afternoon streets with a thunderous roar of \"Republic!\"\nWe all may have lost someone..."
 GTR_event.20.a: "...but we shall all move on."

 GTR_event.21.t: "Bossy Bot"
 GTR_event.21.desc: "\"Tennis Ball, you're acting weak! This is a time of confusion for everyone, we need strong, guiding leadership!\" Golf Ball's volume raised further. For the last few hours, the two had been attempting to calmly discuss the manner in which the two should govern. The universe's heat death would come sooner than a calm discussion about this topic between the two. Tennis Ball, despite favoring the highly radical reforms that a sector of the populace seemed to favor, kept quiet. He always attempted to appear more reserved in his beliefs, moving the goal post further and further with each subsequent conversation, but today discussions boiled over. Golf Ball was screaming at the top of her lungs about the insolence she percieved in him. And, of course, Tennis Ball obliged, for the moment."
 GTR_event.21.a: "\"Awwwww, okaaaaaaaaaaay\""

 GTR_event.22.t: "Old Connections"
 GTR_event.22.desc: "After a long day of alternating between cars, trains, and walking on foot, a delegation of people from Casland finally arrived in Announcergrad. Looking around for a while, they found similarities between that city and theirs. Announcergrad was clearly a city that had seen its fair share of violence, as did Casland, but there was a certain uniqueness about Announcergrad. Upon interviewing a random object they found on the street, one Uranium, they discovered that, despite being one of the few people he knew that survived the turmoil in the city, he was still hopeful for better days. He seemed almost cheerful, a stark contrast to the rubble behind him. Seeing as the situation had improved within the past couple months, who could blame objects like him for believing in the University Administration? This thought enlightened the delegation. Things could certainly improve in Casland, too. Political unrest had been dying down, violence had all but disappeared, people felt safe enough to have public outings in the city again. They just needed to make their people believe things would keep getting better.\n\nInterviewing random University students and alumni was not the goal of this excursion, however. The delegation, now in front of a small building labelled \"South Goiky University Administration,\" took one last gaze at the city before entering. \n\nAnd after a short discussion with Golf Ball and Tennis Ball, they quickly understood why the population was so sure of their future. Encountering the two in the middle of a tender conversation, Golf Ball's demeanor quickly shifted as she noticed the delegation, screaming \"WHAT PURPOSE DO YOU HAVE IN THIS BUILDING?\"\nTennis Ball quickly followed in saying \"You must be the delegation from Casland, we're happy to have you!\" The contrast between the two's approach created a very firm, yet very soft governing voice, just what a people needed to feel secure in times like these. After a short bit of discussions, they couldn't fully convince Golf Ball to enter into an alliance with the good people over in Casland, so, it came down to Tennis Ball's verdict."
 GTR_event.22.a: "Let's make contacts with Casland."
 GTR_event.22.b: "Send 'em back!"

 GTR_event.23.t: "Rails and Sleepers"
 GTR_event.23.desc: "There had been no trains running on the Lofty-Satoymin branch for several months. The young conductor, Pawny, dozing in his cab during a long shift, didn't notice that someone had reset the levers, and the mile-long, coal-filled train was rushing straight along the old branch.\n\nPawny woke to the sound of the border outpost's siren. Rapid movement, and the wheels sparked. Raised hands. Border guards' rifles.\n\n...\"There's gonna some problems for me at the depot.\""
 GTR_event.23.a: "Why not reopen this old branch?"
 GTR_event.23.b: "Confiscate the train."

 GTR_event.24.t: "By ourselves"
 GTR_event.24.desc: "There's not a single fragment of Goiky left around the Republic capable of constructive dialogue. Under these circumstances, surrounded by crazed radicals and thugs, the Republic is forced to remain cool in its foreign diplomacy and harden its heart to protect itself from potential aggression."
 GTR_event.24.a: "We have nothing else to do."

 GTR_event.25.t: "Our Path"
 GTR_event.25.desc: "The Republic faces a difficult choice regarding its inner policy. Tennis Ball advocates for expanding the ruling circles and strengthening the role of democracy, while Golfball favors preserving the powers of the University Administration and strengthening the role of the intellect in governance for the further development of science.\n\nWhich path will the Republic take?"
 GTR_event.25.a: "Democracy!"
 GTR_event.25.b: "Noocracy!"

 GTR_event.26.t: "Path of Our Industry"
 GTR_event.26.desc: "Tennis Ball and Golfball are in dispute over the direction of industrial development. Tennis Ball favors small, technologically advanced, environmentally friendly factories scattered over a large area, while Golfball wants large-scale industry and is not particularly concerned about the environment.\n\nWhat plan will the Republic adopt?"
 GTR_event.26.a: "Industry for Objects!"
 GTR_event.26.b: "Industry for Science!"

 GTR_event.27.t: "Ivy League"
 GTR_event.27.desc: "Thanks to the scientific collaboration between Casland and Announcergrad, a decision was made between the University of Goiky and Casland University to create a unified research community through which objects can share contemporary problems in the natural sciences and other disciplines. This will significantly strengthen cooperation between [?206.owner.GetName] and the Technocratic Republic."
 GTR_event.27.a: "Glory to our Science!"

 GTR_event.28.t: "Homesickness"
 GTR_event.28.desc: "\"Hi, Mom.\n\nHow are you? Things are now better for you there, as I've heard. Dad read in the newspapers that you have electricity again at home.\nThings aren't easy here. Dad and the other adults had to build a house out of REAL TREES themselves! But at least we're safe here. I can go for walks as much as I want! You was always forbidding me this at home! Dad even made a swing set for me and my friends!\nDad feels better too, I can feel it. He was always so nervous in the city, but now he breathes easier. But he's worried about you.\nI'm worried about you too. We all want to go home as soon as possible!\n\nThey say we don't have to be afraid to return now. That the border has opened. Dad says the same. But he's always arguing with others. They say he's a traitor. But my Dad isn't a traitor! We just want to go home! How is that traitorous? :(\n\nIt's hard to send letters here, the mail doesn't come often, and Dad says the postman is a bostard. I don't know what that means, but it's probably bad.\n\nAnyway, Mom, wait for us, we'll be home soon!\nWe all hope you are fine!\""
 GTR_event.28.a: "Good Luck, Little One!"

 GTR_event.29.t: "Gold Rush"
 GTR_event.29.desc: "A backwater bar on the outskirts of Wilopede had been full of strangers the last few evenings. No one asked names, and why would they? Nobody really cares here. Most of the customers here now are profit hunters who have forgotten the concept of home, and just seeking for some profit.\n\n\"I'm telling you, this branch will be one of the most profitable in all of Goiky! Brother, have you heard about the artificial crystals from Announcergrad? And about the flowers in Greenheart?\nThis produt is crazy! Thugs will tear you apart for it if you decide to transport it across the northern plain. Now imagine the opportunities that the railway opens up!\"\n\nA drunk-ish Cotton traced his finger across the stained map, tracing the trajectory of the newly opened Lofty-Announcergrad line. Pebble hung on his every word, as if under a spell, and the other objects around him weren't above listening, either."
 GTR_event.29.a: "\"Tell more, tell more!\""

 GTR_event.30.t: "Lofty Intergration"
 GTR_event.30.desc: "Thanks to our cooperation with [SRR.GetName] we managed to incorporate the city of Lofty! This will massively improve our position in the north and make our economical condition better."
 GTR_event.30.a: "Wonderful!"

 GTR_event.31.t: "Professional Etiquette"
 GTR_event.31.desc: "A gloomy rain pours down on the backstreets of the Announcergrad. A lone lamp shines through the thickly curtained windows of a nondescript gray building. \"Where the hell is he? The meeting's been going on for half an hour already.\"\nNotes glanced nervously at his watch, drumming his fingers on the table.\n\n\"Why do you even think we can trust him? Where did he even come from?\"\n\"I already told you he's from Casland, and that the subject is as trusted and reliable as a Greenport watch. He'll be here any minute.\"\n\nA rattling sound in the front hall. Everyone glanced at the entrance to the room, but saw nothing.\n\n\"Gentlemen, look a little lower. I am here.\""
 GTR_event.31.a: "\"Told ya!\""

 GTR_event.32.t: "Political Vacuum"
 GTR_event.32.desc: "After the Republic government declared the Goiky University's technological developments private, many Goiky self-proclaimed governments reacted with serious negativity. We lost a fair number of diplomatic contacts, but that's all for science, right?"
 GTR_event.32.a: "That should've been done."

 GTR_event.33.t: "Successful Operation!"
 GTR_event.33.desc: "The operation to lure scientists from another country was successful, and we were able to transfer these objects to our country. This will undermine our relations with that country, but that's not really a big deal."
 GTR_event.33.a: "Wonderful!"

 GTR_event.34.t: "Scientists Flee!"
 GTR_event.34.desc: "As a result of Technocrats' espionage activities in our country, many of our scientists fled to Announcergrad with the support of Golfball intelligence. This will seriously impact our scientific potential, and we will need time to fill the vacancies with new personnel."
 GTR_event.34.a: "Stupid Bossy Bot!"

 GTR_event.35.t: "Democratization"
 GTR_event.35.desc: "\"Any Announcergrad object, regardless of gender, limb count, or mental abilities, has the right to vote, express dissent, run for office, and be elected to the Announcergrad Council. This right is unconditionally granted to all objects of the city.\"\n\nTennis Ball stands still in anticipation of the crowd's reaction."
 GTR_event.35.a: "Roaring Applause."

 GTR_event.36.t: "Presidency"
 GTR_event.36.desc: "Tennis Ball's political reforms were met with a great warmth among the objects of Announcergrad. Democratization and the formation of fully fledged civil institutions helped establish the Technocratic Republic as a fully fledged state, where all objects could benefit from the fruits of science and technological progress."
 GTR_event.36.a: "Long live The Republic!"

 GTR_event.37.t: "Dead Weight of Morality"
 GTR_event.37.desc: "Golfball was particularly nervous about her evening brainstorming today. The question made her shudder several times in her comfy office.\n\n\"NO ONE in the old Goiky did care about weapons development. That makes total sense. But why don't we want to do it NOW?\nWhat's stopping my scientists from now starting to develop weapons\"\n\nAnd, suddenly, thought pierced her brain.\nThe reluctance to kill and the feeling of responsibility for killing hinders the creation of new types of weapons.\nThis dead weight needs to be shed."
 GTR_event.37.a: "Science is above these prejudices."

 GTR_event.38.t: "The First Mind"
 GTR_event.38.desc: "Thanks to Golfball's rigorous reforms aimed at supporting the scientific field and transforming the Technocratic Republic into a fully-fledged state with a self-defense force capable of defending itself, Golfball has gained enormous support. The time has come to finally prioritize scientific development for the Republic!"
 GTR_event.38.a: "Long live The Science!"

 GTR_event.39.t: "Stomach Question"
 GTR_event.39.desc: "- \"Won't taking this junk. Give me real money, or get out!\"\n\nLife in Announcergrad revived after the Republic was declared. Transportation was restored, and numerous new businesses opened. They even began printing their own currency. But, unfortunately, growing pains are inevitable.\n\n- \"Knock-knock, four-eyes, you hear me?=\"\n- \"This is all I have. Please, I need to feed my daughter.\"\n\nThe family is struggling to survive on rations, even though they've expanded significantly in recent months. A black market is thriving in the back alleys of Announcergrad.\n\n- \"You don't understand?\"\nThe fist whistled through the air.\n\nProfessors are paid primarily in ration cards, but they are also given foreign currency. However, this is not yet in circulation.\n\n- \"I'll pay for them.\"\nAn object comes out of the queue.\n - \"Carton? My student?\""
 GTR_event.39.a: "- \"Don't worry, professor Geocache.\""

 GTR_event.40.t: "The Blueprints are Done!"
 GTR_event.40.desc: "Work on the plans for the new University is largely complete. Soon we'll be able to bring these projects to life, and the University will rise above Goiky even more brilliantly than before!"
 GTR_event.40.a: "Nice Job!"

 GTR_event.41.t: "The Professors are Collected!"
 GTR_event.41.desc: "We've managed to assemble the necessary personnel for the University's operations. Although they're young, few in number, and lacking the same experience as those died in the explosion, they have a bright future and will be able to make up for the losses of Goiky science!"
 GTR_event.41.a: "Good Luck, colleagues!"

 GTR_event.42.t: "The Construction is Done!"
 GTR_event.42.desc: "The incredible plans for the new University have been accomplished! The modern, gleaming buildings cast a glimmer of sunlight onto the once-destroyed campus. Now, the aftermath of the horrific explosion has vanished. All that remains is the grand opening!"
 GTR_event.42.a: "The Phoenix!"

 GTR_event.43.t: "Golfball Statue?"
 GTR_event.43.desc: "During the construction of the University, the idea arose among the engineers to glorify the First Mind of Goiky and place a statue of Golfball on the Campus. There are protests, but it is ultimately up to the government to resolve this issue.\n\nWhat will we decide?"
 GTR_event.43.a: "Let the project live!"
 GTR_event.43.b: "Our focus is better spent elsewhere." #added because i think player should be able to say no

 GTR_event.44.t: "Deeper in the Mud"
 GTR_event.44.desc: "The average life of a tank on the battlefield is 5 minutes. In the Campus area, an excavator can only lift soil consecutively for about 15 minutes.\n\nThe bravest and most honest objects of Announcergrad volunteered to work in the Campus area to renew the contaminated soil cover. Radiation and infection killed many. But they did it. The most difficult and dangerous task was successfully completed at the cost of these priceless lives."
 GTR_event.44.a: "True Heroes."

 GTR_event.45.t: "Fair Wind"
 GTR_event.45.desc: "A pleasant northerly breeze enveloped Piney as she found herself at the main square of the Campus.\nThe perfect glass windows of the new buildings and classrooms reflected the midday sun. Directly ahead, a few dozen meters away, flowed the steady stream of a magnificent fountain.\n\nFascinating.\n\nThe buildings' pristine, clean walls were ready to bear the full weight of the work ahead. There were very few objects around for such a colossus of architecture and technology. She was one of the first to arrive, and the objects around her were no less surprised than Piney.\n\nHaving recovered from her amazement and found the building where her office was assigned, she saw the flags of the Young Technocratic Republic fluttering from the flagpoles in the calm trade winds. A guarantee of peace and stability in the corridors of this monstrous institution, the true flagship of all of Goiky.\nBut it is time to get to work."
 GTR_event.45.a: "Colleagues, We're Back!"

 GTR_event.46.t: "Changing The Capital?"
 GTR_event.46.desc: "With the University's restoration nearly complete, the question of returning the Council to this powerful academic institution has become pressing. Golfball fully supports the capital's return to the Campus, while Tennis Ball believes the administration has already established itself in Announcergrad and is a purely civilian structure.\n\nWhat will the Council decide?"
 GTR_event.46.a: "Back in The University!"
 GTR_event.46.b: "We stay in Announcergrad."

 GTR_event.47.t: "Administrator of The University"
 GTR_event.47.desc: "During the recruitment process for the new University, a dispute erupts between Golfball and Tennis Ball: Golfball nominates the militant, defense-focused Napalm for the University's administrator position, while Tennis Ball nominates Octahedron, who is interested in more peaceful research.\n\nWho will be the University Administrator?"
 GTR_event.47.a: "Napalm."
 GTR_event.47.b: "Octahedron."

 GTR_event.48.t: "1:3" 
 GTR_event.48.desc: "\"...The battles for the Greenland Plain once again confirm the thesis put forward two thousand years ago by the commander Rotatius: for a successful large-scale offensive against the enemy, it is necessary to have a numerical superiority in equipment and objects of *at least* three times.\"\n\nThe erudition of Cross, an elderly military historian and one of the few survivors of the University disaster, once again became useful in these dark times for Goiky.\n\n\"Looking at the tiny battalions of our border guards and seeing the military metamorphoses that are taking place today in Casland, it gives an unresistable urge to cry!\nIf The Technocracy wants to survive, we must redirect our resources to forming a full-scale army!\"\n\nThe conference room at the administration building in Announcergrad erupts in applause. Golfball rises from her chair."
 GTR_event.48.a: "\"You are UNARGUABLY right, mr. Cross!\""

 GTR_event.49.t: "Commission Report"
 GTR_event.49.desc: "...       CONCLUSION\n\nThe Commission concludes that the detonation of the above-described Mixture was associated with the instability of the outer electron shell of the phosphorus atoms, which created a chain reaction and led to the release of a enormous amount of energy.\nThe Commission was unable to obtain information about why the substance left a stable state, but the Commission put forward a hypothesis according to which the disintegration of atoms occurred as a result of the action of some catalyst, which is still unknown to modern science..."
 GTR_event.49.a: "Continue the observations."

 GTR_event.50.t: "Shine in the Sky"
 GTR_event.50.desc: "Telescopes have recorded the fall of an unknown celestial body near the University. It appears to be a meteorite, approximately a hundred meters in diameter. During the search, a large mineral object was discovered, 58.8% of which, according to spectrographs, is composed of an extremely rare metal called yoylite.\nObviously, we will be able to use yoylite samples for our experiments."
 GTR_event.50.a: "Right in our hands!"

 GTR_event.51.t: "Disorder"
 GTR_event.51.desc: "...            EXPERIMENT No. 1\n\nAfter delivering the mineral samples to the equipped laboratory, Professor ------ attempted to pick up one of the active elements. According to surveillance footage, after a few seconds, the sample began to emit a light yellow glow, after which loose objects in the surrounding area were lifted approximately 10 centimeters into the air.\nAfter 10-15 seconds the effect stopped and all the levitating objects fell back down.\nProfessor ------ was charged with violating safety regulations."
 GTR_event.51.a: "This thing seems unstable."

 GTR_event.52.t: "Deja vu"
 GTR_event.52.desc: "...            EXPERIMENT No. 2\n\nAfter moving the samples into a specially equipped chamber, experiments were conducted on their interaction with other elements and substances. The samples generally performed reliably, but in one test, specifically with the parasitic fungus called Noctiluca Yoylean, a sharp spike in luminescent activity was recorded, followed by a bright flash illuminating the entire observation room.\nA large energy release occurred and the sample was destroyed, but thanks to the fact that the chamber was equipped with tungsten alloys, the lives of the observing professors were saved.\nProfessor ---- claimed to have seen her long-dead mother."
 GTR_event.52.a: "Unrestrictable potential."

 GTR_event.53.t: "Half-life"
 GTR_event.53.desc: "...            EXPERIMENT No. 3\n\nAfter studying the instability properties of the samples, the council decided to attempt to create a simple reactor for the controlled disintegration of yoylite atoms.\nSilicon oxide was used as a moderator for the emitted neutrons, and the sample was placed in a lead chamber.\nAs a result of observations of the energy release, it was found that one gram of yoylite has an energy value equivalent to 2000 tons of coal...."
 GTR_event.53.a: "Is a controlled explosion possible?..."

 GTR_event.54.t: "Air Resistance"
 GTR_event.54.desc: "It had long since darkened outside, but Tennis Ball had been sitting for hours, working on his drawings. Gravity, aerodynamics, engine power, and the numbers in his head were neatly organized, like a library. But he was also open to more abstract thoughts.\nHe admired the beauty and elegance of aviation, how huge machines made of aluminum and stainless steel gracefully soared, towering tens of kilometers above the earth.\nBut he returns to work again."
 GTR_event.54.a: "Spreading The Wings."

 GTR_event.55.t: "The Launch"
 GTR_event.55.desc: "The Deadland expanses encompass a small portion of the Greeny Plains to the south, formed by the transition to the rolling plateau. Due to strong winds and low humidity, this part of the plains was never inhabited; only occasional transports passed through.\n\nThis is the place chosen for the Event of today.\n\nTennis Ball looked out of the slit windows of the smooth concrete bunker onto the peaceful plain that stretched out.\n\"We have to disturb this land.\".\n\nWhen a blaze of light, brighter than a thousand suns, rose above the heights, he involuntarily uttered:"
 GTR_event.55.a: "\"I am become Death, the destroyer of worlds.\""

 GTR_event.56.t: "Dream of the Stars"
 GTR_event.56.desc: "The blue of the gloomy sky again enveloped all the thoughts of Uranus. The longer he looked into the vast expanses of space, the more clearly he saw the white crumbs of scattered stars forming a sieve of millions-year-old constellations.\n\nUranus was assigned to a new secret project in the University's engineering committee. After he found out the details, he began to look at the stars differently. They are no longer unattainable deities, eating you through the glasses of the stratosphere.\n\nThey became the goal.\nThe goal that must be achieved."
 GTR_event.56.a: "We'll light up our own stars!"

 GTR_event.57.t: "The Big Day"
 GTR_event.57.desc: "It's the hardest to blaze uncharted trails through the surrounding reality for pioneers. This is not really a secret. But today, the stakes are especially high.\n\nEverything was accomplished very quickly: in just a few months, the testing ground was set up, the launch pad was excavated, and a brand-new observation post was established just a few kilometers from the gleaming rocket. Everything around appears calm, but this calm is only an illusion created by the surrounding nature.\nInside this small building with its clear glass windows, the nerves of objects here are on edge. They've worked long and hard on this masterpiece of science and technology, but none of them are confident of the operation's success.\nThere, on the horizon, inside this iron leviathan, about to soar toward the constellations, are real objects. Everyone fears for their lives.\nThe tension here can be used as a spreding on a bread.\n\nThe hum of a radio transmitter.\n\"Grapes, it's Cherries, I'm ready for the takeoff, Grapes.\"\n\nFinally, Golfball's calm voice raises its sharpened sword:"
 GTR_event.57.a: "\"Start the Countdown!\""

 GTR_event.58.t: "Crew Returns!"
 GTR_event.58.desc: "The entire astronaut team successfully landed in the Goiky Ocean and managed to return to our territory. Recordings of the lunar surface were obtained, and the flag of our Technocracy was planted on the satellite itself!\nThis unprecedented victory for our science will go down in Goiky's history as one of its most striking pages, despite the anarchy and chaos surrounding this great event..."
 GTR_event.58.a: "The Future is Calling!"

 GTR_event.59.t: "The Tragedy of \"Cherries\""
 GTR_event.59.desc: "As a result of tragic miscalculations, our space mission failed. This seriously damaged morale among the professors and the team. But this is not the end. Not all projects, and not all great deeds, are accomplished on the first try. We will definitely return to this plan, even more prepared and experienced. In the meantime, let's remember the heroic \"Cherrys\" team, which proved to be pioneers in the conquest of space, even if they didn't quite reach its heights..."
 GTR_event.59.a: "The Future is Calling!"

 GTR_event.60.t: "Operation \"Bridgecrossing\""
 GTR_event.60.desc: "\"...and now, let's get to the details.\"\n\nGolfball and Tennis Ball sat in a quiet, even modest conference room, where the agenda was being discussed on a topic that was completely unfittable for its setting.\n\n\"So, the ship will consist of three main, so to speak, \"parts\": a shuttle, where three crew members will be located; a fuel tank, which will contain the energy source for the engine; and the engine itself, which will keep the ship moving and direct it to its final destination - the Moon.\"\n\nShort applause.\n\n\"But, as we know, the devil hides in the details, and we have never had such an extreme experience in the history of engineering, so we will have to experiment...\""
 GTR_event.60.a: "Let's get to work."

 GTR_event.61.t: "Stability"
 GTR_event.61.desc: "It seems that during the internal political reforms, neither side has been able to seize the initiative. The old friendship remains strong, and Golfball and Tennis Ball continue to rule the Technocratic Republic together. Seems like it's just their fate."
 GTR_event.61.a: "TB, GB, sitting on a tree..."

 GTR_event.62.t: "Fire"
 GTR_event.62.desc: "An accident occurred on the streets of Announcergrad, bringing down a power line on several houses, causing fire. Many buildings were damaged and objects left homeless. Tennis Ball believes they need to immediately allocate funds from the reserve fund, while Golfball speaks of the Republic's long-term goals and that these funds will still be needed. What will the Council decide?"
 GTR_event.62.a: "Give them money!"
 GTR_event.62.b: "We'll need these funds later."

 GTR_event.63.t: "Fall of Casland"
 GTR_event.63.desc: "Unfortunately, the government in Casland has suffered a defeat. A completely unfriendly regime has taken hold in the heart of Goiky, and we cannot continue to cooperate. The Technocracy will once again be forced to act alone."
 GTR_event.63.a: "Well."

#NEWS
 bfdinews.1.t: "Firey won Dream Island!"
 bfdinews.1.desc: "After two years of competition, Battle For Dream Island is coming to an end. According to the results of the final vote, the winner was ... Firey! Coiny collapsed as a result. This news has already excited the public and caused considerable resentment in Goiky's society. Leaks also report that Firey allowed everyone on the island except Leafy, his best friend. The reasons are not yet known, but we are monitoring developments.."
 bfdinews.1.a: "Hate is popularity too."
 
 bfdinews.2.t: "DREAM ISLAND HAS BEEN STOLEN!"
 bfdinews.2.desc: "                          GOIKY NEWS: SPECIAL RELEASE\nAccording to our sources from the western regions, the Dream Island, the battle for which has been continuously going on for 2 years in a row, has disappeared without a trace. According to original statements, the island was bought by Leafy, who probably hid in the evil forest. Who allowed this illegal operation to be carried out and where the money was taken from is still unknown. At this time, riots swept almost the entire continent and local cities plunged into chaos. Goiky News will follow developments."
 bfdinews.2.a: "Craziness!"
 
 bfdinews.3.t: "Battle for Socialism"
 bfdinews.3.desc: "'Battle for Socialism' is an object show that was recently launched at the NGRF Captial for the purpose of propaganda work with the population. Unlike BFDI, this show promotes the ideas of cooperation, the participants do not compete with each other, but, on the contrary, cooperate in order to achieve the goal and resist the reactionaries."
 bfdinews.3.a: "Interesting."
 
 bfdinews.4.t: "Revolutionary Manifesto"
 bfdinews.4.desc: "In the new work 'Revolutionary Manifesto', the ideologists of the North Goiky Revolutionary Front announced the 'inevitable export of the revolution and its spread to the whole of Goiky'. Neighboring NGRF regimes have already regarded this as a threat and are preparing their militias."
 bfdinews.4.a: "Firey has come far."
 bfdinews.4.b: "Reactionaries tremble in fear!"
 
 bfdinews.5.t: "North Goiky expedition!"
 bfdinews.5.desc: "Good morning, dear listeners! Interesting news came from North-Goikyland: A group of pioneering expeditioners of two hundred objects set sail from there and went to North Goiky straight across the canal. Their goal is to explore the coastal regions of the continent. That's all we know for now, but we'll keep an eye on this interesting research."
 bfdinews.5.a: "Good luck."
 
 bfdinews.6.t: "Proclamation of a Socialist Republic"
 bfdinews.6.desc: "Important News: A few weeks after the defeat of the Military District and after the Red Army had established control over the Cary Peninsula, Firey announced the creation of the Goiky Socialist Republic. This is a new page in the history of Northern Goiky and a new stage in the advancement of the 'all-goikean revolution'. Will the new republic fail or will it successfully spread its influence throughout the continent?"
 bfdinews.6.a: "To the future."
 
 bfdinews.7.t: "Collapse of the Snowy Plateau!"
 bfdinews.7.desc: "Interesting news came from the Snowy Plains: The local dictatorship couldn't withstand the blows of the resistance and collapsed into fragments and self-proclaimed governments. Most likely, this will entail a serious blow to the entire cultural and national identity of the Snowy Plateau objects. In any case, our editors continue to follow developments."
 bfdinews.7.a: "Dark times."
 
 bfdinews.8.t: "Invasion of the Snowy Forest!"
 bfdinews.8.desc: "The atmosphere in the Snowy Plateau had been heating up for several years, and now: the Reich Army crossed the border of the Snowy Forest with the aim of clearing it of Anarchists. So far the details are not clear, but most likely the war will be difficult and prolonged for both sides."
 bfdinews.8.a: "Freedom and Order collide."
 
 bfdinews.9.t: "The anarchists of the Snowy Plateau are defeated!"
 bfdinews.9.desc: "Breaking news: The Reich's armed forces have recently completed clearing the Snowy Forest of anarchist forces, and although they still have combat-ready units, they are unlikely to ever be able to recover. Although the anarchist objects claim they will continue to resist for many years to come, they have been defeated for now."
 bfdinews.9.a: "Order was established in the Snowy Plateau."
 
 bfdinews.10.t: "Crisis in Casland"
 bfdinews.10.desc: "Important news came from the Provisional Government: The head of the transitional regime, Clock, was killed by a left-wing activist! This further aggravated the political crisis in the state and factionalism in Casland's life ceased to know boundaries. The cabinet will have to do a lot of work to maintain stability."
 bfdinews.10.a: "And all of Goiky held its breath."
 bfdinews.10.b: "We will count on the victory of the socialists."
 bfdinews.10.c: "We will support our right-wing friends."
 bfdinews.10.d: "The Democratic faction must win at all costs."
 bfdinews.10.e: "Heart in Crisis."
 
 bfdinews.11.t: "Proclamation of the Goiky Republic!"
 bfdinews.11.desc: "A few hours ago, in Casland, the cabinet head approved the constitution of the Goiky Republic. The interim government has been in crisis for a long time, but it appears to be coming to an end and stability is once again being established in the center of Goiky. But for now, nothing else can be said. We will monitor developments."
 bfdinews.11.a: "Long live united Goiky!"
 bfdinews.11.b: "Stability comes to Casland."
 
 bfdinews.12.t: "Collapse of the provisional government!"
 bfdinews.12.desc: "Disturbing news comes from Casland. As a result of the conflict in the cabinet, the congress of objects of the Transitional Government of Goiky collapsed and ceased its work, and the outskirts of the state were occupied by military formations of factions. This is likely the end of the short-lived truce between the parties."
 bfdinews.12.a: "Mobilize all available forces!"
 bfdinews.12.b: "Dark times."
 
 bfdinews.13.t: "Christmas in Goiky"
 bfdinews.13.desc: "Along with the first snow, Christmas comes to the Greeny Plains. The Casland objects gather together and celebrate joyfully. The roar of fireworks and laughter can be heard from all corners of Goiky. In connection with this event, our redaction congratulates you and wishes you a happy New Year!"
 bfdinews.13.a: "Happy New Year!"
 
 bfdinews.14.t: "RCC arson!"
 bfdinews.14.desc: "News from Casland: Yesterday the building of the Recommended Characters Council caught fire. The government cabinet immediately blamed the Toilers Front cell for the arson, and a member of the local Communist Party with a party card was detained on the spot. The investigation is ongoing and we will monitor developments."
 bfdinews.14.a: "Provocation!"
 bfdinews.14.b: "We'll see."
 
 bfdinews.15.t: "Civil war hits Casland"
 bfdinews.15.desc: "According to several eyewitness reports, the Provisional Government, which resided over the capital of Old Goiky, Casland, has all but retreated from the area. Its many factions have broken off, declaring their own separate, sovereign states, all claiming to be the true successor to Old Goiky. Additionally, these factions have declared states of war, though, violence between the factions had been going on since the assassination of Clock. It's hard to say what the outcome of this situation may be, but what we do know is that Casland, and the surrounding areas, are not safe. We predict large refugee populations migrating to nearby states, and urge all of Goiky to aid these groups as they see fit."
 bfdinews.15.a: "The fragments shatter again."
 bfdinews.15.b: "Casland must be ours!"
 
 bfdinews.16.t: "End of the Civil War!"
 bfdinews.16.desc: "After days of devastating fighting, the Provisional Government managed to regain control over its territories and suppress uprisings on the outskirts. Although this is not the end yet, it is already a big step towards restoring stability in the region."
 bfdinews.16.a: "Interesting."
 bfdinews.16.b: "Casland secured."
 
 bfdinews.17.t: "Casland Democratization!"
 bfdinews.17.desc: "As a result of fierce fighting in Casland and its suburbs, the Democratic Faction was able to destroy its opponents and restore stability. Yesterday Taco, as a representative of the new government, said: 'The goal of the new government is to create a unified democratic state throughout the entire South Goiky.'"
 bfdinews.17.a: "Will it work out?"
 bfdinews.17.b: "Casland secured."
 bfdinews.17.c: "Excellent news!"
 
 bfdinews.18.t: "Socialism in Casland!"
 bfdinews.18.desc: "Following a brutal civil war in the heart of Goiky, the mine workers under the leadership of the Toilers Front managed to destroy their opponents and establish a 'dictatorship of the proletariat' throughout the territory of the former Provisional Government. This has already greatly alarmed all the neighbors of the new state, but so far the foreign policy course of the local government remains unclear."
 bfdinews.18.a: "We'll see."
 bfdinews.18.b: "Casland secured."
 bfdinews.18.c: "Excellent news!"
 
 bfdinews.19.t: "National Ressurection"
 bfdinews.19.desc: "The fighting in the Casland areas had almost died down, and a clear winner was visible. Thanks to its deep militarization, the Iron Hand was able to destroy its opponents and establish strict power over all the territories of the former transitional regime. The aggressive intentions of the new regime have already become obvious to all its neighbors."
 bfdinews.19.a: "Creepy."
 bfdinews.19.b: "Casland secured."
 bfdinews.19.c: "Excellent news!"
 
 bfdinews.20.t: "Tensions in Greeny Plains!"
 bfdinews.20.desc: "As a result of the instability in Casland, the Greeny Plains Republic annexed the border areas and the city of Lawnland in order to protect its borders. Now, with the restoration of a stable government in the heartland of Goiky, there is a significant deterioration in relations between the governments. Negotiations on the region are likely to begin soon."
 bfdinews.20.a: "Hope that there will be no war."
 bfdinews.20.b: "A stake of the future has arrived."
 
 bfdinews.21.t: "Anarchists take power in Casland!"
 bfdinews.21.desc: "After the victory of the Toilers Front in the civil war in the Greeny Plains, the idea that stability had finally arrived in the region was firmly established. But suddenly, news spread across the continent: rebellious unknown militants, with enormous numerical superiority, swept away the Ruby regime and declared an 'anarchic system'. So far, nothing is known about the new government, and the atmosphere in the heart of the region is tense. We will monitor developments."
 bfdinews.21.a: "Another split?"
 bfdinews.21.b: "To prosperity!"
 
 bfdinews.22.t: "Greeny Plains in flames!"
 bfdinews.22.desc: "Important news! Casland regime forces have crossed the Republic border and attacked troops in occupied Lawnland! Mobilization has been announced in Greenport. Match called the act of aggression 'a, like, ugly thing to do' and the government declared a state of emergency. Apparently, the war will be prolonged and bloody. No information from Casland side."
 bfdinews.22.a: "The fate of Central Goiky hangs in the balance."
 bfdinews.22.b: "Liberty or Death!"
 bfdinews.22.c: "And objects are dying again."
 
 bfdinews.23.t: "Esoterics in Casland"
 bfdinews.23.desc: "After the victory of the Iron Hand in the civil war, many expected anything, but surely no one expected this. According to the meager information from the local government, it declared itself “a successor of the Great Yoyleland Race” and threatened all “traitors and degenerates” with complete annihilation. The news from Casland is becoming increasingly radical, and this is alarming."
 bfdinews.23.a: "Yoyleland?"
 bfdinews.23.b: "Yoyleland!"
 
 bfdinews.24.t: "Pin's Coronation"
 bfdinews.24.desc: "Interesting news came the other day from St. Objectburg. The local government, formed from the fleet command, announced Pin's ascension to the self-declared throne. She had already accepted the title and became the first monarch in Goiky's history. So far, the sentiments of neighboring governments are neutral, but we will continue to monitor developments."
 bfdinews.24.a: "Monarchy? In Goiky?"
 
 bfdinews.25.t: "Declaration of the Greeny Plains Federation!"
 bfdinews.25.desc: "This morning our correspondent from Casland brought the important news about the results of the Democratic Congress: the governments of Greenport and Casland are uniting into an equal democratic union! This significantly changes the balance of power in the entire region, and perhaps the Federation will spread to other countries."
 bfdinews.25.a: "Objects are united, again."

 bfdinews.26.t: "Conflict in the South!"
 bfdinews.26.desc: "Reports have flooded in that forces under the Yellow Face Corporation have crossed the de facto border between themselves and Eraser's Bunch and entered the lands controlled by the bandits! A correspondent from the corporation has reported that \"the socialist bandits\" will be removed from the lands in \"ideological clensing operations\" in the interests of \"international capital.\" We are also getting reports that the Numismatian Senate has began debating on whether or not they should get involved. For now, it's unclear who will win, but it is believed that the unorganized bandits will end up lyosing in a protracted war; if they move swiftly, however, the bandits have the chance to gain the upper hand."
 bfdinews.26.a: "Eyes on the prize."
 bfdinews.26.b: "How dare they!"
 bfdinews.26.c: "Interesting times..."
 
 bfdinews.27.t: "Goiky University in shambles!"
 bfdinews.27.desc: "Breaking news from the frenzied city of Announcergrad! It appears the population of the starving city has revolted and razed the continent's largest university to the ground. Nothing exact is known yet, but it's already terrifying. Our correspondents will continue to monitor developments."
 bfdinews.27.a: "..."
 bfdinews.27.b: "Tragic."
 
 bfdinews.28.t: "Explosion in University!"
 bfdinews.28.desc: "Our correspondents from Central Goiky report on the aftermath of the accident that occurred near Announcergrad! A mushroom cloud of smoke several miles high was reportedly visible from the town to the south, and windows were blown out in the town. The number of casualties is unknown at this time, but we will continue to monitor the situation."
 bfdinews.28.a: "Hopes dropped to 0.000%."
 bfdinews.28.b: "A lot of dead, it seems."

 bfdinews.29.t: "Proclamation of the Technocratic Republic!"
 bfdinews.29.desc: "We're getting interesting news from Announcergrad, that recently suffered massive calaclysm. The restored administration of the Goiky University after eliminating the worst concequences of the crisis, has proclaimed 'The Technocratic Republic, based on the eternal march of the technological progress'. Announcergrad objects, according to our journalists, mostly support the new government formation. We'll keep monitoring the development of the situation in Announcergrad."
 bfdinews.29.a: "I will NOT let anyone else decide the future!"
 bfdinews.29.b: "Golfball actually did it?"

 bfdinews.30.t: "Grand Opening of the University!"
 bfdinews.30.desc: "Our correspondents in Announcergrad recorded a widespread upsurge in the mood of the \"Technocratic Republic's\" objects: the lengthy and expensive project to restore the glorious South Goiky University has proven successful. Our journalists were able to take a look at the newly erected buildings of Goikean alma mater, and they truly look simply marvelous!\nThis will most likely greatly strengthen the position of the newly formed state in the political arena of Goiky and will revive all scientific activity on the continent, unless, of course, the government decides to leave the University in an isolated state."
 bfdinews.30.a: "What a great news!"

 bfdinews.31.t: "Meteorite In Goiky!"
 bfdinews.31.desc: "Last night, a bright white comet was spotted over the Greeny Plains, which, according to eyewitnesses, landed somewhere near the city of Announcergrad. As far as we know, no one was injured, but the shockwave damaged some local infrastructure. The composition and origins of the meteorite are both still unknown, though rumors suggest it consists of a very rare material. We will continue to follow the events surrounding this incident."
 bfdinews.31.a: "The Symbol of Hope."

 bfdinews.32.t: "Testing of the New Bomb!"
 bfdinews.32.desc: "Breaking news is coming in from all over the Greeny Plains: it appears the government of the \"Technocratic Republic\" has tested a new type of weapon. The blast wave reached the borders of Casland, and the flash in the sky was visible even from Centrogoiky. If this is truly a new type of weapon, it will turn the entire situation in Goiky upside down: a bomb of such power would likely be capable of wiping out entire cities!\nOur editorial team is very concerned about such news and will continue to monitor developments."
 bfdinews.32.a: "Such power..."
 bfdinews.32.b: "The stakes are rising."

 bfdinews.33.t: "Space Flight!"
 bfdinews.33.desc: "Our correspondents captured unique footage from the launch pad at the \"Dimples\" test site: for the first time in Goiky's history, objects have successfully crossed the stratosphere and soared into space! This astonishing project was made possible thanks to the restoration of Goiky University and the enormous financial investment of the Technocratic Republic's government.\nIt appears the shuttle is heading directly for the Moon. It's still unclear when the astronauts will return to Earth, but it's already clear that this will upend the entire arms race between the surrounding nations."
 bfdinews.33.a: "One step for <an> object..."

 bfdinews.34.t: "Space Flight Tragically Failed!"
 bfdinews.34.desc: "Tragic news is coming from the Technocratic Republic: it appears the launch of a long-developed space rocket has ended in disaster. Most likely, an accident occurred during the launch mechanism, and the fuel detonated, causing a massive explosion and killing the entire crew. This will seriously undermine the prestige of the Goiky University and the Technocratic Republic in the scientific race with other nations. We will continue to monitor news surrounding this tragic event."
 bfdinews.34.a: "The first step is always troublesome."
 bfdinews.34.b: "Too fast it seems."

 bfdinews.35.t: "Davidland Economy Crash!"
 bfdinews.35.desc: "The collapse of economic and political ties in South Goiky now repercussions beyond the continent: the Goikean Trading Company, a key player in the entire Davidland economy, effectively stopped its existance. Due to the disruption of logistical links and the deteriorating situation in the main export regions of Goiky, the company was unable to fulfill its futures contracts, and its shares plummeted to near zero. A large number of banks declared bankruptcy, unable to meet their deposit obligations. This is causing enormous discontent among the people and will likely undermine the centuries-old monarchy..."
 bfdinews.35.a: "Aw, seriously?"

 bfdinews.36.t: "The Northern War!"
 bfdinews.36.desc: "According to military correspondence, several hours ago, Revolutionary Front troops crossed the neutral zone and attacked border outposts in the Goiky Canal Military District. Unlike previous armed clashes, this one appears to be on a scale ten times larger and will likely escalate into a full-scale war. Events are unfolding rapidly, and the potential outcome of this conflict cannot yet be determined. We will continue to monitor the escalation of the situation."
 bfdinews.36.a: "The flame is smoldering."
 bfdinews.36.b: "Forwards!"
 bfdinews.36.c: "Uh Oh."

 bfdinews.37.t: "Flute Tours Goiky!"
 bfdinews.37.desc: "The continent-famous composer, who has already made history with his legendary \"Truth of a Legend\" and \"Frost Waltz\", has announced a massive tour with his entire orchestra throughout cities and towns of Goiky! Nearly everywhere, theaters are brimming with queues of objects eager to snag a ticket, even though the announced performance date in many cities is still months away! Tickets in Casland and Greenport are already sold out! Goiky hasn't seen such excitement in a long time. We wish this talented artist the best of luck."
 bfdinews.37.a: "Sounds familiar."

 bfdinews.38.t: "[FROM.GetName] Declares Bankruptcy!"
 bfdinews.38.desc: "Well, it seems that the [FROM.GetAdjective] government announced its inability to pay its debt obligations and adopted strict anti-crisis measures. It seems the economy in the vast expanses of the new, anarchic Goiky hasn't yet fully got on its own grip, and this is currently impacting the lives of many objects around. Our team also predicts further financial unrest amid similar events..."
 bfdinews.38.a: "Terrible!"
 bfdinews.38.b: "Their collapse is near!"
 bfdinews.38.c: "Unique developments."

 bfdinews.39.t: "Formation of The Three Musketeers!"
 bfdinews.39.desc: "Interesting news has been reported from South Goiky. The nations of Yellow Face, Numismatia, and the newly formed Bunch Republic have created an economic and defense alliance! Yellow Face has stated that the goal is to create economic growth throughout all of Goiky. Only time will tell if the three will stay united, but the balance of power has been changed in Southern Goiky."
 bfdinews.39.a: "To the future!"
 bfdinews.39.b: "They think this will stop us?" 
 bfdinews.39.c: "Interesting..."

 bfdinews.40.t: "Formation of the Goiky Trade League!"
 bfdinews.40.desc: "Interesting news has arrived from South Goiky. A few months after the defeat of the Bandits led by Eraser, the governments of Yellow Face and Numismatia have an economic and defense alliance! Yellow Face has stated that the goal is to create economic growth throughout all of Goiky. Only time will tell if this faction will hold, but a new strong presence has formed in the South!"
 bfdinews.40.a: "To the future!"
 bfdinews.40.b: "They think this will stop us?" 
 bfdinews.40.c: "Interesting..."

 bfdinews.41.t: "Numismatia - Yellow Face Split!"
 bfdinews.41.desc: "Officials from Numismatia have denounced The Yellow Face Corporation for allegedly working with the Southern bandits. This report comes with evidence including trade deals and new routes between the Company and bandits. It should be noted that clashes between the two have also calmed down making the once de facto border seem more official. We have yet to hear from Yellow Face about this matter. Numismatia has called on other nations to quit working with Yellow Face on this matter. Could this be the quick end for the Company?"
 bfdinews.41.a: "Really now!?"
 bfdinews.41.b: "Just to think we could have worked together..." 
 bfdinews.41.c: "Maybe we should cut trade..."
 bfdinews.41.d: "This could work..."

 bfdinews.42.t: "Bandits Unite!" #ZDubbz if you want to
 bfdinews.42.desc: "One of our remaining correspondents has reported the creation of a military and economic alliance in the South. Created by The Yellow Face Corporation, now self renamed to Yellow Face Raiders, and Eraser's Bunch, the alliance calls itself the 'Bandit Pack'. While its goals are unclear, it seems to wish great profit to themselves by the destruction of its neighbors. Yellow Face blamed both neighbors and his own staff of having to reach this stage. We will keep reporting as the two start making more serious moves... "
 bfdinews.42.a: "Take the backstabbers' wealth!" #YFC/BUN
 bfdinews.42.b: "A storm is brewing..." #Neighbors
 bfdinews.42.c: "A storm grows in the South." #Anyone else

 bfdinews.43.t: "Top Hat Takeover!" #if you want to bro i already wrote this ToT
 bfdinews.43.desc: "Though most of our on-the-ground reporters had fled Footpathburg during and after the reported turmoil in the area, the few remaining news objects have communicated that, apparently, Yellow Face has been entirely ousted from power in the area, his company having fallen with him. They claim that one particular object, Top Hat, who was at the head of the operation to oust Yellow Face, as well as one of the corporate executives in the Yellow Face Corporation, has proclaimed the new leadership to be the 'Top Hat Clan,' and is seeking to integrate itself into the wider Goikean economy, like its predecessor once had done. Top Hat claims that the Top Hat Clan is nothing like the 'barbaric corporation of the past,'' and is instead focused on the common economic development of Goiky. Only time will tell what this new group will be doing in and around the continent, but, we can only provide more updates as to what goes on in Footpathburg, for the time being, as speculation is near-impossible at the onset of a political organization."
 bfdinews.43.a: "Free at last!" #YFC
 bfdinews.43.b: "What?! WHAT?!" #BUN
 bfdinews.43.c: "What do they even sell?" #Anyone else
 bfdinews.43.d: "Just another bourgeois political grouping." #Communism
 bfdinews.43.e: "Purple, a great choice!" #GFG

# bfdinews_cities

 bfdinews_cities.1.t: "GREENPORT OVERRUN!"
 bfdinews_cities.1.desc: "As of [?global.date.GetDateStringNoHourLong] reports from local civilians living inside Greenport, an important center of trade, have fallen under [193.controller.GetName] control. The invading forces went street by street clearing out the city and its defenders. The final stand of the defenders came around the port, where boats evacuated civilians, soldiers, and the government before being overrun. The sounds of battle have ended in the city, but a new flag has risen."
 bfdinews_cities.1.a: "An Alliance, broken."
 bfdinews_cities.1.b: "Matchy what did you do!?"
 bfdinews_cities.1.c: "Divided they fall!"

 bfdinews_cities.2.t: "FALL OF PODGORNYV!"
 bfdinews_cities.2.desc: "The [85.controller.GetName] government reported that on [?global.date.GetDateStringNoHourLong], local bandit forces fled the town of Podgornyv after a small engagement. Bandits had rallied to stop the invaders, but after a few engagements the bandits were too disorganized to defend Podgornyv. The attackers entered the town and after a few hours, took control. Key Bandit leaders have been reported missing, but stated that the war is not over. Regardless, the loss of the major town has a major effect on the course of the war."
 bfdinews_cities.2.a: "The Pillagers were pillaged..."
 bfdinews_cities.2.b: "There is an emergency button right?"
 bfdinews_cities.2.c: "Down with the Bandits!"

 bfdinews_cities.3.t: "FALL OF NORTH-GOIKYLAND!"
 bfdinews_cities.3.desc: "While gunfire is still ringing out inside the North-Goikyland, the flag of [177.controller.GetName] has now been raised over the main government building. The socialist forces, led by Firey, had been pushed into the city after defeats in battle. With the outer defence line broken, fighting entered the streets. The defenders fought house by house to blunt the attacker's advances. Despite all efforts, [?global.date.GetDateStringNoHourLong] is the believed time where over 95% of the city is in the attacker's hands. Firey's whereabouts are still unknown."
 bfdinews_cities.3.a: "The flame is dying..."
 bfdinews_cities.3.b: "*Internal and external screaming*"
 bfdinews_cities.3.c: "The flames have been stomped!"

 bfdinews_cities.4.t: "CARY SEIZED!"
 bfdinews_cities.4.desc: "Cary, the center of Coiny's dictatorship, has been taken by forces under the [173.controller.GetName]. With the battle soon to arrive after defeats near the city, the defenders prepared by setting up barricades, trenches, and obstacles to stop the invader's advance. The street battle proved fierce, as much of the city was destroyed in the fighting. The defenders slowly lost ground and were soon pushed into small pockets of resistance. With the main being around the military HQ that surprisingly held Coiny. At[GetDateText], Coiny ordered the remnants of a once great army to surrender. The streets are now fairly quiet, but a new emotion is felt in the ruined city."
 bfdinews_cities.4.a: "Such a way to end..."
 bfdinews_cities.4.b: "At least the bloodshed ends..."
 bfdinews_cities.4.c: "Merely a paper tiger..."

 bfdinews_cities.5.t: "GORGE TOWN RAZED!"
 bfdinews_cities.5.desc: "Panic reports have arrived that not only was Gorge Town taken by [169.controller.GetName] forces, but were also set on fire on [?global.date.GetDateStringNoHourLong]. The town was the center of Snowy Anarchists and the objects prepared for a defence. As the invaders entered the town, they were attacked by defenders using guerrilla warfare and ambushes. The attackers advanced slowly, clearing each house and each room. The attack took so long that the attackers opted to set the town on fire and also committed a series of murders on civilians. Both defenders and civilians evacuated the burning town. The fires have long since stopped, but the burns are still felt."
 bfdinews_cities.5.a: "Poor Objects..."
 bfdinews_cities.5.b: "Our Freedom is not yet lost!"
 bfdinews_cities.5.c: "We can claim excuses..."

 bfdinews_cities.6.t: "COLLAPSE OF FARAWAY!"
 bfdinews_cities.6.desc: "Fighting both around and inside Faraway has been reported to cease as either the defenders fled or were defeated by the [183.controller.GetName] government. Ice Cube, leading the 'revenge' like government, had rallied the defenders and civilians to fight over every street, house, and room over the city. This led to confusing battles where soldiers and civilians fought over the ruined streets. The most heated engagement came around the government building where it was blown to pieces by the invading attackers. Ice Cube is reported to have fled before the fall of the government building around [?global.date.GetDateStringNoHourLong], citing that 'revenge will come'. As of now, ash and debris still fill the hollow streets."
 bfdinews_cities.6.a: "Revenge against the Revenger..."
 bfdinews_cities.6.b: "I want more revenge!"
 bfdinews_cities.6.c: "Best served cold!"

 bfdinews_cities.7.t: "CAKE STAKED!"
 bfdinews_cities.7.desc: "Our reporter on the ground has reported that the city that held Cake at Stake when BFDI was still running, led by Robot Flower, has fallen to the advance of soldiers under the [175.controller.GetName]. The government had tried to reinforce the defences, but low morale had plagued the defenders. As the battle started on the outskirts, the Directorate, led by Robot Flower, fled the city. With this fleeing of the government, morale collapsed in the defenders and most of the city was taken without a fight. The final stand of the remaining defenders came around the Army HQ, where they managed to hold for days before surrendering on [?global.date.GetDateStringNoHourLong]. The Directorate has not stated anything after the fall of the capital, but the silence of a new way of life is felt inside the city."
 bfdinews_cities.7.a: "No Cake for them it seems..."
 bfdinews_cities.7.b: "How dare they give up so quickly?!"
 bfdinews_cities.7.c: "Run like cowards!"

 bfdinews_cities.8.t: "END OF CASLAND!"
 bfdinews_cities.8.desc: "Casland, the very heart of Goiky, had been taken by the flag of [206.controller.GetName] on [?global.date.GetDateStringNoHourLong]. [GPG.GetLeader] had held press statements before the battle that the city would be 'held at all costs'. The defenders had prepared to defend their homes with obstacles, strong points, and traps inside the city. The fighting was fierce and deadly with each house costing more blood to capture. However, the preparations were not enough to withstand the waves of attackers and were soon pushed into only a few key sections of the city. One of the last points to fall was the Recommended Characters Council, where the defenders fought to the very last object. The government itself is nowhere to be seen, but is believed to have fled."
 bfdinews_cities.8.a: "The very Heart, broken..."
 bfdinews_cities.8.b: "Being the Heart of Goiky was not enough..."
 bfdinews_cities.8.c: "The Heart is now ours!"

 bfdinews_cities.9.t: "END OF CASLAND!"
 bfdinews_cities.9.desc: "Fires still rage in the Casland, the heart of Goiky, as the city has been captured by the invading forces under the [206.controller.GetName] flag. Previous battles have led to this decisive engagement for the heart of Goiky. [GSR.GetLeader] knew this and had gathered a large force of both militia and soldiers for the defence. The fighting became a grinding battle where every part of the city taken by the attackers cost more and more lives to capture. As of [?global.date.GetDateStringNoHourLong], the government fled and only a few pockets remain in the city. The streets are still filled with the determination of a once great nation that is near its end."
 bfdinews_cities.9.a: "Red banners spilled with blood..."
 bfdinews_cities.9.b: "The workers can't fail us now!"
 bfdinews_cities.9.c: "The Red Heart is ours!"

 bfdinews_cities.10.t: "END OF CASLAND!"
 bfdinews_cities.10.desc: "The sounds of gunshots still ring in Casland, the heart of Goiky, as fighting is still ongoing. However, most major key areas have been captured by the invading forces on [?global.date.GetDateStringNoHourLong]. The government had rallied various objects to the key defence of the capital, with many rallying to the 'Order' cause. The attacking forces of the [206.controller.GetName] had a difficult time taking ground as each house and street were protected by defenders determined to die for their country. [GFG.GetLeader] had even been reported to be on the frontline a few times inspiring the defenders. Despite all efforts from the state, the city was taken by the attackers and the defenders are only left to a few pockets. With the government fleeing, is it the end of the Order like state?"
 bfdinews_cities.10.a: "Order was not restored, but taken..."
 bfdinews_cities.10.b: "I HATE failed defenses!"
 bfdinews_cities.10.c: "The Ordered Heart is ours!"

 bfdinews_cities.11.t: "END OF CASLAND!"
 bfdinews_cities.11.desc: "As of [?global.date.GetDateStringNoHourLong], Casland's defenders have surrendered to the advance of [206.controller.GetName] soldiers. The government had gathered forces and made preparations for key defences in the city. [GDR.GetLeader] had made statements that 'The heart of Goiky could not fall' and that 'we shall defend our homes!'. The fighting was fierce and desperate, where every part of the city was fought tooth and nail over. Major fighting came around the Lower House, where the building was taken by the attackers after being turned into ruins. Later the government fled and ordered those that had survived the battle to surrender. The lights of flames are still present in the city, but for a few days the beating heart has stopped."
 bfdinews_cities.11.a: "Freedom to live or die..."
 bfdinews_cities.11.b: "The best efforts were not to save it..."
 bfdinews_cities.11.c: "The 'Free' Heart is now ours!"

 bfdinews_cities.12.t: "LOOTING OF FOOTPATHBURG!"
 bfdinews_cities.12.desc: "While gunfire still rings out in the streets, it is clear that forces under the [201.controller.GetName] flag have captured a majority of the city. [YFC.GetLeader], head of the [YFC.GetName], had hired even more mercenaries to replace the losses from the war. Despite all efforts to throw more money into the war, their enemies reached the city. Fighting took place on every street as the invading army took captured block after block. During the chaos, many stores, banks, and even the HQ of Company itself were looted by the advancing army and civilians. [YFC.GetLeader] and the rest of the Higher Ups had reportedly fled the capital before it came under fire. For now, the once great center of trade has fallen into a state of anarchy as of [?global.date.GetDateStringNoHourLong]."
 bfdinews_cities.12.a: "Will the global market survive?"
 bfdinews_cities.12.b: "Is there anyone left to fire...?"
 bfdinews_cities.12.c: "Money will not solve your problems here!"

 bfdinews_cities.13.t: "FALL OF ANNOUNCERGRAD!"
 bfdinews_cities.13.desc: "Reports are chaotic and misleading, but it seems that as of [?global.date.GetDateStringNoHourLong], Announcergrad has fallen to the advance of [209.controller.GetName]. [GTR.GetLeader] had rallied any possible defenders inducing armed civilians after the defeats that had allowed the attackers to reach the city. As time went on, fighting had reached more into the city as the attackers had to clear street by street. As the council building came under fire, most of the government, inducing [GTR.GetLeader] had fled from the city. With the fall of the council building, most of the resistance has collapsed with only a few pockets holding on. With the loss of the major city, will the Technocratic Government hold on?"
 bfdinews_cities.13.a: "Grim situation."
 bfdinews_cities.13.b: "*Incoherent Screaming*"
 bfdinews_cities.13.c: "A central point in Goiky is now ours!"

 bfdinews_cities.14.t: "FALL OF THE GOIKY UNIVERSITY!"
 bfdinews_cities.14.desc: "[89.controller.GetName] had announced that on [?global.date.GetDateStringNoHourLong], The Goiky University, the center of technological advancement in Goiky, had been captured by their forces. As the attackers pushed closer to the University, [GTR.GetLeader] had made preparations to defend the University using fortifications and trenches. As the battle began, the attackers cleared trench after trench, then pushed into the outer buildings of the Campus. Fighting became brutal as the attackers had to clear building after building that housed defenders. As the clearing continued, Golf Ball's lab was cleared out using grenades and flamethrowers. Golf Ball was not there, having already fled. With most of the University captured, the defenders surrendered. With the smoldering ruins now being truly revealed, is this the end of the Technocratic Republic?"
 bfdinews_cities.14.a: "Technological developments are no more."
 bfdinews_cities.14.b: "Is the statue gone?"
 bfdinews_cities.14.c: "Their tech is for the taking!"

 bfdinews_cities.15.t: "FALL OF SCHNEEHORN!"
 bfdinews_cities.15.desc: "A [15.controller.GetAdjective] report from the front has announced on [?global.date.GetDateStringNoHourLong] the capitulation of all remaining Großgoikian forces in Schneehorn. After encircling the city, the attackers stormed it from several different directions, with the defenders resisting furiously every step of the way. Attacking troops finally fought their way into the parliament building, fighting room by room until they reached the roof where the [15.controller.GetAdjective] flag was raised over the city. The Battle of Schneehorn is over. Snowball is reported to have fled before the encirclement was completed, vowing to continue the fight. Will Großgoikysreich hold on or is this the end?"
 bfdinews_cities.15.a: "The oppression of the Snowy Plateau is no more. "
 bfdinews_cities.15.b: "A counter attack is coming!"
 bfdinews_cities.15.c: "The fascist lair is ours!"

#Bullshit

 DAV_lol_event.1.t: "Civil War Time"
 DAV_lol_event.1.desc: "Uh Oh! It seems that you were unable to fix the economy in three seconds and now the people are really MAD at you! (even though it would take months for this to happen) Anyways this group called Davidland Freedom Front took all the northern lands and now a civil war is here! Good luck :)"
 DAV_lol_event.1.a: "Wait... WHAT!?"