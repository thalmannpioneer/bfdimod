l_english:
 #COMMON
 common_event.1.t: "Bankruptcy"
 common_event.1.desc: "It seems our government is unable to pay off its debt. We are forced to declare insolvency until we pay off by our obligations. This will severely impact our economic potential."
 common_event.1.a: "Not the best leadership, it seems."

 common_event.2.t: "Crisis Ends"
 common_event.2.desc: "We have successfully paid off our bloated debts, and our economy can return to normal. Great job!"
 common_event.2.a: "Forwards!"

 common_event.3.t: "Money System"
 common_event.3.desc: "The economy in Troubles in Goiky works very simply! Money accumulates based on certain fixed parameters - the number of factories and population. Money is spent on some social policies - public education and medicine, as well as on additional game mechanics (e.g. decisions). If your balance goes deep negative, bankruptcy may occur. Try to avoid this.\nGood luck!"
 common_event.3.a: "Gotcha"

 common_event.4.t: "White Peace?"
 common_event.4.desc: "We have received a telegram from our enemy, [FROM.GetName]. They have asked for a white peace as no clear frontline that either side has to attack the other. With our inability to progress the war this could be our way out of the conflict. What is our official response?"
 common_event.4.a: "Agree to White Peace"
 common_event.4.b: "We have a plan to win!"

 SEC_event.1.t: "We Won!" #Bullshit, remove later
 SEC_event.1.desc: "In the border war we won, yay!"
 SEC_event.1.a: ":D"

 SEC_event.2.t: "We Lost!" #Bullshit, remove later
 SEC_event.2.desc: "In the border war we lost, fuck!"
 SEC_event.2.a: "D:"

 #GOIKY
 GOI_event.1.t: "Battle For Dream Island"
 GOI_event.1.desc: "BFDI, or Battle For Dream Island, is an internet show in which various objects compete for the ultimate prize - an Island with a hotel, two restaurants and other amenities. Recently, it has been gaining more and more popularity. But this show is far from the only thing that happens in the lands of Goiky. This continent is densely populated with various other objects and as a whole is a strong economic and social entity."
 GOI_event.1.a: "In the suspense."
 
 GOI_event.2.t: "Final-Four"
 GOI_event.2.desc: "With the elimination of Spongy, there are only four possible winners left: Firey, Leafy, Flower and Bubble. The passion for the show continues to run high and it even causes serious political unrest on the continent, which is very rare in Goiky."
 GOI_event.2.a: "Many won't like the winner."
 
 GOI_event.3.t: "Final Results"
 GOI_event.3.desc: "The votes are counted, possible stuffing is prevented, and in the end ... Firey came out the winner! Behind him in second place was Leafy, narrowly behind in the number of votes. The results have already been published, and the reaction of the public is not yet clear."
 GOI_event.3.a: "Well it looks like this is the end."
 
 GOI_event.4.t: "Celebrations"
 GOI_event.4.desc: "On the occasion of Firey's victory, celebrations were held on Dream Island. At this time, continental Goiky was torn apart by political conflicts. Simple dissatisfaction with the winner began to develop into real political manifestations and rallies. But the riots will go away on their own, right?"
 GOI_event.4.a: "Giant is awakening."
 
 GOI_event.5.t: "Island... Dissapeared?"
 GOI_event.5.desc: "No, it can't be. A couple of hours ago, Dream Island just... Disappeared? The island, which used to be the mecca of Goiky, is now only enclosing wals and crashing waves."
 GOI_event.5.a: "..."
 
 GOI_event.6.t: "Protests turn into uprisings!"
 GOI_event.6.desc: "The conditionally unified Goiky very quickly plunges into the abyss of anarchy. On the outskirts of the continent, local governments are already being proclaimed. Looks like this is the end..."
 GOI_event.6.a: "The future is hazy."
 
 GOI_event.7.t: "Report"
 GOI_event.7.desc: "'...The most hopeless objects were the last to leave the city; Without legs and arms, with cracks, bent, and others mutilated by this dark time. All recovery centers were destroyed or were under the control of bandits, and it was impossible to provide any clear help to these unfortunate objects. The evacuation was carried out in a hurry and very unorganized, especially in the final waves, for example: in the eastern outskirts, 17 trucks were lost on the road on the 20th alone, 10 of them were stolen by local bandits, and 7 were burned. Slightly better situation in the north...'"
 GOI_event.7.a: "Interesting excerpt."
 
 GOI_event.8.t: "Battle for Goiky"
 GOI_event.8.desc: "This is where our story begins. First, you need to choose one of the many fragments of Goiky, which you will lead to greatness.\n\n§RWE STRICTLY RECOMMEND TO PAUSE THE GAME!§!"
 GOI_event.8.a: "Let's go!"

 GOI_event.9.t: "This Country is Unplayable!"
 GOI_event.9.desc: "This country currently has no content and not meant to be played by a player. We recommend exiting to the main menu and selecting a different country. You can ignore this warning."
 GOI_event.9.a: "Ignore Warning"

 GOI_event.69.t: "Free Will!"
 GOI_event.69.desc: "To make The Great Battle for Goiky more interesting do you wish to buff the AI?"
 GOI_event.69.a: "Fine as it is."
 GOI_event.69.b: "Minor Buff."
 GOI_event.69.c: "Moderate Buff."
 GOI_event.69.d: "Major Buff."
 GOI_event.69.e: "I want to suffer!!!"

 #NGRF
 WGF_event.1.t: "Revolutionary front"
 WGF_event.1.desc: "It's surprising, because just a couple of months ago he won the vote, he was supposed to get the island, but today he's here. Firey often wondered where fate had taken him. In general, he changed dramatically during the days of the front. Where's Leafy? Where did the island go? These questions have not bothered him for a long time. The liberation of Goiky's objects became the main task of his existence. The short-lived friendship with Coiny quickly broke down when that traitor abandoned the cause of liberating the workers and fled to the east. But it's okay, all the enemies of the revolution will get what they deserve."
 WGF_event.1.a: "The fire won't go out."
 
 WGF_event.2.t: "Case #8"
 WGF_event.2.desc: "CONCLUSION ON CASE #8 ABOUT THE DISAPPEARANCE OF D.I.:\nAfter the research work carried out described on page 9 of this document and hearings of witnesses, Leafy's guilt in the loss of objects's property, which led to particularly large economic losses, becomes undeniable. A court hearing in the case will take place in the next few months."
 WGF_event.2.a: "Let it be so."
 
 WGF_event.3.t: "Trial"
 WGF_event.3.desc: "'...Thus, despite the absence of the accused at the trial, the evidence base of the prosecution is sufficient and indisputable to convict the accused under Articles 14.1, 16 and 51 of the legislation of the socialist republic, the revolutionary court pronounces a sentence..."
 WGF_event.3.a: "Death by flattening'"
 WGF_event.3.b: "Life imprisonment'"
 WGF_event.3.c: "The court will not pass a verdict."
 
 WGF_event.4.t: "Greetings from the snow plateau"
 WGF_event.4.desc: "When we began a program to establish contacts with communist organizations throughout Goiky, we did not at all expect what we found in the snow plateau. In the south, in the snowy forests, anarcho-communists led by Rocky are waging an irreconcilable struggle against the fascist regime of Snowball! Our delegates received a warm welcome and we were able to agree on cooperation with their partisan movement. The road to supply them with equipment was also chosen, incredibly difficult and long, but there can be no obstacles to solidarity with comrades in the far east."
 WGF_event.4.a: "They are heroes, although they are mistaken."
 
 WGF_event.5.t: "Offer"
 WGF_event.5.desc: "An interesting telegram arrived from the communists in the north: They offer military and technical cooperation, which is much needed for both of our countries in these dark years. Although the hostility of the northerners towards our regime is obvious, we will transfer the decision on the issue to the RCC."
 WGF_event.5.a: "Under pressure from the left faction, the proposal passes."
 
 WGF_event.6.t: "Looking East"
 WGF_event.6.desc: "Now that the attack on the Military District is being prepared, many things have become clear: Coiny, during his participation in the construction of the Front, initially sabatoged the regime by passing harmful proposals. It is also possible that he was planning a military coup. In any case, it's not that important now."
 WGF_event.6.a: "Fictitious friendship."
 
 WGF_event.7.t: "Victory!"
 WGF_event.7.desc: "The Coiny Junta has been defeated! Our border guards were successfully able to advance deep into enemy territory and capture military warehouses!"
 WGF_event.7.a: "Take everything you can carry!"
 
 WGF_event.8.t: "Defeat"
 WGF_event.8.desc: "Our offensive stalled, and as a result, the troops of the Military District launched a counteroffensive and captured some of our warehouses. This is a heavy defeat for our young armed forces and the objects of northern Goiky."
 WGF_event.8.a: "We will take revenge later"
 
 WGF_event.9.t: "Negotiations"
 WGF_event.9.desc: "Although we achieved some successes, the operation eventually floundered and the front stopped. In this regard, negotiations began and the conflict ended in a draw."
 WGF_event.9.a: "Good."
 
 WGF_event.10.t: "Signal"
 WGF_event.10.desc: "Our radio stations picked up a signal about a request for help, which came from North Goiky. We believe that this is an expedition that went there half of the year ago. Should we send a rescue ship?"
 WGF_event.10.a: "Send transport vessels to the signal."
 WGF_event.10.b: "Not really our problems."
 
 WGF_event.11.t: "Successful rescue"
 WGF_event.11.desc: "Our ships were able to successfully cross the Goiky Canal and sail to the coordinates. There we found approximately 60 objects, which were successfully transported back to the continent."
 WGF_event.11.a: "It will be interesting to listen to their stories."
 
 WGF_event.12.t: "Too late"
 WGF_event.12.desc: "Alas, when our ships sailed to the coast, we could only find a few ration packages and traces. The fate of the group is unknown."
 WGF_event.12.a: "Waste of time."
 
 WGF_event.14.t: "Coin shine"
 WGF_event.14.desc: "Gradually, border conflicts developed into full-fledged battles along the entire front line from the desert to the canal coast. Our troops are going on the offensive. The conflict has officially begun."
 WGF_event.14.a: "Steady as she goes."
 
 WGF_event.15.t: "Trial over Coiny"
 WGF_event.15.desc: "- So, accused, do you admit your guilt in war crimes against the objects of Northern Goiky and against the revolution?\n- Frick you, Firey!\nThe defendant suddenly jumped out of his seat in the court room, ran up to Firey and slapped him in the face, which was followed by a retaliatory slap. Soon they were separated."
 WGF_event.15.a: "Just like the good old days."
 
 WGF_event.16.t: "Supply chains are broken!"
 WGF_event.16.desc: "After the Fascist invasion of the Snowy Forest began, it became almost impossible to continue supplying the Anarchists. Unfortunately, we will have to stop sending rifles to these comrades."
 WGF_event.16.a: "Good luck to them."
 
 WGF_event.17.t: "Relations break with the Provisional Government"
 WGF_event.17.desc: "We received a telegram from Casland. As a result of an obviously fabricated investigation, our cells were discovered in the ranks of the local Communist Party. This was the reason for ending diplomatic relations with us."
 WGF_event.17.a: "Once we enter Casland, they won't even be able to send a surrender request."
 
 WGF_event.18.t: "A gift from Casland"
 WGF_event.18.desc: "After the sad news about the falling of the socialist regime in Casland, our government didn't count on anything. But, suddenly, a report was received about defectors crossing the border from the Defense Zone. The border trespasser wrapped in rags and his accomplices offered their services to us."
 WGF_event.18.a: "Welcome."
 
 WGF_event.19.t: "Operation failure"
 WGF_event.19.desc: "The initial plan to defeat Coiny within six months failed. This is causing serious upheaval in our society and increasing distrust in the government. Our resources have been largely depleted."
 WGF_event.19.a: "We need to hurry."
 
 WGF_event.20.t: "Relations break with Greeny Plains"
 WGF_event.20.desc: "The GPSR government declared us to be 'revisionist' and severed all ties with us. This decision seems strange, but there is nothing we can do about it."
 WGF_event.20.a: "Idiots."
 
 WGF_event.21.t: "Our Situation"
 WGF_event.21.desc: "Firey had been in control over his now sovereign territory for several weeks now, however, most of his supporters didn't actually know what his ideology was like. That was going to change in just a few short hours, because Firey was making morning preparations to give a speech to his new-found subjects. He was currently sitting on a train, being transported to the building he was expected to speak at. Firey was definitely afraid of what might happen to him at the event, even one stutter could ruin his dream of a united, just Goiky. He ran through different scenarios of the things that could possibly go wrong in his head, whilst taking sips of his coffee.\nThe thoughts weighed heavily on his mind, making a slip up feel more and more inevitable.\n\nAs the train car stopped, and Firey stepped out, he saw a large crowd of objects, all around the platform the train had stopped at. All the objects seemed very excited, but for what, Firey didn't know. He started to look around the platform, wondering what they were all excited about. However, as he looked around, he soon realized that all of these objects were grinning, wide-eyed, at him. He was the center of attention. They all wanted to know his thoughts."
 WGF_event.21.a: "This speech will be light work for him."

 #Reich
 GGR_event.1.t: "Behind the ridge"
 GGR_event.1.desc: "The Snowy Plateau is a wonderful region with beautiful objects, although it is quite poor. It has some features, for example: Its population, due to its isolation, is quite united and has a uniform, special culture, unlike other regions of South Goiky. It is particularly autonomous and does not depend so much on foreign trade..."
 GGR_event.1.a: "This land needs in a strong hand."
 
 GGR_event.2.t: "Snowy status-quo"
 GGR_event.2.desc: "'Death to anarchists!' - This is where Snowball ended his speech to the fighters of the newly created militia. Doubts accumulated in him, as if he himself rolled into a big snowball. Anarchists occupy village after village, and his popular support is small. But he knows one thing for sure:"
 GGR_event.2.a: "Our spirit cannot be broken."
 
 GGR_event.3.t: "Wald Massacre"
 GGR_event.3.desc: "Wald, one of the few forest settlements that remained under Reich control, was subjected to an 'act of retaliation' by ultranationalist battalions. According to initial data, 506 objects of all genders and ages were killed on suspicion of collaboration with the resistance. The dead were thrown into heaps and burned. Those who could not be burned were simply thrown into ditches and pits. This incident will go down in the history of the Snowy Plateau as one of the most brutal events of our time."
 GGR_event.3.a: "There are also excesses..."
 
 GGR_event.4.t: "The Final Stretch"
 GGR_event.4.desc: "Those damned anarchists, national traitors who tried to undermine the unity of the Snowy Plateau. Soon they will answer for their actions fairly, all that remains is to strike the final blow. Grassy was immersed in those thoughts that haunted his mind. He joined the local Whiteshirt squad quite a long time ago and showed exemplary discipline. He doesn't know about his promotion yet."
 GGR_event.4.a: "The hand that will end anarchy."
 
 GGR_event.5.t: "Resistance suppressed"
 GGR_event.5.desc_1: "We're successfully destroyed resistance in Schneehorn region and now region fully controlled by us."
 GGR_event.5.desc_2: "We're successfully destroyed resistance in Snowy Plains region and now region fully controlled by us."
 GGR_event.5.desc_3: "We're successfully destroyed resistance in Snowy Hills region and now region fully controlled by us."
 GGR_event.5.desc_4: "We're successfully destroyed resistance in Bottom Plateau region and now region fully controlled by us."
 GGR_event.5.a: "Good work."
 
 GGR_event.6.t: "Revolutionary Front supports Anarchists resistance!"
 GGR_event.6.desc: "The Firey regime in the north, despite disagreements in state-building, managed to negotiate a supply line for equipment for the Snowy Plateau Anarchists. Although the NGRF is quite far from the Snowy Plateau geographically, it greatly raised the morale of the Anarchists."
 GGR_event.6.a: "Curse them!"
 
 GGR_event.7.t: "The Anarchist Problem"
 GGR_event.7.desc: "Not everyone agreed with our... Quite radical methods of government building, and this creates many difficulties for us. National traitors formed into communes and took refuge in the forests in the south, almost completely controlling them. Moreover, they propagate their corrupting ideas among the objects of our great Snowy State in the northern regions. If we do not solve this problem in the coming years, the fate of the Snowy Plateau will remain in doubt."
 GGR_event.7.a: "Heil Snowball!"
 
 GGR_event.8.t: "Snowball's Notes"
 GGR_event.8.desc: "Interestingly, in the last months of the Snowy Reich, Snowball even learned to write, and kept some semblance of a 'diary'. The entries in it, in keeping with the times, became more and more hopeless every day. When first the Snow Hills and then the Northern Regions left the control of the Reich, Snowball wrote a short message for his followers. It served as a kind of 'manifesto' for the remaining forces in Schneehorn. After writing, Snowball likely went into battle with one of his elite units and died."
 GGR_event.8.a: "There was no lights out. The fight continues."
 
 GGR_event.9.t: "The danger of rebellion has been eliminated!"
 GGR_event.9.desc: "The last center of resistance in our rear has been successfully destroyed, and we can now turn our attention completely towards foreign policy."
 GGR_event.9.a: "Wonderful news."
 
 GGR_event.10.t: "Profitable destruction...?"
 GGR_event.10.desc: "A few weeks after the creation of the first concentration camp in the Snowy Hills region, one of the directors of a local manufacturing company came to Schneehorn to offer... a small contribution to the state in exchange for the free labor of concentration camp prisoners. Although segregated objects generally do not have hands, it does not hurt to force them to work."
 GGR_event.10.a: "Business is going well."
 
 GGR_event.11.t: "Some... uncertainties"
 GGR_event.11.desc: "- Why the hell is this road blocked!?\n\n- No specific reasons are given, but driving here is strictly prohibited.\n\n- I don't care, I have an urgent meeting in Schneehorn, open this barrier immediately, otherwise you will have big problems in the Reichsordnung!\n\n- ...Sorry, sir, but I'll get myself court-martialed if I do this. This is an order from the very top.\n\nThe irritated driver, completely enraged, pressed the pedal to the floor and broke through the barrier, rushing into the distance."
 GGR_event.11.a: "Open fire!"
 
 GGR_event.12.t: "Crossing the line"
 GGR_event.12.desc: "At 4 AM, our troops crossed the conventional border in the form of the Snowriver River and occupied bridgeheads in the Snowy Forest. The anarchists clearly did not expect such a quick invasion and are preparing their defense. The Battle of the Snowy Plateau begins."
 GGR_event.12.a: "Forwards!"
 
 GGR_event.13.t: "Mass desertion!"
 GGR_event.13.desc: "We are faced with a big problem: The reserve units treacherously went over to the side of the enemy, having been subjected to his propaganda. This significantly impacts our rear and can lead to the destruction of the front."
 GGR_event.13.a: "Traitors!"

 GGR_event.14.t: "Aid from the Snow Fascists!"
 GGR_event.14.desc: "We received an import of guns from Großgoikysreich a few hours ago. While they claim it is for 'Crushing the Bandits', it could very easily be for larger goals we don't have the information on. Should we accept this import of rifles?"
 GGR_event.14.a: "Accept!"
 GGR_event.14.b: "Deny!"
 
#PROVISIONAL GOVERNMENT
 GPG_event.1.t: "A Mess"
 GPG_event.1.desc: "Another day in the council. Another arguement between Ruby and Taco over some minor issue. Expansion of the war tax, it seems? ...In any case, it matters little. Week after week, the government is buying time and is not making any decisions that could get Central Goiky out of this plight. Factionalism has affected all levels of society and Casland is in a difficult situation..."
 GPG_event.1.a: "The congress is nearing opening."
 GPG_event.1.b: "I want to know more about factions." 
 
 GPG_event.2.t: "Transitional Government"
 GPG_event.2.desc: "Represents the current government cabinet. A fairly neutral and inactive faction. In fact, the formation of a unified government of the Greeny Plains and the preservation of some stability is the merit of this faction. Its brightest and most passionate member at the moment is Clock, who heads the cabinet."
 GPG_event.2.a: "Maintaining stability is a priority."
 
 GPG_event.3.t: "Democratic Faction"
 GPG_event.3.desc: "An openly liberal organization. Its participants are aimed at the partial restoration of the anarchic economic model of Goiky, as well as the formation of a federal structure of the southern continent. This faction does not have a clear leader, but Taco, Book and Barf bag stand out the most."
 GPG_event.3.a: "(And they are also sponsored by the Alliance)"
 
 GPG_event.4.t: "Toilers Front"
 GPG_event.4.desc: "An openly revolutionary faction that has repeatedly called for armed uprisings. It has several wings, but still has a common goal - the reconstruction of the state on a popular basis. The general secretary of the faction is Ruby."
 GPG_event.4.a: "Workers of Goiky, unite!"
 
 GPG_event.5.t: "Iron Hand"
 GPG_event.5.desc: "Perhaps the most militarized faction in the entire government. Formed from many organizations of different kinds in the wake of the onset of anarchy, the faction defends conservative and reactionary positions in the government. Management takes place behind the scenes in the so-called 'Iron Three', which consists of Fanny, Pillow and Nickel."
 GPG_event.5.a: "Goiky, United and Indivisible!"
 
 GPG_event.6.t: "Clock is dead!"
 GPG_event.6.desc: "Today, an incident occurred in Casland that will affect the entire state. The leader of the government cabinet, the head of the neutral faction, Clock, died as a result of an assassination attempt by a representative of the radical wing of the democratic faction. The murder was carried out with a small hammer, which was used to break through the glass case. At the moment, the cabinet is running like a decapitated chicken. Pie was temporarily chosen as acting head of the cabinet."
 GPG_event.6.a: "The crisis is getting worse."
 
 GPG_event.7.t: "The factions demand the opening of the congress!"
 GPG_event.7.desc: "The government crisis continues to worsen. In this regard, three of the four factions demanded an emergency opening of the second congress on a predetermined date to resolve issues of governance."
 GPG_event.7.a: "We have no choice."
 
 GPG_event.8.t: "Congress opening"
 GPG_event.8.desc: "The streets of Casland are guarded, the council building is prepared, everything is ready for the start of the faction meeting. The most pressing issues will be resolved one by one at the congress, at the end of which stability should be achieved."
 GPG_event.8.a: "It's time to get ready!"
 
 GPG_event.9.t: "The Clock Question"
 GPG_event.9.desc: "So, the first issue that the congress must resolve will be the assassination attempt on the head of the cabinet. It is not yet completely clear whether there was someone larger behind the left-wing democratic activist. The congress must decide on an investigation, however, we can play with the facts a little and blame the communists and democrats for this, which will affect their positions in the council."
 GPG_event.9.a: "Obviously, it was the communists."
 GPG_event.9.b: "...This anarchist acted on his own, we'll not talk idle words."

 GPG_event.10.t: "Communists and Democrats deny their involvement!"
 GPG_event.10.desc: "As a result of an independent investigation, it turned out that the raider who killed the head of the cabinet did not even have a party card and called himself a democrat with no reason. But this no longer matters, because the communists launched a counterattack and accused the current government of deliberate provocations."
 GPG_event.10.a: "Fries tried to dispute the accusation, but he had nothing to answer."
 
 GPG_event.11.t: "The Chairman Question"
 GPG_event.11.desc: "The second topic of the congress will be the acting head of the cabinet. It's no secret that Pie is not very suitable for this role. Fries announced his candidacy for this post. What will the council say?"
 GPG_event.11.a: "Fries passes!"
 GPG_event.11.b: "Pie managed to defend her post."
 
 GPG_event.12.t: "The Island Question"
 GPG_event.12.desc: "Like nothing else in Casland, the question now is about the funds that were spent on the construction of Dream Island. Huge amounts of money disappeared into thin air, and this dealt a severe blow to the economic heart of the continent. The agenda of the congress included the issue of partial payment of compensation to investors. Many consider this a necessary measure, but there is also an opinion that Goiky's economy will be able to recover its wounds on its own, and the payment of compensation will cut into an already incredibly small budget. What will Congress choose?"
 GPG_event.12.a: "Immediate compensations!"
 GPG_event.12.b: "Congress rejects the proposal."
 
 GPG_event.13.t: "The Defense Question"
 GPG_event.13.desc: "While the republic is in a state of crisis, it is necessary to ensure its security from external threats. This is precisely the question that was raised at the congress. It was decided to allocate part of the budget for the construction of defensive lines on the external borders. But these funds are clearly not enough to ensure strong defense in all areas. The congress must choose a priority direction."
 GPG_event.13.a: "The railway in the north should be protected."
 GPG_event.13.b: "Mining facilities in the east should be protected."
 GPG_event.13.c: "Radicals in the south pose the greatest threat."
 
 GPG_event.14.t: "The Casland Question"
 GPG_event.14.desc: "After the creation of the government, a collective decision was made to ban the actions of military organizations and the admission of army units into the city. But today many are raising the question of sending troops into the city to maintain order. We can accept this decision, but it will cause furious protest from many assessors."
 GPG_event.14.a: "No!"
 GPG_event.14.b: "First state patrol enters Casland with fanfare."
 
 GPG_event.15.t: "The Mines Question"
 GPG_event.15.desc: "Representatives of the Toiler's Front demanded that the government nationalize mines in the eastern part of the country that were destroyed after the crisis in order to save them. The adoption of this proposal may cause serious protests from other factions. How will the congress proceed?"
 GPG_event.15.a: "Accept."
 GPG_event.15.b: "Let them figure it out for themselves."
 
 GPG_event.16.t: "The Constitution Question"
 GPG_event.16.desc: "Since the creation of the republic, it has been drowning in anarchy and legislative chaos. The time has come. All factions are talking about this, the cabinet is talking about this, and now, finally, the question has been raised. A draft constitution was put forward, developed by representatives from all four factions."
 GPG_event.16.a: "Long live the republic!"
 GPG_event.16.b: "§RThe congress decides to postpone the constitution...§!"
 
 GPG_event.17.t: "Factions vote on the constitution!"
 GPG_event.17.desc: "Despite the government's decision, factions still continue to vote for the constitution, boycotting the cabinet's decision. Ultimatums are already beginning to be put forward to the government for its immediate adoption."
 GPG_event.17.a: "Just ignore them."
 
 GPG_event.18.t: "Communists and Democrats leaving the council!"
 GPG_event.18.desc: "The refusal to adopt the constitution led to mass protests by the meeting of these two factions, as a result of which a decision was made to leave and boycott the congress. In such conditions, the council can no longer continue its work."
 GPG_event.18.a: "We can do without them."
 
 GPG_event.19.t: "Armed uprisings!"
 GPG_event.19.desc: "As a result of the collapse of the congress and the disunity of factions, uprisings began throughout the state: Right-wing mobilized armed forces, communist party activists take control of the mines, and so on. In this regard, martial law was declared and the council ceased its work."
 GPG_event.19.a: "The end of the republic."
 
 GPG_event.20.t: "Collapse"
 GPG_event.20.desc: "As a result of the crisis of local democracy, the outskirts broke away from the central government and declared their goal to take Casland. The battle for the future of Goiky is taking place here."
 GPG_event.20.a: "Provisional government will restore stability!"
 GPG_event.20.b: "Workers of Goiky, unite!"
 GPG_event.20.c: "Democrats will restore the republic!"
 GPG_event.20.d: "The Iron Hand will establish order!"
 
 GPG_event.21.t: "Coup!"
 GPG_event.21.desc: "The Iron Hand, taking advantage of its special position in the armed forces, with the help of police garrisons in Casland, managed to take control of the city almost without resistance! The government fled to the west, and this probably means the collapse of the council and government cabinet."
 GPG_event.21.a: "Oh my bakery!"
 
 GPG_event.22.t: "Radicals take advantage of government weakness!"
 GPG_event.22.desc: "In a result of...not the best decisions of the congress, the popularity of the cabinet fell sharply, and radical groups took advantage of this, starting to boycott the decisions of the cabinet and challenge its position. In such conditions, the council cannot continue its work."
 GPG_event.22.a: "This will lead to dire consequences."
 
 GPG_event.23.t: "Successful completion of the congress"
 GPG_event.23.desc: "Wonderful job! The Cabinet managed to maintain stability in the state and consensus on key issues was successfully found! The Republic is moving forward, and its objects are happy."
 GPG_event.23.a: "Forwards, Goiky!"
 
 GPG_event.24.t: "Counterattack"
 GPG_event.24.desc: "So, stability has been restored, but this is just the beginning. We have bought time, and now we need to deal with the radical opposition and do it in a way that does not cause unrest, before these radicals destabilize the state again."
 GPG_event.24.a: "We need to act quickly."
 
 GPG_event.25.t: "Arson of the council!"
 GPG_event.25.desc: "That night, a group of attackers entered the vicinity of Casland and, under the cover of darkness, entered the city center, where they set fire to the building of the Recommended Characters Council with the aim of a coup. One of them was detained with a Toilers Front party card. Our valiant police immediately took the entire administration of the Toilers Front into custody and they are awaiting trial."
 GPG_event.25.a: "It's time for judgment."

 GPG_event.26.t: "Recharnd Process"
 GPG_event.26.desc: "According to the results of the trial in Recharnd, the guilt of the communists in the arson of a state building was certainly proven. They all received sentences, and now the Toiler's Front is effectively decapitated."
 GPG_event.26.a: "Wonderful work."
 
 GPG_event.27.t: "Democratic uprising in the Greeny Plains!"
 GPG_event.27.desc: "The Democrats, with the support of the Greeny Plains Republic, managed to occupy the north of the country and establish their regime there. We must destroy them."
 GPG_event.27.a: "We'll deal with that."
 
 GPG_event.28.t: "Communists take control of the mines!"
 GPG_event.28.desc: "As a result of our government's not very clever policy towards radicals, the Toilers Front faction managed to gain full support among the workers of the eastern mines and establish a socialist regime there. Now the troops are joining in."
 GPG_event.28.a: "To battle!"
 
 GPG_event.29.t: "Iron Forces occupy Recharnd!"
 GPG_event.29.desc: "The Iron Hand, feeling complete impunity on the part of the government, decided on an armed uprising and occupied the second largest city in the country. We must crush this uprising immediately!"
 GPG_event.29.a: "Bring Recharnd back!"
 
 GPG_event.30.t: "Fries takes military command"
 GPG_event.30.desc: "The time has come to give armed resistance to the rebels. Fries takes over as military commander to protect Goiky from the radicals."
 GPG_event.30.a: "Forwards!"
 
 GPG_event.31.t: "Republic occupies Lawnland!"
 GPG_event.31.desc: "Taking advantage of the instability in government following the recent adoption of the Constitution, the Greenport government decided to introduce war into the border areas to 'protect its borders'. This is an unprecedented act of aggression, but for now there is nothing we can do."
 GPG_event.31.a: "Bastards."
 
 GPG_event.32.t: "Factions ban"
 GPG_event.32.desc: "The Second Congress continued its work as if nothing had happened. The congress was not concerned about either the bloody civil war that had passed or the absence of two-thirds of the former members. The first document adopted by the new cabinet was the ban on factionalism. After a five-minute discussion, it was signed, like an ordinary monthly income report, and the congress continued to calmly discuss the next issue."
 GPG_event.32.a: "Like nothing happened."
 
 GPG_event.33.t: "Constitution of Goiky"
 GPG_event.33.desc: "We, the objects of different shapes and sizes, bound by the glorious historical bonds, the great economic and political unity of the objects of all of Goiky, believing in equality, justice, and freedom, gathered in Casland to draw up the CONSTITUTION OF GOIKY.\n\nChapter 1. Fundamentals of the constitutional order. \nArticle 1..."
 GPG_event.33.a: "...This edition is different"
 
 GPG_event.34.t: "Negotiations start"
 GPG_event.34.desc: "Today an authorized group of diplomats arrived in Casland from Greenport to resolve the Lawnland issue. The first meeting was scheduled for tomorrow. The results of the negotiations will determine our future course."
 GPG_event.34.a: "Pack your bags!"
 
 GPG_event.35.t: "Complete victory!"
 GPG_event.35.desc: "Our diplomats were able to seize the initiative in the negotiations and convicted Greenport of unjustified aggression. Their mission completely capitulated to our demands and agreed to the transfer of Lawnland."
 GPG_event.35.a: "Wonderful work!"
 
 GPG_event.36.t: "Complete failure."
 GPG_event.36.desc: "The diplomats who arrived in Casland not only refused to make any concessions, but also accused our side of preparing aggression and demanded the demilitarization of the border areas. Our representatives have been completely defeated and we are faced with a choice."
 GPG_event.36.a: "Capitulate to their demands."
 GPG_event.36.b: "We cannot bear such shame. Start Operation 'Grassburn'."
 
 GPG_event.37.t: "Dead end."
 GPG_event.37.desc: "As a result of the heated negotiations and excessive measures taken by the armed forces, the issue of Lawnland reached a dead end. Relations between us and the Republic are incredibly tense, and we should not wait for them to stab us in the back."
 GPG_event.37.a: "Start Operation 'Grassburn'."
 
 GPG_event.38.t: "Status-quo"
 GPG_event.38.desc: "As a result of protracted negotiations, our diplomats were unable to obtain any form of approval for the return of Lawnland. However, the Greenport side agreed to pay large compensation in our favor."
 GPG_event.38.a: "Not the best result."
 
 GPG_event.39.t: "Return of the Lawnland!"
 GPG_event.39.desc: "Our diplomats were able to successfully negotiate an end to the occupation of Lawnland. With some conditions, the border returned to its previous form."
 GPG_event.39.a: "Wonderful!"
 
 GPG_event.40.t: "End of negotiations."
 GPG_event.40.desc: "Today, Republic diplomats left Casland, marking the end of the diplomatic mission and negotiations regarding Lawnland. Our government is entering the next stage."
 GPG_event.40.a: "Forwards!"
 
 GPG_event.41.t: "Lawnland Demilitarization"
 GPG_event.41.desc: "Our diplomats were able to successfully convince the Greenport government to withdraw troops from the border region during negotiations. This is our great diplomatic victory."
 GPG_event.41.a: "Good."
 
 GPG_event.42.t: "Refuse"
 GPG_event.42.desc: "Republic diplomats refused to pursue any form of demilitarization of Lawnland. This greatly strained the negotiations, and perhaps indicates the preparation of aggression in our direction."
 GPG_event.42.a: "Damn it."
 
 GPG_event.43.t: "Protests in Lawnland"
 GPG_event.43.desc: "Objects of the border provinces captured by the Republic are coming out en masse to protest against the occupation. We can support them, but this will escalate the situation. What should we do?"
 GPG_event.43.a: "Let them protest."
 GPG_event.43.b: "Sponsor them!"
 
 GPG_event.44.t: "Government reestablishment"
 GPG_event.44.desc: "Now that stability has finally triumphed in Casland, the Transitional Government in the form of the head cabinet can transfer back the powers of the executive branch to the congress and council."
 GPG_event.44.a: "Wonderful!"
 
 GPG_event.45.t: "Idea of a lower house"
 GPG_event.45.desc: "Throughout its existence, only objects that had ever been shown in BFDI were allowed into the Council. This created a certain divide in our republic. Once, at the Second Congress, Taco spoke about the creation of the Lower House of the Council, into which any objects could be admitted. Yesterday, the Congress decided to develop a plan for the creation of the Lower House and determine the scheme of its work. However, the decision to create it will probably be made only at the Fourth Congress."
 GPG_event.45.a: "Interesting."
 
 GPG_event.46.t: "Republic offers negotiations"
 GPG_event.46.desc: "A telegram was transmitted to our government today from Greenport proposing a 'settlement of the Lawnland issue'. A conference will be held between our diplomats in Casland, which will determine the fate of the region. We can't miss this chance."
 GPG_event.46.a: "Let them come."

 GPG_event.47.t: "The Wind Changes Directions!"
 GPG_event.47.desc: "With Pie winning the vote it seems that not only were some of our council members unhappy, but one of our generals. Cloudy had submitted his resignation a few hours ago citing 'Disillusioned with the current government'. For now, it seems that he will not be with us in the upcoming days."
 GPG_event.47.a: "Interesting..."

 GPG_event.48.t: "Industrial cooperation with Technocrats"
 GPG_event.48.desc: "Announcergrad Government continues to expand its cooperation with us: they offer to send their scientific specialists in exchange for experience from our industry. This is a rather lucrative offer."
 GPG_event.48.a: "Of Course!"

 GPG_event.49.t: "Open Borders with Technocrats"
 GPG_event.49.desc: "The government of Announcergrad has proposed a mutual easing of border controls between our countries. This will significantly increase trade between Announcergrad and Casland and generally improve communication between us."
 GPG_event.49.a: "Great!"

 GPG_event.50.t: "Mutual Assistance Pact with Announcergrad!"
 GPG_event.50.desc: "We have been cooperating with the Technocratic Republic for quite some time now. This has resulted in a mutual defense agreement against aggressors and invaders! It is quite possible that this friendly action will lead to even greater cooperation between our countries in the future."
 GPG_event.50.a: "Five fingers are a fist!"

 GPG_event.51.t: "Relations with Announcergrad"
 GPG_event.51.desc: "We recently sent negotiators to Announcergrad to establish relations with the local government. It appears they returned with good news: the technocratic government is quite willing to do business with us. Perhaps this marks the beginning of a long and fruitful partnership."
 GPG_event.51.a: "Brain and Heart are friends again?"

 GPG_event.52.t: "To Hell with our old Obligations"
 GPG_event.52.desc: "Dream Island no longer exists. The old government has been reorganized, and there's no point in us trying to pay off the monstrous old debts. It's time to step into a new era for Casland, free from this shameful yoke of economic collapse and irresponsibility."
 GPG_event.52.a: "Forwards!"
 
 #GDR
 GDR_event.1.t: "Battle For Democracy"
 GDR_event.1.desc: "The provisional government, through its decisions, showed its desire to establish a dictatorship, and we were forced to raise our rifles for the sake of our freedom and the freedom of Goiky's objects. Opponents of democracy must be defeated today, or we are doomed to another authoritarian regime."
 GDR_event.1.a: "Forwards!"
 
 GDR_event.2.t: "Return of the Republic"
 GDR_event.2.desc: "Casland's objects celebrate the advent of democracy, and the congress once again prepares to continue its work with a new members. We have a big job ahead of us to return to normal life."
 GDR_event.2.a: "Getting to work!"
 
 GDR_event.3.t: "Third Congress"
 GDR_event.3.desc: "For the first time since the brutal battles for Casland, the RCC office was illuminated by the bright sun of Goiky. The objects had gathered here once again to continue the democratic tradition of this glorious city in the heart of the continent. Now they had a huge amount of work ahead of them; the destruction brought by the civil war and the huge debts to Greenport, the political crisis of the Democratic government and other problems that needed to be resolved quickly."
 GDR_event.3.a: "For object's better life!"
 
 GDR_event.4.t: "Elections"
 GDR_event.4.desc: "The Republic needs a president, a strong personality, who will be supported by our objects. It is time to eliminate collective leadership and hold elections."
 GDR_event.4.a: "I will vote!"
 
 GDR_event.5.t: "Results"
 GDR_event.5.desc: "So, the votes have been counted. It's time to announce the results. By a small margin in the first round, the first presidential term of the Republic was won by..."
 GDR_event.5.a: "...Taco!"
 GDR_event.5.b: "...Book!"
 GDR_event.5.c: "...Barf Bag!"
 
 GDR_event.6.t: "Total Devastation"
 GDR_event.6.desc: "[GDR_GETLEADERNAME] looked at the graffiti on the walls of a ruined building on the outskirts of Casland. The symbols ranged from smily faces, to hammers adourned with sickles. From names of common objects to names of leaders, with death wishes next to them. Weird looking letter 'S's to symbols only known to the most radical of Iron Hand supporters. Casland, and the surrounding areas, have been in decline ever since the fall of old Goiky. A terrible civil war has destroyed the provisional government and driven our objects into harsh poverty."
 GDR_event.6.a: "It's time to act!"
 
 GDR_event.7.t: "New Life"
 GDR_event.7.desc: "Drilly wandered alone through the night alleys. The civil war had carried him in the dark deep. After the university closed, he experienced extreme poverty and had been on the brink of death a couple of times. He even had been recruited into the anarchist organization; he had done many stupid things during those months. He began to understand more and more the marginality of his situation. The news of the opening of the university was the final hit.\n\n- It's time to put an end to this.\n\nHe sweared to himself to continue studying from tomorrow."
 GDR_event.7.a: "When floating up, don't tear your lungs."
 
 GDR_event.8.t: "Greenport Agreement"
 GDR_event.8.desc: "Great news! The Republic is making concessions to us and has freed us from paying off most of the debt. Now we can breathe a sigh of relief."
 GDR_event.8.a: "Wondrous!"
 
 GDR_event.9.t: "Opening of the Democratic Congress"
 GDR_event.9.desc: "Now that the most important internal problems have been settled, there are no disagreements between Greenport and Casland. The question of merging into a single Democratic Federation is becoming the most matter one. Objects all over the Greeny Plains are holding rallies and demanding unification. Today, a delegation from the Republic arrived in Casland to begin negotiations. The main question is hanging in the air: where will the capital be..."
 GDR_event.9.a: "...Casland or Greenport?"
 
 GDR_event.10.t: "Lawnland Referendum"
 GDR_event.10.desc: "Now that there is no disagreement between the democratic governments, it is time to end the occupation of Lawnland and hold a national referendum."
 GDR_event.10.a: "It's time to return back home."
 
 GDR_event.11.t: "Lawnland returns"
 GDR_event.11.desc: "According to the voting results, 93.9% of the objects unanimously voted for returning to us. Greenport ends the occupation and transfers the border territories back."
 GDR_event.11.a: "Victory of the Democracy!"
 
 GDR_event.12.t: "Democratic Congress ends"
 GDR_event.12.desc: "The appointed time has come, and the fate of the Greeny Plains has been decided. The Objects have made their decision, and it is time to find out what it is."
 GDR_event.12.a: "And the whole of Goiky froze."
 
 GDR_event.13.t: "Federation!"
 GDR_event.13.desc: "The dream of an equal union has become a reality today. Greenport and Casland are united in a federation, and the objects of the Greeny Plains are united again."
 GDR_event.13.a: "Best result."
 
 GDR_event.14.t: "Unification"
 GDR_event.14.desc: "As a result of the Congress, a decision was made to join the Greeny Plains Republic. Although we failed to achieve a federation, at least democratic values were preserved."
 GDR_event.14.a: "Greenport is the new capital."
 
 #GSR
 GSR_event.1.t: "Liberation of the mines"
 GSR_event.1.desc: "The workers at one of the iron mines cheered as they listened to Ruby's speech. Finally, they were freed from 12 hours of slavery in the caves. 'But this is not the end!' - Ruby exclaimed. Objects must continue to fight to maintain their gains."
 GSR_event.1.a: "And the Red Banner will fly in Casland!"
 
 GSR_event.2.t: "What's next?"
 GSR_event.2.desc: "The revolutionary forces led by Ruby were able to defeat the reactionaries in the west and established their rule over the entirety Casland. But, during the civil war, the army was filled with volunteer armed forces, driven by anarchist ideals, which began to demand open representation for themselves. Which path will the government choose?"
 GSR_event.2.a: "Ruby gives the green light to crush the voluntarists!"
 GSR_event.2.b: "The communes are seizing the initiative!"
 
 GSR_event.3.t: "Arrest of Gelatin"
 GSR_event.3.desc: "A black car arrived suddenly. The ambitious Gelatin had long been suspected of sponsoring the underground activities of anarchists. Early the next morning, all local steakhouses came under state control."
 GSR_event.3.a: "No one saw him again."
 
 GSR_event.4.t: "Defeat of the Anarchists"
 GSR_event.4.desc: "The Casland trial showed the full essence of the anarchist movement and allowed us to finally crush these revisionists. All serious counter-revolutionary units were defeated, and now Casland can sleep peacefully."
 GSR_event.4.a: "Long live the Revolution!"
 
 GSR_event.5.t: "Anarchists in Casland!"
 GSR_event.5.desc: "As a result of a short clash with overwhelming numerical superiority, the anarchist detachments drove the revolutionary brigades out of Casland and other cities of the Greeny Plains. Anarchist councils proclaim their power throughout the territory of the state. Anarchy comes to Casland."
 GSR_event.5.a: "But this time, anarchy will rescue this country."
 
 GSR_event.6.t: "Preparation for the first congress"
 GSR_event.6.desc: "The situation in the Greeny Plains has calmed down a bit. The socialist system has finally established itself in Casland, and the time has come to give our objects real reforms. To this end, the first congress of the reformed Greeny Plains Communist Party begins, which should solve the most serious questions of our government."
 GSR_event.6.a: "Let's get ready!"
 
 GSR_event.7.t: "Resistance to Resettlement politics"
 GSR_event.7.desc: "Our policy has caused... some protests in society. Objects are refusing en masse to vacate their homes in Casland and move to the hills. Many of those already displaced rushed back to the city to save their homes. All this creates serious inconvenience."
 GSR_event.7.a: "Temporary difficulties."
 
 GSR_event.8.t: "Sugar production"
 GSR_event.8.desc: "With a beaming smile, Ruby walked quickly around the new gumdrops production facility. This is of great importance to her; 'every object of Casland should have the right to sweets!'"
 GSR_event.8.a: "Sweet life."
 
 GSR_event.9.t: "Resistance to cultural politics"
 GSR_event.9.desc: "The rejection of our Cultural Revolution by many objects sparked large-scale protests in Casland and other major cities in the Greeny Plains. Of course, they will be suppressed, but this is only a symptom of a great disease of the masses."
 GSR_event.9.a: "They'll change their minds."
 
 GSR_event.10.t: "Right Way"
 GSR_event.10.desc: "No one has ever achieved success like ours! The Toilers Front and the Chairman lead us forward to a bright future for Goiky!\n\nLong live the Toilers Front!\nLong live the Toilers Front!"
 GSR_event.10.a: "Long live the Toilers Front!"
 
 GSR_event.11.t: "Backstab!"
 GSR_event.11.desc: "The troops of the southern regime have crossed our state border and are approaching Recharnd! It is necessary to defeat these treacherous traitors!"
 GSR_event.11.a: "Forward! To the defense of our homes!"
 
 GSR_event.12.t: "Disbandment of the Ministry of Economics"
 GSR_event.12.desc: "We have successfully removed the burden of taxes and state slavery from our objects. Anarchy is spreading."
 GSR_event.12.a: "Forwards!"
 
 GSR_event.13.t: "Dissolution of the Ministry of Foreign Affairs"
 GSR_event.13.desc: "Our commune does not need diplomatic relations with reactionaries! The objects of the Greeny Plains will decide for themselves how they feel about the reactionary regimes."
 GSR_event.13.a: "All these fascists don't have long to live."
 
 GSR_event.14.t: "Disbandment of the Patrols"
 GSR_event.14.desc: "We no longer need 'state security' agencies. Casland's objects can fend for themselves!"
 GSR_event.14.a: "Go, Anarchy!"
 
 GSR_event.15.t: "Dissolution of Parliament"
 GSR_event.15.desc: "We don't need 'Representative Democracy'. Objects will decide for themselves what they want, and we don't need 'representatives'!"
 GSR_event.15.a: "Down with dictatorship!"
 
 GSR_event.16.t: "Dissolution of the Armed Forces"
 GSR_event.16.desc: "State Armed Forces are the same means of strangling the freedom of objects as the police. We can take care of ourselves!"
 GSR_event.16.a: "Go ahead, militia!"
 
 GSR_event.17.t: "The Anarchist Council of Lawnland asks for an invasion!"
 GSR_event.17.desc: "Our friends, the objects occupied by the reactionaries from Greenport, sent us a message asking for help against the occupation and for a liberation. We can't hesitate."
 GSR_event.17.a: "The Councils unanimously support the invasion!"
 
 GSR_event.18.t: "Lessons from old Goiky"
 GSR_event.18.desc: "The anarchic system once already dominated the vastness of the Greeny Plains. The Great Goiky flourished in times of stability and calm, without government and police, without fake papers and political power. We need to strive for this ideal."
 GSR_event.18.a: "Goiky will be revived."
 
 #???
 uncommon_event.1.t: "..."
 uncommon_event.1.desc: "North of Yoyle City, lies a little tree. The tree seems to be any ordinary tree, yet this is far from the truth. It contains an unknown ancient power at its 'heart'. It was known by ancient tribes of objects from thousands years ago but rarely remembered today by only a few objects that are labeled as 'crazy'. \n\nWell, that was until Leafy's arrival after fleeing from her execution. She was still on edge worrying that someone was still following her wanting blood. This caused her to not explore Yoyle City believing it was populated but keep running further north. After 2 days of running and worrying, she finally calmed down. \n\nIt was quite convenient that where Leafy chose to rest right where the tree was. She was startled from a weird noise she heard and realized it came from the tree. With nothing better to do she decided the investegate. She found a small opening on the tree and made her way inside. It was bigger than she was expecting for since it was an seemly average tree size on the outside. She ventured further into the inside the tree and found 'heart'.\n\nThe 'heart' looked to be a normal heart shape, just that it was bigger and glowing a neon green. Without really thinking, Leafy reached out towards it. In a mere blink of an eye, a blinding light filled the room. So bright in fact that it caused Leafy to pass out. When she woke up, she was now in the stadium of Yoyle City."
 uncommon_event.1.a: "The Tree began to act."

 uncommon_event.2.t: "IT"
 uncommon_event.2.desc: "It desires\n\nIt desires\n\nIt desires\n\nIt Desires\n\nIt Desires\n\nIt Desires\n\nIt DESIRES\n\nIt DESIRES\n\nIt DESIRES"
 uncommon_event.2.a: "It desires that of... Texas?"
 uncommon_event.2.b: "It desires."

 uncommon_event.3.t: "'Where am I?'"
 uncommon_event.3.desc: "Those were the words of Rick Perry now looking around the area. He was just debating about a Healthcare bill when... something happened? To him, it was a blink and now he was here. The land looked strange, way too colorful to be earth itself, but weirdly reminded him of his childhood. Maybe a windows background? \n\nFootsteps came quick from behind breaking his thoughts of questions. Those footsteps were of Mark Milley and a few soldiers following him. 'Sir, you alright?'' asked Milley. Perry turned after a quick look he respond with, 'I'm alright, what happen what is going on?''. Milley shrugged, he was doing some inspections when he too blinked and was brought here. 'Someone...'' Milley started to say while glancing at a compass, '...west of here had a radio and has been getting in contact with friendlies, but only with people here...'.'Only people here?'' asked Perry. 'Other units that describe the same area we are in, no higher command or the government.'\n\nBeyond strange as both of them pondered their next course of action. Milly pointed towards the nearby building, it looked as if a hotel. 'Let's rally everyone there, we will figure out what is going on.'' he remarked. Perry looked at him knowing that was the only good idea they had at the moment."
 uncommon_event.3.a: "'Sure.'"

 uncommon_event.4.t: "Here we are."
 uncommon_event.4.desc: "It has been a few days now since the strange teleportation. The hotel looking building has now turned into a temporary government building. The rooms are being used for government officials and military personal. The lobby got turned into a makeshift Legislature room with the House and Senate having to take turns using it. The small cafe and kitchen did not change. Lastly, the suite at the top is now being used by Perry. Outside was a makeshift military base that doubled as the HQ and a bunch of makeshift houses people made out of anything. \n\nThat was a problem, the people. Their complaints made sense, no food and little shelter. People we already close to dying from the lack everything needed to live. There was an estimated 500K people that were teleported here along with the Texian Government. That was way too many people that this island could fit with the little supplies it had. This was not helped by the fact that everyone in the government had various ideas on how to fix the high growing problems. \n\n It was not all doom and gloom, however. A good amount of civilian and military equipment was also sent over. This equipment ranged from guns to trackers to computers to aircraft. Should time allow it, they could fight their way out of this mess and get a better understanding of their situation."
 uncommon_event.4.a: "For now, that has to wait."

 uncommon_event.5.t: "Containing the Mockingbird"
 uncommon_event.5.desc: "Rick Perry had been getting a headache for a few hours now. The back and forth between and in House and Senate had drained him. Everyone has ideas with some that were good and others that really should stayed buried. The problem was that no one was united in how to fix the many crises that had formed in less than a month. If something were to fix it, it would have the be quick before the start already ended.\n\nA seed had been planted in Perry for quite some time now. He has already forgotten when, where, or who planted the said seed. This seed had been growing for the last month with the flames of chaos not having been smothered. This seed was a very simple one: take full control of the government until a clear path was more visible. A radical seed sure, but compared to what the 'plan' seemed to be it would be a better idea.\n\nWith courage in hand, Perry got up from his chair and walked toward the makeshift podium. The conversation over how to ration the food quickly died down has everyone watched Perry walked. A feeling of dread swept in as Perry got close to the podium. Despite this, no one did anything to stop him. He started explaining his plans for the future and stating that he would be in full control unless anyone wishes to challenge his efforts.\n\nTo his surprise, no one dared to."
 uncommon_event.5.a: "The seed has now sprouted."

 uncommon_event.6.t: "Not Alone"
 uncommon_event.6.desc: "Manuel 'Tony' Rodriguez had been residing in a military outpost near the only bridge on the island. The 'bridge' in question appeared to be unusable, from the looks of neglect and damage from combat. Strange to Rodriguez. He had been appointed one of the Commanders of the forces that were teleported to the island. He remind curious on what was on the other side of the bridge. From their view it showed only a far larger landmass then what they were on. What was more concerning was that movement was noticed from what appeared to be humanoid school supplies. No recon missions were done as the focus has been saving the population from starvation and as temporary police. \n\nHowever, with the situation dying down a bit Rodriguez had the resources needed to try a recon mission on the other side. It would involve a squad from the 143rd Infantry Regiment navigating the decayed bridge and making their way to the other side. Afterwards they would look around and report their findings. A fairly simple mission to Rodriguez and the squad. It was dated a few days before the 'event' happened. \n\nThe 'event' in question happened a few hours ago. It started with 3 unknown humanoids approaching the outpost using the bridge. Since no one has attempted this and what their intentions were the outpost went a full alert. Tensions rose the closer and closer they got. One of the soldiers screamed at them demanding to know this business. To the shock of everyone they were curious about us and the island. They claimed that the island we are on is called 'Dream Island' that disappeared due to unknown reasons. After some more exchanges in information the three left. Rodriguez rushed to state the new information they learned today."
 uncommon_event.6.a: "A New World."

 uncommon_event.7.t: "BREAKING NEWS: DREAM ISLAND RETURNS?"
 uncommon_event.7.desc: "It is unclear how or why it is now back, but reports from objects in Bridgetown who traversed the ruined Dream Island Bridge have stated that Dream Island is now back! However, these same reports also note that a foreign group of people now live on the island. They claim to be from the 'United States of America', more specifically a region called 'Texas'. These people, who refer to themselves as 'Humans', claim that they were brought here for unknown reasons. These humans seem to be more technology advanced than any area of Goiky. It is advised to not go to the island as they seem on edge and ready to attack for unknown reasons. Various breakaway states in Goiky have already claimed Dream Island as their rightful ownership. However, their power to express this claim is limited. It is believed that it's a matter of time before the Island is taken or..."
 uncommon_event.7.a: "That island is rightfully ours!"
 uncommon_event.7.b: "Really? After Goiky collapsed!?"
 uncommon_event.7.c: "Worrying..."

 uncommon_event.8.t: "Laying the Land"
 uncommon_event.8.desc: "The Island carried interesting features. It was around 630 acres in size, had a hotel which is now the government building, has a casino which is still being used as one, had 6 restaurants all of which turned into makeshift soup kitchens and stores, lasty the robots servants having been mostly stored in a makeshift warehouse with some being used by a few politicians.\n\nAbout 400 acres of land is free to be used as anything that is needed. 'Perfect for housing and some nice farmland', said Todd Staples in a conference with Perry and various company CEOs. These companies were either elements that were also teleported or are brand new companies, each wanting to prove themselves. Despite various CEOs wanting different projects such as a football stadium, Perry had agreed that the people needed to come first for anything else to be built. \n\nThis decisions comes right as outside of the hotel, a mother weeps. She was born and raised in Austin with a great childhood. She graduated at The University of Texas at Austin with a master's degree in nursing. From there after 15 years of rocky work she got married and later had a child. It seemed nothing could go wrong in her life. \n\nNow, 3 years after the birth, she watches the effects of an illness on her son. The pair were the only ones teleported, with the father being lucky (or unlucky) to not have been teleported. It could have been cured in the normal world, but the makeshift hospitals and staff have been overworked, undersupplied, and stretched to a limit that would only be seen in a war torn city. The son's eyes close, an within an hour he dies. The weeping only grows louder."
 uncommon_event.8.a: "Time is Ticking..."

 uncommon_event.9.t: "Questions of Morality or Money"
 uncommon_event.9.desc: "Surrounding a bunch of makeshift houses is a new building finishing near the end of construction. A proper building up to code with even electricity, a rare commodity only seen in the buildings that were already on Dream Island. Now the question is what the building should be once construction is finished. Food supply was still scarce, so many of the starving population want it to be soup kitchen. These demands have gone so far as they already have elected the person who would be in charge running it by the name of Isabella.\n\nHowever, possible plans have increased in compilations, as the newly reformed Whataburger corporation came to Secretary of State of Texas, Esperanza 'Hope' Andrade, office. They come with the offer that in exchange for ownership of the building, they would be more willing to work with the Texan Government directly. A tempting offer to Andrade, as their services could provide much needed food and supplies to the population at a better rate than some random individual. On the other hand allowing empowerment to the population would give a needed win for the struggling government.\n\nWhataburger gave Andrade 10 days to decide the outcome of the building. She immediately called Rick Perry and both discussed what action should be taken. After a few hours of talks, they both landed on..."
 uncommon_event.9.a: "'The starving people should come first!'"
 uncommon_event.9.b: "'The bigger picture!'"

 uncommon_event.10.t: "Watching from Above"
 uncommon_event.10.desc: "A disheveled woman glances behind herself to see another woman of similar age. Both stand in one of the many soup kitchen lines waiting for food. The kitchens have been working overtime and on limited supplies needed to run it. Today was an especially terrible day, was a big storm fell onto Dream Island.\n\n'Where is the will to go on?'' One of them asks the other.\n\n'Someone still has to be watching over us'\n\n'Under this anarchy?'\n\n'Regardless, we can't give in, not now or never.'\n\n'As if god is still watching...'\n\nJust then, as if magic had shown up from outside forces, the storm began to clear."
 uncommon_event.10.a: "And a rainbow became visible."

 uncommon_event.11.t: "Mobilization"
 uncommon_event.11.desc: "Ever since the teleport, our old military units have been trying to reorganize into the correct regiments. This includes elements of the famed 36th Infantry Division and the powerful 1st Armored Division. Today, the Texas State Guard has finally finished reorganizing into 4 brigades. The other units, however, are still taking their sweet time to be combat ready. Manuel 'Tony' Rodriguez and Anthony R. Ierardi have been making strides to get the units ready, but both predict it will take years for everything to be set."
 uncommon_event.11.a: "How does a unit take 'years' to be combat ready?"

 uncommon_event.12.t: "Mobilization, Continued"
 uncommon_event.12.desc: "The ground forces were not the only ones gathering themselves, but also the air force. Some of the planes were thankfully on the ground when the teleport happened. However, a good amount of them were in the air and had to make various emergency lands on Dream Island. Some reports even say that there may be more out there. Regardless, the air force is regoraining itself in a similar fashion to that of the army."
 uncommon_event.12.a: "If there was more elsewhere, would they have not radioed?"

 uncommon_event.13.t: "Shocking Values"
 uncommon_event.13.desc: "At one of the local clothing shops, an older man approaches the counter. For a few weeks it had mainly a bartering system here. People came in with a variety of items of value for clothes, that was just how it was since the dollar seemly lost all of it's value despite the efforts made by the Texan government. Well that was...\n\n'What do you mean you only take dollars?', asked the man in a agitated tone.\n\n'Sorry, it's store policy sir.', reliped the younger women who was the clerk. \n\n'It was not like that yesterday!'\n\n'It was updated recently.'\n\n'By your ridiculous management or the idiots in the government!?'\n\n'Both...?'\n\nBoth stared at each other with neither making a move."
 uncommon_event.13.a: "But as the line grew behind him, he left and angrily marched towards the new bank."

 uncommon_event.999.t: "End Point"
 uncommon_event.999.desc: "Hello Map Painter! You have reached the end of this wacky and wild Texas ride. For some fun end game stuff new decisions have been added which includes war declarations! Thanks for playing this path! As for if it will be updated in the future, ask ZD*bbz if he is working on the actual content for the mod or is being lazy. If lazy, then you can bet that this path will be updated!\n\n- Pun (Who has never been to Texas)"
 uncommon_event.999.a: "Cool time to kill all of Goiky now >:D" #pun i think youre gay (Fuck you)

 #GFG
 GFG_event.1.t: "Iron Forces in Casland"
 GFG_event.1.desc: "The Transitional Government has shown its complete inability to resist the parasites from the council. In this regard, a government of National Revival was created, which would put an end to the arbitrariness of the national traitors with bayonets."
 GFG_event.1.a: "Goiky will be united!"
 
 GFG_event.2.t: "The Strong Rule"
 GFG_event.2.desc: "The last remnants of resistance against the Iron Hand were brutally suppressed. The Government of National Resurrection will never again allow anarchy to absorb Casland."
 GFG_event.2.a: "Heil Goiky!"
 
 GFG_event.3.t: "Long-lost Yoyleland"  
 GFG_event.3.desc: "For a very long time, rumors have been circulating around objects of Goiky about a forgotten region in the depths of the uninhabited northern continent. Legends about the mysterious disappearance of the local objects and about the incredible technologies and secrets these lands keep have spread widely across the Greeny Plains and have taken root here in Casland. Many of our ranks support the idea of continuity with this great northern race and believe that the modern objects of Goiky are its direct heritage."
 GFG_event.3.a: "Interesting."
 
 GFG_event.4.t: "Traitors"
 GFG_event.4.desc: "After our crushing victory over the communists and other bastards, we were able to catch many of them, and we can judge those traitors fairly. This process should show our future course and strengthen our power in the region."
 GFG_event.4.a: "Public execution!"
 GFG_event.4.b: "§RTOTAL TERROR§!"
 
 GFG_event.5.t: "Fanny takes command"
 GFG_event.5.desc: "Now that Casland is clear of traitors and factionists, it is time to put an end to the Triumvirate and bring forward the true Leader of the Objects of Goiky. Fanny will lead us forward, straight to unification!"
 GFG_event.5.a: "Heil Goiky!"
 
 GFG_event.6.t.a: "Basketball accepts our offer"
 GFG_event.6.t.b: "Basketball rejects"
 GFG_event.6.desc.a: "Basketball agrees to work in our new government cabinet for the glory of the Goikean Nation!"
 GFG_event.6.desc.b: "Basketball rejects your offer to work in the new government."
 GFG_event.6.a: "Welcome!"
 GFG_event.6.b: "Damn."
 
 GFG_event.7.t.a: "Remote accepts our offer"
 GFG_event.7.t.b: "Remote rejects"
 GFG_event.7.desc.a: "Remote agrees to work in our new government cabinet for the glory of the Goikean Nation!"
 GFG_event.7.desc.b: "Remote rejects your offer to work in the new government."
 GFG_event.7.a: "Welcome!"
 GFG_event.7.b: "Damn."
 
 GFG_event.8.t.a: "Puffball accepts our offer"
 GFG_event.8.t.b: "Puffball rejects"
 GFG_event.8.desc.a: "Puffball agrees to work in our new government cabinet for the glory of the Goikean Nation!"
 GFG_event.8.desc.b: "Puffball rejects your offer to work in the new government."
 GFG_event.8.a: "Welcome!"
 GFG_event.8.b: "Damn."
 
 GFG_event.9.t: "Resistance is supressed!"
 GFG_event.9.desc: "The last serious cells of opponents of our National Revolution have been defeated, and the Casland objects are entering a new, happy era!"
 GFG_event.9.a: "Heil Goiky!"
 
 GFG_event.10.t: "Path to Unification"
 GFG_event.10.desc: "Now that Casland is at the height of its powers, the Government of National Resurrection can begin to defeat the surrounding traitors. Our first goal is the Alliance."
 GFG_event.10.a: "Forwards!"
 
 GFG_event.11.t: "Moving Forwards"
 GFG_event.11.desc: "Thanks to the kind-hearted work of our objects and their national unity, Casland is rising from ruin, and we no longer feel the dire consequences of the political crisis."
 GFG_event.11.a: "New Casland."
 
 GFG_event.12.t: "Call of the Ancestors"
 GFG_event.12.desc: "Our great ancestors from the Northern Civilization are calling our objects to a sacred battle in the name of destroying all unfaithful! Anyone who stands in our way will be crushed by the might of descendants of the Yoyleland!"
 GFG_event.12.a: "Let us raise the sword above their heads!"
 
 GFG_event.13.t: "Pillow takes on the role of Supreme Leader"
 GFG_event.13.desc: "The inevitable result of our great National Revolution was to set a course for restoring the greatness of our ancestors and Northern Civilization. All Casland objects unanimously support the mighty impulse for the holy battle against traitors and heretics!\n\n§1Long live Yoyleland!§!"
 GFG_event.13.a: "Eternal Glory!"
 
 GFG_event.14.t: "The Last Congress"
 GFG_event.14.desc: "The remains of the previous cabinet were all here, when Fries entered the room. Perhaps, the most important person in this trial. All eyes were directed at his face, which emotionlessly listened to accusations of resistance to the National Revolution, betrayal of the Goikean nation and many other lines. Only when the announcement was over, his cheekbones did move."
 GFG_event.14.a: "He yawned."
 
 GFG_event.15.t: "Expedition"
 GFG_event.15.desc: "After long hours and days of traveling through the Goiky Canal, the group finally encountered the shores of the northern continent. No object has set foot here for several years, and this land is fraught with many secrets."
 GFG_event.15.a: "We'll go to the Northeast."
 
 GFG_event.16.t: "A City"
 GFG_event.16.desc: "After several more days of wandering and navigating by the stars, the group saw the concrete jungle of Yoylecity on the horizon. The city greeted visitors with silence and a faintly burning, never-setting sun."
 GFG_event.16.a: "Absorbing silence."
 
 GFG_event.17.t: "Return of the Group"
 GFG_event.17.desc: "Finally, after long days of waiting, the expedition returned with many interesting things. However, one of the group members has disappeared due to unknown circumstances, and the other is raving about some kind of 'leaf'."
 GFG_event.17.a: "Revealing the cards!"
 
 GFG_event.18.t: "Culture"
 GFG_event.18.desc: "Our expedition managed to obtain priceless fragments of the ancient Yoyleland civilization. We must use the treasures of our ancestors that we have obtained for the sake of reviving their great culture."
 GFG_event.18.a: "Forwards!"
 
 GFG_event.19.t: "Language"
 GFG_event.19.desc: "The Yoyleland alphabet on faded, ancient paper lay on the table in front of Pillow. The hypnotic forms of the hieroglyphs made the Leader fall in love with them."
 GFG_event.19.a: "Approved!"
 
 GFG_event.20.t: "Nation"
 GFG_event.20.desc: "The perplexed residents of Casland listened to the radio broadcast.\n\n'From now on, there is no longer any 'Goykian' nation. We are Yoylese!' - The speakers rang with enthusiasm, and the new Yoylese objects listened to them."
 GFG_event.20.a: "Purple flag."
 
 GFG_event.21.t: "Succesful Agreement!"
 GFG_event.21.desc: "Our diplomats successfully managed to conclude a pact with the Southern government. Now everything is ready to attack north!"
 GFG_event.21.a: "Perfect!"
 
 GFG_event.22.t: "Negotiations Fail."
 GFG_event.22.desc: "Unfortunately, our diplomats were unable to sign a pact with the southern government. Looks like they are planning against us..."
 GFG_event.22.a: "Damn."
 
#YFC

 YFC_event.1.t: "The Company with a State"
 YFC_event.1.desc: "We, The Yellow Face Corporation, have decided that we need our own place to conduct business operations. Our employees have taken a pledge to live in one of the many cities the Corporation has control of (and of course we threatened to lower pay if they refused), but the government's legitimacy is still quite low. It is important that we allow other companies to reside in our nation, and allow a free and fair market to prosper. After all, we don't want to have everything be government owned, less we fall into socialism.\n\n§RFor now, we must balance our budgets and equipment correctly...§!" #Minor way of telling the player to not waste their money
 YFC_event.1.a: "Better Dead Than Red!"

 YFC_event.2.t: "The Southern Bandits"
 YFC_event.2.desc: "Yesterday, Pipe, head of the Rail Road Sector, came all the way from our foreign investment project in Navgornyv to inform Yellow Face about a recent event. They claimed that their employees were attacked by savage bandits, and that several thousands of funds, as well as dozens of galvanized steal bars, were stolen from the building they had been operating in. They sadly informed us that profits would be down until they can recover. This incident, however, wasn't isolated. Other countries, such as the Southern Rail Road Administration, and Numismatia, have reported that they've had similar, and sometimes quite brutal attacks take place on some of their facilities near their border with Eraser's Bunch. \nAdditionally, today, Yellow Face recieved a letter from Eraser himself, asking for the Corporation to allow them to travel through our territory to \"gain wealth and stimulate the economy.\" Despite the fact that Eraser is obviously lying about his intentions, this does bring up a good point. Should we let Eraser's men travel through the country?"
 YFC_event.2.a: "If they want free passage, they can come and take it!"
 YFC_event.2.b: "We could allow them to travel through our territories... for a price."

 YFC_event.3.t: "Message from South Rail Road Administration"
 YFC_event.3.desc: "Wrench, from the South Rail Road Administration, has recently sent corporate a message. They stated that they no longer wish to control the city of Navgornyv, due to its proximity to The Bunch. They have offered to sell this territory to us for very cheap. Wrench, in addition, stated that they also want to continue working with our Railing Sector, despite still not wanting to have official diplomatic relationships with any country. If we don't accept this offer, they will probably just keep the territory, and if they don't manage well, the city could fall under Bunch control."
 YFC_event.3.a: "Who the hell says no to cheap land?!"
 YFC_event.3.b: "They can pry my money out of my cold dead hands if they wish."

 YFC_event.4.t: "Numismatia wishes to collaborate"
 YFC_event.4.desc: "Numismatian ministers have recently sent a message to our Military Sector, stating that they wish to help us in our war with Eraser's Bunch. This has come at no surprise to anyone in our government, as this outcome seemed likely just days after we established our anti-bunchivist diplomatic measures."
 YFC_event.4.a: "Brothers in arms!"
 YFC_event.4.b: "On second thought..."
 YFC_event.4.c: "Uhhh, that letter is a little late..."

 YFC_event.5.t: "MONEY!!!"
 YFC_event.5.desc: "Weekly Report 62, Military Sector \nMONEY!!!\n\nRecently, after the capture of the Bunch's \"capital\" (no more than a silly community of savage raider individuals, but we must call it what they do), we found a building with stockpiles of pure gold in it! We have ordered our soldiers to count it, and when they finish we will be sending it straight to Yellow Face himself. Isn't this great? MONEY!!\nEnd Transmission."
 YFC_event.5.a: "The soldiers better not pocket it!"

 YFC_event.6.t: "Moment of opportunity"
 YFC_event.6.desc: "With our friends to the north fighting the anarchical bandits, we have a unique chance to ambush the raiders in the south to help the corporation. Our top generals and marshals have discussed with Credit Card, and we came to the conclusion that it may be the right time to join the war, and aid our friends... and take some 'wealth'."
 YFC_event.6.a: "Send the telegram!"
 YFC_event.6.b: "Not worth it..."

 YFC_event.7.t: "Stab in the back."
 YFC_event.7.desc: "After weeks of no response, it's clear that Yellow Face wishes for us to not enter the war. Maybe he thinks that the war should stay local or he only wants the wealth for himself. Either case, the generals are itching for a fight so it might be worth it to annoy our friends."
 YFC_event.7.a: "Roll Out!"
 YFC_event.7.b: "We'll stay."

 YFC_event.8.t: "INCIDENT #46"
 YFC_event.8.desc: "It had only been a week since Checkpoint B had been set up along the supposed \"border\" between the Corporation and the Bandits. The day of the event was like any other, few refugees crossing, some arrests, and the random machine gun on an object. The day was wrapping up like any other... \n\nUntil, during the night, Checkpoint B's guards spotted a mass amount of objects heading towards them. They claimed that there were \"open borders\" and that the guards at the checkpoint had no real authority. After much heated shouting, a gunshot rang out which led to an open battle. They were not refugees, but were bandits. They tried to storm the checkpoint from the small number of guards protecting it. Despite all odds, the guards held their ground and made the Bandits pay for each step forward. Even after the checkpoint was taken, the guards fell back inland and kept the fight on. One interesting report was that a squad of eight held up in a cabin, lead by Vodka Bottle, fought off a force of around a hundred objects and only lost three objects in the five hours of fighting. \n\nNight became day with the engagements only heating up. With the help of reinforcements, the combined forces pushed the Bandits back to the checkpoint. Only when nightfall arrived did the Bandits retreat from the checkpoint. The checkpoint was retaken the next day. Many of the objects that took part in the engagement have earned medals for their bravery. The overall death toll is still being counted, but both soldiers and civilians were harmed in the fighting. No response has come from anyone in the Bandit lands. "
 YFC_event.8.a: "Rapid Escalations..."

 YFC_event.9.t.a: "Question of Yellow Face" 
 YFC_event.9.t.b: "Breaking of Trust" 
 YFC_event.9.desc.a: "It's no secret that the Yellow Face Corporation has been 'buddying up' with the bunch of bandits in the south of the continent. We've also gotten reports that some other countries have already began embargoing the YFC, in hopes that they'd end the partnership before it gets out of hand. We also hold these same convictions; a raider-state spreading across the continent would be horrible for the livlihoods of our people. Though, on the otherhand, the income we gain from selling parts of our surplus does help us out quite a bit, economically speaking. Is it a wise decision to embargo the Corporation?"
 YFC_event.9.desc.b: "We have received information that Yellow Face, whom we just started trading with, is now working with the raiders to the north. With this early betrayal by the Company, it has been decided that we seize some assets and cut trade with them. Auf Wiedersehen mit ihnen!"
 YFC_event.9.desc.c: "The Yellowfacers have done it again. After a night of perusing through senseless spam mail, a delegate has found out that the Yellow Face Corporation has, once again, gone behind our backs and betrayed our trust. Though, this time, we're looking to cut ties for good. The Yellowfacers are now officially allied to the raiding group just north of us, meaning that they have likely been sponsoring the various raids and robberies that this group has been conducting on our cities and towns within the past months. A majority of our delegates are in agreement, we should fully cut ties with The Yellow Face Corporation. Are you in agreement?"
 YFC_event.9.desc.d: "We see the writing on the wall. It is no secret that no one else on this entire continent supports Yellow Face anymore. Really, we're just in it for the money, regardless, but it looks super bad on us if we keep supporting the YFC. With a heavy heart, we've decided to embargo the company, just like the rest of the continent has... Right? That's what we're doing, right?" #large stability and pp hit if no
 YFC_event.9.a: "Yes!"
 YFC_event.9.b: "We should just wait this out... for now." #See focus
 YFC_event.9.c: "We do not negotiate with Terrorists!"

 YFC_event.10.t.a: "Tragic News!" 
 YFC_event.10.t.b: "Connections Severed." 
 YFC_event.10.desc.a: "[FROM.GetName] has embargoed us!"
 YFC_event.10.desc.b: "On a calm afternoon at the corporate office, a strongly worded letter was handed in from who we thought would stand in solidarity with us forever. The Numismatians have, idiotically, decided to break all ties with us. This is, obviously, a horribly stupid and egrigious act on their part, but what's even worse is that they decided to PUBLICIZE this decision. They've broadcasted to every publication that'd listen that we're working with 'pillagers' and 'arsonists'. Don't they know anything about business? We obviously don't support everything that the Bunch does; it's for money. Numismatians, of course, frequently work with socialists, but our esteemed corporate employees don't speak ill of them. It's just money. It's profit. It's the game. \nIt gets even worse; they've also been telling news networks that they've ideologically split from us, and have denounced our economic system as 'Crony Capitalism.' They claim that their economic is the only true capitalistic mode of production. Numismatian buffoonery, from this day forward, knows absolutely no bounds. We have no interest in ever working with them again."
 YFC_event.10.a: "They don't know anything! They're... purple!"
 YFC_event.10.b: "Such 'useful' allies!" #For CRN

 YFC_event.11.t: "How Much?"
 YFC_event.11.desc: "It is no surprise that the large sums of money that Eraser managed to stockpile in his months as a plunderer could be useful for our industrialization efforts, however, many of our Sectorial leaders have been in open debate about the exact amount needed. In an attempt to ease the tensions between the Sectorials, Yellow Face decided to step in and make a concrete decision. He stated that we will be..."
 YFC_event.11.a: "Taking None."
 YFC_event.11.b: "Taking Some."
 YFC_event.11.c: "Taking Half."
 YFC_event.11.d: "Taking Most."

 YFC_event.12.t: "Brand new faces!"
 YFC_event.12.desc: "Recently, we've heard reports from eastern companymen that a steadily growing population of Teardroppers have been coalescing within our borders. They claim that they are from the Beach Territory, and that many of them have been leaving in droves due to overcrowding. Additionally, it seems these teardropper clones have taken on appearances quite different to that of Teardrop herself. Someone who seems to be the \"community organizer\" type, who calls themselves Dewdrop, barely even resembles the former BFDI contestant. Regardless, these new Teardroppers do indeed pay tax, so, we shall not interfere with their happenings."
 YFC_event.12.a: "What an interesting group!"

 YFC_event.13.t: "What to Do With The Head?"
 YFC_event.13.desc: "After an extraordinarily long trial, which, honestly, seemed much more like a debate, a decision was made. For nearly the entire night, the sectorials stood, heatedly arguing amongst themselves, as to the fate of the previous leader of the petty raider \"state.\" Eraser was essentially absent from his own trial, being left in a cell in the corner of the court house. It was not unlikely that the sectorials had collectively forgotten about his presence. Well, except for Pipe, who was making crude drawings of the object getting poked and stabbed in various ways. What exactly was wrong with our company's executives? Yellow Face had fallen asleep by the time the final decision was made. After quickly being woken up, and informed of the consensus by Top Hat, Yellow Face read the final sentence, of:"
 YFC_event.13.a: "Acquitted of all charges and able to join the company!"
 YFC_event.13.b: "Sentenced to 30 years hard labor!"
 YFC_event.13.c: "Executed by firing squad!"

 YFC_event.14.t: "Plundering Plunder"
 YFC_event.14.desc: "Out of many of the discussions that the sectorials and Yellow Face had, this one lasted only a few minutes. Who was going to stop us from \"relocating\" their money? The air in our conference room? Besides, this wealth will be put to far better use under our control, compared to simply laying around for anarchist use.\nA week after the very obvious outcome of the vote, Blocky entered the warehouse which stored the vast wealth of the former bunchivist nation. He took one last look at it all, as if a chapter of his life had ended, and a new one took its place. Even though he should've feel some sort of emotion, perhaps sorrow, anguish, even regret..."
 YFC_event.14.a: "Nothing was felt...?" #800K Taken

 YFC_event.15.t: "Trade Routes Along the Sea" #fires right after finishing YFC_focus_scope_out_sea_trade
 YFC_event.15.desc: "It has come to our attention that, according to some of our denizens living farther east, the Sea of St. Rocky is significantly closer than we previously thought. Seizing the opportunity to expand our trade routes by way of this sea, although it may be costly in the short term, could bring great profits. Obviously, we would need to have more educated individuals get a proper look at the area, as to determine which place would be best to set up a small port for the time being. \nThe easterners that contacted us did indeed say that they would be perfectly fine with conducting field assessments of the area. However, are we sure that it would be wise to trust the people of Peoniele and Yoyleton to give accurate information on their own?"
 YFC_event.15.a: "The people know their land, let them assess it." #takes longer to get event 16
 YFC_event.15.b: "The costs are faster than the barbarians!" #Reworded so it tells the player that this is faster

 YFC_event.16.t: "RE: Trade Routes Along the Sea"
 YFC_event.16.desc: "The small squadron we sent to examen the east has returned to us, showing their findings. It seems as if there are many locations that could become a small, profitable port. According to them, a couple of pieces of the east jut out into small peninsulas, with which shipping could be made easy. For now, we've ordered them to set up shop (literally) at the nearest spot they could, however, should we expand further, the east could become extraordinarily profitable. Unfortunately, it seems as if some sectorials aren't currently on board with this idea, citing that we wouldn't be able to properly devote our time to this endeavor. They are likely right, sure, however this definitely would not hurt to attempt in the future."
 YFC_event.16.a: "At least we have a good foothold!" #gives some money and state 225, setting the vp there to 12 instead of 1 (RE: Just gonna turn this into a VP, can be increased later)

 YFC_event.17.t: "On the Prisoners of War"
 YFC_event.17.desc: "In recent talks, Blocky brought up the idea of releasing the several extremists we took as prisoner during the war. We had indeed jailed many, giving them very long prison sentences for the many crimes they had committed. However, releasing them would make Blocky look like a hero, which would likely boost his suppport in the former Bunchivist lands. Everyone knows our populace to not really care for what may be happening elsewhere, so we have not to worry of their opinions in this deal. Though, the Sectorials have repeatedly stated that they do not want many of them to be released. Beaker specifically stating that we had \"no reason to appeal to those criminals,\" and Top Hat agreeing, saying that \"the barbarians to our south deserve not our respect.\" So then, what shall the fate of the POWs be?"
 YFC_event.17.a: "Release only the non-combat role ones."
 YFC_event.17.b: "Release mainly the lower ranks."
 YFC_event.17.c: "Release nearly everyone."

 YFC_event.18.t: "Upcoming Debate!"
 YFC_event.18.desc: "The campaigning process of the last few weeks has been quite samey, some objects stating that they likely won't vote for any candidate. Numismatia abhors this reality, saying that it is \"imperative that the people vote,\" for some reason. In order to make things more interesting for the common Bunchivist, Numismatia has decided to host a debate in Snowpath, between the candidates. Eraser and Pen have both already planned to attend, meaning that Blocky will likely want to follow suit. Obviously, we would want Blocky to be take part in this debate as well, seeing as this could be a good opportunity for him. This could be our chance to ensure victory in the polls. A profitable puppet is more than worth investing in."
 YFC_event.18.a: "Can we bribe the judges?"

 YFC_event.19.t: "The Face of a New Bunch"
 YFC_event.19.desc: "Blocky sent a letter through the mail only a few days after the Bunch fell, stating he wished to work with us. Over the months, we kept this letter in mind, and today, he came to remind us of this offer. Numismatia has been really obsessed with the idea of the former anarchical lands \"democratically\" \"electing\" a new leader for themselves, however none of our sectorials really know what those words mean. Regardless, they told us to put forward a candidate on the same day that Blocky made his visit. He outlined big plans for the former anarchist lands, and profitable plans, at that. In all honesty, his willingness to work with us seems a bit strange. Though, who would we be if we didn't endorse his candidacy?" 
 YFC_event.19.a: "We'd be fools, broke fools at that."

 YFC_event.20.t: "Blocky's Bunchivist \"New Deal\""
 YFC_event.20.desc: "Though we've not really been paying close attention, it does seem as if the election has been going well. Blocky has been campaigning on the idea of big reform, but until today, he hadn't really spoken about what he was planning. Recently, he visited Yellow Face and the Sectorials, laying out his exact plans for the former terroristic nation of the Bunch. Blocky seems to intrinsically understand the very fabric of the nation from which he hails, seeing as his ideas for national unity work well with the ideas your average bunchivist already has. For starters, he wishes to make transportation between bunchivist settlements affordable, and efficient. He wants to make Podgornyv a real city, with real jobs, and do as such for most other settlements. He wants to allow former bunchivists, regardless of their criminalities, an easy path to freedom, so long as they act as any good capitalist would. Lastly, he seems to have quite the \"chilled out\" immigration policy, so to speak, which most bunchivists seem to love. \nIn short, Blocky is surprisingly not as stupid as we believed him to be; integrating these plans into his rallies and whatnot would surely win him the election. Why he asked for our permission, we don't know, because"
 YFC_event.20.a: "It's very clear what our answer will be." #doing this focus makes blocky gain votes faster or something idfk (#RE: Just like 3 or something I got this)

 YFC_event.21.t: "Complications in the Military District!"
 YFC_event.21.desc: "Seeing as the rotten, filthy communists to the north have invaded our ally, Coiny has asked for us to return all assistance, as they will need to move back in order to defend his country. It's, unfortunately, a fair request which we cannot deny. The outcome of the war will be unknown, if anyone even will win. We could send aid to Coiny...\n\nThough, should we?"
 YFC_event.21.a: "Send Volunteers!"
 YFC_event.21.b: "Our hands are too tied at the moment..."

 YFC_event.22.t.a: "On the promotion of Peoniele"
 YFC_event.22.t.b: "Enlargement of Yoyleton, Yellow Face Corporation"
 YFC_event.22.desc.a: "Ah, Peoniele. \nHer flowers and meadows, tranquil and alone, have seen a small amount of trampling from the objects, moving lumber into the town square, and the vans, housing cement and other building goods. Peoniele's natural beauty is one of the things most treasured by the city's population, some of them are even protesting us building here at all. But, profits are to be made, and bigger buildings for more jobs certainly correlate with higher per capita incomes. Incomes which will be siphoned to us, of course. In the mean time, let us decide how big should we go here." 
 YFC_event.22.desc.b: "Strangely, Yoyleton's small teardropper population has been essential in helping us with our current tasks. We've been working on adding a couple of water features to the city, to attract tourism (we say it's to make life easier for them), and they've been giving great pointers to our engineers and architects who are... less versed... in building with water. Despite the pay cuts we need to issue, things seem to be going well. However, after we're done with the water features, how much bigger should this city be?" 
 YFC_event.22.a: "It just needs a little bit extra." 
 YFC_event.22.b: "Let us flesh out this city more, it's feeble." 
 YFC_event.22.c: "Pure economic opportunity is in the palms of this city's planner. It shall be the YFC's largest." 

 YFC_event.23.t: "Peoniele, The Second City" #Mixed
 YFC_event.23.desc: "Following our large investments into the city of Peoniele, we have seen massive increases in profits. The pockets of our Sectorials are lined more than sufficiently, and even the average employee has gained a few extra dollars for their hard work. Sure, the population of Peoniele herself haven't been the most enthusiastic about the large swaths of people moving to the city, but who cares for their opinions when profits have never been higher? Some environmentalist groups have formed in the city, who preech about 'keeping the beauty,' and what not, but what's more beautiful than the color green? An ignorant populace is easy to ignore, but what we have neglected to ensure the comencing of operations on the other development project we were seeing to, Yoyleton. It was in a great position for trade with the north, so it is a shame that we failed to take the opportunity. Regardless, the population there seems to care not, so at least they are good with what they have been given."
 YFC_event.23.a: "Show me a money spread, Peoniele."

 YFC_event.24.t: "Peoniele, The Second City" #Good
 YFC_event.24.desc: "Following our investments into the city of Peoniele, we have seen great increases in profits. The pockets of our Sectorials are lined more than sufficiently, and even the average employee has gained a few extra dollars for their hard work. The existing populace seems to quite enjoy our changes too, so that's good too. Unfortunately, it seems as if we accidentally neglected so industrialize Yoyleton, which seemed like the promising location, all things considered. Regardless, we have a second stable source of money, and it seems to be growing by the day, seeing as Peoniele's population count has tripled."
 YFC_event.24.a: "A great investment."

 YFC_event.25.t: "Beacons of the East" #Good
 YFC_event.25.desc: "Our investments into our eastern territories have born fruits beyond our wildest capitalistic dreams! Our returns have been, quite frankly, absurd. Every Sectorial's pocket has been dashed more than sufficiently, and even the average menial laborer has seen a more than noticeable pay increase. Despite Peoniele's unsatisfactory growth, according to some of the architects who were designing the city, it seems to have become sort of a tourist attraction across Goiky, due to its natural beauty. Sure, \"natural beauty\" isn't all that important, but everyone knows that a tourist is just a walking wallet. Yoyleton has become a bastion of Northern trade, with objects from all over paying visits just to buy and sell. Some independent companies have even started profiting up there, inspiring the competition needed to get our employees to work harder. Of course, these new companies still pay taxes, and who exactly do those tax dollars come back to?"
 YFC_event.25.a: "Back to us!"

 YFC_event.26.t: "Missed Opportunities" #Bad
 YFC_event.26.desc: "Our investments into our eastern territories have been for not. Whether by way of incompetant architects, or through the neglect of leadership, we have failed to allow our eastern territories to bare fruits. Peoniele looks nearly the same as it did before our investing, the same boring fields of flowers, and small, grass covered houses. Yoyleton is quite a similar story as well, unfortunately. Though the inhabitants of these areas are quite happy with our changes, their opinions are, quite literally, worthless. We gain no profit from bringing \"happpiness\" to the existing populace. In fact, it seems as if we've lost a sizeable amount of money from this endeavor. Maybe with better planning, this experiment could've gone over better."
 YFC_event.26.a: "I hope someone gets fired for this blunder."

 YFC_event.27.t: "Expansion of Northern Trade" #Good
 YFC_event.27.desc: "Our investments into our eastern territories have born dilectable fruits! Our profits have been noticeably higher over the past week, and we -- the company executives, obviously -- have reaped our due benefits. We've managed to establish trade routes with the Teardroppers and Davidians, which is where most of our profits have hailed from. Additionally, we've managed to strengthen our formerly weak routes to the Military District, which has been a nice benefit. The population of Yoyleton, though their opinions obviously do not mater much, seem to be quite happy with the changes we have made. Some lunatic named Dewdrop had claimed that they had always been weary of our rule, but the moderate upgrades to the city quelled their 'revolutionary' feelings. Whatever that meant. \nIn hindsight, it does seem as if we had forgotten to invest into Peoniele, which did net us some slight losses, however the gains from Yoyleton have more than made up for this. Perhaps Peoniele was a lost opportunity, however, for now, we frolic."
 YFC_event.27.a: "Frolic in the enhancing of free trade!"

 YFC_event.28.t: "A Great Mistake" #Bad
 YFC_event.28.desc: "It seems as if our investments into the eastern territories have failed. Not only have many assessed our reworking of Yoyleton to have been far too small, we have entirely neglected Peoniele. The costs for attempting to enlargen Yoyleton and the losses from our neglect of Peoniele far outweigh and profit we gained from the new people moving to the cities. Sure, the population of the cities seems quite okay with being left alone, but who cares of that? Our Sectorials most certainly don't, seeing as they are openly criticizing the actions taken in attempting to develop the city. Peoniele looks nearly the same as it had before, and Yoyleton leaves a lot to be desired."
 YFC_event.28.a: "We could've done better..."

 YFC_event.29.t: "The New Market"
 YFC_event.29.desc: "We had received an interesting telegram. The Yellow Face Corporation, led by Yellow Face, has informed us about business opportunities with them. They are willing to make deals in a way of a pawn shop as they are willing to both buy and sell equipment. While we may or may not need this now, it will be a valuable tool that we should use carefully." 
 YFC_event.29.a: "Very interesting!"
 YFC_event.29.b: "We are sadly not in a position to use it yet!"

 YFC_event.30.t: "Peoniele, the Metropolis of East Goiky" #Mixed
 YFC_event.30.desc: "Our investment into the city of Peoniele has paid of more than favorably! The pockets of every single corporate employ have been filled significantly, especially those of the Sectorials. Those Sectorials in question seem to be quite happy with our investments, even dispite the neglect of Yoyleton. The profits earned from this endeavor are more than enough to fund future Yellow Facer projects, to the point money is barely a concern to us. On the expense end, of course; profits shall never stop! Some do seem to be concerned with the reactions of the Peoniele populace who had lived there before our improvements, citing how angry they seem about the removal and trampling of their natural flower fields. Why a people would care for plants is beyond the heads of corporates. It's amazing how little the opinions of people like that contribute to the amount of profits we make."
 YFC_event.30.a: "Finally, it's a real city!"

 YFC_event.31.t: "Interesting discovery."
 YFC_event.31.desc: "After months of trying to figure out why production was being slowed, we found our answer. It seems that our agreements made with Yellow Face have a minor detail we were left out of. In the agreements of cooperation we made, they were given access to some of our factories. It seems that they were funneling weapons to them without us. While bad, we still need to maintain good relations with them. They have lots of money, so we can reach a deal with them."
 YFC_event.31.a: "It's not that big of a deal for now."
 YFC_event.31.b: "Let's just end these shenanigans."
 YFC_event.31.c: "Maybe we could make a rearrangement."

 YFC_event.32.t: "Coiny finds out!"
 YFC_event.32.desc: "So, it seems that the hidden funneling of weapons was found out. It was expected sadly, as this loss of production to them was to be noticed. Nothing has been said from the district as of now. It seems that this will not be discussed on either side. For us, we will have to just sell and buy equipment until a new opportunity occurs."
 YFC_event.32.a: "So be it."

 YFC_event.33.t: "Deals with the District."
 YFC_event.33.desc: "So, it seems that the hidden funneling of weapons was found out. It was expected sadly, as this loss of production to them was to be noticed. However, what is more interesting is that Coiny is willing to sell a permanent factory in exchange for a high price. Since we have to buy and sell equipment and can't make our own, this could bring long term profits and a better army. Though is the price worth it?"
 YFC_event.33.a: "We'll buy it!"
 YFC_event.33.b: "We'll pass."

 YFC_event.34.t: "[FROM.GetName] have accepted our deal!" #Don't rewrite
 YFC_event.34.desc: ""
 YFC_event.34.a: "Great!"

 YFC_event.35.t: "[FROM.GetName] have denied our deal!" #Don't rewrite
 YFC_event.35.desc: ""
 YFC_event.35.a: "Huh."

 YFC_event.36.t: "New Yellow Face Deal!" #Don't rewrite (For buying X stuff)
 YFC_event.36.desc: "We have received a new deal from the Yellow Face Corporation which is the following:\n\n§GYellow Face is willing to sell [selling_deal_equipment_type] that we have requested.§!\n\n§RFor [?trade_cost_show_var]K dollars.§!\n\nShould we take the deal?"
 YFC_event.36.a: "Accept!"
 YFC_event.36.b: "Deny!"

 YFC_event.37.t: "New Yellow Face Deal!" #Don't rewrite (For selling X stuff)
 YFC_event.37.desc: "We have received a new deal from the Yellow Face Corporation which is the following:\n\n§RYellow Face is willing to buy [?ROOT.selling_amount] equipment that we are selling.§!\n\n§GFor [?trade_cost_show_var]K dollars.§!\n\nShould we take the deal?"
 YFC_event.37.a: "Accept!"
 YFC_event.37.b: "Deny!"

 YFC_event.38.t: "Yellow Face demands our resources!" #SRI refers to the player as boy, because the SRI is an eighty year old man who has been in the mines for 2 thirds of his life
 YFC_event.38.desc.a: "Uh, this morning, a large piece of paper hit some poor mining man. Now, the paper says it came from the Yellow Facers, to the north of us, and that they're asking us for partial resource rights, in exchange for protection. We don't really know how they managed to not contact anyone who actually works in the government, but anywho, it's looking pretty promising. Do we accept, or deny, boy?" #:sob:
 YFC_event.38.desc.b: "" #ZDubbz, just a version for raiders. Should only have demands resource rights or war
 YFC_event.38.a: "Accept!"
 YFC_event.38.b: "Deny!"

 YFC_event.39.t: "The Northern Ridge Response"
 YFC_event.39.desc: "We received an amazing response from the Ridge today! They seemed quite a bit confused in their response, whatever that might mean, but they did indeed agree to our offer! Additionally, it seems as if we managed to send our first letter to the wrong address, so we definitely need to fire someone. Though, regardless, this is a great opportunity!"
 YFC_event.39.a: "I can smell the resources from here..."

 YFC_event.40.t: "The Northern Ridge Response"
 YFC_event.40.desc: "We received a pretty confusing response from the Ridge this morning. They didn't seem to understand our request for resource rights. Instead, they started saying something about 'national integrity,' before going on a three paragraph tangent about how their leader had been coughing, quote, 'real bad,' since venturing into a new cave. We're not exactly sure what this means, but it does not seem as if they're looking forward to working with us."
 YFC_event.40.a: "He should really check out that cough..."

 YFC_event.41.t: "Yellow Face demands our subjugation!"
 YFC_event.41.desc: "Uh, apparently them company folk are asking us to be their puppet, boy. They're saying it's an 'Ultimatum,' whatever that means. Basically, we gotta accept it or get invaded boy. By the way, do you know where the mayonnaise is? I haven't been able to find it. And I've told you too many damn times to stop touching my food. But, yeah, either they puppet us or we go to war. Really, I think it'll just be a small skirmish, but, you know how them capital folk are. Always trying to start a fight. Well, what if I don't want a fight? Listen boy, I've been mining for as long as my memory goes back. All I want to do now is keep mining. Ain't much left in this life, I'll tell you what."
 YFC_event.41.a: "Accept!"
 YFC_event.41.b: "Deny!"

 YFC_event.42.t: "Fate of The Northern Ridge"
 YFC_event.42.desc: "The Northern Ridge has heeded our calls. They submitted to our subjugation and we now have full control of them. This new member of our alliance will not have the same perks as the others, meaning we won't have to give them much money. Really, they seem quite content mining, so, we'll let them keep doing that.."
 YFC_event.42.a: "YAAAAAY!!!"

 YFC_event.43.t: "Fate of The Northern Ridge"
 YFC_event.43.desc: "The Northern Ridge has denied our offer. They seem to already be mobilizing in preparation for war. Many of our sectorials are advising against actually attacking them, but if we don't attack, we won't have any resources rights at all. War, or the denial of benefits?"
 YFC_event.43.a: "It's not worth it..."
 YFC_event.43.b: "An ultimatum is an ultimatum."

 YFC_event.44.t: "Eyes to the East"
 YFC_event.44.desc: "The teardropper population has been rapidly spreading throughout northern and eastern Goiky. Anyone living there would tell you that, just a few years ago, it was rare to find a teardropper outside of the Beach Territory. Now? They're nearly everywhere. This, of course, comes from Beacher... overbreeding. Without getting into detail, the territory has become overcrowded, and their government is using it for political advantage, claiming lands in which the teardropper population exceeds a certain, arbitrary threshold. This, obviously, poses a threat on the small amounts of sea trade that we do through the lawless Eastern Seaboard. Though, if we claim and control those lands before the teardroppers can... perhaps we could keep it for ourselves?"
 YFC_event.44.a: "That would be perfect."

 YFC_event.45.t: "Dear Teardrop,"
 YFC_event.45.desc: "Hello. We have, unfortunately, traded letters before. Then, and even now, I can smell the essence of your sea-salty being upon the paper. You sicken me, not just in smell, but in demeanor and in personality. You are a rotten sort of individual, what with your ruling style, poor planning, uncoordination, I could continue, though, I'm not entirely sure of the reading capabilities that you may or may not have. I say this to say, I have absolutely no clue how any of your citizens, let alone your high command, could stand bearing witness to your ugliness. I would like to extend an apology, not to you, but to the populace of the Beach Territory, as I'm sure your stench wafts its way from Farbeach and back."
 YFC_event.45.a: "-Sincerely, Yellow Face (P.S., that droopiness at your top is hideous)"

 YFC_event.46.t: "Pickpocketting" #okay but consider that its really funny and that this is supposed to be the slightly wackier part of the tree
 YFC_event.46.desc: "Surely the citizens of the Bunch wouldn't notice any missing funds, they are far too poor to care about that sort of thing. This was, in essence, what Taser had been suggesting that we do for the past... well, however long. It's a fair idea to gain money, sure, but no one could really agree on what should be stolen. We've come down to three choices:\n1. We steal a large chunk of quartz from the large bank we built in Podgornyv. They are quite unlikely to notice it, or even blame it on a member of their own populace, if we do it correctly.\n2. We steal a small amount of pillars from the bank. This is quite a bit harder to pull off, considering it would involve removing large structural supports.\n3. Steal the whole bank."
 YFC_event.46.a: "Quartz chunk!" #Gain 200K, increases Taser influence by 2 (Side note come up with item we are stealing or remove my dumbass idea for normal money)
 YFC_event.46.b: "Quartz pillars!" #Gain 400K, increases Taser influence by 2, and some other bad thing but I have no idea rn
 YFC_event.46.c: "Entire bank??!!" #Gain 700K, increases Taser influence by 2, and some other bad thing but I have no idea rn
 YFC_event.46.d: "We don't need such actions." #Lowers Taser's influence by 2

 YFC_event.47.t: "Buying Boats" #For the boats
 YFC_event.47.desc.a: "The Davidians, our closest trading partners before their unfortunate economic collapse, are seemingly attempting to regain their monetary footing. Despite having to militarily oust their idiotic king (not a difficult task, surely), they are willing to give away some of their naval assets to fund our mission in the board, for a price. We had sent communications to various seafaring nations, and they were the first to respond. To headquarters, the Davidians said that they had found themselves \"entirely aligned with the idea of containing the teardropper population,\" and are \"willing to work with anyone to rid Goiky of those droplets.\" This is, certainly, not our policy or approach to dealing with teardroppers (we prefer to tax them heavily, as we do to everyone else), but, of course, the Davidians don't need to know this. If they are willing to sell their high quality boats to us for a relatively cheap price, who are we to say no to their... concerning ideas of teardropper eradication?" #if DAV is fascist
 YFC_event.47.desc.b: "The Davidians, our closest trading partners before their unfortunate economic collapse, are seemingly attempting to regain their monetary footing. Despite having to deal with a petty uprising (our friends had an easy time with this task, of course), they are willing to give away some of their naval assets to fund our mission in the board, for a price. We had sent communications to various seafaring nations, and they were the first to respond. To headquarters, the Davidians said that they had found themselves \"wanting to disable the teardropper threat before it comes to a head,\" and that they are \"concerned about the possibility of teardropper expansian into Hendalia [their southernmost island chain].\" This is, certainly, a reasonable line of thought; if the teardroppers wish to expand into the board, where else might they want to go? Additionally, it would be a great way to send the Davidians a message that they can still trust the Company, even after the troubles in Goiky." #if DAV is monarchist
 YFC_event.47.desc.c: "In all honesty, we weren't entirely sure that we would get a response after asking to make purchases for boats. To the outside world, it looks rather inane; we, de jure, do not border any coastal territory, but, de facto, we have most certainly been able to reach coastlines. Of course, with the sea comes the fleet; we need to be able to properly defend these coastlines. This is an abridged version of the concerns that we laid out in the communications we sent to the coastal nations of Goiky. And, for a short while, we hadn't any responses. Though, eventually, our message made its way to Saint Objectburg, and there, we found our trading partners. Now, their boats aren't of... the best quality. But they certainly aren't asking us for too high of a price, and they'll get the job done if we manage to surprise the teardroppers, which we are sure to do." #SOS
 YFC_event.47.a: "What a deal!"

 YFC_event.48.t: "Gobbled Up"
 YFC_event.48.desc.a: "We have nearly finished our conquest of the Eastern Seaboard. Though some view our conquests to be, for lack of a better word, unsatisfactory, dissent upon the mission can easily be disregarded. There is a certain tranquility to be found on this patch of sea that could easily be commodified. Perhaps, with these conquests, we could bolster tourism even further? Additionally, let us not forget about what is to be gained from direcct access to the sea. Sea trade is now more than ever, an easy alternative to the treacherous land routes of days past. Our conquests have brought us the potential for a great, profitable future. The game now shifts on to how we plan on using this opportunity."
 YFC_event.48.desc.b: "A report from the Eastern Seaboard has just arrived at corporate headquarters, unfortunately, carrying horrible news. Due to the abnormally high, and unexpected prowess of the teardropper menace, we have failed to connect ourselves to any viable port. Of course, we are an inventive company; this will not stop us from engaging in seafaring activities, it will simply make it more difficult. Our failure to establish formal control over a port only means that we will have to be stealthy about our oceanic endeavors."
 YFC_event.48.desc.c: "A report from the Eastern Seaboard has just arrived at corporate headquarters, incredibly, carrying the most wonderful news of the month! Due to our expertise in raiding, pillaging, invading, what have you, we have managed to control a sufficient amount of the Eastern Seaboard; an amount that allows us to properly connect our supply lines to one of the many ports along the coast. We have, so easily, bested the teardroppers at their game, and, so easily, can continue our assaults into the sea. We must, at once, begin building grand vessels, and keep moving where the money leads us."
 YFC_event.48.a: "What might our next point of interest be?"
 YFC_event.48.b: "Merely a set back." #Fail
 YFC_event.48.c: "Onwards to the waves!" #Win

 YFC_event.49.t: "Battalions of Force"
 YFC_event.49.desc: "Top Hat is an object of many, many suggestions. Earlier today, he had came to headquarters, wishing to offer Yellow Face some extra forces. Apparently, he has spare men lying around (From where does he procure these men?), and is willing to commit them to the operation of the seaboard, so long as he gains a sort of return. Of course, yet again, that return is a profit. Now, he certainly isn't asking for a large sum of money, however, some analysts have stated that the next fiscal quarter might be rougher for us at the Company. Just how far are we willing to take this game?" #tophat wants 150k
 YFC_event.49.a: "As far as it needs to go." #Increases TopHat influence
 YFC_event.49.b: "Soldiers are not essential; lets not overdo things."
 YFC_event.49.c: "Forsooth: Keep quiet for a time, yes? Perhaps forever?" #Lowers TopHat influence

 YFC_event.50.t: "Spoils of Efforts"
 YFC_event.50.desc: "Hammer has always been quite the vivid writer. Just this early morning, he had written a letter, and just this late afternoon, it arrived at central headquarters. It is reproduced below:\nYellow Face\n\nPipe and I were spending the morning surveying the development of our cause in the board. It was a nice, early morning. What with the sun, rising from its place across the vast sea, giving an air of freedom to all those who saw it from this particular position. The seawinds blowing loud, yet soft noise from the ocean, past the shore. It cannot be overstated how peaceful one could find themselves here. The vibrant, calming orange of the somehow rocky yet still well-forested slice of Goiky made no sense, sure, but truly, it felt like sense didn't matter to it. I could feel clearly how purposeful the board is; above all, it wanted to calm. This was a cause I could find myself at ease with. This is a cause I can find myself in awe of. But, unfortunately for the board, her majesty, there has been a petty conflict on these shores.\nLet me not get ahead of myself. Regardless of the board's beauty, there are indeed things to be gained, money to be made, and we have found our gain in the form of grain. Yes, a shabby, seemingly abandoned millhouse was found on our way to the larger site that you had assigned me and Pipe to. It was a cute little place, I'll admit. Though slightly faded, the red paint and accented whites made for a nice color combination; it was easy on the eyes. It was barely taller than a building's story, which is why, though it was seemingly designed and decorated like a barn, I didn't call it one. Regardless, inside, there was a sizeable amount of grains. Barley, rice, wheat, they were stored in barrels, strewn across the floor of the tiny place like someone had thrown them in there with no regard for the soundness of the interior. Some grain had even spilled onto the floor, though, the people we end up selling it to won't have to know.\nWell, of course, I can't say for sure that we'll be selling this stuff. After all, it must belong to someone, right? Borrowing things from a random person to be sold could be cause for escalated conflict, but, at the same time, we've never sold grain before. Breaking into a new market could be profitable for us. What do you think?\n\nHammer, Construction Sector, Yellow Face Corporation"
 YFC_event.50.a: "Sell the grain, Hammer." #Increases Pipe and Hammer influence, possibility of higher resistence in a random seaprovince, gains like 300k
 YFC_event.50.b: "Let us not haste." #Decreases Pipe and Hammer influence

 YFC_event.51.t: "Prospecting Prizes"
 YFC_event.51.desc: "Beaker, surprisingly, emailed Headquarters today, which caused quite the startle. Receieving communications from sectorials was not rare, sure, but Email? Seriously? We've had this the whole time? Why hasn't anyone else been using this? In any case, she was asking for Corporate's help in ransaking the Eastern Seaboard's caverns in search of aluminum. Apparently, he needed it for her \"science experiments,\" whatever that might mean. Regardless of his reasonings, we have recieved reports from Hammer about teardroppers taking up residence in the caves, along with some other... questionable individuals, claiming to have allegiance to a \"king\" of some sort. Tearing up caves for science may not go over well with cave dwelling individuals, so, this idea has been somewhat contentious at headquarters. Even more contentious than the use of Email."
 YFC_event.51.a: "They're just caves, people. Let us at them." #Increases Beaker influence, add aluminum production to a board state (dont care which)
 YFC_event.51.b: "But, but, an unruly populace is hard to conquer!" #Decreases Beaker influence

 YFC_event.52.t: "Mercenary Upgrade"
 YFC_event.52.desc: "Today we received an interesting letter from some good friends of ours, those friends being the Mercenaries. The Mercenaries' strength has been growing for quite some time now, due entirely to our glorious funding and somewhat in part to their own (measly) adventures. They have sent us a letter, stating that, due to this increasing strength, the size of their forces have increased. A great update from them, and a great upgrade for us."
 YFC_event.52.a: "Fantastic!"

 YFC_event.53.t: "Olive Branch"
 YFC_event.53.desc: "Despite the opinions of many of our office employees, the company has been looking to establish formal relations with Eraser's Bunch. Though the bandits conduct brutal, anarchist-like raids of proper settlements, they have been paying us handsomly for our weaponry. A formal connection could easily translate to more profits, which would obviously bolster the company in its entirety. We have been given warnings from some companymen about the instability of such a partnership, as well as how the Bunch's hostility may reflect on us, but we disregard them; the monetary incentive from this partnership is likely worth losing the support of a couple of rump states."
 YFC_event.53.a: "For capital!"

 YFC_event.54.t: "Breaking Point"
 YFC_event.54.desc: "Headquarters is in disaray. Employees are quitting in droves, the sectorials are pulling investments out of the company, objects are foolishly migrating out of the territories we control, and pay is down across the board. A recession is nigh. The actual building in which we have placed our headquarters is rather cluttered, due to the chaos; we would typically hire some menial object to clean it all up, but, again, we don't have the funds to do so. Despite our best efforts to keep things stable, it seems as if a large majority of our trading partners have pulled out of their partnerships, and even embargoed us. We can, of course, still trade with our ever loyal ally in the Military District, but regardless, trading no longer seems as if it will yield the great profits needed to sustain our corporation. It is likely time that we look into... different measures, in regards to making money."
 YFC_event.54.a: "Save the sinking ship!"

 YFC_event.55.t: "Reflections on our Geopolitical Standings"
 YFC_event.55.desc: "Well, we most certainly don't have any allies outside of the Bunch. From Schneehorn to Cary, we have lost all of our former trading partners. We have had a good run, but it is clear to the entirety of headquarters now, (rather, what remains of our rapidly shrinking company), that times are changing; we must significantly reconsider the purpose of the corporation, or face its closure. The Bunchivists, despite seemingly having an aversion to capitalism, are actually quite privy to it; they just participate in a different manner. Many at the corporation have noticed this, and, seeing as the situation is dire, it is likely high time that we grow far, far closer to the Bunch, to stay afloat. They respect us now; we are seldom stolen from, instead, they purchase from us. We are no longer raided, instead, we are protected. Their (feeble) governance respecting us has been one thing, but the population's support is another. It is different enough to make us consider a much more formal, much more integrated partnership."
 YFC_event.55.a: "It shall be."

 YFC_event.56.t: "Permanent Mercenaries?"
 YFC_event.56.desc: "The Bunchivists have stated that it is imperative that we have a standing army. They say that our model -- buying mercenaries for a time and directly administering them -- is inefficient. These calls do seem to come from a place of concern, as, although it is cheaper to not keep (and pay for) a military at all times, it does come with the concern of being unprepared for surprise attacks. Now, of course, we do have a choice in this: there are some at the company who are worried about the pricing here, to the point that they believe it is idiotic for us to do this at all. \nThough, Top Hat, of the Military Sector, is quite interested in this idea, and has pushed for the company to buy out the Unnamed Mercenary Brotherhood. He cites the strength found in the company, stating that it has great potential in future conflicts, as he's taken to studying the military tactics of the Bunch.\nThere is, of course, dissent in all forms, everywhere, but ultimately, there is only one correct choice."
 YFC_event.56.a: "Cherries!"
 YFC_event.56.b: "Grapes!"
 YFC_event.56.c: "The Brotherhood!"
 YFC_event.56.d: "It works fine as it is..." #This one keeps the same systems

 YFC_event.57.t: "Being Open to Negotiation"
 YFC_event.57.desc: "War.\n\nWar is petty. War is unnecessary. War is antithetical to our goal. \nWar is costly.\n\nWe, at the company, for the first time in a long while, have decided to start an open, back and forth, and most importantly, publicized series of negotiations that are to eventually, peacefully, resolve the Great Game over the Eastern Seaboard. We are not privy or partial to any unfair dealings, and will break off negotiations if ever necessary. However, peace is the preferred option by the majority of our populace. Sure, they are not the ones generating the majority of our profit, and sure, large swaths of the corporation do indeed think violence will resolve this issue faster, regardless of the costs, but the sectorials and Yellow Face himself all agree that the unruly populace in the east should be tamed, if we are to move forward with this. The risk of a long and protracted conflict with the teardroppers frightens us, and the bad publicity from a full out war against another sovereign, trading country could devestate our profits for three entire quarters, according to out top economists. It is not the most righteous move, not the most brave, not even the most fun; but it is the correct move. The profitable move."
 YFC_event.57.a: "And we'll laugh all the way to the bank when we're done!" #we should def have an event chain thatd be awesome and highly needed. the only question is on if i will write that.. YOU will have to design it though. please be less than 12 events
 
 #My man I do not want more then like 3 or 4 :sob:
 #In my head it would be TBT gets an event and either demands more, agrees, or rejects the offer. 

 YFC_event.58.t: "Piggy Banks"
 YFC_event.58.desc: "Following our escalation in the East, a question has begged to rear its head: How are we to ensure our profits don't lull during this conflict? Sure, we have the budget to fund our efforts, however, we still need not be wasteful; really, we should make this operation should fund itself. The sectorials have given their differing thoughts upon this topic. Some had suggested cuts in the defense budget, suggestions which Top Hat ferociously attacked. Arguing with Top Hat is so frequently the death of a discussion, so, rapidly, the sectorials began to debate about the managing of our corporate assets. Beaker suggested selling of old products and resources. Pipe thought to lay off some lesser employees. Lastly, Taser thought funding in the population centers might have a positive effect in the long run. All would hurt the company in the short term, yes, but the prospects of what the East might hold are sure to make it worth its while. After some hours of discussions, Yellow Face decided to..."
 YFC_event.58.a: "Sell off some old products and resources."
 YFC_event.58.b: "Lay off some employees."
 YFC_event.58.c: "Cut some funding to the population centers."
 YFC_event.58.d: "Use some of his own funds."

 YFC_event.59.t: "Our Place in the Sun?"
 YFC_event.59.desc: "This nights discussions between Yellow Face and the company's Sectorials were quite bleak. The Sectorials were not very happy at being summoned late at night, however, discussions were certainly to be had. It was very clear that the company could not continue in the direction that it had been going in for so long. What with the near death of the international free market through mass embargoes, and denunciation from Numismatia (the morons were being overrun by communists, who could trust them?) undermining our legitimacy, what could the company do? Throughout the night of discussions, the only answer we were able to recieve for this question was Pipe quietly suggesting that the good objects in Cary and Podgornyv were still happy to trade with us officially. This, of course, would not be enough to sustain us, but not a single Sectorial other than Pipe presented an alternative in the meeting. Near its conclusion, Yellow Face spoke about attempting to find more subversive ways to profit. Beaker groaned at the claim, the Sectorials didn't quite enjoy getting their hands dirty."
 YFC_event.59.a: "An uncertain future."

 YFC_event.60.t: "A Different Kind of Profit?"
 YFC_event.60.desc: "Walking home from a long day of doing nothing in Headquarters, out of the corner of his eye, Yellow Face saw something very interesting. Two objects, attempting to appear hidden, exchanging a seemingly innocuous bag of a green substance, for a fat stack of cash. It was such a simple display, but it had a powerful effect on Yellow Face. People were willing to pay so much for so little? It would likely be easier for the company to store than anything they had sold before; why hadn't he thought of this earlier?! This stuff would likely have to be sold behind the backs of the leaders of the selling area, which might upset the Sectorials; but who cares about them anyways? They're under Yellow Face, and his word is final! Walking over to the cunning business man in the alleyway, Yellow Face quickly and loudly spoke. \"One bag of weed, please!\""
 YFC_event.60.a: "\"Um.. are you a cop?\""

 YFC_event.61.t: "An Outing Ruined"
 YFC_event.61.desc: "The Sectorials had all grown somewhat close to each other, since the company hired them. They frequently attended social outtings together as a group to take the edge off things when work was getting stressful, and work was more stressful than ever under current conditions. Naturally, the Sectorials decided to eat at a fancy restaurant for dinner that night, and their meal was nearly over now, the waiter coming to them now for the bill. Well, for five bills; they would of course be paying separately.\n\nThey gave their cards to the waiter. Hammer made a bad joke about their cards declining, and no one laughed except for Pipe. Though, as the minutes since the waiter left doubled, and then tripled, the group became confused as to what had been taking so long. After nearly half an hour, the waiter came back, apologizing profusely about the cards declining. Top Hat checked his balance to find he was over $100,000 in debt, as were the rest of the Sectorials. It seemed as if the debt of the company randomly became the debt of the Sectorials."
 YFC_event.61.a: "For what purpose?!"

 YFC_event.62.t: "Learning From Our Invested Armies" #no extra text needed
 YFC_event.62.desc.a: "A small shack in the distance seemingly beckoned to Top Hat. It was a rather unkempt building, especially for Top Hat's high standards, and, with regards to normalcy, he would never enter such a building. However, this dinky thing was of the utmost importance; it had been the coordination facility of the Cherry Company. He, of his own accord, was visiting the facility to learn more about the -- for lack of a better word,-- \"interesting\" tactics that the Cherry Company chose to employ during raids. One could certainly call them pragmatic, and that pragmatism was something Top Hat wanted to understand for himself. Would gaining that understanding would be done in order to avoid said set of tactics? This was not a question Top Hat planned to answer, outwardly. Regardless, there were lessons to be had in the building ahead of him, he'd ought to get going."
 YFC_event.62.desc.b: "tophat talk to grapes zdubbz"
 YFC_event.62.desc.c: "Secretly slipping into a random forest in the middle of the night was not the easiest task for a high profile, affluent individual, such as Top Hat, however, it was the most important task on his agenda. He was meeting with the Unnamed Mercenary Brotherhood that night, and the meeting was, to him, of the utmost importance. He hadn't been sent on this mission by his company superiors (or rather, company superior, as, Yellow Face was really the only one above him), he had decided to come here on his own accord. The brotherhood had highly intriguing strategies in the face of war, which had been illustrated through their effective raiding; it was something Top Hat wished to learn about personally. For such an effective military organization, it was strange for them to have their headquarters within a forest clearing, however, if that was where the money lead Top Hat, so be it."
 YFC_event.62.desc.d: "\"Yes, yes, I understand your, er, 'strength,' but you have yet to tell me how this strength translates to profits\" Yellow Face was stuck in what was, quite possibly, the least productive meeting of his life. These mercenaries were insolent! This ragtag group couldn't even comprehend the concept of money, let alone how they might be able to properly help the company! Goodness, what was Yellow Face even paying them for? If he hadn't needed a standing army, he would've layed these hellions off with the rest of his useless ex-employees. He sighed again when another idiot piped up, giving the same, unnecessary spiel about the group's power. Yellow Face was becoming so, so tired of it all."
 YFC_event.62.a: "Strength in knowledge, knowledge in strength." #tophat 
 YFC_event.62.b: "\"Do you ever shut up?!\"" #yellow face

 YFC_event.63.t: "On Diversifying Our Foreign Outputs"
 YFC_event.63.desc.a: "Yellow Face,\n\nI write to you today, partly in confusion over your concerning recent actions, however, above all, with a sense of clarity, about the future of the corporation. After speaking with our mercenary associates, I've come to the conclusion that, acting as a sort of proxy with which other nations buy manpower could be our biggest break. This field is so different from our current, that, with some clever rebranding, and sweeping some documents (like this one) under the rug, we could easily be profitable again. Now, this would, of course, require you, the CEO of this company, to get your act together. In the most HR friendly terms possible: you need to keep in mind who built what you are today. The sectorials are not ragdolls to be toyed with, we are objects who are in nearly the same standings as you. We can, and will, guide this company to success if you work with us. But, you *must* work *with* us. Additionally, if mercenaries are one of the many things that are not willing to work with, we could also deal in connecting foreign nations with spies, or even using them ourselves to extract money out of them, since we're doing terribly shady stuff already. Why not both?\n\nThe Honorable, Top Hat, Yellow Face Corporation, Military Sectorial"
 YFC_event.63.desc.b: "Recently, Top Hat sent Yellow Face a strongly worded letter, about what he believed the company should look like, going forward. His message, however, made some very strong assertions, ones that could rupture the fabric of this already fragile corporation. He claimed that Yellow Face \"must\" work \"with\" him, or rather, the sectorials at large. He tells us that the sectorials are the ones with the real power in this corporation. Who does he think he is?\nUnfortunately, that is only the beginning of the complications we've been having with Top Hat. Just this morning, Yellow Face found Top Hat, in a secluded corner of our headquarters, speaking in a hushed tone to Beaker, Hammer, and a small circle of menial employees. When confronted, he and Yellow Face had a short exchange. Top Hat, quite quickly ceased speaking to this group, hiding a piece of paper behind his back, and began walking towards Yellow Face. First, he said \"What are you doing here?\" before backtracking, adding \"The lot of us were simply discussing trading prospects with the railroad corporation. You need not apply.\"\n\"I didn't say anything!\" It was clear that this group was taking part in some subversive actions -- not the good kind -- so, Yellow Face quickly thought up an excuse to break this group up. \"But, Top Hat, I need to have a meeting with you. We need to talk about the letter you sent me. Maybe over some tea? You people seem to like that stuff... The rest of you, go back to your designated working areas, or else -- pay cuts! All of you!\""
 YFC_event.63.a: "A great day for Paper Shredder!"

 YFC_event.64.t: "The Powderkeg Explodes" #If you want two separate texts for both paths then replace this comment
 YFC_event.64.desc.a: "This morning, the sectorials took to the streets of Footpathburg, proclaiming their seperation from the Yellow Face Corporation. The sectorials, after idling around headquarters for nearly an hour, staged a walk out, leaving through the front doors, holding signs, burning flags, and, importantly, waving guns. Unfortunately, a sizeable amount of our staff, as well as some of Top Hat's armed men (from where does he procure these men?), also walked out, seemingly being previously unaware of the planning of this demonstration. It is certainly upsetting that our sectorials have seen it fit to split from us in this way, and, they must be dealt with accordingly. We have already sent a dispatch of forces to search for them, but they are still at large, giving speeches to citizens and employees who have not yet started their shifts (or are late!!), riling up the city with insurrectionary behavior. This is likely the worst happening of the company's history. Yes, even worse than the embargoes; even worse than the recession! This shocking event has taken nearly all remaining employees by surprise, even Yellow Face himself, and many of us are at a slight impasse. Where exactly do we go from here? And, more importantly, why did this happen? Some analysts have pointed to the pay cuts that have been given to the sectorials, however, those certainly were not substantial enough to cause this type of resistence... right? Regardless, they are now gone, and we must continue operating the company without them; we cannot once more face a recession due to shock or inactivity! For now, our first course of action should be attempting to quell any dissent within the remaining populace and within the corporation."
 YFC_event.64.desc.b: "This morning, the sectorials took to the streets of Footpathburg, proclaiming their seperation from the Yellow Face Corporation. The sectorials, after idling around headquarters for nearly an hour, staged a walk out, leaving through the front doors, holding signs, burning flags, and, importantly, waving guns. Unfortunately, a sizeable amount of our staff, as well as some of Top Hat's armed men (from where does he procure these men?), also walked out, seemingly being previously unaware of the planning of this demonstration. It is certainly upsetting that our sectorials have seen it fit to split from us in this way, and, they must be dealt with accordingly. We have already sent a dispatch of forces to search for them, but they are still at large, giving speeches to citizens and employees who have not yet started their shifts (or are late!!), riling up the city with insurrectionary behavior. It cannot be said that this event has come at a surprise to us. Yellow Face was already well aware that the sectorials would soon plan on splitting, but in this fashion? It is, simply, uncalled for; the sectorials must be dealth with. Regardless, thanks to Yellow Face's careful planning, the company is more than ready to operate without those pesky excuses for employees, and we already have personnel and operational equipment in and around our settlements. The company, sadly, is still likely to see some losses from this event."
 YFC_event.64.a: "Well that's not good..."

 YFC_event.65.t: "Reflecting on Footpathburg" #thc
 YFC_event.65.ta: "Footpathburg's Illness" #yfc
 YFC_event.65.desc.a: "Footpathburg,\n\nToday, I write to all those who inhabit the city of Footpathburg. I write to tell you all of a recent, important happening within -- now without -- the company: The severing of the sectorials. \nWe, sectorials, for a while now, have found our treatment at the hands (or lack thereof) of Yellow Face to be an unworkable sort of thing. He undermined our authority as corporate executives, simply to better himself in the short term. He has never had, and will never have, any regard for the wellbeing or lives of anyone, except for himself. And so, that bright morning, when we took to the streets and spoke to you all, we spoke, not of a happening of a day, week, or month; we spoke of a happening of years. We spoke of the sloth that is Yellow Face.\nI remember clearly what I said to you all, when I was in city center, the day after the grand walkout, while the lot of you stared at me and my fellow sectorials with awe. I spoke to you of his unfaithfulness to the cause of capitalist expansion. I spoke to you of his horrible stench. I spoke to you of his failure to adapt to the hostile international climate that he forged for himself. I remember clearly the ways in which many of you reacted to this information. In the crowd, there were loud shouts of rightful disdain. Chants of \"down with the face!\", and \"bankrupt him!\" made me smile the brightest. You lot were so expressive that I could read your emotions from a glance. Some of you were surprised, some were disgusted, some were angered. But, most importantly, all of you became steeled with resolve as you marched with me, around the city, gathering more and more support for this succession, turning mercenary forces away from corporate, and towards the sectorial cause. And for this, I am indebted to you a large, large sum; one that I plan to pay back, by way of ousting this lazy, incompetant, dastardly, unfortunizing, ignorant, imbecilic menace from power, giving way to a society led by objects who value the people they proside over. This, Footpathburg, this is what you are owed.\n\nThe Honorable, Top Hat."
 YFC_event.65.desc.b: "That morning of the walk out was, unfortunately, not the end of the renegade sectorials' campaign in Footpathburg. The next day, there were more demonstrations, even larger than the original walk out itself. The sectorials are, clearly, attempting to gain power over our populace; this cannot be had. \nAn informant from headquarters reportedly spied on a speech that the deserters were giving to a crowd, during one of the day's many large demonstrations. Many in the crowd were moved, (not our loyal employee, of course!) apparently, though, by what exactly, we cannot know, as, information is somewhat limited. The employee did tell us that the sectorials had a brief argument during the speech, though, which seemed to confuse the crowd. The sectorials, certainly, aren't the most united group, however, they still pose a threat. We must, of course, vanquish this threat."
 YFC_event.65.a: "Right!"

 YFC_event.66.t: "Beaker Goes Off to College" #thc
 YFC_event.66.ta: "Beaker's Departure?!" #yfc
 YFC_event.66.desc.a: "The Movement,\n\n\"And, you're sure that's everything you're gonna need?\" I asked her a question I thought to be important. Beaker had only packed a few things with which to travel, a few too little. He brought a notebook, a pen, two textbooks -- on topics I could not hope to understand -- and nothing else. It confused me, really, as to why she was so confident in his ability to \"make it,\" wherever she was planning to go. The Technocratic Republic wasn't the most safe place to be in. Sure, South Goiky University was prestigious, an after the fall of Old Goiky, the most prestigious in the continent, but, until recently, Golf Ball's poor leadership led to famines all across the campus, and in Announcergrad. Don't misinterpret me; I understood exactly why he was going: she was an educated object, a place like this was natural for her. I was just worried about him. This was something one should be much more prepared for, isn't it? \nRegardless, she was deadset on not packing anything more. He had already hopped into the train car, waving goodbye to me (and Pipe, who was at my side. I couldn't really get a gauge as to what they felt about her circumstances in the moment) by the time he responded, giving a matter-of-fact \"I'll be okay!\" ...Truly, I can't describe to you how happy she looked in the moment. The sun had just barely come up, whispering thin oranges across the dark blue sky, which managed to, just barely, just perfectly, strike Beaker. I suppose the environment steeled me? I couldn't recognize it then, but that moment as a whole did indeed soothe me, my thoughts turned moreso towards Pipe rather than Beaker's wellbeing, as I took in his words. She'd be okay, over there, I had to believe it.\nOf course... we are talking about Beaker. He didn't miss the opportunity to tell me to \"stop bothering everyone so much!\" before the train's car doors closed, and it sped off into the distance. My friend, Beaker, would be back, soon. Stronger than ever.\n\nHammer" #thc; PUN use if she goes to GTR
 YFC_event.66.desc.ab: "The Movement,\n\n\"And, you're sure that's everything you're gonna need?\" I asked her a question I thought to be important. Beaker had only packed a few things with which to travel, a few too little. He brought a notebook, a pen, two textbooks -- on topics I could not hope to understand -- and nothing else. It confused me, really, as to why she was so confident in his ability to \"make it,\" wherever she was planning to go. Casland wasn't the most safe place to be in. Sure, Central Goiky University was prestigious, maybe not as prestigious as South Goiky, though, they were dealing with their own issues at the moment. Regardless, the recent militant action in and around Casland was certainly concerning. Don't misinterpret me; I understood exactly why he was going: she was an educated object, a place like this was natural for her. I was just worried about him. This was something one should be much more prepared for, isn't it? \nRegardless, she was deadset on not packing anything more. He had already hopped into the train car, waving goodbye to me (and Pipe, who was at my side. I couldn't really get a gauge as to what they felt about her circumstances in the moment) by the time he responded, giving a matter-of-fact \"I'll be okay!\" ...Truly, I can't describe to you how happy she looked in the moment. The sun had just barely come up, whispering thin oranges across the dark blue sky, which managed to, just barely, just perfectly, strike Beaker. I suppose the environment steeled me? I couldn't recognize it then, but that moment did indeed soothe me, my thoughts turned moreso towards Pipe rather than Beaker's wellbeing, as I took in his words. She'd be okay, over there, I had to believe it.\nOf course... we are talking about Beaker. He didn't miss the opportunity to tell me to \"stop bothering everyone so much!\" before the train's car doors closed, and it sped off into the distance. My friend, Beaker, would be back, soon. Stronger than ever.\n\nHammer" #thc; PUN use if she goes to GPG
 YFC_event.66.desc.ac: "The Movement,\n\n\"And, you're sure that's everything you're gonna need?\" I asked her a question I thought to be important. Beaker had only packed a few things with which to travel, a few too little. He brought a notebook, a pen, two textbooks -- on topics I could not hope to understand -- and nothing else. It confused me, really, as to why she was so confident in his ability to \"make it,\" wherever she was planning to go. Don't misinterpret me; I understood exactly why he was going to a university, now: she was an educated object, a place like that was natural for her. I was just worried about him. This was something one should be much more prepared for, isn't it? \nRegardless, she was deadset on not packing anything more. He had already hopped into the train car, waving goodbye to me (and Pipe, who was at my side. I couldn't really get a gauge as to what they felt about her circumstances in the moment) by the time he responded, giving a matter-of-fact \"I'll be okay!\" ...Truly, I can't describe to you how happy she looked in the moment. The sun had just barely come up, whispering thin oranges across the dark blue sky, which managed to, just barely, just perfectly, strike Beaker. I suppose the environment steeled me? I couldn't recognize it then, but that moment did indeed soothe me, my thoughts turned moreso towards Pipe rather than Beaker's wellbeing, as I took in his words. She'd be okay, over there, I had to believe it.\nOf course... we are talking about Beaker. He didn't miss the opportunity to tell me to \"stop bothering everyone so damn much!\" before the train's car doors closed, and it sped off into the distance. My friend, Beaker, would be back, soon. Stronger than ever.\n\nHammer" #thc; PUN use if she goes anywhere else
 YFC_event.66.desc.b: "So, an interesting letter came in today, from an ex-sectorial at that. Beaker has told us that she wishes to escape from the sectorial revolt. He says that she \"never really agreed with Top Hat's plans,\" and \"was always loyal to Yellow Face.\" It seems like something is going awry for them" #zdubbz, she also gives yellow face the hiding location of the sectorials after being pressured
 YFC_event.66.a: "We'll see you soon, Beaker."

 YFC_event.67.t: "The Sectorial Deportorial" #If you want two separate texts for both paths then replace this comment
 YFC_event.67.desc.a: "The Movement,\n\nI write to you from the Eastern Seaboard, to where, in just over a day, we have been transported to. Yesterday, early in the morning, even earlier than when Beaker left, Top Hat came to us, and said that we all needed to begin packing our stuff, to leave immediately. He did not elaborate to us then, but I soon came to realize, that the incompetence that is Yellow Face, managed to send enough men on patrol, that he nearly found us. Top Hat was acting slightly paranoid, as we packed. He was pacing around the small storage room we bunked in whilst hiding, occasionally turning to stare out of windows, but the sky was too dark to see through. I think Pipe was scared? I do always notice them, but I was focused on getting my things in order, and making sure I had enough pens to write for the forseeable future, in case things turned ugly. It was, admittedly, strange to see Top Hat act this way. I don't mean to elevate him to some high status, but he was typically a calm, calculated guy. There was a reason he was the leader of this grand movement, after all. But, truly, his actions were well intentioned; we could not have any more setbacks. \nThe moment we finished packing our things, we were rushed out the door. Quickly, Top Hat walked, nearly ran, seemingly aimlessly down streets. Taser, poor Taser, was having trouble keeping up, having sustained a leg injury from falling real bad three days ago. At once, Top Hat stopped, and knocked on a random door. As quickly as he knocked, an entire regiment seemingly activated immediately, and what felt like a hundred armed objects shuffled quickly out the door. (Was this from where he procured his men?) Finally, Top Hat continued down the street, knocking on door after door. I thought more armies of that size would appear from the shadows, but seemingly, these were your average objects, who had happened to declare allegiance to the movement. Even as our numbers grew, we remained silent; it was still the dead of night, the stars were so clearly visible, and street lamps had been inoperable for weeks (one of the many ways in which Yellow Face had ruined this city). It was an insane feeling, knowing that hundreds walked in silent formation right behind you, and it was an even insaner feeling, knowing that they would heed to your command as soon as you gave it. I do not let feelings of power corrupt me, though. \nOf course, our luck did run out. After knocking on around twelve doors, a small patrol of militia, as well as a large series of trucks, with carts in the back of them, rounded a corner. One of the front runners of the militias stepped out of a truck, greeting Top Hat personally, and gifting him a piece of paper. Top Hat called him a traitor, and kicked him in the shin, before signalling to the silent army that they were to enter the trucks, and do as Yellow Face's militias said. We were being deported.\n\nHammer"
 YFC_event.67.desc.b: "Top Hat takes Portland and moves to footpathburg, however without any support from the other sectors and mercenaries" #zdubbz
 YFC_event.67.a: "This is an outrage against the movement!" #thc
 YFC_event.67.b: "As was expected."

 #PUN PUNKID LISTEN UP. this event is meant to take place like a week after the completion of the focus "pride," and is exclusive to sectorial victory. please please please code this in ive already written it please
 YFC_event.67a.t: "Your Idiocy"
 YFC_event.67a.desc.a: "Yellow Face,\n\nI am of the opinion that this deportation has ruined you. In your unfathomable stupidity, you have managed to bolster us, by way of attempting to cease our actions. Today, as in, when you recieve this message, we march. We march long days, we even march nights, but, regardless, we march towards Footpathburg, for the sole purpose of disbanding the embarrassing group of nimrods that you call a corporation. And, as we march, more and more objects become committed to our cause. Our ranks are snowballing; from five, to twenty, to hundreds, now thousands. All of the good men in Footpathburg are striking, have quit, or, even more likely, have been fired; I am sure of it. The only objects left in your ranks are yes-men, and, thus, your poor decision-making is (and really, for a long time, has been) permeating throughout the entirety of the Yellow Face Corporation. The militias I previously made you purchase are aware of this, too. The offduty ones, stationed in Yoyleton and Peoniele have already decided to turn their allegiances from the Yellow Face Corporation, over to, what Hammer has so graciously dubbed, The Movement. I tell you this, mainly, to make sure you are prepared for the carnage we will bring to you. We are well aware, we are entirely sure that, we will arrive in Footpathburg promptly, and, on arrival, perhaps after a short petty-engagement, overrun headquarters, and, there, we will proclaim something new. Though, there, more importantly, you will be tried. I would love to see you executed.\n\nThe Honorable, Top Hat"
 YFC_event.67a.a: "Well... alright, then."

