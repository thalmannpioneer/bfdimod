l_english:
 BEGGINING_OF_THE_END_NAME: "Troubles in Goiky"
 BEGGINING_OF_THE_END_DESC: "The competition show 'Battle For Dream Island' is rising rapidly in popularity throughout the continent, bringing peace and prosperity to the objects of Goiky! Though, perhaps, this show's running is uniting the continent too much. One could only wonder what may happen if it ends poorly..."
 GOI_BEGGINING_OF_THE_END_DESC: "South Goiky - A fairly densely populated continent with large settlements and production. However, it has practically no central authority, apart from small organizations and defense groups. This system, in turn, facilitates a rather unstable society. The entire social structure could collapse in an instant, with just one, tiny push..."
 PETRI_DISH_NAME: "Petri Dish"
 PETRI_DISH_DESC: "The calm, peaceful, united Goikean continent of the past fell in an instant, following the disgraceful stealing of Dream Island. Social structures throughout Goiky have changed wildly, power vacuums forming and falling rapidly. Any of the new countries littered throughout the continent have the possibility to either die fast, or become the next great Goikean unifier.\n\n§RIf you are playing for the first time, it is recommended to take the first scenario!§!" #They really need to see this
