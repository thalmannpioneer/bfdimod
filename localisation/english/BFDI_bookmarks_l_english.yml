l_english:
 BEGGINING_OF_THE_END_NAME: "Troubles in Goiky"
 BEGGINING_OF_THE_END_DESC: "Contests are going well, but many may not like the winner."
 GOI_BEGGINING_OF_THE_END_DESC: "South Goiky - A fairly densely populated continent with large settlements and production. However, there is practically no central authority on it. These factors create a rather unstable social situation, and the entire social structure could collapse in an instant, with just one, tiny push..."
 PETRI_DISH_NAME: "Petri Dish"
 PETRI_DISH_DESC: "Jump straight into the fight for Goiky, skipping the prelude.\n\nIf you are playing for the first time, it is recommended to take the first scenario!"
 GTR_PETRI_DISH_DESC: "The young Technocracy, not yet aware of itself as a full-fledged state, rises above Goiky."
 YFC_PETRI_DISH_DESC: "The Yellow Face Financial Empire has grown so large that it has become a full-fledged state on the ruins of old Goiky. But it demands more and more \"investments\"..."