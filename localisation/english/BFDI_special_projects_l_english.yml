 sp_application_choice_reward_desc: "...              CLASSIFIED. HAND OVER TO GOLFBALL PERSONALLY.\n\nEngineers are arguing. The team is divided into two groups: one wants as much yoylite as possible to be used during the explosion; the other, on the contrary, is in favor of the fact that as a result of the explosion, unstable yoylite will be distributed over a large area and cause contamination of the surrounding area.\nWhat decision will be made?"
